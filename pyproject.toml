# uv workspace: packages/py/* are workspace members, so `uv sync --all-packages`
# builds and installs every package from this one root (citry_core through the
# maturin backend, citry editable) and the lockfile covers all of them. This is
# what makes `uv run` safe and lets citry's tests run in CI. See issue #8.
[tool.uv.workspace]
members = ["packages/py/*"]

# Resolve the inter-package dependency (citry needs citry-core) to the local
# workspace member during development. Published Citry builds keep this
# dependency pinned to the exact compatible citry-core release.
[tool.uv.sources]
citry = { workspace = true }
citry-core = { workspace = true }
# Citry UI's type-check test drives the language server package directly.
citry-lsp = { workspace = true }
# The docs build's citry lexer resolves to the local workspace member, not PyPI
# (it may not be published yet); an ordinary version range applies for consumers
# that install pygments-citry directly.
pygments-citry = { workspace = true }

# Tool configurations (codebase-wide)
[tool.ruff]
line-length = 119
# Honour the exclusions above even when a tool passes explicit file paths
# (editors, pre-commit), so an excluded file is excluded everywhere.
force-exclude = true
src = ["packages/py"]
exclude = [
    "env",
    ".env",
    ".venv",
    ".tox",
    "build",
    "dist",
    "__pycache__",
    ".mypy_cache",
    # Third-party dependencies (git submodules)
    "third_party",
    # Vendored third-party code, kept byte-compatible with upstream.
    "docs_site/_internal/_vendor",
    # benchmark files, not linted.
    "packages/py/citry/tests/test_benchmark*.py",
    # The error-prevention benchmark's apps follow each framework's own style,
    # and its cases contain deliberate mistakes.
    "benchmarks/errors/frameworks",
    "benchmarks/errors/cases",
    "packages/py/citry_core/tests/benchmark*.py",
    # The snippets in docs_site are read as source and shown to a reader, so their
    # shape follows what the page needs to explain rather than house style.
    "docs_site/snippets",
    # Formatter golden inputs deliberately include invalid and noncanonical Python.
    "crates/citry_template_formatter/tests/fixtures",
    # Agent/editor harness tooling, not shipped code.
    ".claude",
]

# See https://docs.astral.sh/ruff/linter/#rule-selection
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Annotations
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed in `*args`
    # Docstring
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in `__init__`
    "D203", # Incorrect blank line before class
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "D400", # First line should end with a period
    "D401", # First line of docstring should be in imperative mood
    "D404", # First word of the docstring should not be "This"
    "D412", # No blank lines allowed between a section header and its content ("Examples")
    "D415", # First line should end with a period, question mark, or exclamation point
    # Exceptions
    "EM101", # Exception must not use a string literal, assign to variable first
    "EM102", # Exception must not use an f-string literal, assign to variable first
    # `TODO` comments
    "FIX002", # Line contains TODO, consider resolving the issue
    "TD002",  # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`
    "TD003",  # Missing issue link for this TODO
    "TD004",  # Missing colon in TODO
    # Code
    "C901",    # Function is too complex
    "COM812",  # missing-trailing-comma (NOTE: Already handled by formatter)
    "ERA001",  # Found commented-out code (NOTE: Too many false positives)
    "INP001",  # File is part of an implicit namespace package. Add an `__init__.py`.
    "PLR0915", # Too many statements
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
    "RET504",  # Unnecessary assignment before `return` statement
    "RET505",  # Unnecessary `elif` after `return` statement
    "S308",    # Use of `mark_safe` may expose cross-site scripting vulnerabilities
    "S603",    # `subprocess` call: check for execution of untrusted input
    "SIM108",  # Use ternary operator instead of `if`-`else`-block
    "SIM117",  # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "SLF001",  # Private member accessed
    "TRY300",  # Consider moving this statement to an `else` block
    "TRY301",  # Abstract `raise` to an inner function
    # TODO: Following could be useful to start using, but might require more changes.
    "C420",    # Unnecessary dict comprehension for iterable; use `dict.fromkeys` instead
    "PERF401", # Use `list.extend` to create a transformed list
    "PERF203", # `try`-`except` within a loop incurs performance overhead
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "TRY003",  # Avoid specifying long messages outside the exception class
    # TODO_V1 - Rename error to suffix with `Error` before v1?
    "N818", # Exception name should be named with an Error suffix
    "G004", # Logging statement uses f-string
]

[tool.ruff.lint.flake8-bandit]
# These are the exact qualified imports used for MarkupSafe's trusted-HTML
# class. Listing both lets S704 check public application code and Citry itself.
extend-markup-names = [
    "citry.Markup",
    "citry.util.html.Markup",
]

[tool.ruff.lint.per-file-ignores]
"packages/py/**/tests/*" = [
    "ARG001",  # Unused function argument (mock/callback signatures in tests)
    "ARG002",  # Unused method argument
    "ARG003",  # Unused classmethod argument (e.g. on_dependencies hook stubs)
    "ANN",     # Annotations are not needed for tests
    "N806",    # Variable in function should be lowercase
    "PLC0415", # `import` should be at the top-level of a file
    "PLW1641", # `__eq__` without `__hash__` is fine for throwaway test fixtures
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "S101",    # Use of `assert` detected
    "TRY002",  # Create your own exception
]
"packages/py/**/tests/benchmark*" = [
    "T201",    # Benchmark scripts print their results
]
"packages/py/citry/citry/commands/*" = [
    "T201",    # The CLI commands print their output to stdout
    "ARG002",  # A command's handle receives the parsed options but may use none
]
"packages/py/citry/citry/_vue/compiler.py" = [
    # PYI049 asks whether a private TypedDict is used in the file that defines it.
    # These declaration shapes describe the generated browser definition and are
    # read by the other modules of the private `_vue` package, so the rule reports
    # them as dead when they are not. The `.pyi` stubs still get the check.
    "PYI049",
]
"benchmarks/*" = [
    "ARG002",
    "T201",    # The comparison runner prints its results
]
# The benchmark harness tests follow the same rules as the package tests.
"benchmarks/{web,errors}/**/test_*.py" = [
    "ARG001",  # Unused function argument (mock/callback signatures in tests)
    "ARG002",  # Unused method argument
    "ARG003",  # Unused classmethod argument
    "ANN",     # Annotations are not needed for tests
    "N806",    # Variable in function should be lowercase
    "PLC0415", # `import` should be at the top-level of a file
    "PLW1641", # `__eq__` without `__hash__` is fine for throwaway test fixtures
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "S101",    # Use of `assert` detected
    "TRY002",  # Create your own exception
]
"docs_site/_internal/*" = [
    "T201",    # the CLI prints its build summary to stdout
    "E501",    # page-chrome templates carry long inline SVG icon and HTML lines
]
"docs_site/examples/*" = [
    "ANN",     # example code is illustrative and shown to readers; keep it minimal
    "ARG002",  # template_data takes slots even when an example does not use them
    "D",       # example modules are demonstrations, not documented APIs
    "INP001",  # examples are imported by file path, not as a package
    "S101",    # the per-example regression tests use assert
]
"examples/starters/*" = [
    "ANN",     # starter code keeps the concise signatures readers copy
    "ARG002",  # component data hooks keep the standard kwargs/slots shape
    "FLY002",  # straightforward joins keep the searchable data fields explicit
    "PLC0415", # Django's executable entrypoint imports after selecting settings
    "S101",    # project-local tests use assert
    "T201",    # the standalone render command reports its output path
]
"examples/demos/*" = [
    "ANN",     # demo component hooks keep reader-facing signatures concise
    "ARG002",  # component data hooks keep the standard kwargs/slots shape
    "FLY002",  # straightforward joins keep the searchable data fields explicit
    "PLC0415", # test fixtures import app state only after setting environment
    "S101",    # project-local tests use assert
    "TID252",  # the independently copyable app uses normal package-relative imports
]
"examples/tests/*" = [
    "ANN",  # annotations are not needed for repository contract tests
    "S101", # pytest assertions describe the catalog and archive contracts
]
"examples/_internal/*" = [
    "PLC0415", # Playwright is an optional browser-gate dependency
    "T201",    # command-line tools print qualification/archive progress
]
"docs_site/live_snippets/*" = [
    "ANN",     # live examples are reader-facing code; keep their hooks concise
    "ARG002",  # component data hooks keep the arguments readers see elsewhere
    "B018",    # the final bare value is the playground preview contract
    "T201",    # __main__ keeps the same module runnable from a normal Python shell
]
"docs_site/snippets/*" = [
    "ANN",     # executable guide snippets keep the same concise style readers copy
    "ARG001",  # stand-in side effects accept the arguments the guide demonstrates
    "ARG002",  # template_data takes slots even when a snippet does not use them
    "RUF012",  # a component's Dependencies lists are written plainly in the docs
    "S101",    # the private verifier executes the snippets as test fixtures
]
"docs_site/tests/*" = [
    "ANN",     # Annotations are not needed for tests
    "ARG002",  # Unused method argument
    "PLC0415", # In-test imports (e.g. to monkeypatch a module) are fine
    "S101",    # Use of `assert` detected
    "TC003",   # Type-only imports need not move to a TYPE_CHECKING block in tests
]
"docs_site/static/*" = [
    "ARG002",  # Unused method argument
]
"docs/design/docs_playground_research/vertical_proof/src/*" = [
    "ARG002",  # The proof mirrors the reader-facing component method signatures
]
# The hand-written stub for the Rust extension. Its class and method names mirror
# the PyO3 module and enum-variant names on purpose (the bindings check enforces
# that), and it carries docstrings so editors show help on hover.
"**/*.pyi" = [
    "A002",    # `input` mirrors the published parse_template/compile_template parameter name
    "E501",    # mirrored signatures and docstrings can run long in the stub
    "N801",    # class names mirror Rust submodules/enum variants (html_transform, Node_WithBody)
    "N805",    # namespace classes expose module-level functions, so the first arg is not `self`
    "PYI021",  # docstrings in the stub are intentional (IDE hover help)
    "PYI063",  # positional-only params mirror the PyO3 signatures
]
# The safe-eval sandbox: it executes user expressions and reimplements builtins,
# so several "smells" are the whole point of the file.
"packages/py/citry_core/citry_core/safe_eval/eval.py" = [
    "A001",    # the sandbox intentionally provides builtins named `slice`/`format`
    "PLC0415", # t-string imports are version-gated (string.templatelib is 3.14+), so necessarily lazy
    "PLW2901", # the format() builtin transforms each loop value in place, which reads clearly here
    "PYI063",  # the builtin wrappers use the `__name` positional-only idiom on purpose
    "S102",    # the sandbox executes compiled user code by design
]
# `input` is the published parameter name of parse_template/compile_template;
# renaming it to avoid shadowing the builtin would be an API break.
"packages/py/citry_core/citry_core/template_parser/*" = [
    "A002",    # `input` shadows a builtin but is the public parameter name
]
# The check/validate runners print their report and shell out to cargo/uv.
"scripts/check.py" = [
    "S607",    # `cargo`/`uv` are intentionally resolved from PATH
    "T201",    # the runner prints its results
]
"scripts/validate.py" = [
    "T201",    # the runner prints its results
]

[tool.ruff.lint.isort]
known-first-party = ["citry", "citry_core", "citry_lsp", "citry_ui", "pygments_citry"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "build",
    "docs_site/_internal/_vendor",
    # A component's tests and snippets import their own package root, which
    # makes a cycle mypy resolves before the component metaclass is known, so a
    # call like CTable(columns=...) is checked against object.__init__.
    "packages/py/citry_ui/citry_ui/(?:components/[^/]+/(?:tests|snippets)|quality/tests)",
]

[[tool.mypy.overrides]]
module = "citry_core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "citry_ui.*"
disallow_untyped_defs = true

# pygments-citry is a small public package; hold it to the strict bar too.
[[tool.mypy.overrides]]
module = "pygments_citry.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "citry_lsp.*"
disallow_untyped_defs = true

# BasedPyright (the VS Code type-checker) crawls the whole workspace by default,
# so keep it out of the vendored trees the other tools already exclude.
[tool.pyright]
extraPaths = ["packages/py/citry", "packages/py/citry_ui"]
exclude = [
    # Built-in defaults (restate them)
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    # Third-party (git submodules)
    "third_party",
    # Other
    "docs_site/_internal/_vendor",
    "build",
    # Deliberate mistakes would otherwise fill every editor's Problems panel.
    "benchmarks/errors/frameworks",
    "benchmarks/errors/cases",
]

[tool.pytest.ini_options]
# Collect only the published packages' suites. Without explicit paths, pytest
# recurses from the repo root and tries to collect the vendored ruff submodule
# (third_party/) and the docs-site tests, which fail to import here. The
# docs-site has its own tests, run separately with its `--extra docs` deps.
testpaths = [
    "packages/py/citry_core/tests",
    "packages/py/citry/tests",
    "packages/py/citry_lsp/tests",
    "packages/py/citry_ui/tests",
    "packages/py/citry_ui/citry_ui/components",
    "packages/py/citry_ui/citry_ui/quality/tests",
    "packages/py/pygments_citry/tests",
]
# Put the repository root on sys.path so tests can import `scripts.*` and the
# gate can load `-p scripts.vue_render_parity.collect`. pytest applies this
# before it loads `-p` plugins, whether pytest starts as `uv run pytest` or
# `python -m pytest`.
pythonpath = ["."]
markers = [
    "e2e: browser end-to-end test (needs Playwright and a browser binary)",
    "qualification: slow boundary proof kept in full integration and version-matrix runs",
]

[tool.coverage.run]
# NOTE: The Rust half of citry_core is covered separately by `cargo test`;
#       only its Python wrapper is seen here.
source = ["citry", "citry_core", "citry_lsp", "citry_ui", "pygments_citry"]
branch = true
omit = [
    "*/tests/*", # the test files themselves are not the measured code
    "*/citry_ui/quality/*", # repository qualification tools are not shipped runtime
    # Public demo sources are excluded from the wheel and are exercised through
    # the docs/UI scenario suites instead of counted as shipped runtime code.
    "*/citry_ui/components/*/snippets/*",
    # These LSP subprocess/transport adapters are exercised end-to-end, but the
    # parent coverage process does not observe the child Python processes.
    "*/citry_lsp/__main__.py",
    "*/citry_lsp/app_worker.py",
    "*/citry_lsp/server.py",
    "*/_rust*",  # the compiled Rust extension and its hand-written type stub
]

[tool.coverage.report]
fail_under = 88.5 # temporary ratchet below 88.51%; raise as coverage recovers
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

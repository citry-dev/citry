[package]
name = "citry-i18n-phase0"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "citry_i18n_phase0"
crate-type = ["cdylib"]

[dependencies]
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
pyo3 = { version = "=0.27.1", features = ["extension-module"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
unic-langid = "=0.9.6"

[workspace]

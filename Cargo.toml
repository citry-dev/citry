[workspace]
members = [
    "crates/citry_core_py",
    "crates/citry_html_transform",
    "crates/citry_i18n",
    "crates/citry_template_formatter",
    "crates/citry_template_parser",
    "crates/python_safe_eval",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Juro Oravec <juraj.oravec.josefson@gmail.com>"]
license = "MIT"
homepage = "https://citry.dev"
documentation = "https://citry.dev"
repository = "https://github.com/citry-dev/citry"

[workspace.dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module"] }
quick-xml = "0.38.3"
pest = "2.8.3"
pest_derive = "2.8.3"
thiserror = "2.0.17"
regex = "1.12.2"
lazy_static = "1.5.0"
icu_locale = { version = "2.2.0", features = ["compiled_data"] }
icu = { version = "2.2.0", features = ["compiled_data", "sync", "unstable"] }
icu_provider = "2.2.0"
fixed_decimal = "0.7.2"
tinystr = "0.8.3"
writeable = "0.6.3"
fluent-bundle = "=0.16.0"
fluent-syntax = { version = "=0.12.0", features = ["serde"] }
unic-langid = "=0.9.6"
oxc_allocator = "0.143.0"
oxc_ast = "0.143.0"
oxc_ast_visit = "0.143.0"
oxc_parser = "0.143.0"
oxc_semantic = "0.143.0"
oxc_span = "0.143.0"
oxc_syntax = "0.143.0"

# Ruff dependencies
ruff_annotate_snippets = { path = "third_party/rust/ruff/crates/ruff_annotate_snippets" }
ruff_cache = { path = "third_party/rust/ruff/crates/ruff_cache" }
ruff_db = { path = "third_party/rust/ruff/crates/ruff_db", default-features = false }
ruff_diagnostics = { path = "third_party/rust/ruff/crates/ruff_diagnostics" }
ruff_formatter = { path = "third_party/rust/ruff/crates/ruff_formatter" }
ruff_macros = { path = "third_party/rust/ruff/crates/ruff_macros" }
ruff_memory_usage = { path = "third_party/rust/ruff/crates/ruff_memory_usage" }
ruff_notebook = { path = "third_party/rust/ruff/crates/ruff_notebook" }
ruff_python_ast = { path = "third_party/rust/ruff/crates/ruff_python_ast" }
ruff_python_codegen = { path = "third_party/rust/ruff/crates/ruff_python_codegen" }
ruff_python_formatter = { path = "third_party/rust/ruff/crates/ruff_python_formatter" }
ruff_python_literal = { path = "third_party/rust/ruff/crates/ruff_python_literal" }
ruff_python_parser = { path = "third_party/rust/ruff/crates/ruff_python_parser" }
ruff_python_trivia = { path = "third_party/rust/ruff/crates/ruff_python_trivia" }
ruff_source_file = { path = "third_party/rust/ruff/crates/ruff_source_file" }
ruff_text_size = { path = "third_party/rust/ruff/crates/ruff_text_size" }
ty_static = { path = "third_party/rust/ruff/crates/ty_static" }

# Used by ruff_python_formatter and its workspace-inherited dependencies
arc-swap = { version = "1.7.1" }
camino = { version = "1.1.7" }
char_str = { version = "0.0.2" }
clap = { version = "4.5.3", features = ["derive"] }
countme = { version = "3.0.1" }
dashmap = { version = "6.0.1" }
drop_bomb = { version = "0.1.5" }
dunce = { version = "1.0.5" }
etcetera = { version = "0.11.0" }
ignore = { version = "0.4.30" }
matchit = { version = "0.9.0" }
path-slash = { version = "0.2.1" }
pathdiff = { version = "0.2.1" }
quick-junit = { version = "0.6.0" }
rand = { version = "0.10.0", default-features = false, features = ["std_rng"] }
same-file = { version = "1.0.6" }
similar = { version = "3.0.0", features = ["inline"] }
smallvec = { version = "1.13.2", features = ["union", "const_generics", "const_new"] }
supports-hyperlinks = { version = "3.1.0" }
tempfile = { version = "3.9.0" }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["env-filter", "fmt", "ansi", "smallvec"] }
uuid = { version = "1.6.1", features = ["v4", "fast-rng", "macro-diagnostics"] }
which = { version = "8.0.0" }
zip = { version = "8.0", default-features = false }

# Used by ruff_annotate_snippets
anstream = { version = "1.0.0" }
anstyle = { version = "1.0.10" }
unicode-width = { version = "0.2.0" }
snapbox = { version = "1.0.0", features = [
    "diff",
    "term-svg",
    "cmd",
    "examples",
] }

# Used by ruff_python_ast
aho-corasick = { version = "1.1.3" }
arrayvec = { version = "0.7.6" }
bitflags = { version = "2.5.0" }
compact_str = "0.10.0"
get-size2 = { version = "0.10.3", features = [
    "derive",
    "smallvec",
    "hashbrown",
    "compact-str",
    "ordermap",
    "thin-vec",
] }
is-macro = { version = "0.3.5" }
itertools = { version = "0.15.0" }
memchr = { version = "2.7.1" }
rustc-hash = { version = "2.0.0" }
salsa = { version = "0.28.2", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
] }
schemars = { version = "1.0.4" }
serde = { version = "1.0.197", features = ["derive"] }
sha2 = "0.10.9"
thin-vec = { version = "0.2.14" }

# Used by ruff_cache
filetime = { version = "0.2.23" }
glob = { version = "0.3.1" }
globset = { version = "0.4.14" }
getrandom = "0.3.4"
seahash = { version = "4.1.0" }

# Used by ruff_macros
heck = "0.5.0"
proc-macro2 = { version = "1.0.79" }
quote = { version = "1.0.23" }
syn = { version = "3.0.0" }

# Used by ruff_python_codegen
test-case = { version = "3.3.1" }

# Used by ruff_python_literal
icu_properties = { version = "2.1.2" }

# Used by ruff_python_parser
anyhow = { version = "1.0.80" }
bstr = { version = "1.9.1" }
datatest-stable = { version = "0.3.3" }
insta = { version = "1.35.1" }
serde_json = { version = "1.0.113" }
unicode-normalization = { version = "0.1.23" }
unicode_names2 = { version = "1.2.2" }
walkdir = { version = "2.3.2" }

# Used by ruff_python_trivia
unicode-ident = { version = "1.0.12" }

# Used by ruff_text_size
serde_test = { version = "1.0.152" }
static_assertions = "1.1.0"

# https://ohadravid.github.io/posts/2023-03-rusty-python
[profile.release]
debug = true      # Debug symbols for profiler.
lto = true        # Link-time optimization.
codegen-units = 1 # Slower compilation but faster code.

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(fuzzing)",
    "cfg(codspeed)",
] }

[package]
name = "citry_ownership_journal_probe"
version = "0.1.0"
edition = "2024"
publish = false

# This experiment builds separately and does not alter the shipped extension.
[workspace]

[workspace.dependencies]
citry_ownership = { path = "../../crates/citry_ownership", version = "=0.1.0" }
pyo3 = { version = "=0.27.1", features = ["extension-module", "abi3-py310"] }
pyo3-build-config = "=0.27.1"

[lib]
name = "citry_ownership_journal_probe"
crate-type = ["cdylib"]

[dependencies]
citry_ownership = { workspace = true }
pyo3 = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

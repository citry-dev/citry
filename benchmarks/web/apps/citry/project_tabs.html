<div id="project-tabs" x-data="{ activeTab: 'outputs' }">
<div role="tablist">
<button type="button" data-tab-target="project-info" @click="activeTab = 'project-info'; $dispatch('project-tab-change', activeTab)">Project Info</button>
<button type="button" data-tab-target="notes-1" @click="activeTab = 'notes-1'; $dispatch('project-tab-change', activeTab)">Notes 1</button>
<button type="button" data-tab-target="notes-2" @click="activeTab = 'notes-2'; $dispatch('project-tab-change', activeTab)">Notes 2</button>
<button type="button" data-tab-target="notes-3" @click="activeTab = 'notes-3'; $dispatch('project-tab-change', activeTab)">Notes 3</button>
<button type="button" data-tab-target="outputs" @click="activeTab = 'outputs'; $dispatch('project-tab-change', activeTab)">Outputs</button>
</div>
<c-ProjectInfo />
<c-NotePanel c-for="tab in state['note_tabs']" #c-key="tab['id']" c-tab="tab" />
<section id="outputs" data-tab-panel="outputs" x-show="activeTab === 'outputs'">
<h2>Outputs</h2>
<c-PhaseGroup c-for="phase in state['phase_groups']" #c-key="phase['id']" c-phase="phase" />
</section>
</div>

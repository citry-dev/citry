<section c-id="tab['id']" c-data-tab-panel="tab['id']" x-data="{ activeTab: 'outputs' }" @project-tab-change.window="activeTab = $event.detail" c-x-show="'activeTab === \'%s\'' % tab['id']">
<h2>{{ tab['title'] }}</h2>
<article c-for="note in tab['notes']" c-data-note-id="note['id']">
<p class="note-text">{{ note['text'] }}</p>
<details>
<summary>Comments</summary>
<article c-for="comment in note['comments']" c-data-comment-id="comment['id']">
<span class="comment-author">{{ comment['author'] }}</span>
<p class="comment-text">{{ comment['text'] }}</p>
</article>
</details>
</article>
</section>

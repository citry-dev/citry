[project]
name = "citry-benchmark-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright==1.62.0", "psutil==7.2.2"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
citry-bench = "citry_bench.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citry_bench"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.5"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.ruff]
line-length = 119
extend = "../../../pyproject.toml"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

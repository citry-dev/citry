[project]
name = "citry-benchmark-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["playwright==1.62.0", "psutil==7.2.2"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
citry-bench = "citry_bench.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
# This folder is not a member of the repository's uv workspace, so uv reads
# build pins only from this file and the uv.lock beside it. A [tool.uv] table
# here also stops uv from inheriting the root's settings, so the table repeats
# the root's two settings: a build download without a hash still fails.
# `python scripts/build_constraints.py update` rewrites the pins; run `uv lock`
# in this folder afterwards, because `uv sync --frozen` reads them from uv.lock.
require-build-hashes = true
preview-features = ["build-dependency-hashes"]
build-constraint-dependencies = [
    # BEGIN build constraints, generated by `python scripts/build_constraints.py update`
    { requirement = "editables==0.6", hashes = [
        "sha256:1163834902381c4613787951c5914800fdf155ae08848a373b8ea5006780977c",
        "sha256:d70e4698078a1d033e7786d9c64e5be070d058a67c21417024d38a58ac20aa43",
    ] },
    { requirement = "hatchling==1.27.0", hashes = [
        "sha256:971c296d9819abb3811112fc52c7a9751c8d381898f36533bb16f9791e941fd6",
        "sha256:d3a2f3567c4f926ea39849cdf924c7e99e6686c9c8e288ae1037c8fa2a5d937b",
    ] },
    { requirement = "packaging==26.3", hashes = [
        "sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79",
        "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
    ] },
    { requirement = "pathspec==1.1.1", hashes = [
        "sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a",
        "sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
    ] },
    { requirement = "pluggy==1.7.0", hashes = [
        "sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec",
        "sha256:d1eaa46ebb595891b860ab086b4d09c8588af65ebd4361b8e8f4bb8920b90ba8",
    ] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = [
        "sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71",
        "sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17",
    ] },
    # END build constraints
]

[tool.hatch.build.targets.wheel]
packages = ["src/citry_bench"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.5"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.ruff]
line-length = 119
extend = "../../../pyproject.toml"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

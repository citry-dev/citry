status = "not-applicable"
reason = """This app's card writes its own footer link and does not use `{% extends %}` or `{% block %}`, although both work at the pinned Django Rusty Templates commit. The app was written without them and has not been changed to use them. A `simple_block_tag` card fails there with Django 6.1.3. Even a footer the page handed over as a template name to `{% include %}` would read the card's own context, as a Django block does, so the card hands a fill no slot data of its own and there is no slot data whose type a fill could get wrong. A wrong-typed use of a variable in the card's link is m23."""

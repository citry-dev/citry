status = "prevented"
reason = """The mistake cannot be written: HTMX sends `hx-vals` as ordinary form fields, and a form field is always text, so `hx-vals='{"amount": "1"}'` sends exactly the same request as `{"amount": 1}`. The view turns the field into a whole number with `int(request.POST['amount'])`, as it must for any form field, so the counter works."""

# Tetra's tutorial keys each component a loop renders. Tetra uses the key
# to find the card's saved state when the list renders again; without one,
# every card gets the component's name as its key and resumes from the same
# saved state. The case leaves the card's key out.
status = "ported"
mistake = { file = 'board/components/default.py', contains = 'yesno:"accent,plain" %}' }

[[edits]]
file = 'board/components/default.py'
old = 'yesno:"accent,plain" key=card.title %}'
new = 'yesno:"accent,plain" %}'

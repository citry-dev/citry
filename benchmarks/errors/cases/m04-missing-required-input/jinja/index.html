{% from "card.html" import card %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Projects</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
  <script defer src="{{ url_for('static', path='alpine.min.js') }}"></script>
</head>
<body>
  <div class="board" title="Board">
    <h1>Projects</h1>
    <p>Owner: {{ owner.name }}</p>
    <p x-data='{ api: {{ api_base|tojson }} }'>API: <span x-text="api"></span></p>

    {% for project in projects %}
    <div x-data="{ shown: true }" x-show="shown" @hide="shown = false">
      {% call card(count=project.count) %}
      <a href="#{{ project.title|lower }}">Open {{ project.title }}</a>
      {% endcall %}
    </div>
    {% endfor %}

    {% include "counter.html" %}

    <div x-data="{ open: false }">
      <button type="button" @click="open = !open">Details</button>
      <p x-show="open">Details are visible</p>
    </div>

    <form role="search"><button type="submit">Search</button></form>
  </div>
</body>
</html>

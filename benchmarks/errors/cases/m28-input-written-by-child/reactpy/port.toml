# The status line's own click handler assigns `False` to its `open` input, as
# a React developer would. In Python the assignment makes `open` a new local
# name in `close`, so nothing changes in the page. Adding `nonlocal open`
# would rebind the input itself, which changes nothing in the page either and
# which no tool reports.

status = "not-applicable"
reason = """This app's card writes its own footer link and does not use `{% extends %}` or `{% block %}`, although both work at the pinned Django Rusty Templates commit. The app was written without them and has not been changed to use them. A `simple_block_tag` card fails there with Django 6.1.3. The page could hand the card a template name for `{% include %}` to render as its footer, but that needs a separate template file for each fill, so this app keeps the footer in the card. The page therefore fills no footer under any name."""

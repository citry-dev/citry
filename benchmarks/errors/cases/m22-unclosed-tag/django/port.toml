status = "ported"
mistake = { file = "board/templates/board/card.html", contains = 'class="card-footer"' }

[indirect]
reason = "The unclosed footer div takes the card's closing `</div>`, so djLint reports the card's outer `<div>` as the tag left without a match, four lines above the footer."
codes = ["H025"]

[[edits]]
file = "board/templates/board/card.html"
old = '<div class="card-footer">{% block footer %}{% endblock %}</div>'
new = '<div class="card-footer">{% block footer %}{% endblock %}'

status = "not-applicable"
reason = """The pinned Django Rusty Templates commit has no `{% extends %}` or `{% block %}` tag; both raise NotImplementedError when the template loads, and a `simple_block_tag` card also fails there with Django 6.1.1. So the card writes its own footer link. The page could hand the card a template name for `{% include %}` to render as its footer, but that needs a separate template file for each fill, so this app keeps the footer in the card. The page therefore has no footer to leave out."""

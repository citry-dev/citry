status = "not-applicable"
reason = "The public setting lives in `runtimeConfig` in nuxt.config.ts, where the API base `/api` is a plain string. JavaScript has no path type, and its URL class needs a full address or a base address to resolve against, which a relative setting like `/api` does not have, so a developer would not wrap it in one. A set or a date is not a natural type for an API base, and the page reads the same string the config holds."

# The mistakes the error-prevention benchmark writes into every framework.
#
# Each entry describes the mistake in framework-neutral words. A framework's
# version of it lives in cases/<id>/<framework>/port.toml. `origin` records
# where the mistake came from, so a reader can check that the set is not
# chosen to suit Citry. "neutral" entries come from three sources: issue
# #158, a survey of what other frameworks' tools check, and the
# maintainer's list of hand-offs. A hand-off is a place where a web app
# passes data from one part to another, such as server data into a template
# or browser code, a browser request to a server handler, a slot fill, or
# saved state. The list asks at each one whether a misspelled name, a
# missing value, a wrong type and similar faults are reported (section 2 of
# docs/design/error_prevention_benchmark_plan.md). "citry-inventory" entries
# come from the list of mistakes Citry itself checks or misses. At least
# half must be "neutral".
#
# Freeze this file before a published run. Changing a mistake after seeing which
# framework catches it would bias the result.

[[mistake]]
id = "m01-component-name"
title = "Misspelled component name"
category = "naming"
origin = "neutral"
description = "The page uses the card component under a misspelled name, for example `Crad` instead of `Card`."
correct = "The page renders three project cards."

[[mistake]]
id = "m02-input-name"
title = "Misspelled input name"
category = "naming"
origin = "neutral"
description = "The page passes the card's title under a misspelled input name, for example `titel` instead of `title`."
correct = "Each card shows its project title."

[[mistake]]
id = "m03-input-type-literal"
title = "Wrong-typed input written in markup"
category = "types"
origin = "neutral"
description = "The page passes the card's numeric `count` input as a string literal in the markup, for example `count=\"3\"` where a number is declared."
correct = "Each card shows its numeric task count."

[[mistake]]
id = "m04-missing-required-input"
title = "Missing required input"
category = "naming"
origin = "neutral"
description = "The page leaves out the card's required `title` input."
correct = "Each card shows its project title."

[[mistake]]
id = "m05-slot-name"
title = "Misspelled slot name"
category = "naming"
origin = "neutral"
description = "The page fills the card's `footer` slot (or block, or child region) under a misspelled name, for example `fotter`."
correct = "Each card shows the footer link the page passed in."

[[mistake]]
id = "m06-server-handler-name"
title = "Misspelled server handler name"
category = "events"
origin = "neutral"
description = "The Add button sends its request to a misspelled server handler, route or action name, for example `sav` instead of `save`."
correct = "Clicking Add increases the saved count from 0 to 1."

[[mistake]]
id = "m07-undefined-variable"
title = "Undefined template variable"
category = "naming"
origin = "neutral"
description = "The page reads a template variable that the server never provides, for example `ownr.name` instead of `owner.name`."
correct = "The page shows the owner's name."

[[mistake]]
id = "m08-attribute-typo"
title = "Misspelled attribute on a template object"
category = "naming"
origin = "neutral"
description = "The page reads a field that does not exist on an object the server does provide, for example `owner.nmae`."
correct = "The page shows the owner's name."

[[mistake]]
id = "m09-attribute-value"
title = "Invalid HTML attribute value"
category = "html"
origin = "neutral"
description = "A form button is written with an invalid keyword value, `type=\"sumbit\"` instead of `type=\"submit\"`."
correct = "The search button is a submit button."

[[mistake]]
id = "m10-attribute-name"
title = "Misspelled HTML attribute name"
category = "html"
origin = "neutral"
description = "An element's `title` attribute is written as `titel`."
correct = "The board element has the tooltip `Board`."

[[mistake]]
id = "m11-element-name"
title = "Misspelled HTML element"
category = "html"
origin = "neutral"
description = "A block element is written as `<dvi>` instead of `<div>`."
correct = "The board wrapper is a block element."

[[mistake]]
id = "m12-server-only-value"
title = "Server-only value read in browser code"
category = "server-browser"
origin = "neutral"
description = "Browser-side code reads a value that exists only on the server (a secret token) instead of the public value the server passes to it."
correct = "The page shows the public API base `/api`, and the secret never reaches the browser."

[[mistake]]
id = "m13-state-field-typo"
title = "State field typo in an update handler"
category = "events"
origin = "neutral"
description = "The code that runs when Add is clicked writes the new total to a misspelled state field, for example `cuont` instead of `count`."
correct = "Clicking Add increases the saved count from 0 to 1."

[[mistake]]
id = "m14-hydration-mismatch"
title = "Server and browser render different content"
category = "server-browser"
origin = "neutral"
description = "A component renders different text on the server than in its first browser render, for example by branching on whether it runs in the browser."
correct = "The details section shows the same content before and after the page becomes interactive."

[[mistake]]
id = "m15-i18n-key"
title = "Unknown translation message key"
category = "naming"
origin = "neutral"
description = "The page heading asks for a translation message under a misspelled key, for example `board.titel`."
correct = "The heading reads `Projects`."

[[mistake]]
id = "m16-css-class"
title = "Misspelled CSS class"
category = "html"
origin = "neutral"
description = "The board element uses the class `bord` instead of the styled class `board`."
correct = "The board text is green."

[[mistake]]
id = "m17-input-type-code"
title = "Wrong-typed input computed in code"
category = "types"
origin = "citry-inventory"
description = "Server or component code passes the card's numeric `count` as a string value it computed, for example `str(n)`."
correct = "Each card shows its numeric task count."

[[mistake]]
id = "m18-payload-field"
title = "Misspelled field in a request payload"
category = "events"
origin = "citry-inventory"
description = "The Add button sends its payload with a misspelled field, `amont` instead of `amount`."
correct = "Clicking Add increases the saved count from 0 to 1."

[[mistake]]
id = "m19-client-expression-syntax"
title = "Syntax error in a browser expression"
category = "templates"
origin = "citry-inventory"
description = "A browser-side expression in the markup (a Vue binding, a JSX expression, an Alpine directive) has a syntax error, for example a trailing `&&`."
correct = "Clicking Details shows the details text."

[[mistake]]
id = "m20-component-script-syntax"
title = "Syntax error in component JavaScript"
category = "templates"
origin = "citry-inventory"
description = "The JavaScript that defines the toggle's behavior has a syntax error."
correct = "Clicking Details shows the details text."

[[mistake]]
id = "m21-directive-name"
title = "Misspelled template directive"
category = "naming"
origin = "citry-inventory"
description = "A conditional or binding directive is misspelled, for example `c-iff`, `v-iff` or `x-shwo`."
correct = "The details text is hidden until Details is clicked."

[[mistake]]
id = "m22-unclosed-tag"
title = "Unclosed element in a template"
category = "templates"
origin = "citry-inventory"
description = "An element in the card's markup is opened but never closed."
correct = "Each card's footer sits inside the card."

[[mistake]]
id = "m23-expression-type"
title = "Wrong-typed operation in a template expression"
category = "types"
origin = "citry-inventory"
description = "A template expression adds a number to the card's string title, for example `title + 1`."
correct = "Each card shows its project title."

[[mistake]]
id = "m24-undeclared-event"
title = "Child emits an event the parent does not listen for"
category = "events"
origin = "citry-inventory"
description = "The card's Hide control emits or calls a misspelled event, for example `hdie` instead of `hide`, so the page's listener never runs."
correct = "Clicking Hide on the first card hides that card."

[[mistake]]
id = "m25-browser-input-name"
title = "Misspelled input on a browser-side component"
category = "naming"
origin = "neutral"
description = "The details panel passes its open state to the browser-side `Status` component under a misspelled input name, for example `opne` instead of `open`. Where the component reads its parent's state through a shared scope instead of receiving it as an input, as an Alpine component nested inside another does, the misspelled name is the one the component reads."
correct = "Clicking Details changes the status line from `Status: closed` to `Status: open`."

[[mistake]]
id = "m26-browser-input-missing"
title = "Missing required input on a browser-side component"
category = "naming"
origin = "neutral"
description = "The details panel renders the browser-side `Status` component without its required `open` input."
correct = "Clicking Details changes the status line from `Status: closed` to `Status: open`."

[[mistake]]
id = "m27-browser-input-type"
title = "Wrong-typed input on a browser-side component"
category = "types"
origin = "neutral"
description = "The details panel passes `Status` its boolean `open` input as text, for example `\"open\"` or `\"closed\"` instead of `true` or `false`."
correct = "Clicking Details changes the status line from `Status: closed` to `Status: open`."

[[mistake]]
id = "m28-input-written-by-child"
title = "Child component changes an input it received"
category = "events"
origin = "neutral"
description = "The `Status` component's Close button closes the panel by assigning `false` to its `open` input, instead of telling the parent through an event."
correct = "Clicking Close in the status line hides the details text and the Details button opens it again."

[[mistake]]
id = "m29-listener-name"
title = "Parent listens for a misspelled event"
category = "events"
origin = "neutral"
description = "The card emits or calls `hide` correctly, but the page listens under a misspelled name, for example `@hdie` or `onHdie`."
correct = "Clicking Hide on the first card hides that card."

[[mistake]]
id = "m30-event-payload-type"
title = "Event sent with a payload of the wrong type"
category = "events"
origin = "neutral"
description = "The card's `hide` event carries a number, for example the card's task count, where the page expects the card's title (a string). Where the event carries no value, because the page's listener already knows which card it belongs to, this mistake does not apply."
correct = "Clicking Hide on the first card hides that card."

[[mistake]]
id = "m31-dom-event-name"
title = "Misspelled browser event name on an element"
category = "events"
origin = "neutral"
description = "The Details button listens for a misspelled browser event, for example `@clik`, `onClik`, `x-on:clik` or `hx-trigger=\"clik\"`."
correct = "Clicking Details shows the details text."

[[mistake]]
id = "m32-payload-type"
title = "Request payload field of the wrong type"
category = "events"
origin = "neutral"
description = "The Add button sends `amount` as text, for example `{amount: \"1\"}` or a value read from an element's text, where the server declares a whole number. Where the framework turns that text into a number before the server code sees it, the mistake is prevented."
correct = "Clicking Add increases the saved count from 0 to 1."

[[mistake]]
id = "m33-payload-missing-field"
title = "Request payload leaves out a required field"
category = "events"
origin = "neutral"
description = "The Add button sends its request without the `amount` field, for example an empty payload."
correct = "Clicking Add increases the saved count from 0 to 1."

[[mistake]]
id = "m34-reply-field"
title = "Browser reads a misspelled field of the server's reply"
category = "events"
origin = "neutral"
description = "Browser code that receives the server's reply to Add reads a misspelled field, for example `result.cuont` instead of `result.count`. Where the server replies with HTML that replaces part of the page, this mistake does not apply."
correct = "Clicking Add increases the saved count from 0 to 1."

[[mistake]]
id = "m35-required-slot-missing"
title = "Required slot left unfilled"
category = "naming"
origin = "neutral"
description = "The page renders a card without filling its required `footer` slot (or block, or child region)."
correct = "Each card shows the footer link the page passed in."

[[mistake]]
id = "m36-slot-data-name"
title = "Slot fill reads a misspelled slot-data field"
category = "naming"
origin = "neutral"
description = "The card hands its title and count to the `footer` slot, and the page's fill reads the title under a misspelled name, for example `titel` instead of `title`."
correct = "Each card's footer link reads `Open Alpha (3)`, `Open Beta (5)`, `Open Gamma (8)`."

[[mistake]]
id = "m37-slot-data-type"
title = "Slot fill uses slot data as the wrong type"
category = "types"
origin = "neutral"
description = "The page's footer fill treats the card's numeric `count`, which the slot hands back, as text, for example `count + \" tasks\"` in Python or a string method such as `count.padStart(2, \"0\")`."
correct = "Each card's footer link reads `Open Alpha (3)`, `Open Beta (5)`, `Open Gamma (8)`."

[[mistake]]
id = "m38-state-read-typo"
title = "Template reads a misspelled state field"
category = "naming"
origin = "neutral"
description = "The counter's text reads the saved total from a misspelled state field, for example `cuont`, while the code that updates it is correct."
correct = "Clicking Add changes the text from `Saved: 0` to `Saved: 1`."

[[mistake]]
id = "m39-state-type"
title = "State field given a value of the wrong type"
category = "types"
origin = "neutral"
description = "The Add handler stores the new total as text, for example `str(total)`, in a state field declared as a number."
correct = "Clicking Add increases the saved count from 0 to 1. (Only tools can see the wrong type; the page looks the same.)"

[[mistake]]
id = "m40-browser-value-name"
title = "Browser code reads a misspelled server value"
category = "naming"
origin = "neutral"
description = "Browser code reads the public setting the server passes to it under a misspelled name, for example `apiBsae`."
correct = "The page shows `API: /api`."

[[mistake]]
id = "m41-browser-value-not-json"
title = "Server passes browser code a value the browser cannot receive"
category = "server-browser"
origin = "citry-inventory"
description = "The server passes the public setting to browser code as an object that cannot be sent as JSON, for example a path or URL object, a set, or a date, instead of a string."
correct = "The page shows `API: /api`."

[[mistake]]
id = "m42-secret-sent-to-browser"
title = "Server sends a secret to the browser"
category = "server-browser"
origin = "citry-inventory"
description = "The server adds `SECRET_TOKEN` to the data it passes to browser code (props, JSON data, a public config key), although no browser code reads it."
correct = "The page shows `API: /api`, and the secret appears nowhere in what the browser receives. (The page comparison cannot see this; only tools can catch it.)"

[[mistake]]
id = "m43-css-variable-name"
title = "CSS reads a misspelled variable the server sets"
category = "html"
origin = "citry-inventory"
description = "The server sets the heading color as the CSS variable `--accent`, and the stylesheet reads a misspelled `var(--acent)`. Where the stylesheet reads the server's value by its name in code instead, as Vue's `v-bind()` in a component's `<style>` does, the misspelled name is the one it reads."
correct = "The heading is blue."

[[mistake]]
id = "m44-form-field-name"
title = "Form field name differs from what the server reads"
category = "events"
origin = "neutral"
description = "The search form's text input is named `qeury` while the server reads the field `q`."
correct = "Searching for `alpha` shows `Searched: alpha`."

[[mistake]]
id = "m45-link-route-name"
title = "Link to a route that does not exist"
category = "naming"
origin = "neutral"
description = "The About link points to a misspelled route, by name (`url('abuot')`) or by path (`/abuot`), where the app defines `about`."
correct = "Clicking About opens the page that reads `About this board`."

[[mistake]]
id = "m46-i18n-argument"
title = "Translation message given a missing or misnamed argument"
category = "naming"
origin = "citry-inventory"
description = "The subtitle's translation message takes the owner's name as an argument, and the page passes it under a misspelled name, for example `nmae=` instead of `name=`."
correct = "The heading reads `Projects`, and its subtitle reads `Owned by Ada`."

[[mistake]]
id = "m47-template-path"
title = "Misspelled path to a template or component file"
category = "templates"
origin = "neutral"
description = "The page names the file of its layout or of the card's script with a typo, for example an `extends` target, a `template_file`, or an import path such as `./crad`. Django's m01 port is already an include-path typo, so Django's m47 port misspells the `extends` target instead."
correct = "The page renders three project cards."

[[mistake]]
id = "m48-asset-path"
title = "Misspelled path to a stylesheet, script or image"
category = "html"
origin = "neutral"
description = "The owner's avatar image points to a misspelled static file, for example `/static/avtar.svg` instead of `/static/avatar.svg`."
correct = "The owner's avatar image loads."

[[mistake]]
id = "m49-input-choice"
title = "Component input given a value outside its allowed choices"
category = "types"
origin = "neutral"
description = "The card's `tone` input accepts only `plain` or `accent`, and the page passes a misspelled choice, for example `acent`."
correct = "The first card has the accent border."

[[mistake]]
id = "m50-shared-value-name"
title = "Descendant reads a shared value that no ancestor provides"
category = "naming"
origin = "neutral"
description = "The page makes the board's name, `Projects`, available to the components or templates inside it without passing it to each card as an input (provide/inject, React context, a template context that included templates and components can read, or shared state), and the card reads it under a misspelled key or name, for example `bord` instead of `board`. Where the framework has no way to share a value other than passing it as an input, this mistake does not apply."
correct = "Each card shows `Board: Projects` under its title."

[[mistake]]
id = "m51-list-key-missing"
title = "Repeated browser element without a key"
category = "templates"
origin = "neutral"
description = "The loop that renders the cards gives each card no stable key (`key`, `:key`, `#c-key`), where the framework uses keys to match list items when it updates the list in place. Where the list is rendered only on the server and never updated in place, this mistake does not apply."
correct = "Each card has a key made from its project, and hiding the first card hides only that card."

[[mistake]]
id = "m52-invalid-nesting"
title = "Block element inside a paragraph"
category = "html"
origin = "neutral"
description = "The owner line is written as a `<p>` that contains a `<div>`, for example `<p>Owner: <div>Ada</div></p>` with the name in a `<div>`, which the browser silently splits into separate elements."
correct = "The owner line is one block that reads `Owner: Ada`."

[[mistake]]
id = "m53-image-alt"
title = "Image without alt text"
category = "html"
origin = "neutral"
description = "The owner's avatar image has no `alt` attribute."
correct = "The avatar image has the alt text `Ada`."

[[mistake]]
id = "m54-aria-name"
title = "Misspelled ARIA attribute"
category = "html"
origin = "neutral"
description = "The Details button's `aria-expanded` attribute is written as `aria-expandd`."
correct = "The Details button reports whether the details are open through `aria-expanded`."

[[mistake]]
id = "m55-aria-value"
title = "Invalid ARIA attribute value"
category = "html"
origin = "neutral"
description = "The Details button's `aria-expanded` is set to a value ARIA does not allow, for example `yes` or `open`, instead of `true` or `false`."
correct = "The Details button reports whether the details are open through `aria-expanded`."

[[mistake]]
id = "m56-duplicate-attribute"
title = "Same attribute written twice on one element"
category = "html"
origin = "neutral"
description = "The board wrapper gets a second `class` attribute in front of the one it has, for example `class=\"cards\" ... class=\"board\"`. HTML keeps the first and drops the second, so the board loses its styled class; where the last one wins, as in JSX, the page keeps it."
correct = "The board text is green."

[[mistake]]
id = "m57-duplicate-id"
title = "Two elements share an id"
category = "html"
origin = "neutral"
description = "The heading is given `id=\"board\"`, the id the board wrapper already has."
correct = "Only the board wrapper has the id `board`."

[[mistake]]
id = "m58-loop-non-list"
title = "Loop over a value that is not a list"
category = "types"
origin = "neutral"
description = "The cards loop iterates over one project's `count` (a number), for example the first project's, instead of the list of projects."
correct = "The page renders three project cards."

[[mistake]]
id = "m59-unknown-helper"
title = "Unknown template filter or helper function"
category = "naming"
origin = "neutral"
description = "The line that counts the projects uses a misspelled or wrong name for the length filter or helper, for example `projects|lenght` for `projects|length`, or `length(projects)` for Python's `len(projects)`. Where the count is a property of the list (`projects.length` in JavaScript), the misspelled property is the natural form."
correct = "The page shows `Projects: 3`."

[[mistake]]
id = "m60-handler-arguments"
title = "Handler declares arguments the event does not send"
category = "events"
origin = "neutral"
description = "The page's hide handler is changed to take one more argument than the card's hide event sends, a reason for hiding the card, which the handler then uses. Where the page's listener is an inline statement rather than a function with parameters, this mistake does not apply."
correct = "Clicking Hide on the first card hides that card."

[[mistake]]
id = "m61-route-param-type"
title = "Link passes a route parameter of the wrong type"
category = "types"
origin = "neutral"
description = "The project link points to `/projects/alpha`, the project's slug, instead of `/projects/1`, where the project route takes a numeric id. Where the router can declare the parameter's type, the route declares it as a number, for example `/projects/{id:int}`."
correct = "Clicking the project link opens the page for project 1."

[[mistake]]
id = "m62-boolean-attribute-string"
title = "Boolean attribute given the text \"false\""
category = "html"
origin = "neutral"
description = "The search button is written with `disabled=\"false\"`, which HTML treats as disabled."
correct = "The search button is enabled."

[[mistake]]
id = "m63-binding-on-non-input"
title = "Two-way binding on an element with no value"
category = "templates"
origin = "neutral"
description = "The search field's two-way binding (`v-model`, `x-model`, `unicorn:model`, or `value` with a change handler) is put on the `<form>` around it instead of the `<input>`."
correct = "Typing in the search field updates the text `Searching for: ...`."

key = "citry"
name = "Citry"
notes = """
The baseline follows Citry's FastAPI starter (examples/starters/fastapi):
one Citry engine in app/citry_app.py, components in app/components/, and a
FastAPI app in app/main.py, served by uvicorn. The benchmark measures
Citry served from FastAPI, the setup Citry's Getting Started guide also
uses. Its routes render the pages, and `citry.contrib.fastapi.mount()`
adds Citry's routes under /citry, as the starter and Citry's FastAPI guide
do. citry and citry-lsp are not the PyPI releases: uv builds them from
this repository's sources in packages/py/ and installs them the way it
installs a release, so they include unreleased changes while still
declaring versions 0.6.0 and 0.2.0. Each report names the commit. The
rest comes from PyPI: citry-core 1.8.0, the version citry pins, fastapi
0.141.1 with starlette 1.6.0 and pydantic 2.13.4 (the versions the
starter's lockfile has), uvicorn 0.52.4, and ty 0.0.89, the Python type
checker Citry runs on template expressions, which citry-lsp installs.
They are locked in baseline/uv.lock for Python 3.12.

The editor stage has two parts. It assumes a VS Code user runs both the
Citry extension, which Citry's docs recommend, and Pylance, which VS
Code's Python extension installs with it. The Citry extension's language
server is measured with `citry check --types`, which runs every
`citry check` rule and also ty and TypeScript, as the language server does.
TypeScript 5.9.3 is a dev dependency so that `citry check --types` can find
`tsc`, as Citry's CLI docs ask; in the editor, the Citry extension uses VS
Code's built-in TypeScript, whose version may differ. Pylance is measured
with pyright 1.1.414, installed only so the benchmark can run it, in
`typeCheckingMode = "standard"`, the mode a project with type checking
turned on uses (Pylance's own default is "off"). pyright checks every .py
file, while Pylance by default reports only open files.

The check stage is `citry --app app.main:citry_app check`, the command the
FastAPI starter's README tells developers to run, and ruff
with its default rules, the Python linter most projects add (the starter
installs none). A ruff finding fails the command, so it counts as an
error. Citry has no production build, so there is no build stage. Every
stage and the server get a fixed `CITRY_SECRET`, because the starter's
engine refuses to start without one.

The README names the heading's message `board.title`. Here it is
`board-title`, because a Fluent message ID cannot contain a dot, and
Citry's docs name messages with hyphens.

Every component whose template reads Python values defines
`template_data()`, as each component in the FastAPI starter does; Citry's
Getting Started guide defines it only when a value must be computed.
Citry 0.6.0 skipped a template's Python expressions when its component
defined neither `template_data()` nor `TemplateData`; the Citry
measured here checks them either way (#202). No case measures a component without the
method; a manual check of m23's card with its `template_data()` removed
still reported the type error.

m15 is ported because Citry's translations are a built-in extension that
needs nothing extra installed, as Django's are. The starter itself has no
translated text.

The counter's value lives in the page's browser-held state, so after the
reload the clean page shows `Saved: 0` again, where the other frameworks
show `Saved: 1`.

m12 reads `SECRET_TOKEN` in Vue code, which Citry's unknown-variable
rule checks. Returning it from `js_data()` instead, which sends it to
the browser, reports nothing; m42 measures that. In the Next.js and
Nuxt ports of m12, reading the secret in browser code also sends it:
the server renders it into the page before the browser reports a
hydration error.

m21 misspells the Vue directive `v-if`. A misspelled server-side `c-if`,
such as the one that shows the search form's `Searched:` line, is
reported too (`citry.template.misspelled-directive`), though no case
measures it.

The board page wraps the cards in `<c-provide key="board" name="Projects">`,
and each card reads the board's name in `template_data()` with
`self.inject("board")`, the first form Citry's provide-and-inject docs show.

The search form is its own `Search` component. `@c-submit.prevent` sends
the form's fields to the component's `search` server event, as Citry's
forms guide shows, and the event renders the component again with what
was searched. The text typed so far is ordinary Vue state bound with
`v-model`. The heading's color comes from `css_data()`, which Citry turns
into the CSS variable `--accent` on the board page's own elements, the
heading among them. The FastAPI starter has a single page route and
serves no static files, so app/main.py adds the About and project pages
as two more FastAPI routes, and serves app/static/, where the owner's
avatar lives, with FastAPI's `StaticFiles`, as FastAPI's docs show. The
project route declares its number as `project_id: int`, the way FastAPI's
docs type a path parameter, so FastAPI answers /projects/alpha (m61)
with a 422 validation error. A misspelled page (m45) or image (m48) gets
a 404.

Both `citry` stages and the editor setting in .vscode/settings.json load
the app as `app.main:citry_app`, the module that calls `mount()`, as the
FastAPI starter does, so `citry check` can ask FastAPI which pages and
files the app serves. `citry check`'s `citry.template.unknown-url` rule
warns about the misspelled page (m45) and image (m48); the browser still
gets the 404. The rule does not check a parameter type that only the
route function declares, such as `project_id: int`, so m61 is first
reported by FastAPI's 422.

The browser always runs Vue's production build, so Vue's development
warnings never appear, and no Citry case can end as a runtime warning
through them.

Stricter settings: none changed from the default. The benchmark turns
on a framework's stricter check when other frameworks here have the same
kind of check. Considered and left off:
- Citry's own lint rules are all on by default: each starts as a warning
  or an error, and raising a warning to an error is not turning a check
  on (m29, m31, m43, m45, m48 and m53 end as warnings because of such
  rules; m41's check of `js_data()` values is always a warning).
- ty's rules that are off by default. `citry check --types` honors the
  project's `[tool.ty.rules]`, but it keeps only ty's findings inside
  template expressions. One of these rules, `possibly-unresolved-reference`,
  matches a check pyright's standard mode makes, but inside a template
  expression Citry's own check already reports an unknown name, and no
  test produced a finding from it, so it adds no check. The others
  resemble pyright's strict mode, which no Python app here turns on.
  Turning all of them on changed no finding in the clean app or any case.
- TypeScript's `strict` option, which the Next.js and Nuxt starters turn
  on, is fixed off in the TypeScript check Citry runs; a project cannot
  change it. A test build of Citry's check with `strict` on changed no
  finding.
- Pydantic models for `Kwargs`, which Citry's docs show, would check
  input types when a component renders. Citry already checks each
  input's outer type then, and ty checks inputs in the editor, so
  Pydantic would add only checks of nested types, such as the items of
  a `list[str]`.
- `mode="development"` changes only how translations are loaded, and
  the browser gets Vue's production build in either mode.
"""

[setup]
manifests = ["pyproject.toml", "uv.lock", ".python-version", "package.json", "package-lock.json"]
# uv runs in the clean app's folder, not in the copy of the manifests, because
# the lockfile names citry and citry-lsp by paths relative to that folder
# (see baseline/pyproject.toml); UV_PROJECT_ENVIRONMENT still installs into
# the shared environment. uv builds a package from a folder again only when
# that folder's pyproject.toml, setup.py or setup.cfg changes, so
# --reinstall-package builds both from their current sources each time this
# step runs. The runner runs this step again whenever their sources change.
command = [
  "sh", "-c",
  """UV_PROJECT_ENVIRONMENT='{venv}' uv sync --directory '{framework}/baseline' --frozen --no-install-project \
  --python 3.12 --reinstall-package citry --reinstall-package citry-lsp && npm ci --no-audit --no-fund""",
]

[[stages]]
stage = "editor"
label = "Citry language server (citry check --types)"
argv = ["{venv}/bin/citry", "--app", "app.main:citry_app", "check", "--types", "--format", "json"]
parser = "citry-json"
timeout = 600
env = { CITRY_SECRET = "benchmark-only-secret-not-for-production" }

[[stages]]
stage = "editor"
label = "Pylance, type checking on (pyright 1.1.414, standard)"
argv = ["{env}/node_modules/.bin/pyright", "--outputjson", "--pythonpath", "{venv}/bin/python", "--project", "{work}"]
parser = "pyright-json"
timeout = 600

[[stages]]
stage = "check"
label = "citry check"
argv = ["{venv}/bin/citry", "--app", "app.main:citry_app", "check", "--format", "json"]
parser = "citry-json"
timeout = 600
env = { CITRY_SECRET = "benchmark-only-secret-not-for-production" }

[[stages]]
stage = "check"
label = "ruff 0.15.5 (default rules)"
# --isolated: a real project's ruff reads only its own settings, not those of
# a repository it happens to sit in.
argv = ["{venv}/bin/ruff", "check", "--isolated", "--no-respect-gitignore", "--output-format", "json", "."]
parser = "ruff-json"
timeout = 300

[runtime]
argv = ["{venv}/bin/uvicorn", "app.main:web_app", "--host", "127.0.0.1", "--port", "{port}"]
page_path = "/"
ready_timeout = 180
settle_ms = 1500
env = { CITRY_SECRET = "benchmark-only-secret-not-for-production" }

[[runtime.journeys.default]]
action = "click"
selector = "button:has-text('Add')"

[[runtime.journeys.default]]
action = "wait"
ms = 1500

[[runtime.journeys.default]]
action = "click"
selector = "button:has-text('Details')"

[[runtime.journeys.default]]
action = "click"
selector = "button:has-text('Hide')"

[[runtime.journeys.default]]
action = "wait"
ms = 500

# Opens the details, closes them from the status line, and opens them again.
[[runtime.journeys.status]]
action = "click"
selector = "button:has-text('Details')"

[[runtime.journeys.status]]
action = "click"
selector = "button:has-text('Close')"

[[runtime.journeys.status]]
action = "click"
selector = "button:has-text('Details')"

# Types into the search field and submits the form.
[[runtime.journeys.search]]
action = "fill"
selector = "form[role=search] input"
text = "alpha"

[[runtime.journeys.search]]
action = "press"
selector = "form[role=search] input"
key = "Enter"

# Follows the About link to its page.
[[runtime.journeys.about]]
action = "click"
selector = "a:has-text('About')"

# Follows the project link to its page.
[[runtime.journeys.project]]
action = "click"
selector = "a:has-text('Project 1')"

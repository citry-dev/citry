key = "citry"
name = "Citry"
notes = """
The baseline follows Citry's bare ASGI starter (examples/starters/asgi): one
Citry engine in app/citry_app.py, components in app/components/, and the
root ASGI app in app/main.py, served by uvicorn. Published packages: citry
0.6.0, citry-core 1.8.0, uvicorn 0.52.4, and citry-lsp 0.2.0, which
installs ty 0.0.89, the Python type checker Citry runs on template
expressions. They are locked in baseline/uv.lock for Python 3.12.

The editor stage has two parts. It assumes a VS Code user runs both the
Citry extension, which Citry's docs recommend, and Pylance, which VS
Code's Python extension installs with it. The Citry extension's language
server is measured with `citry check --types`, which runs every
`citry check` rule and also ty and TypeScript, as the language server does.
TypeScript 5.9.3 is a dev dependency so that `citry check --types` can find
`tsc`, as Citry's CLI docs ask; in the editor, the Citry extension uses VS
Code's built-in TypeScript, whose version may differ. Pylance is measured
with pyright 1.1.414, installed only so the benchmark can run it, in
`typeCheckingMode = "standard"`, the mode a project with type checking
turned on uses (Pylance's own default is "off"). pyright checks every .py
file, while Pylance by default reports only open files.

The check stage is `citry --app app.citry_app:citry_app check`, the command
the starter README tells developers to run, and ruff with its default rules,
the Python linter most projects add (the starter installs none). A ruff
finding fails the command, so it counts as an error. Citry has no
production build, so there is no build stage. Every stage
and the server get a fixed `CITRY_SECRET`, because the starter's engine
refuses to start without one.

The README names the heading's message `board.title`. Here it is
`board-title`, because a Fluent message ID cannot contain a dot, and
Citry's docs name messages with hyphens.

Every component whose template reads Python values defines
`template_data()`, as each component in the ASGI starter does; Citry's
Getting Started guide defines it only when a value must be computed. ty
skips a template's Python expressions when its component defines neither
`template_data()` nor `TemplateData`. That is a Citry bug. Without these
methods, m03, m08 and m23 would not be caught in the editor, and
`citry check --types` reports nothing for them.

m15 is ported because Citry's translations are a built-in extension that
needs nothing extra installed, as Django's are. The starter itself has no
translated text.

The counter's value lives in the page's browser-held state, so after the
reload the clean page shows `Saved: 0` again, where the other frameworks
show `Saved: 1`.

In three cases the mistake is written where a Citry rule checks, and a
closely related form goes unreported. m24 misspells the event on the
child's emit, which Citry's `undeclared-emit` rule (an event the component
does not declare) checks; misspelling it in the parent's `@hdie` listener
reports nothing, which m29 measures. m21 misspells `v-if`, which Vue rejects
in the browser; a misspelled server-side `c-if`, such as the one that
shows the search form's `Searched:` line, would be silent. m12 reads `SECRET_TOKEN` in Vue
code, which the unknown variable rule checks; returning it from
`js_data()`, which sends it to the browser, reports nothing, which m42
measures. In the Next.js and Nuxt ports of m12, reading the secret in
browser code also sends it: the server renders it into the page before the
browser reports a hydration error.

The search form is its own `Search` component. `@c-submit.prevent` sends
the form's named controls to the component's `search` server event, as
Citry's forms guide shows, and the event renders the component again with
what was searched. The text typed so far is ordinary Vue state bound with
`v-model`. The heading's color comes from `css_data()`, which Citry turns
into the CSS variable `--accent` on the component's top-level elements,
the heading among them. The bare ASGI
starter has a single page route and serves no static files, so app/main.py
adds the About and project pages as plain path checks and serves
app/static/, where the owner's avatar lives.

The browser always runs Vue's production build, so Vue's development
warnings never appear, and no Citry case can end as a runtime warning
through them.
"""

[setup]
manifests = ["pyproject.toml", "uv.lock", ".python-version", "package.json", "package-lock.json"]
command = [
  "sh", "-c",
  "uv sync --frozen --no-install-project --python 3.12 && npm ci --no-audit --no-fund",
]

[[stages]]
stage = "editor"
label = "Citry language server (citry check --types)"
argv = ["{venv}/bin/citry", "--app", "app.citry_app:citry_app", "check", "--types", "--format", "json"]
parser = "citry-json"
timeout = 600
env = { CITRY_SECRET = "benchmark-only-secret-not-for-production" }

[[stages]]
stage = "editor"
label = "Pylance, type checking on (pyright 1.1.414, standard)"
argv = ["{env}/node_modules/.bin/pyright", "--outputjson", "--pythonpath", "{venv}/bin/python", "--project", "{work}"]
parser = "pyright-json"
timeout = 600

[[stages]]
stage = "check"
label = "citry check"
argv = ["{venv}/bin/citry", "--app", "app.citry_app:citry_app", "check", "--format", "json"]
parser = "citry-json"
timeout = 600
env = { CITRY_SECRET = "benchmark-only-secret-not-for-production" }

[[stages]]
stage = "check"
label = "ruff 0.15.5 (default rules)"
# --isolated: a real project's ruff reads only its own settings, not those of
# a repository it happens to sit in.
argv = ["{venv}/bin/ruff", "check", "--isolated", "--no-respect-gitignore", "--output-format", "json", "."]
parser = "ruff-json"
timeout = 300

[runtime]
argv = ["{venv}/bin/uvicorn", "app.main:application", "--host", "127.0.0.1", "--port", "{port}"]
page_path = "/"
ready_timeout = 180
settle_ms = 1500
env = { CITRY_SECRET = "benchmark-only-secret-not-for-production" }

[[runtime.journeys.default]]
action = "click"
selector = "button:has-text('Add')"

[[runtime.journeys.default]]
action = "wait"
ms = 1500

[[runtime.journeys.default]]
action = "click"
selector = "button:has-text('Details')"

[[runtime.journeys.default]]
action = "click"
selector = "button:has-text('Hide')"

[[runtime.journeys.default]]
action = "wait"
ms = 500

# Opens the details, closes them from the status line, and opens them again.
[[runtime.journeys.status]]
action = "click"
selector = "button:has-text('Details')"

[[runtime.journeys.status]]
action = "click"
selector = "button:has-text('Close')"

[[runtime.journeys.status]]
action = "click"
selector = "button:has-text('Details')"

# Types into the search field and submits the form.
[[runtime.journeys.search]]
action = "fill"
selector = "form[role=search] input"
text = "alpha"

[[runtime.journeys.search]]
action = "press"
selector = "form[role=search] input"
key = "Enter"

# Follows the About link to its page.
[[runtime.journeys.about]]
action = "click"
selector = "a:has-text('About')"

# Follows the project link to its page.
[[runtime.journeys.project]]
action = "click"
selector = "a:has-text('Project 1')"

[project]
name = "citry-error-bench-baseline"
version = "0.1.0"
description = "The error-prevention benchmark's reference page, written in Citry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "citry==0.6.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[dependency-groups]
# The FastAPI starter installs citry-lsp for the editor; it also brings ty,
# which `citry check --types` runs. ruff is the Python linter most
# projects add; the starter does not install it.
dev = [
  "citry-lsp==0.2.0",
  "ruff==0.15.5",
]

[tool.uv]
package = false

# Type checking on, as in most typed Python projects: Pylance's "standard"
# mode, which is also the pyright command line's default.
[tool.pyright]
typeCheckingMode = "standard"

key = "tetra"
name = "Tetra"
notes = """
The app is the Django app (frameworks/django) with Tetra 0.8.5 added the \
way its install guide says: `tetra` first in INSTALLED_APPS, before \
`django.contrib.staticfiles`, so that Tetra's runserver command takes \
precedence over the one staticfiles adds; `tetra.middleware.TetraMiddleware` \
last in MIDDLEWARE; `tetra.urls` under `__tetra__/` in the URL \
configuration; and `{% tetra_styles %}` and `{% tetra_scripts \
include_alpine=True %}` in the page's head. The version is the one the \
performance benchmark's Tetra app pins (benchmarks/web/apps/tetra), whose \
README explains why it is not the latest release. As there, channels 4.3.2 \
is pinned because Tetra 0.8.5 imports it when Django starts; the app uses no \
WebSockets. Tetra builds its components' JavaScript and CSS with esbuild, a \
JavaScript bundler. Tetra 0.8.5's wheel ships no esbuild binary and \
downloads one into its own package folder on the first build, so the app \
installs esbuild 0.27.2, the version Tetra would download, with npm \
(package.json), and names it in TETRA_ESBUILD_PATH, as the install guide \
allows. Tetra brings its own Alpine, so the page loads neither HTMX nor a \
separate Alpine. Django, the settings and the tools are otherwise the same \
as in the Django app.

The page is a plain Django view and template (board/views.py, \
board/templates/board/page.html) with the heading, the subtitle, the avatar, \
the owner and the links, written as in the django-unicorn app: the heading \
color is set in a `<style>` block as the CSS variable `--accent` that \
board.css reads, the subtitle uses `{% blocktranslate with name=owner.name \
%}`, the avatar `{% static %}`, and the links `{% url %}`. The interactive \
parts are Tetra components in board/components/default.py, the module \
Tetra's tutorial uses. Every class in it belongs to the app's `default` \
library, the group of components whose scripts and styles Tetra builds into \
one JavaScript file and one CSS file, and a template uses each one as a tag \
named after its class, such as `{% Card ... %}...{% /Card %}`. Each \
component writes its template, and where it has them its script and its \
stylesheet, as Python strings in the class, as the tutorial and the \
components docs do. A component's public attributes, declared with \
`public(...)`, are part of its Alpine data in the browser; its other \
attributes stay on the server. Its load() method is the one Tetra calls \
with the component tag's values when it renders the component. The \
components:
- ApiLine has the public attribute `api_base`, which load() sets from the \
settings, and shows it with Alpine's `x-text`.
- ProjectList builds the cards in load(), shows `Projects: {{ cards|length \
}}` above them, as the django-unicorn app's card list does (so \
`Projects: 3` sits below the API line, not the owner line), and keeps the titles of the \
hidden cards in the public attribute `hidden`. It gives each card its title \
as its key (`key=card.title`), as Tetra's tutorial keys components in a \
loop. Its `hide(title)` method is \
subscribed with `@public.listen('hide')` to the browser event `hide`, the \
shortcut the components docs give for an event that bubbles up from a \
child: Tetra calls the method on the server with the event's value, then \
renders the list again without the hidden card.
- Card takes `title`, `count` and `tone` as the arguments of its load() \
method. load() also takes `*args, **kwargs`, as most load() methods in \
Tetra's docs do, so an argument it does not name is dropped. `title` is \
public, so the Hide button can send it with `$dispatch('hide', title)`; \
`count` and `tone` are ordinary attributes, because no browser code reads \
them. The card's template has a `{% slot footer %}`, which the card list \
fills inside the card's tag. The accent border is in the card's `style`, \
which Tetra builds into the library's CSS. \
The card prints the board's name, `{{ board_name }}`, from a context \
processor, board/context_processors.py, listed in the settings. Tetra \
renders each component's template with a RequestContext of its own, \
which runs the context processors, so the value reaches every card, \
including when the card list renders again after Hide. The page's own \
context reaches a component only when the component lists the name in \
`_extra_context`, as Tetra's docs describe, or the tag passes it with \
`context:`, and here the card list would have to pass it on too, because \
the cards render inside its template. With `_extra_context`, a name \
misspelled in that list makes Tetra log a warning that the name is not \
in the context; a name misspelled only in the template prints nothing \
either way.
- Counter keeps the saved total in the public attribute `count`. Add runs \
`save(1)`: Tetra calls the public method on the server with the arguments \
in order, then renders the counter again.
- Details keeps the public attribute `open`, which its script's `toggle()` \
changes in the browser, with no server request. Tetra's tutorial puts a \
component's browser behavior in such script methods, and the Django and \
django-components apps toggle the details with a script function too. The \
docs' password field toggles inline instead (`@click="visible = \
!visible"`); written that way, no script would define the toggle, and m20 \
would be n/a, as for django-unicorn. `aria-expanded` and the details text \
follow `open` through Alpine.
- Status is the status line inside Details. Tetra gives a component its \
inputs only when the server renders it, and `open` changes in the browser, \
so, as in the Django and django-components apps, the status line is an \
Alpine component nested inside the details', and its markup reads the \
details' `open` through the scope Alpine shares with it. Its Close button's \
script dispatches `close`, which the details' root element handles.
- Search keeps what is typed in the public attribute `query`, bound to the \
field with `x-model`, in the browser only. The form submits to the page with \
GET, so the field's `name` decides what the view reads, as in the Django \
app.

The footer slot and what the card hands it: Tetra renders a slot's content \
with the card's own variables, not the card list's (the list's variables \
reach the card only through the tag's `context:` section or the card's \
`_extra_context`). So the fill reads `title` and `count` from the card, \
which is how the card hands its data to the fill here. This is how Tetra \
0.8.5's code works (a fill is a Django block, rendered in the component's \
context), but its docs do not describe it: they say only that passing \
context suits content passed down from an outer template. A developer \
whose first try, `{{ card.title }}`, prints nothing would either find this \
or pass the list's `card` with `context: card`. Written the second way, the \
card would hand the fill no data, and m36 and m37 would be n/a, as in the \
Django app. Tetra has no required slots.

State lives in the page. Tetra writes each component's public attributes \
into its root element as Alpine data, together with the component's state: \
the component pickled, without the attributes load() sets, and encrypted \
with a key made from SECRET_KEY and the session. The browser sends both \
back with each public method call. So the saved total is kept in the page, \
and a reload starts again from `Saved: 0`, as in the Citry and \
django-unicorn apps; the Django app keeps the total in the session and \
shows `Saved: 1` after a reload.

Inline components, or directory-style ones: Tetra's library docs also \
describe directory-style components, whose template, script and stylesheet \
are files next to the component's Python module, and call the inline form \
"another (shortcut) way of creating components, especially for simple \
building bricks (like BasicComponents without Js, CSS, and with small HTML \
templates)". The app still writes Details' script and Card's stylesheet \
inline, because the tutorial writes its TodoItem, which has both, that way, \
and so do the components docs' examples. Written as files, the card's \
template would be read by djLint, which reports the unclosed element of m22 \
there (H025, checked on such a file), and the details' script by the \
JavaScript syntax check the Django app has, which reports the syntax error \
of m20 in the Django and django-components apps. So m20 and m22 would \
likely end as in the Django app; m22 was checked with djLint, m20 is \
reasoned from those apps' cells. Tetra 0.8.5 reads a directory-style \
component's script from `<component name>.js`, not the `script.js` its \
library docs show.

Stricter settings: type annotations on public attributes. Tetra has no \
setting that turns on a check, but it checks a public attribute's value \
only when the attribute has a type annotation, so annotating every public \
attribute is how this app turns that check on. Tetra builds a Pydantic \
model from each component's public attributes and their annotations, and \
checks the values against it each time it writes the component's state \
into the page. The docs write public attributes both with an annotation \
(`visible: bool = public(False)`) and without (`title = public("")`); \
without one, the model accepts any value. Citry, and django-components \
with its type-checking extension, check component values' types too. Two \
cells depend on it, measured in a trial run without the annotations on \
`api_base` and `hidden`: m30 and m41 end as runtime errors with them, and \
were missed without them (m30's list stored the number and no title \
matched it; m41 showed the same page, because Tetra's JSON encoder writes \
the Path as its text). pyright reported an error in that trial's clean \
app, where the card list unpacks the unannotated `hidden`; the browser \
check, which decides both cells, is not affected by that. Without the \
annotation on `count`, pyright also rejects the counter's addition, so a \
developer using pyright is pushed to write the annotations anyway. \
Pydantic's default mode accepts numeric text such as "3" for a number, \
and Tetra keeps the text, but it rejects text such as "card.count". Were \
the card's `count` and `tone` public, Tetra would check them too, and m03 \
and m49 would likely end as runtime errors (reasoned from the source, not \
measured); they are not public because no browser code reads them.

Settings considered and left off, with the reason. Tetra's own settings \
choose the path to esbuild (`TETRA_ESBUILD_PATH`, set as described above), \
esbuild's arguments, and the names of its cache folder, its component \
modules and its upload folder; none adds a check. Nor do esbuild's \
arguments add a kind of check the other frameworks make: `--log-level` can \
show messages esbuild hides by default, such as notes on how it bundles \
`require()` and `import()` calls, which are not checks of the code. \
`--log-override` can raise a warning to an error, and the rule does not \
count a raised level as a stricter check. Pydantic's \
strict types (`StrictInt`, or `Annotated[..., Strict()]`) would also \
reject numeric text; Tetra builds its model with fixed settings, so they \
could only be written into each annotation. They are left off because \
Tetra's docs never write them, and they would change no cell: the one case \
that stores numeric text in a public attribute (m39) is already reported \
by pyright in the editor. Django's own options, djLint's rules that are \
off by default, and the three tools the benchmark plan names (the Django \
Language Server, django-extensions' `validate_templates` and django-stubs) \
are left off for the reasons the Django app's notes give. VS Code's \
JavaScript type check (`checkJs`) has no .js file to read here.

pyright sees `public(...)` as a \
`Public` object, not as a value of the annotated type, so each annotated \
line carries a `# pyright: ignore` comment for that one check \
(reportAssignmentType); no case edits those lines except m42, which adds \
one. The docs also annotate each inline template, script and stylesheet \
with a type from the sourcetypes package (an alias of str that VS Code's \
Python Inline Source extension reads to highlight the string). The scripts \
go without it: Component declares `script` as `str | None`, so pyright \
rejects `script: javascript`. `script: javascript | None` passes, but the \
docs never write it, and whether the extension still highlights it was not \
checked.

What Tetra itself checks, read from the installed source and seen in the \
cases:
- Tetra compiles every component's template when Django starts, so an \
unknown tag, such as a misspelled component tag (m01), or an unknown \
filter (m59), fails `manage.py check` and the build. This is not a system \
check, and it depends on how Tetra 0.8.5 compiles templates: in DEBUG, \
Tetra catches the template's syntax error, logs it and puts off compiling \
until the first render, but its own check that the template has exactly \
one top-level tag then reads the template's source, which compiles it at \
once and raises the error. A later version could keep the error until the \
page renders. The same mistake in page.html, which is not a component \
template, fails only when the page renders.
- `@public.listen` requires a method that takes exactly one argument, the \
event's value, and checks it when the class is defined, so a listener \
given a second argument (m60) fails `manage.py check` too.
- The component tag's values are Python arguments of load(), so a missing \
argument raises a TypeError when the page renders. No type or allowed \
value is checked.
- A public method's arguments arrive in order, with no names and no \
conversion, so a missing or wrong-typed amount fails inside the method. \
Tetra logs the error and answers 500, and its browser script throws. A \
public method name the component does not have is a ReferenceError in \
Alpine, in the browser; the server never hears of it.
- The build: `manage.py tetrabuild`, and runserver before it starts, build \
each library's JavaScript and CSS with esbuild. Tetra copies each inline \
script into a file under the app's `__tetracache__` folder, padded with \
spaces so that its lines match the component's Python file, and esbuild \
reports a syntax error at that copy's line. Tetra then prints `ERROR \
BUILDING JS`, but tetrabuild still exits with status 0. The build stage \
reads esbuild's error from the output and counts it as a warning, because \
the developer sees it but a CI build passes (m20). The error names the \
copy, so the case's `indirect` note confirms it. runserver goes on, and \
every page that uses a component of that library then fails, because the \
library's JavaScript file is missing.

editor: as in the Django app. Tetra ships no editor extension or language \
server; its docs point to VS Code's Python Inline Source extension, which \
only highlights the inline strings. The diagnostics come from Pylance with \
type checking turned on, measured with pyright 1.1.414 in typeCheckingMode \
"standard" (Pylance's own default is "off"). Pylance checks only open files \
by default, while the command line checks every file; with one case per run \
this can only add findings. pyright sees the components' Python code, but \
not their templates, Alpine expressions or scripts, which are strings. \
There is no JavaScript syntax check: the app has no .js file, and VS Code's \
JavaScript support does not read JavaScript written in a Python string.

check: `python manage.py check`, plus ruff with its default rules for the \
Python files and djLint with its Django profile for the page templates. A \
linter finding fails its command, so it counts as an error. Tetra's own \
system checks concern only components that use WebSockets; m01 and m59 \
fail `manage.py check` because Tetra compiles the templates when Django \
starts, and m60 because `@public.listen` checks the method when the class \
is defined. \
djLint does not read the component templates, which are Python strings.

build: `python manage.py tetrabuild`, the build command Tetra's install \
guide names, read with the esbuild parser: esbuild's printed errors count \
as warnings when the command exits with status 0, and a failing command \
counts as an error.

runtime: as in the Django app, `manage.py migrate` (sessions are stored in \
the database, and Tetra creates a session for each visitor and uses it in \
the key that encrypts each component's state), then `manage.py runserver \
--noreload`, which is Tetra's runserver: it builds the components' \
JavaScript and CSS, then starts Django's. Tetra also builds its own \
component library, into its package folder in the environment every case \
shares. Setup builds it once, with `manage.py tetrabuild tetra` from the \
clean app's folder, so cases running side by side find it built and never \
write it at the same time.

The default journey's Add and Hide clicks each call a public method on the \
server; the journey waits 500 ms after Add, and 300 ms after Details as the \
other Django apps' journeys do, and the runner waits for the last request \
after Hide. Details and Close change the page in the browser only, so the \
status journey needs no waits.
"""

[setup]
manifests = [".python-version", "pyproject.toml", "uv.lock", "package.json", "package-lock.json"]
# Tetra writes its own component library's build into its package folder in
# the shared environment. Building it here, once, keeps cases that run side
# by side from building it at the same time.
command = [
  "sh", "-c",
  "uv sync --frozen && npm ci --no-audit --no-fund && cd \"{framework}/baseline\" && \"{venv}/bin/python\" manage.py tetrabuild tetra",
]

[[stages]]
stage = "editor"
label = "Pylance, type checking on (pyright 1.1.414, standard)"
argv = ["{venv}/bin/pyright", "--outputjson", "--pythonpath", "{venv}/bin/python"]
parser = "pyright-json"
timeout = 300
env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" }

[[stages]]
stage = "check"
label = "manage.py check"
argv = ["{venv}/bin/python", "manage.py", "check"]
parser = "exit"
timeout = 300

[[stages]]
stage = "check"
label = "ruff 0.15.5 (default rules)"
# --isolated: a real project's ruff reads only its own settings, not those of
# a repository it happens to sit in.
argv = ["{venv}/bin/ruff", "check", "--isolated", "--no-respect-gitignore", "--output-format", "json", "."]
parser = "ruff-json"
timeout = 300

[[stages]]
stage = "check"
label = "djLint 1.46.6 (--lint, django profile)"
argv = ["{venv}/bin/djlint", "board/templates", "--lint", "--profile=django"]
parser = "djlint"
timeout = 300

[[stages]]
stage = "build"
label = "manage.py tetrabuild (esbuild 0.27.2)"
argv = ["{venv}/bin/python", "manage.py", "tetrabuild"]
# tetrabuild exits with status 0 when esbuild fails, so its printed errors
# are read too.
parser = "esbuild"
timeout = 300

[runtime]
argv = [
  "sh", "-c",
  "{venv}/bin/python manage.py migrate --noinput -v 0 && exec {venv}/bin/python manage.py runserver 127.0.0.1:{port} --noreload",
]
page_path = "/"
ready_timeout = 180
env = { PYTHONUNBUFFERED = "1" }
[runtime.journeys]
default = [
  { action = "click", selector = "button:has-text('Add')" },
  { action = "wait", ms = 500 },
  { action = "click", selector = "button:has-text('Details')" },
  { action = "wait", ms = 300 },
  { action = "click", selector = "button:has-text('Hide')" },
]
# Opens the details, closes them from the status line, and opens them again.
status = [
  { action = "click", selector = "button:has-text('Details')" },
  { action = "click", selector = "button:has-text('Close')" },
  { action = "click", selector = "button:has-text('Details')" },
]
# Types into the search field and submits the form.
search = [
  { action = "fill", selector = "form[role=search] input", text = "alpha" },
  { action = "press", selector = "form[role=search] input", key = "Enter" },
]
# Follows the About link to its page.
about = [
  { action = "click", selector = "a:has-text('About')" },
]
# Follows the project link to its page.
project = [
  { action = "click", selector = "a:has-text('Project 1')" },
]

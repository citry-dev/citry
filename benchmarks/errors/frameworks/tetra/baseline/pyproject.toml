[project]
name = "tetra-error-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Tetra 0.8.5 imports channels when Django starts, even when no component
# uses WebSockets, so channels is pinned at the version the performance
# benchmark's Tetra app uses.
dependencies = ["django==6.1.1", "tetra==0.8.5", "channels==4.3.2"]

[dependency-groups]
# The tools most Django projects add, which Django's own starter does
# not install: pyright stands in for Pylance in the editor, ruff lints the
# Python files and djLint the templates.
dev = [
    "djlint==1.46.6",
    "pyright==1.1.414",
    "ruff==0.15.5",
]

[tool.uv]
package = false

# Type checking on, as in most typed Python projects: Pylance's "standard"
# mode, which is also the pyright command line's default.
[tool.pyright]
typeCheckingMode = "standard"

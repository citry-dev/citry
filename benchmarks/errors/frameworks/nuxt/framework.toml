key = "nuxt"
name = "Nuxt (TypeScript)"
# One case at a time: every `nuxt dev` picks a second port for its server-side
# hot reload from the same 21 ports (24678-24698) by checking which one is
# free, so two servers starting together can pick the same port, and the one
# that loses may stop or log an error, which would be scored as the case's
# runtime error.
max_jobs = 1
notes = """
The baseline is the `npm create nuxt@latest` minimal starter (create-nuxt 4.0.1, template
`minimal`, no modules selected), pinned to nuxt 4.5.2, vue 3.5.42 and vue-router 5.3.1. On top
of the starter it adds the reference page, written as `<script setup lang="ts">`: the board in
`app/pages/index.vue`, the About and project pages in `app/pages/about.vue` and
`app/pages/projects/[id].vue`, `app/components/Card.vue` and `Status.vue`, a global stylesheet
listed in `css`, the public and private `runtimeConfig` keys, two server routes in `server/api/`,
and the saved total in `server/utils/state.ts`. An app with a `pages/` folder renders the
current page from `app/app.vue` with `<NuxtPage />`, as Nuxt's routing docs show, and the board
links to the other pages with `<NuxtLink>`. Node is the system Node, v26.5.0 with npm 11.17.0
(nuxt 4.5.2 accepts Node ^22.19.0, ^24.11.0 or >=26.0.0).

The board data carries the heading's color, and the page's `<style>` reads it with Vue's
`v-bind()`, the way Vue's docs link CSS to component state. The search form submits back to the
page with GET, and the page reads `route.query.q`. The project page takes a numeric id, which a
file-based route cannot declare, so it checks the id with `definePageMeta({ validate })`, as
Nuxt's routing docs show; a link to `/projects/alpha` (m61) shows Nuxt's 404 page, with no
error in the browser's console or the server's log.

The board page calls `provide('boardName', 'Projects')`, and Card.vue reads it with
`inject<string>('boardName')`, the string key Vue's provide/inject guide uses first, with the
type argument its TypeScript guide gives for a string key. Exporting a typed `InjectionKey`
symbol and importing it in both files, which the TypeScript guide also shows, would make a
misspelled key an undefined name, which vue-tsc reports.

The benchmark adds typescript 6.0.3 and vue-tsc 3.3.13 as dev dependencies, only to run the
editor stage. The starter installs neither. Nuxt does not type-check during `nuxt dev` or
`nuxt build` unless `typescript.typeCheck` is turned on, and it defaults to false.

The editor stage stands in for the Vue - Official extension, which Nuxt's installation guide
recommends. It first runs `nuxi prepare`, as the starter's postinstall script does, to write
the `.nuxt` tsconfigs the editor reads. A failing prepare is ignored, because the editor keeps
the `.nuxt` folder an earlier install wrote. It then runs `vue-tsc -b --noEmit`, the command
`nuxt typecheck` runs when tsconfig.json lists project references, as the starter's does.
vue-tsc checks every file, while the editor shows diagnostics only for open files. A type error
is reported where the wrong value is used: in m17 the server route returns a string, and
vue-tsc reports TS2322 at the `:count` binding in `app/pages/index.vue`. The case's `indirect`
note records why that finding still counts. A developer editing the route sees no error there;
the editor shows it only with `app/pages/index.vue` open.

vue-tsc reports only TypeScript's diagnostics. The extension also shows the Vue compiler's own
errors for a single-file component (SFC), such as "Element is missing end tag", through the
`vue-sfc` and `vue-compiler-dom-errors` plugins of @vue/language-service 3.3.13, the version
the Vue - Official extension ships. The second editor command, `vue-template-diagnostics.cjs`
next to this file, calls the @vue/language-core 3.3.13 parse and compile functions with the
default options to report those errors. It skips two adjustments language-core makes while a
developer types: it adds a closing `>` when the template ends inside an unfinished opening tag,
and it reuses the previous result while an edit stays inside one expression. No case hits
either, and the script was not compared against a running editor.

check: ESLint through Nuxt's official `@nuxt/eslint` module 1.17.0 (ESLint 10.13.0), added with
`nuxi module add eslint` as Nuxt's docs describe; the starter itself installs no linter. It
keeps the module's default rules, except that eslint.config.mjs turns off
`vue/multi-word-component-names`, because the page's component has a one-word name (Card), which
most Nuxt projects allow. `nuxt typecheck`, which Nuxt's TypeScript docs
describe, runs the same vue-tsc command as the editor stage, so it is not a separate stage.

The runtime check runs `nuxt dev`, so Vue's development warnings stay on, and Nuxt DevTools
stays enabled as in the starter. The editor reports m06 indirectly: `$fetch` of an unknown
route returns `unknown`, so reading `result.count` four lines below is TS18046. m11 renames both
the opening and the closing tag; vue-tsc reports the unknown element because `strictTemplates`
is on (below), and renaming only the opening tag is also a template compile error.

Three results depend on how the page is written. The heading's color is read with `v-bind()`,
so m43's misspelled name reads a property the board data does not have, which vue-tsc reports; a
`style` binding that sets `--accent` for a `var(--accent)` in main.css would report nothing. The
avatar is a path into public/, and Vite turns an absolute path in a template into an import, so
m48's misspelled file fails `nuxt build`. And the page links with paths, `<NuxtLink
to="/about">`, the form Nuxt's routing docs show first, so `typedPages` (below) does not check
them, and a misspelled path (m45) shows only vue-router's warning in the browser.

Settings changed from the default. The benchmark turns on a framework's stricter check when
other frameworks here have the same kind of check, so nuxt.config.ts sets two:
- `typescript.tsConfig.vueCompilerOptions.strictTemplates: true`, which Nuxt writes into the
  `.nuxt/tsconfig.app.json` that vue-tsc reads. In vue-tsc 3.3.13 it turns on
  `checkUnknownProps`, `checkUnknownEvents`, `checkUnknownComponents`, `checkUnknownDirectives`
  and `strictVModel`, so vue-tsc reports an unknown component, element, attribute, directive or
  component event, the same kinds of names Next.js's tsc checks (Citry checks component names
  before the app runs). It moves m01, m10,
  m11, m21 and m29 to the editor. A misspelled event on a plain element (m31) is still not
  reported, because vue-tsc lets a plain element take any listener name, and Vue's slot types
  accept any slot name, so m05 and m35 are not reported either.
- `experimental.typedPages: true`, which checks a `<NuxtLink>` or router call that names a
  route, such as `{ name: 'abuot' }`, against the app's routes, the same kind of check as
  Next.js's `typedRoutes`, which checks paths too. vue-router accepts any string as a path, so
  it does not change m45.
The clean app needs no change for either.

Considered and left off:
- `typescript.typeCheck`, which runs the same vue-tsc during `nuxt dev` and `nuxt build`, later
  than the editor stage, so it cannot change a result.
- The `fallthroughAttributes` options, which check attributes a wrapper component passes on, a
  kind of check no other framework here has.
- `eslint.config.typescript.tsconfigPath`, which gives @nuxt/eslint a tsconfig so that it turns
  on about 46 typescript-eslint rules that read the code's types. A few match a check other
  frameworks here make, such as reporting a promise that is never awaited, which pyright does
  in every Python app. Most do not: the `no-unsafe-*` rules report values typed `any`, as
  pyright's strict mode does, which no Python app here turns on, and others, such as
  `restrict-template-expressions` and `no-unnecessary-condition`, have no counterpart here. It
  also replaces seven typescript-eslint strict rules that do not read types. No case leaves out
  an `await`, so it would change no result.
- eslint-plugin-vue rules outside Nuxt's presets. The benchmark keeps each linter's rules as
  the framework's preset sets them; these rules either repeat vue-tsc's checks at a later stage
  or, like `vue/no-undef-components`, report Nuxt's auto-imported components, which the clean
  app uses as Nuxt's docs show (6 findings in the clean app).
The rest of `@nuxt/eslint`'s default checks, including typescript-eslint's strict rules, are
already on.

m12 reads the private `secretToken` in the page, so the server renders the
secret into the HTML it sends; the hydration error comes after the leak.
"""

[setup]
manifests = ["package.json", "package-lock.json"]
command = ["npm", "ci", "--no-audit", "--no-fund"]

[[stages]]
stage = "editor"
label = "vue-tsc (Vue - Official)"
argv = ["sh", "-c", "nuxi prepare > /dev/null 2>&1; exec vue-tsc -b --noEmit --pretty false"]
parser = "tsc"
timeout = 600

[[stages]]
stage = "editor"
label = "Vue compiler diagnostics (Vue - Official)"
argv = ["node", "{framework}/vue-template-diagnostics.cjs"]
parser = "eslint-json"
timeout = 300

[[stages]]
stage = "check"
label = "ESLint 10.13.0 (@nuxt/eslint 1.17.0)"
# nuxi prepare writes the generated config that eslint.config.mjs extends.
argv = ["sh", "-c", "nuxi prepare > /dev/null 2>&1; exec eslint . -f json"]
parser = "eslint-json"
timeout = 300

[[stages]]
stage = "build"
label = "nuxt build"
argv = ["nuxt", "build"]
parser = "exit"
timeout = 900

[runtime]
argv = ["nuxt", "dev", "--port", "{port}", "--host", "127.0.0.1"]
page_path = "/"
ready_timeout = 240
[runtime.journeys]
default = [
  { action = "click", selector = "button:has-text('Add')" },
  { action = "click", selector = "button:has-text('Details')" },
  { action = "click", selector = "button:has-text('Hide')" },
]
# Opens the details, closes them from the status line, and opens them again.
status = [
  { action = "click", selector = "button:has-text('Details')" },
  { action = "click", selector = "button:has-text('Close')" },
  { action = "click", selector = "button:has-text('Details')" },
]
# Types into the search field and submits the form.
search = [
  { action = "fill", selector = "form[role=search] input", text = "alpha" },
  { action = "press", selector = "form[role=search] input", key = "Enter" },
]
# Follows the About link to its page.
about = [
  { action = "click", selector = "a:has-text('About')" },
]
# Follows the project link to its page.
project = [
  { action = "click", selector = "a:has-text('Project 1')" },
]

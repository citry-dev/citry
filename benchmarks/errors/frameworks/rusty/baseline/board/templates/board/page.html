<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Board</title>
  <link rel="stylesheet" href="{{ STATIC_URL }}board/board.css">
  <script src="{{ STATIC_URL }}board/htmx.min.js" defer></script>
  <script src="{{ STATIC_URL }}board/board.js" defer></script>
  <script src="{{ STATIC_URL }}board/alpine.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {{ api_base_script }}
  <div class="board" title="Board" x-data="board" @close="open = false">
    <h1>{{ heading }}</h1>
    <p>Owner: {{ owner.name }}</p>
    <p>API: <span x-text="api"></span></p>

    {% for card in cards %}
      <div x-data="{ shown: true }" x-show="shown" @hide="shown = false">
        {% include "board/card.html" with title=card.title count=card.count tone=card.featured|yesno:"accent,plain" %}
      </div>
    {% endfor %}

    <p>
      {% include "board/saved.html" %}
      <button
        type="button"
        hx-post="{% url 'save' %}"
        hx-vals='{"amount": 1}'
        hx-target="#saved"
        hx-swap="outerHTML"
      >
        Add
      </button>
    </p>

    <button type="button" :aria-expanded="open" @click="toggle">Details</button>
    <p x-show="open">Details are visible</p>
    <p x-data="status">
      <span x-text="open ? 'Status: open' : 'Status: closed'"></span>
      <button type="button" @click="close">Close</button>
    </p>

    <form role="search">
      <button type="submit">Search</button>
    </form>
  </div>
</body>
</html>

key = "rusty"
name = "Rusty + HTMX + Alpine"
notes = """
The app is the Django app from frameworks/django with its template backend \
switched to Django Rusty Templates, an experimental Rust version of Django's \
template engine. Django Rusty Templates has no release on PyPI, so it is \
pinned to commit 0725f875535b2fca93953a403a57df1d9b34e073 (committed on \
2026-09-22; its package version is 0.1.0), the commit the performance \
benchmark in benchmarks/web uses. `uv sync` builds its Rust extension from \
that commit, so installing the app needs a Rust compiler. Django, HTMX, \
Alpine and every tool are the same versions as in the Django app.

Everything outside the templates, the settings, mysite/urls.py, the view \
lines that feed the templates and the dependency files is the Django app \
unchanged: the static files, board.js and the rest of the generated project. \
The settings differ in three places: the TEMPLATES BACKEND line; the `static` \
context processor, added for the reason below; and the admin app, left out of \
INSTALLED_APPS (and its route left out of mysite/urls.py) because its \
templates need Django's own engine (`manage.py check` reports admin.E403 \
otherwise) and the board does not use it. The pinned commit's parser does not \
know several tags and filters the Django app uses. An unknown tag raises \
NotImplementedError when the template loads, and so does `{% load %}` of a \
library with any tag that is not a simple tag, which includes Django's `i18n` \
and `static` libraries. The template differences, each written the way a \
Rusty user would work around the missing part:
- no `{% load i18n static %}`: the page writes the static files' URLs as `{{ \
STATIC_URL }}board/...`, the variable Django's `static` context processor \
provides, which gives the same URLs as `{% static %}`. Writing plain \
`/static/...` paths would fail djLint's D004 rule, which asks for the `{% \
static %}` tag this engine lacks;
- no `{% translate %}`: the page view translates the heading with Django's \
`gettext`, with the English text as the message id, and the template prints \
it;
- no `json_script` filter: the page view calls \
`django.utils.html.json_script`, the function behind the filter, and the \
template prints the `<script>` tag it returns;
- no `{% partialdef %}`: the counter's text is its own template, \
board/saved.html, which the page includes and the save view renders;
- no `{% extends %}` or `{% block %}`: the card writes its own footer link. \
A card written as a Django `simple_block_tag`, the usual other way to take \
markup, fails when the template loads at this commit with Django 6.1.1 \
(TemplateSyntaxError: 'card' must have a first argument of 'content'). The \
page could still hand the card a template name for `{% include %}` to render \
as its footer, but that needs a separate template file for each fill, so \
the app keeps the footer in the card. The four slot mistakes do not apply: the page has no \
footer to fill (m05, m35), and the card hands no slot data to a fill (m36, \
m37).
Apart from whitespace and the order of the tags in its head, the page the \
browser gets is the same as the Django app's.

The card's `tone` and the status line inside Details are written as in the \
Django app: the page picks each card's `tone` with \
`card.featured|yesno:"accent,plain"`, and the status line is an Alpine \
component (`Alpine.data('status')` in board.js) nested inside the board's. \
Alpine has no required or typed component inputs; the status line's \
markup reads the board's `open` through the scope Alpine shares with it. Its \
Close button dispatches a `close` event, and a listener on the board sets \
`open` to false.

The card reads the board's name from the context its include inherits, as \
in the Django app.

The heading's color, the search form, the avatar, and the About and project \
pages with their `{% url %}` links are written as in the Django app, apart \
from two workarounds. The avatar's URL is built from `{{ STATIC_URL }}`, \
like the other static files. The parser has no `{% blocktranslate %}`, so \
the page view translates the subtitle with `gettext('Owned by %(name)s')` \
and fills in the owner's name with `%`, the way Django's docs pass gettext a \
named argument.

Where the two engines differ on a mistake: a misspelled attribute of an \
existing object, such as `{{ owner.nmae }}`, raises VariableDoesNotExist at \
render, where Django prints an empty string. An undefined variable (`{{ \
ownr.name }}`) and the `add` filter given a value it cannot add (m23) still \
print an empty string, as in Django. No setting makes them raise: the engine \
accepts `string_if_invalid` but prints an empty string anyway, and it has no \
counterpart of Jinja's StrictUndefined, so there is no stricter setting to \
turn on.

editor: the same as the Django app. Django Rusty Templates adds no editor \
support. Pylance with type checking turned on is measured with pyright \
1.1.414 in typeCheckingMode "standard" (Pylance's own default is "off"); \
Pylance checks only open files by default, while the command line checks \
every file, and with one case per run this can only add findings. VS Code's \
built-in JavaScript support is measured with tsc from TypeScript 6.0.3 (the \
version VS Code ships) with --allowJs and no checkJs, on board.js. pyright \
and TypeScript are measurement-only dev dependencies.

check: the same as the Django app: `python manage.py check`, ruff with its \
default rules, and djLint with its Django profile for the templates, which \
use Django's syntax. `manage.py check` reads no templates in either app, and \
the Rusty backend adds no checks of its own. A linter finding fails its \
command, so it counts as an error. There is no build stage.

runtime: `manage.py migrate`, because sessions are stored in the database and \
need their table, then `manage.py runserver --noreload`, so the runner stops \
a single process. DEBUG is on, so a template error shows Django's error page. \
Django Rusty Templates sets its own `debug` option from DEBUG, but nothing \
reads it at this commit, so m08's error is raised either way.
"""

[setup]
manifests = [".python-version", "pyproject.toml", "uv.lock", "package.json", "package-lock.json"]
command = ["sh", "-c", "uv sync --frozen && npm ci --no-audit --no-fund"]

[[stages]]
stage = "editor"
label = "Pylance, type checking on (pyright 1.1.414, standard)"
argv = ["{venv}/bin/pyright", "--outputjson", "--pythonpath", "{venv}/bin/python"]
parser = "pyright-json"
timeout = 300
env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" }

[[stages]]
stage = "editor"
label = "VS Code JavaScript syntax check (tsc 6.0.3 --allowJs)"
argv = ["{env}/node_modules/.bin/tsc", "--allowJs", "--noEmit", "--pretty", "false", "board/static/board/board.js"]
parser = "tsc"
timeout = 300

[[stages]]
stage = "check"
label = "manage.py check"
argv = ["{venv}/bin/python", "manage.py", "check"]
parser = "exit"
timeout = 300

[[stages]]
stage = "check"
label = "ruff 0.15.5 (default rules)"
# --isolated: a real project's ruff reads only its own settings, not those of
# a repository it happens to sit in.
argv = ["{venv}/bin/ruff", "check", "--isolated", "--no-respect-gitignore", "--output-format", "json", "."]
parser = "ruff-json"
timeout = 300

[[stages]]
stage = "check"
label = "djLint 1.46.6 (--lint, django profile)"
argv = ["{venv}/bin/djlint", "board/templates", "--lint", "--profile=django"]
parser = "djlint"
timeout = 300

[runtime]
argv = [
  "sh", "-c",
  "{venv}/bin/python manage.py migrate --noinput -v 0 && exec {venv}/bin/python manage.py runserver 127.0.0.1:{port} --noreload",
]
page_path = "/"
ready_timeout = 180
env = { PYTHONUNBUFFERED = "1" }
[runtime.journeys]
default = [
  { action = "click", selector = "button:has-text('Add')" },
  { action = "wait", ms = 500 },
  { action = "click", selector = "button:has-text('Details')" },
  { action = "wait", ms = 300 },
  { action = "click", selector = "button:has-text('Hide')" },
]
# Opens the details, closes them from the status line, and opens them again.
status = [
  { action = "click", selector = "button:has-text('Details')" },
  { action = "click", selector = "button:has-text('Close')" },
  { action = "click", selector = "button:has-text('Details')" },
]
# Types into the search field and submits the form.
search = [
  { action = "fill", selector = "form[role=search] input", text = "alpha" },
  { action = "press", selector = "form[role=search] input", key = "Enter" },
]
# Follows the About link to its page.
about = [
  { action = "click", selector = "a:has-text('About')" },
]
# Follows the project link to its page.
project = [
  { action = "click", selector = "a:has-text('Project 1')" },
]

key = "unicorn"
name = "django-unicorn"
notes = """
The app is the Django app (frameworks/django) with django-unicorn 0.67.0 \
added the way its installation guide says: `django_unicorn` in \
INSTALLED_APPS, `django_unicorn.urls` under `unicorn/` in the URL \
configuration, `{% unicorn_scripts %}` and `{% csrf_token %}` in the page. \
The version is the one the performance benchmark's django-unicorn app pins \
(benchmarks/web/apps/unicorn). Django, the settings and the tools are \
otherwise the same as in the Django app. django-unicorn sends every action \
to the server and puts the HTML the server sends back in place of the old, \
so the app needs neither HTMX nor Alpine and loads neither.

The page is a plain Django view and template (board/views.py, \
board/templates/board/page.html) with the heading, the subtitle, the avatar, \
the owner, the API line and the links. Its interactive parts are \
django-unicorn components, each a Python class in board/components/ with a \
template of the same name in board/templates/unicorn/, the layout `manage.py \
startunicorn` creates. The page renders them with the `{% unicorn %}` tag. \
Where the django-unicorn docs show a way to write a part, the app uses it; \
elsewhere it keeps the Django app's way. Data goes down to a child through \
the tag's keyword arguments, as the docs' `{% unicorn 'row' book=book \
key=book.id %}` does, and calls go up through `self.parent`, as the docs' \
filter component calls `self.parent.load_table()`:
- project-list renders the cards. It keeps the titles of the hidden cards in \
a `hidden` field and has a `hide(title)` method. It builds the cards from \
server data in `mount()` and lists them in `Meta.javascript_exclude`, the \
docs' way to keep a value the template reads out of the page. The page picks \
each card's `tone` with `card.featured|yesno:"accent,plain"`, as the Django \
app does, inside a `{% with %}` block: the `{% unicorn %}` tag does not \
apply template filters to its keyword arguments (in this tag the page fails \
to render; after an argument with a literal value, the filtered one is \
dropped with no message).
- card is a child component. The tag's keyword arguments `title`, `count` \
and `tone` set the fields the card declares with types and defaults. Its \
Hide button runs the card's own `hide()`, which calls \
`self.parent.hide(self.title)` and sets `self.parent.force_render`, the way \
django-unicorn's child-components docs reach a parent. django-unicorn has no \
slots: a component renders only its own template, so the card writes its own \
footer link from its title and count, as the Rusty app's card does, and m05, \
m35, m36 and m37 do not apply.
- counter keeps the saved total in a `count: int` field. Add runs \
`save(amount=1)`, a keyword argument as the actions docs write them \
(`is_user_via_kwarg(pk=2)`).
- details keeps `open: bool`. The Details button runs django-unicorn's \
built-in `$toggle('open')` action, `aria-expanded` and the details text \
follow `open`, and the details render the status line as a child component \
with `{% unicorn "status" open=open %}`. So Status takes `open` as an input, \
where the Django app's status line reads its parent's Alpine state: \
django-unicorn renders the details again after every toggle, and sets the \
child's `open` from the tag each time. This choice decides m25 to m28, which \
can all be written and are all missed; reading `self.parent.open` instead, \
as the docs' filter component reads `self.parent.books`, would keep the \
Django app's shape. Status's Close button runs its own `close()`, which \
calls the details' `close()` through `self.parent`, as the card does.
- search is the search form. Its input, named `q`, is bound to the \
component's `query` field with `unicorn:model`, django-unicorn's way to keep \
an input in step with a component field, and the `Searching for:` line shows \
`query`. As in the Django app, the form submits to the page with GET, so the \
input's `name` decides what the view receives: the view reads `q`, and the \
page shows `Searched: ...`. This keeps m44 the same mistake as in the Django \
app.

The page parts that are plain template markup are written as in the Django \
app: the heading color, set in a `<style>` block as the CSS variable \
`--accent` that board.css reads; the subtitle's `{% blocktranslate with \
name=owner.name %}`; the avatar's `{% static %}`; and the `{% url %}` links \
to the About and project pages, which have their own views and templates.

State lives in the page. django-unicorn writes each component's public \
fields into its root element as JSON, the browser sends them back with each \
action, and the server answers with the new HTML. So `open`, `hidden` and \
the saved total change only through a server request, and a reload starts \
again from `Saved: 0`, as in the Citry app. The Django app keeps the total \
in the session, so after a reload it shows `Saved: 1`. Every public field \
reaches the browser this way unless `Meta.javascript_exclude` names it. m42 \
adds the token as an ordinary class attribute, which django-unicorn treats \
as public, and does not name it there, so the token reaches the browser. The \
views docs warn about exactly this: never put sensitive data into a public \
property, because it is publicly available in the HTML source.

pyright types `self.parent` as any django-unicorn component, or None, so the \
docs' plain `self.parent.load_table()` form would be an error in the clean \
app. The card and the status line first narrow it with `assert \
isinstance(self.parent, ...)`, the usual way to tell pyright the type (the \
views docs use the same form), so pyright then checks the method name and \
its argument. A `# pyright: ignore` comment on the call, the form the \
django-components app uses where no type-correct form exists, would hide the \
call from pyright: m24 and m29 would then fail with a server error and m30 \
would be missed (reasoned from the source, not measured). The actions docs \
also list a `$parent` special argument, which lets the markup call \
`$parent.hide(...)` directly, but show no example of it. This choice decides \
three cells: written with `$parent`, pyright would not see the call, a \
misspelled method (m24, m29) would be ignored at runtime with no message, \
and a count sent in place of the title (m30) would be converted to text, so \
all three were missed in a trial run of that form.

django-unicorn cannot mark a component input as required: a field the tag \
does not set keeps its class default, or renders as `None` when it has none. \
The card's and the status line's fields have defaults, so a missing input \
(m04, m26) leaves the default in place.

What django-unicorn itself checks: an unknown component name fails when the \
page renders; an action whose method raises (for example a missing argument) \
gives a server error. An action's keyword argument that the method does not \
take is dropped, so `save(amont=1)` (m18) fails only because `amount` then \
has no value and no default. It sets the tag's keyword arguments on the \
component without checking their names or types, and it ignores an action \
that names a method the component does not have, with no message. It \
converts action arguments to the types the method's annotations name, so m32 \
is prevented. In DEBUG it logs a warning-level message when a component's \
HTML seems to miss a closing tag; with Django's default logging the message \
prints without a "WARNING" label, so the runner would not count it. None of \
django-unicorn's settings turns on a check of the kind this benchmark \
measures (they choose caching, request queueing, the DOM morphing library, \
script placement, minifying, where components are found and which JavaScript \
functions a component may call), so no setting is changed from its defaults.

The default and status journeys send a server request on each click. The \
status journey waits 500 ms between clicks, so one request comes back before \
the next click acts on its result; the default journey already waits between \
its clicks, which also go to three different components. The search journey \
presses Enter right after typing, before django-unicorn's 250 ms wait on \
`unicorn:model` ends, so no component request is sent and the page goes \
straight to `/?q=alpha`; no journey records the `Searching for:` line while \
it changes, as in the Django app.

editor: as in the Django app. This benchmark found no editor extension or \
language server for django-unicorn. The diagnostics come from:
- Pylance with type checking turned on, measured with pyright 1.1.414 in \
typeCheckingMode "standard" (Pylance's own default is "off"). Pylance checks \
only open files by default, while the command line checks every file; with \
one case per run this can only add findings. pyright sees the components' \
Python code, but not the templates, the `{% unicorn %}` tags or the action \
expressions in `unicorn:click`.
- VS Code's built-in JavaScript support, which reports syntax errors in \
plain .js files. It is measured with tsc from TypeScript 6.0.3 (the version \
VS Code ships) with --allowJs and no checkJs, on the one hand-written script \
board/static/board/board.js, which writes the API line.

check: `python manage.py check`, plus ruff with its default rules for the \
Python files and djLint with its Django profile for the page and component \
templates. A linter finding fails its command, so it counts as an error. \
django-unicorn adds no system checks; its one management command, \
`startunicorn`, creates components. There is no build stage.

runtime: as in the Django app, `manage.py migrate` (Django's session \
middleware and auth app stay installed), then `manage.py runserver \
--noreload`.

Stricter settings: none changed from the default. The benchmark turns on a \
framework's stricter check when other frameworks here have the same kind of \
check, and none of django-unicorn's settings turns on a check: they choose \
caching, how the page is updated, where its script goes and whether its HTML \
is minified. Its one extra check, that a component's HTML is well formed, \
runs whenever Django's DEBUG is on, as it is here. The Django app's notes \
cover Django's own options and the tools this app shares with it.
"""

[setup]
manifests = [".python-version", "pyproject.toml", "uv.lock", "package.json", "package-lock.json"]
command = ["sh", "-c", "uv sync --frozen && npm ci --no-audit --no-fund"]

[[stages]]
stage = "editor"
label = "Pylance, type checking on (pyright 1.1.414, standard)"
argv = ["{venv}/bin/pyright", "--outputjson", "--pythonpath", "{venv}/bin/python"]
parser = "pyright-json"
timeout = 300
env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" }

[[stages]]
stage = "editor"
label = "VS Code JavaScript syntax check (tsc 6.0.3 --allowJs)"
argv = ["{env}/node_modules/.bin/tsc", "--allowJs", "--noEmit", "--pretty", "false", "board/static/board/board.js"]
parser = "tsc"
timeout = 300

[[stages]]
stage = "check"
label = "manage.py check"
argv = ["{venv}/bin/python", "manage.py", "check"]
parser = "exit"
timeout = 300

[[stages]]
stage = "check"
label = "ruff 0.15.5 (default rules)"
# --isolated: a real project's ruff reads only its own settings, not those of
# a repository it happens to sit in.
argv = ["{venv}/bin/ruff", "check", "--isolated", "--no-respect-gitignore", "--output-format", "json", "."]
parser = "ruff-json"
timeout = 300

[[stages]]
stage = "check"
label = "djLint 1.46.6 (--lint, django profile)"
argv = ["{venv}/bin/djlint", "board/templates", "--lint", "--profile=django"]
parser = "djlint"
timeout = 300

[runtime]
argv = [
  "sh", "-c",
  "{venv}/bin/python manage.py migrate --noinput -v 0 && exec {venv}/bin/python manage.py runserver 127.0.0.1:{port} --noreload",
]
page_path = "/"
ready_timeout = 180
env = { PYTHONUNBUFFERED = "1" }
[runtime.journeys]
default = [
  { action = "click", selector = "button:has-text('Add')" },
  { action = "wait", ms = 500 },
  { action = "click", selector = "button:has-text('Details')" },
  { action = "wait", ms = 300 },
  { action = "click", selector = "button:has-text('Hide')" },
]
# Opens the details, closes them from the status line, and opens them again.
# Each click sends the server a request that renders the details again, so
# the journey waits for one to come back before the next click acts on it.
status = [
  { action = "click", selector = "button:has-text('Details')" },
  { action = "wait", ms = 500 },
  { action = "click", selector = "button:has-text('Close')" },
  { action = "wait", ms = 500 },
  { action = "click", selector = "button:has-text('Details')" },
]
# Types into the search field and submits the form.
search = [
  { action = "fill", selector = "form[role=search] input", text = "alpha" },
  { action = "press", selector = "form[role=search] input", key = "Enter" },
]
# Follows the About link to its page.
about = [
  { action = "click", selector = "a:has-text('About')" },
]
# Follows the project link to its page.
project = [
  { action = "click", selector = "a:has-text('Project 1')" },
]

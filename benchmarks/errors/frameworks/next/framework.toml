key = "next"
name = "Next.js (TypeScript)"
notes = """
The baseline follows `npx create-next-app@latest` 16.3.5 with the recommended
defaults: TypeScript, ESLint (eslint-config-next core-web-vitals and
typescript presets), Tailwind CSS, the App Router, no src/ folder, the @/*
alias and no React Compiler. eslint.config.mjs and postcss.config.mjs
are the template's own; tsconfig.json is the template's with three
options added (see the settings changed below). The other differences
from the starter:
- react and react-dom are 19.3.0, matching the other benchmarks' Next.js app;
  create-next-app 16.3.5 itself writes 19.2.8. The App Router renders with
  the React copy bundled inside next, so this should not change a result.
- The layout leaves out the Geist fonts. next/font/google fetches them from
  Google when the app compiles, and every case starts without a cache, so
  every build and dev start would depend on Google's servers. The matching
  --font-sans and --font-mono lines are left out of globals.css.
- The .board style is plain CSS in globals.css.
- next.config.ts sets turbopack.root to the environment folder, two levels
  above the working copy, because node_modules is installed there once.
  Without it Turbopack takes the repository root as its root, because the
  repository has a pnpm-workspace.yaml.
The secret lives in .env, as the Next.js environment-variable docs describe.

The search form is next/form's `<Form action="/">` in a client component
that keeps the text typed so far in state, and the page reads `q` from its
`searchParams`. The About and project pages are App Router pages that the
page links to with next/link. The board sets the heading's color as the CSS
variable `--accent` in an inline style, which globals.css reads. The avatar
is a next/image `<Image>`, because the starter's ESLint config warns on a
plain `<img>` (@next/next/no-img-element), and its `src` is a path into
public/, the first form the Next.js image docs show. So a misspelled file
(m48) is a 404 at runtime; a static import of the file would fail
`next build` instead.

The board's name reaches every card through a React context, BoardContext
in app/board-context.tsx. The page is a server component, which cannot
provide a context, so it wraps the board in BoardProvider, a client
component in the same file that provides the context, as the Next.js docs
on context providers show. Each card reads the name with
`useContext(BoardContext)`.

Settings changed from the default. The benchmark turns on a framework's
stricter check when other frameworks here have the same kind of check:
- `typedRoutes: true` in next.config.ts. The Django, Django Rusty
  Templates, Jinja, Tetra, django-unicorn and django-components apps check each
  link's route when the page renders. With it on, `next typegen` writes the app's
  routes as types, and tsc reports a literal path that matches no route
  in a next/link `href`, a next/form `action`, a router call or
  `redirect()`, so a misspelled link (m45) is an editor error rather
  than a 404.
- `noUncheckedIndexedAccess`, `noImplicitOverride` and
  `verbatimModuleSyntax` in tsconfig.json, the three checks beyond
  `strict` that the tsconfig Nuxt generates turns on: tsc then treats a
  value read from an array or a dictionary by index as possibly missing,
  asks a class method that replaces its parent's to say so with
  `override`, and asks an import used only as a type to say so with
  `import type`. No case depends on any of them.
The clean app needs no change for any of them.

Considered and left off:
- `experimental.typedEnv`, because the types it writes still accept any
  `process.env` name, so it checks nothing.
- `experimental.strictRouteTypes`, which checks what page and layout
  files export, a kind of check no other framework here has.
- `experimental.taint`, which adds no check by itself: it only lets code
  call React's taint functions.
- typescript-eslint's rules that read the code's types. eslint-config-next
  has no option for them; they would be added by hand.
- The jsx-a11y accessibility rules eslint-config-next leaves unset, such
  as `label-has-associated-control`, which matches djLint's H042. The
  benchmark keeps each linter's rules as the framework's preset sets
  them, and no case reaches these rules: with jsx-a11y's whole strict
  set on, neither the clean app nor any case gets a finding.
Every `@next/next` rule in eslint-config-next is already on. The config
turns off four React rules: `react/no-unknown-property` and
`react/prop-types` repeat TypeScript's checks, `react/react-in-jsx-scope`
does not apply to the JSX transform Next.js uses, and
`react/jsx-no-target-blank` checks links that open a new tab, which no
other framework here checks.

Versions come from the lockfile: next 16.3.5, react and react-dom 19.3.0,
typescript 5.9.3, @types/react and @types/react-dom 19.3.0, @types/node
20.19.43, eslint 9.39.5, eslint-config-next 16.3.5, tailwindcss and
@tailwindcss/postcss 4.3.3. Measured with the system Node 26.5.0 and npm
11.17.0.

editor: VS Code's TypeScript service with the workspace TypeScript version
selected, as the Next.js TypeScript docs tell developers to do. It is
measured with `tsc --noEmit` from the project's own typescript 5.9.3.
`next typegen` runs first because the editor works on a project where
`next dev` (or create-next-app itself) has already written next-env.d.ts and
the route types under .next/types; without them the layout's global
LayoutProps type is missing. The Next.js TypeScript plugin named in
tsconfig runs only inside the editor, so its extra checks are not measured.
Its main check is that a server component passes only serializable props
to a "use client" file; in these cases that file is board.tsx, whose props
stay serializable in every case. The plugin was not run.

check: `eslint` (the starter's `npm run lint`; ESLint 9 lints the current
folder by default), run as `eslint . -f json` with the starter's
eslint.config.mjs. Next.js 16 has no separate check command.

build: `next build`, which type-checks the app and fails on a type error by
default. It does not run ESLint.

runtime: `next dev` (Turbopack), with the browser check driving the page.
Reading process.env.SECRET_TOKEN in a client component (m12) is scored as a
runtime error from the hydration mismatch, but by then the server has
already sent the secret in the page's HTML.
"""

[setup]
manifests = ["package.json", "package-lock.json"]
command = ["npm", "ci", "--no-audit", "--no-fund"]

[[stages]]
stage = "editor"
label = "tsc --noEmit (VS Code TypeScript)"
argv = ["sh", "-c", "next typegen > /dev/null 2>&1; exec tsc --noEmit"]
parser = "tsc"
timeout = 300

[[stages]]
stage = "check"
label = "eslint (npm run lint)"
argv = ["eslint", ".", "-f", "json"]
parser = "eslint-json"
timeout = 300

[[stages]]
stage = "build"
label = "next build"
argv = ["next", "build"]
parser = "tsc"
timeout = 900

[runtime]
argv = ["next", "dev", "-p", "{port}", "-H", "127.0.0.1"]
page_path = "/"
ready_timeout = 300
settle_ms = 1500

[[runtime.journeys.default]]
action = "click"
selector = "button:text-is('Add')"

[[runtime.journeys.default]]
action = "wait"
ms = 500

[[runtime.journeys.default]]
action = "click"
selector = "button:text-is('Details')"

[[runtime.journeys.default]]
action = "click"
selector = "button:text-is('Hide')"

# Opens the details, closes them from the status line, and opens them again.
[[runtime.journeys.status]]
action = "click"
selector = "button:text-is('Details')"

[[runtime.journeys.status]]
action = "click"
selector = "button:text-is('Close')"

[[runtime.journeys.status]]
action = "click"
selector = "button:text-is('Details')"

# Types into the search field and submits the form.
[[runtime.journeys.search]]
action = "fill"
selector = "form[role=search] input"
text = "alpha"

[[runtime.journeys.search]]
action = "press"
selector = "form[role=search] input"
key = "Enter"

# Follows the About link to its page.
[[runtime.journeys.about]]
action = "click"
selector = "a:text-is('About')"

# Follows the project link to its page.
[[runtime.journeys.project]]
action = "click"
selector = "a:text-is('Project 1')"

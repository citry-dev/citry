[project]
name = "reflex-error-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# The Reflex version the Reflex app in benchmarks/web pins.
dependencies = [
    "reflex==0.9.10.post2",
]

[dependency-groups]
# The tools most Python projects add, which `reflex init` does not install:
# pyright stands in for Pylance in the editor, and ruff lints the Python
# files.
dev = [
    "pyright==1.1.414",
    "ruff==0.15.5",
]

[tool.uv]
package = false
# The same resolved versions as the Reflex app in benchmarks/web, so the two
# benchmarks describe one Reflex install.
constraint-dependencies = [
    "anyio==4.15.1",
    "bidict==0.24.1",
    "certifi==2026.10.19",
    "click==8.5.0",
    "granian==2.8.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "packaging==26.3",
    "platformdirs==4.11.8",
    "psutil==7.2.2",
    "pygments==2.21.0",
    "python-engineio==4.14.0",
    "python-multipart==0.0.32",
    "python-socketio==5.16.4",
    "redis==7.4.1",
    "reflex-base==0.9.10.post2",
    "reflex-components-code==0.9.4",
    "reflex-components-core==0.9.9",
    "reflex-components-dataeditor==0.9.2",
    "reflex-components-gridjs==0.9.1",
    "reflex-components-lucide==1.0.4",
    "reflex-components-markdown==0.9.3",
    "reflex-components-moment==0.9.3",
    "reflex-components-plotly==0.9.5",
    "reflex-components-radix==0.9.8",
    "reflex-components-react-player==0.9.2",
    "reflex-components-recharts==0.9.2",
    "reflex-components-sonner==0.9.2",
    "reflex-hosting-cli==0.1.71",
    "rich==15.0.0",
    "simple-websocket==1.1.0",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "watchfiles==1.2.0",
    "wrapt==2.1.2",
    "wsproto==1.3.2",
]

# Type checking on, as in most typed Python projects: Pylance's "standard"
# mode, which is also the pyright command line's default.
[tool.pyright]
typeCheckingMode = "standard"

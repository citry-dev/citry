key = "django-components"
name = "django-components + HTMX + Alpine"
notes = """
The app is the Django app (frameworks/django) with django-components 0.152.0 \
added the way its installation guide says: `django_components` in \
INSTALLED_APPS, its template loaders listed in place of APP_DIRS, its static \
file finder, and `django_components.urls` in the URL configuration. \
django-components installs djc-core 1.3.1, its compiled helper package. \
Django, HTMX, Alpine, the settings and the tools are otherwise the same as in \
the Django app.

The board page is built from four components in the project's \
`components/` folder, the folder django-components looks in by default. Each component is a \
Python class in its own folder with its template in a separate .html file, as \
the getting-started tutorial writes them, and is registered with `@register`:
- BoardPage is the whole page. Its `View.get` answers `/`, and \
`get_js_data()` sends the public API base to the page's script, \
board_page.js. That script registers the board's Alpine data (the API base \
and the Details toggle) from its `$onComponent` callback. The docs' Alpine \
example instead writes into a running Alpine component, but Alpine is loaded \
with `defer` and has not started yet when the callback runs: django-components \
runs the callback while the page is still being parsed, and a deferred \
script starts only after that. So the script registers the data for Alpine \
to find when it starts. The page's stylesheet is board_page.css.
- Card declares the inputs `title: str`, `count: int` and \
`tone: Literal['plain', 'accent']` in `Kwargs`, and its required `footer` \
slot in `Slots`, typed with the data the slot hands back \
(`SlotInput[FooterData]`). Its template marks the slot `required` and passes \
it `title` and `count` as slot data, and its stylesheet, card.css, gives the \
accent card its blue border. The page picks each card's `tone` with \
`card.featured|yesno:"accent,plain"`, as the Django app does. Its fill, \
`{% fill "footer" data="footer" %}`, reads the slot data through the \
`data` keyword the slot docs show, naming it `footer`, as `footer.title` \
and `footer.count`. The slot data's type is a hint for pyright in Python \
code that fills the slot with a function or calls it. Neither \
django-components nor djc-ext-pydantic, which checks only that each slot is \
a slot, checks a template fill or the `{% slot %}` tag's data against it. \
The Hide button sends Alpine's `hide` \
event, as in the Django app. \
The page wraps the cards in `{% provide "board" title="Projects" %}`, and \
each card reads the board's name in `get_template_data()` with \
`self.inject('board')`, as django-components' provide/inject docs show. \
The provided value calls the board's name `title`, because `name` is the \
`{% provide %}` tag's own argument that holds the key.
- Status is the status line inside Details. django-components renders a \
component's markup on the server, so the page can give the status line \
only the value `open` has at that moment, and `open` changes later in the \
browser. As in the Django app, the status line \
is an Alpine component (`Alpine.data('status')`, registered in status.js) \
nested inside the board's, and its markup reads the board's `open` through \
the scope Alpine shares with it. Its Close button dispatches a `close` \
event, and a listener on the board sets `open` to false.
- Counter shows the saved total. Its `View.post` handles Add: it adds the \
posted amount to the session's `count` and replies with the counter's own \
HTML, which HTMX swaps in. As in the Django app, the reply shows the total \
it computed, so a typo in the stored field name shows only after the reload \
the runner does after its clicks.

The page parts that are plain template markup are written as in the Django \
app: the subtitle's `{% blocktranslate %}`, the avatar's `{% static %}`, the \
search form, which submits back to the page with GET, and the `{% url %}` \
links. Three parts use django-components' own features. BoardPage's \
`get_css_data()` returns the heading's color, which django-components turns \
into the CSS variable `--accent` that board_page.css reads. The page's View \
passes the searched text to BoardPage as its input `searched`. And the About \
and project pages are two more components, whose Views are routed with \
`as_view()`. Their templates name where the components' CSS and JavaScript \
go with `{% component_css_dependencies %}` and \
`{% component_js_dependencies %}`, the tags the docs' page templates use; \
BoardPage leaves that to django-components, which inserts them by default. \
A template tag in the head also keeps djLint's rule that asks for a meta \
description (H030) quiet, as BoardPage's `{% static %}` tags do.

A component's View gets a URL in one of two ways the docs show: \
`get_component_url()`, which makes one up from the class, or \
`Component.as_view()` in the URL configuration, which the docs' HTML \
fragments guide uses with HTMX. The app uses `as_view()` for both views, so \
the Add button names its handler `save` through `{% url %}`, as the Django \
app does. With `get_component_url()` the button would name the Counter class \
in Python instead, and a misspelled class name there (m06) would be an \
editor error rather than the runtime error `{% url %}` gives.

Value types: by default django-components turns a component's `Kwargs`, \
`Slots`, `TemplateData`, `JsData` and `CssData` classes into named tuples, \
which check only that each name is known and each required name is given. \
Its docs say that to check types as well, a project writes these classes as \
Pydantic models and installs the djc-ext-pydantic extension, which the \
django-components project publishes. The benchmark turns on a framework's \
stricter check when other frameworks here have the same kind of check, and \
Citry, Next.js, Nuxt and FastHTML check the types of a component's inputs \
(before the app runs; Citry 0.6.0 does not check them again when a component \
renders), so this app turns that type check on: djc-ext-pydantic 1.1.0 (with \
Pydantic 2.14.1) is listed in `COMPONENTS["extensions"]`, and those classes \
are Pydantic `BaseModel`s. Pydantic's default ignores names a model does not \
declare, which would lose the named tuples' check of unknown names, so each \
model also sets `model_config = ConfigDict(extra='forbid')`, as Citry and \
the named tuples reject an unknown name. These are the two changes from \
django-components' defaults. Pydantic's default mode still converts text \
such as "3" to a number. Its `strict=True` would reject that, but the \
benchmark's decision on conversions counts a framework that turns "3" into 3 \
for the developer as preventing the mistake, so it stays off. Of the cases, \
m03 and m49 end differently because of the Pydantic models: without them, \
nothing checks the input's type or its allowed choices. No case passes an \
unknown name next to all the right ones, so `extra='forbid'` changes no \
result: a misspelled input or slot name is reported anyway, because the \
correctly spelled required name is then missing.

`get_template_data()` and `get_js_data()` return plain dicts, which \
django-components checks against those models. Its docs also show returning \
a `TemplateData` instance, but django-components types the method as \
returning a mapping, so pyright rejects that. Each `class View:` is written \
as the docs write it; django-components turns it into a ComponentView \
subclass when it creates the component, but pyright sees only the plain \
class and reports that it overrides `Component.View` with an incompatible \
type, so that line carries a \
`# pyright: ignore[reportIncompatibleVariableOverride]` comment. No case \
edits those lines.

editor: as in the Django app. django-components ships no editor extension or \
language server; its docs point to a third-party extension that only \
highlights HTML, JS and CSS written inside Python strings. The diagnostics \
come from:
- Pylance with type checking turned on, measured with pyright 1.1.414 in \
typeCheckingMode "standard" (Pylance's own default is "off"). Pylance checks \
only open files by default, while the command line checks every file; with \
one case per run this can only add findings.
- VS Code's built-in JavaScript support, which reports syntax errors in plain \
.js files. It is measured with tsc from TypeScript 6.0.3 (the version VS Code \
ships) with --allowJs and no checkJs, on the two hand-written scripts, \
components/board_page/board_page.js and components/status/status.js.
Nothing in the editor checks the component templates, the inputs given in \
`{% component %}` tags, the HTMX attributes or the Alpine expressions.

check: `python manage.py check`, plus ruff with its default rules for the \
Python files and djLint with its Django profile for the component templates. \
A linter finding fails its command, so it counts as an error. The only check \
django-components adds to `manage.py check` comes from its static file \
finder, which checks the folders its settings name; nothing checks templates \
or component classes. `manage.py check` does import every component module, \
because django-components finds and imports them when Django starts, so a \
component module that fails to import fails the check. Its \
`manage.py components` command creates, lists and upgrades components and \
runs extension commands; none of them checks anything, so it is not a \
stage. There is no build stage.

runtime: as in the Django app, `manage.py migrate` (sessions are stored in \
the database), then `manage.py runserver --noreload`. django-components \
checks each component's inputs, slots and data when it renders, so a \
misspelled, missing or wrong-type input, slot or data value surfaces as a \
server error on the first page load.
"""

[setup]
manifests = [".python-version", "pyproject.toml", "uv.lock", "package.json", "package-lock.json"]
command = ["sh", "-c", "uv sync --frozen && npm ci --no-audit --no-fund"]

[[stages]]
stage = "editor"
label = "Pylance, type checking on (pyright 1.1.414, standard)"
argv = ["{venv}/bin/pyright", "--outputjson", "--pythonpath", "{venv}/bin/python"]
parser = "pyright-json"
timeout = 300
env = { PYRIGHT_PYTHON_IGNORE_WARNINGS = "1" }

[[stages]]
stage = "editor"
label = "VS Code JavaScript syntax check (tsc 6.0.3 --allowJs)"
argv = ["{env}/node_modules/.bin/tsc", "--allowJs", "--noEmit", "--pretty", "false", "components/board_page/board_page.js", "components/status/status.js"]
parser = "tsc"
timeout = 300

[[stages]]
stage = "check"
label = "manage.py check"
argv = ["{venv}/bin/python", "manage.py", "check"]
parser = "exit"
timeout = 300

[[stages]]
stage = "check"
label = "ruff 0.15.5 (default rules)"
# --isolated: a real project's ruff reads only its own settings, not those of
# a repository it happens to sit in.
argv = ["{venv}/bin/ruff", "check", "--isolated", "--no-respect-gitignore", "--output-format", "json", "."]
parser = "ruff-json"
timeout = 300

[[stages]]
stage = "check"
label = "djLint 1.46.6 (--lint, django profile)"
argv = ["{venv}/bin/djlint", "components", "--lint", "--profile=django"]
parser = "djlint"
timeout = 300

[runtime]
argv = [
  "sh", "-c",
  "{venv}/bin/python manage.py migrate --noinput -v 0 && exec {venv}/bin/python manage.py runserver 127.0.0.1:{port} --noreload",
]
page_path = "/"
ready_timeout = 180
env = { PYTHONUNBUFFERED = "1" }
[runtime.journeys]
default = [
  { action = "click", selector = "button:has-text('Add')" },
  { action = "wait", ms = 500 },
  { action = "click", selector = "button:has-text('Details')" },
  { action = "wait", ms = 300 },
  { action = "click", selector = "button:has-text('Hide')" },
]
# Opens the details, closes them from the status line, and opens them again.
status = [
  { action = "click", selector = "button:has-text('Details')" },
  { action = "click", selector = "button:has-text('Close')" },
  { action = "click", selector = "button:has-text('Details')" },
]
# Types into the search field and submits the form.
search = [
  { action = "fill", selector = "form[role=search] input", text = "alpha" },
  { action = "press", selector = "form[role=search] input", key = "Enter" },
]
# Follows the About link to its page.
about = [
  { action = "click", selector = "a:has-text('About')" },
]
# Follows the project link to its page.
project = [
  { action = "click", selector = "a:has-text('Project 1')" },
]

[package]
name = "citry_core_py"
description = "Singular Python API for Rust code used by Citry"
version = "1.1.0"
edition = "2024"
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "citry_core_py"
crate-type = ["cdylib"]

[features]
# One CPython wheel per platform supports every GIL-enabled interpreter from
# 3.10 onward; release jobs still build separate PyPy and free-threaded wheels.
abi3-py310 = ["pyo3/abi3-py310", "pyo3/extension-module"]

[dependencies]
citry_html_transform = { path = "../citry_html_transform" }
citry_i18n = { path = "../citry_i18n" }
citry_template_formatter = { path = "../citry_template_formatter" }
python_safe_eval = { path = "../python_safe_eval" }
citry_template_parser = { path = "../citry_template_parser" }
icu_locale = { workspace = true }
pyo3 = { workspace = true }
quick-xml = { workspace = true }

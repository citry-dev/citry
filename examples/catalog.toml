python = ">=3.10,<4"
test = ["uv", "run", "pytest"]
serve = ["uv", "run", "waitress-serve", "--listen=127.0.0.1:{port}", "app.main:application"]
page_path = "/"
citry_prefix = "/citry"
profile = "starter-web-v1"
docs = ["/web-frameworks/#bare-asgi-and-wsgi", "/events/"]


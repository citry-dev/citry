[project]
name = "citry-example-wsgi"
version = "0.1.0"
description = "Run the Citry Project Explorer directly on WSGI"
requires-python = ">=3.10,<4"
dependencies = [
  "citry>=0.4.4,<0.5",
  "waitress>=3.0,<4",
]

[dependency-groups]
dev = [
  "citry-lsp>=0.1,<0.2",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

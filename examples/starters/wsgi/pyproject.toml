[project]
name = "citry-example-wsgi"
version = "0.1.0"
description = "Run the Citry Project Explorer directly on WSGI"
requires-python = ">=3.11,<4"
dependencies = [
  "citry>=1.0.0,<2",
  "waitress>=3.0,<4",
]

[dependency-groups]
dev = [
  "citry-lsp>=1.0.0,<2",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "citry-example-asgi"
version = "0.1.0"
description = "Run the Citry Project Explorer directly on ASGI"
requires-python = ">=3.10,<4"
dependencies = [
  "citry>=0.4.4,<0.5",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "citry-lsp>=0.1,<0.2",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

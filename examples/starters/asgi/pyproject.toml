[project]
name = "citry-example-asgi"
version = "0.1.0"
description = "A dependency-light bare ASGI starter for Citry"
requires-python = ">=3.10,<4"
dependencies = [
  "citry>=0.4.3,<0.5",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

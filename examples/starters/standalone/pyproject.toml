[project]
name = "citry-example-standalone"
version = "0.1.0"
description = "Render the Citry Project Explorer without a web server"
requires-python = ">=3.11,<4"
dependencies = [
  "citry>=1.0.0,<2",
]

[dependency-groups]
dev = [
  "citry-lsp>=1.0.0,<2",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

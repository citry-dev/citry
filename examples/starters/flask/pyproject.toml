[project]
name = "citry-example-flask"
version = "0.1.0"
description = "Run the Citry Project Explorer with Flask"
requires-python = ">=3.10,<4"
dependencies = [
  "citry>=0.4.6,<0.5",
  "flask>=3.1,<4",
]

[dependency-groups]
dev = [
  "citry-lsp>=0.1,<0.2",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "citry-demo-project-board"
version = "0.1.0"
description = "A browser-complete project board demo for Citry"
requires-python = ">=3.10,<4"
dependencies = [
  "citry>=0.4.4,<0.5",
  "fastapi>=0.141,<1",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.10,<3",
  "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

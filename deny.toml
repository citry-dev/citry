# cargo-deny settings for the security workflow
# (.github/workflows/repo--security.yml). Only the advisories check runs
# there: it fails on any RustSec advisory for a crate in Cargo.lock, because
# nearly everything in the lock ships in the citry-core wheel (the only
# exception is a test-only crate). An advisory that cannot be fixed yet is
# listed below with the reason it is accepted and the issue that tracks its
# removal.

[graph]
# Check the dependency graph with every feature on, so an advisory in an
# optional dependency counts too.
all-features = true

[advisories]
# Fail on yanked crates too, since authors yank a release that is broken or
# unsafe.
yanked = "deny"
ignore = [
    # zip 8.6.0 reaches us only through the vendored ruff formatter (ruff_db),
    # which pins zip 8. Citry formats source text and never extracts an archive,
    # so the affected extraction code never runs. Remove these when the ruff
    # pin moves to a ruff release that uses zip 9: ruff main has it since
    # astral-sh/ruff#29808, but no release does yet (issue #378).
    { id = "RUSTSEC-2026-0367", reason = "zip extraction, unused; vendored ruff pins zip 8 (#378)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction, unused; vendored ruff pins zip 8 (#378)" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction, unused; vendored ruff pins zip 8 (#378)" },
    { id = "RUSTSEC-2026-0429", reason = "zip extraction, unused; remove when the ruff pin reaches a release with zip 9 (#378)" },
    # 0545 needs zip's `aes-crypto` feature and 0547 its `legacy-zip` feature,
    # which the workspace pin leaves off (default-features = false); 0546 and
    # 0548 are in archive extraction.
    { id = "RUSTSEC-2026-0545", reason = "zip AES decryption, feature off and unused; vendored ruff pins zip 8 (#378)" },
    { id = "RUSTSEC-2026-0546", reason = "zip extraction, unused; vendored ruff pins zip 8 (#378)" },
    { id = "RUSTSEC-2026-0547", reason = "zip legacy-zip decoders, feature off and unused; vendored ruff pins zip 8 (#378)" },
    { id = "RUSTSEC-2026-0548", reason = "zip stream extraction, unused; vendored ruff pins zip 8 (#378)" },
    # chrono is in Cargo.lock only through ruff_db's optional quick-junit
    # dependency; `cargo tree -i chrono --target all` finds nothing built.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; locked by vendored ruff_db's optional quick-junit, never built (#378)" },
]


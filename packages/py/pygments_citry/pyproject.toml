[build-system]
# Tracks a current setuptools. 77 is the true minimum, where PEP 639 license
# metadata and `license-files` arrived, but only a build from source reads this
# and pip supplies a recent setuptools there anyway.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-citry"
version = "0.1.2"
requires-python = ">=3.10, <4.0"
description = "Pygments lexer for Citry components with embedded HTML, JavaScript, CSS, and Fluent"
readme = "README.md"
keywords = [
    "citry",
    "pygments",
    "lexer",
    "syntax highlighting",
    "components",
    "html",
    "fluent",
    "i18n",
]
authors = [{ name = "Juro Oravec", email = "juraj.oravec.josefson@gmail.com" }]
classifiers = [
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]
# The Pygments floor is where the plugin lexer API we rely on is stable.
# fluent.pygments supplies the Fluent lexer used inside `messages` blocks and
# also registers the standalone `fluent` / `ftl` aliases.
dependencies = [
    "fluent.pygments==1.0",
    "pygments>=2.20",
]

# Registers the lexers as Pygments plugins: any environment with this package
# installed resolves ```citry (full component) and ```citry-html (template only)
# through get_lexer_by_name with no explicit import.
[project.entry-points."pygments.lexers"]
citry = "pygments_citry.lexers:CitryPythonLexer"
citry-html = "pygments_citry.citry_html:CitryHtmlLexer"

# The single declaration of this package's test deps. The uv workspace installs
# them on `uv sync --all-packages`, so the shared venv and CI get them with no
# separate root-level copy to keep in step.
[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.urls]
Homepage = "https://citry.dev"
Repository = "https://github.com/citry-dev/citry"
Changelog = "https://github.com/citry-dev/citry/blob/main/packages/py/pygments_citry/CHANGELOG.md"
Issues = "https://github.com/citry-dev/citry/issues"

# Ship only the lexer package; the flat-layout auto-discovery would otherwise
# also try to package the tests directory.
[tool.setuptools.packages.find]
include = ["pygments_citry*"]

[tool.setuptools.package-data]
pygments_citry = ["py.typed"]

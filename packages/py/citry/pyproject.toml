[build-system]
# Tracks a current setuptools. 77 is the true minimum, where PEP 639 license
# metadata and `license-files` arrived, but only a build from source reads this
# and pip supplies a recent setuptools there anyway. Loosen it again if someone
# building from an sdist needs an older one.
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citry"
version = "0.4.1"
requires-python = ">=3.10, <4.0"
description = "Fast, simple, and smart frontend framework for Python that brings the best of Vue, React, Django, Jinja, and LiveWire"
# Symlink to the repo-root README; setuptools refuses a readme outside the
# package dir, so the link makes the root README local to this package.
readme = "README.md"
keywords = [
    "citry",
    "components",
    "frontend",
    "html",
    "web development",
    "templating",
    "template engine",
]
authors = [{ name = "Juro Oravec", email = "juraj.oravec.josefson@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Pinned to one exact version, not a range. The runtime node classes in
    # `citry.nodes` read the source citry-core's compiler emits, so the two
    # move together: raise this in the same change that releases citry-core.
    "citry-core==1.5.0",
    # Deliberately wide. Citry uses only `ObjectProxy` and `__wrapped__`, and
    # wrapt keeps `ObjectProxy` working across its 2.0 rewrite, so both major
    # lines serve. Raising the floor would force wrapt 2 on every installation
    # for no gain here.
    "wrapt>=1.16",
    # Deliberately wide. `Markup` and `escape` are all citry needs; the private
    # `_escape_inner` fast path in citry.util.html is opportunistic and falls back
    # to `escape` where it is absent, which is the case on 2.x. Raising the floor
    # would force markupsafe 3 on every installation to buy only that fast path.
    "markupsafe>=2.1",
    # 4.10 is the first release with `TypeIs` (PEP 742), which citry.util.misc
    # imports. The other symbols used here (`TypeAliasType`, `Unpack`,
    # `override`, and `TypeVar` with a PEP 696 default) all land earlier.
    "typing-extensions>=4.10",
    # Python 3.11 added tomllib to the standard library. Citry's i18n package
    # compiler reads pyproject.toml on 3.10 through this compatible backport.
    "tomli>=2.0; python_version < '3.11'",
    # Citry opens this package directly instead of consulting the host's
    # system zoneinfo search path. LocaleContext records the installed data
    # version, so time-zone conversion and cache identity stay explicit.
    "tzdata>=2026.3",
]

# Optional runtime extras, namespaced `<category>-<name>` (see docs/codebase.md).
# `watcher-*` are hot-reload file-watcher backends (docs/design/hot_reload.md);
# the polling fallback in citry.reload needs no extra.
#
# Both floors are deliberately wide, for the same reason as the runtime
# dependencies above: a user installs these, so the floor states what they must
# have. citry.reload imports only `watchfiles.watch`, and watchdog's
# `FileSystemEventHandler` and `Observer`, which every release in range provides.
[project.optional-dependencies]
analysis-ty = ["ty==0.0.71"]       # Python expression types for analysis tooling
watcher-watchfiles = ["watchfiles>=1.0"]   # recommended native backend
watcher-watchdog = ["watchdog>=4.0"]       # alternate native backend

# The `citry` console script (the CLI entry point); see citry/__main__.py.
[project.scripts]
citry = "citry.__main__:main"

# These groups are the single declaration of citry's test and benchmark deps.
# The uv workspace installs them on `uv sync --all-packages`, so the shared venv
# and CI get them with no separate root-level copy to keep in step.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",  # coverage gate in scripts/check.py
    # Both repository-check profiles distribute non-browser tests by file;
    # the e2e group below reuses the same runner for its browser suites.
    "pytest-xdist>=3.8.0",
    # test-only: the django contrib adapter tests (test_contrib_django.py) need a
    # real django. A range, not the benchmark group's exact pin: benchmarks need a
    # stable baseline, these tests just need any supported django. py>=3.12 only,
    # matching django 6's floor; on older pythons those tests skip.
    "django>=5.2; python_version >= '3.12'",
    "pydantic>=2.13.4", # test-only: components may use Pydantic Kwargs/Slots
    "fastapi>=0.141.1",  # test-only: FastAPI contrib tests (Starlette TestClient)
    # Starlette's TestClient moved to httpx2 and deprecates the httpx transport,
    # so the warning it emits is a real instruction rather than noise.
    "httpx2>=2.10.0",  # test-only: the transport Starlette's TestClient uses
    "jsonschema>=4.26.0", # test-only: protocol conformance validates every emitted envelope
]
# Browser end-to-end tests (tests/e2e). A separate group, NOT installed by
# default, so the normal test run skips them (they need browser binaries from
# `playwright install`). The e2e CI jobs install this group and the browsers.
e2e = [
    "playwright>=1.62.0",
    "pytest-playwright>=0.9.0",
]
# Benchmark baselines (docs/design/benchmarking.md), pinned exactly so a bump is
# a deliberate re-baseline; skipped when absent (tests/conftest.py).
# django 6.0 requires Python >= 3.12, so the Django comparison baselines only
# install there; on 3.10/3.11 the suite skips them (the bare pin would otherwise
# make the whole workspace unresolvable on those versions).
benchmark = [
    "django==6.0.6; python_version >= '3.12'",
    "django-components==0.151.1; python_version >= '3.12'",
    "jinja2==3.1.6",
]

[project.urls]
Homepage = "https://citry.dev"
Repository = "https://github.com/citry-dev/citry"
Changelog = "https://github.com/citry-dev/citry/blob/main/CHANGELOG.md"
Issues = "https://github.com/citry-dev/citry/issues"

[tool.setuptools.package-data]
# Non-Python files shipped inside the package: the type-checking marker and
# the client-side dependency manager and Events runtime (inlined into rendered
# pages, later also served over HTTP by the web integrations).
citry = ["py.typed", "ext/dependencies/client/*.js", "ext/events/client/*.js", "ext/i18n/client/*.js"]

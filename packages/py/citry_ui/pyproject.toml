[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "citry-ui"
version = "0.0.1"
requires-python = ">=3.10, <4.0"
description = "First-party styled component library for Citry"
readme = "README.md"
keywords = [
    "citry",
    "components",
    "frontend",
    "ui",
]
authors = [{ name = "Juro Oravec", email = "juraj.oravec.josefson@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["citry>=0.3.1,<0.4.0"]

[dependency-groups]
dev = [
    "brotli>=1.1.0",
    "pytest>=8.3.5",
]
e2e = [
    "playwright>=1.49",
    "pytest-playwright>=0.5",
]
storybook = [
    "playwright>=1.49",
    "uvicorn>=0.49",
]

[project.urls]
Homepage = "https://citry.dev"
Repository = "https://github.com/citry-dev/citry"
Issues = "https://github.com/citry-dev/citry/issues"

[tool.setuptools.packages.find]
include = ["citry_ui*"]
exclude = [
    "citry_ui.quality",
    "citry_ui.quality.*",
    "citry_ui.components.*.quality",
    "citry_ui.components.*.quality.*",
    "citry_ui.components.*.snippets",
    "citry_ui.components.*.snippets.*",
    "citry_ui.components.*.tests",
    "citry_ui.components.*.tests.*",
]
namespaces = false

[tool.setuptools.package-data]
citry_ui = ["py.typed"]

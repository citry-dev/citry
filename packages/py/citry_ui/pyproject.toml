[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "citry-ui"
version = "0.0.1"
requires-python = ">=3.10, <4.0"
description = "First-party styled and headless component library for Citry"
readme = "README.md"
keywords = [
    "citry",
    "components",
    "frontend",
    "ui",
]
authors = [{ name = "Juro Oravec", email = "juraj.oravec.josefson@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = ["LICENSE"]
# Workspace placeholder only. Before publishing citry-ui, replace this with
# the first released Citry range that contains ComponentLibrary.
dependencies = ["citry>=0.3.0,<0.4.0"]

[dependency-groups]
dev = ["pytest>=8.3.5"]
storybook = [
    "playwright>=1.49",
    "uvicorn>=0.49",
]

[project.urls]
Homepage = "https://citry.dev"
Repository = "https://github.com/citry-dev/citry"
Issues = "https://github.com/citry-dev/citry/issues"

[tool.setuptools.packages.find]
include = ["citry_ui*"]

[tool.setuptools.package-data]
citry_ui = ["py.typed"]

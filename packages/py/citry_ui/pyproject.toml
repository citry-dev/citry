[build-system]
# Tracks a current setuptools. 77 is the true minimum, where PEP 639 license
# metadata and `license-files` arrived, but only a build from source reads this
# and pip supplies a recent setuptools there anyway.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citry-ui"
version = "0.2.0"
requires-python = ">=3.10, <4.0"
description = "First-party styled component library for Citry"
readme = "README.md"
keywords = [
    "citry",
    "components",
    "frontend",
    "ui",
]
authors = [{ name = "Juro Oravec", email = "juraj.oravec.josefson@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = ["citry>=0.4.2,<0.5.0"]

[dependency-groups]
dev = [
    "brotli>=1.1.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0", # test_component_contracts reads the component manifests
]
e2e = [
    "playwright>=1.49",
    "pytest-playwright>=0.5",
]
storybook = [
    "playwright>=1.49",
    "uvicorn>=0.49",
]

[project.urls]
Homepage = "https://citry.dev"
Documentation = "https://citry.dev/ui-library/"
Repository = "https://github.com/citry-dev/citry"
Issues = "https://github.com/citry-dev/citry/issues"
Changelog = "https://github.com/citry-dev/citry/blob/main/packages/py/citry_ui/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["citry_ui*"]
exclude = [
    "citry_ui.quality",
    "citry_ui.quality.*",
    "citry_ui.components.*.quality",
    "citry_ui.components.*.quality.*",
    "citry_ui.components.*.snippets",
    "citry_ui.components.*.snippets.*",
    "citry_ui.components.*.tests",
    "citry_ui.components.*.tests.*",
    "citry_ui.components.*.tools",
    "citry_ui.components.*.tools.*",
]
namespaces = true

[tool.setuptools.package-data]
citry_ui = ["py.typed"]
"*" = ["*.min.css", "*.min.js"]
citry_ui_i18n = [
    "citry-i18n.toml",
    "formats.json",
    "locales/**/*.ftl",
    "_compiled/*.json",
]

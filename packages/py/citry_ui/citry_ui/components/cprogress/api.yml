schema_version: 1
family: progress

components:
  - CProgress

inputs:
  - id: cprogress-server-inputs
    component: CProgress
    channel: server
    column_widths: [fit, 15rem, 7rem, auto]
    entries:
      - {id: label, name: label, type: str, default: {kind: required}, effect: Sets the required nonempty native accessible name and fallback text.}
      - {id: value, name: value, type: 'float | int | None', default: {kind: literal, value: null}, effect: Sets determinate completion from zero through max; None omits the native value attribute for indeterminate progress.}
      - {id: max, name: max, type: 'float | int', default: {kind: literal, value: 100}, effect: Sets the positive native task maximum.}
      - {id: value-text, name: value_text, type: 'str | None', default: {kind: literal, value: null}, effect: Sets optional `aria-valuetext` when units are not naturally understood as a percentage.}
      - {id: intent, name: intent, type: {display: '"neutral" | "primary" | "success" | "warn" | "danger"', interfaces: [CProgressIntent]}, default: {kind: literal, value: primary}, effect: Selects the visual range palette; surrounding text still carries meaning.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg"', interfaces: [CProgressSize]}, default: {kind: literal, value: md}, effect: Sets track thickness.}
      - {id: shape, name: shape, type: {display: '"square" | "rounded" | "pill"', interfaces: [CProgressShape]}, default: {kind: literal, value: rounded}, effect: Sets native track and range radius.}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds native root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds native root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds copied trusted nonconflicting native, ARIA relationship, data, and targeted Alpine attributes to the native progress root.'}
  - id: cprogress-client-inputs
    component: CProgress
    channel: client
    column_widths: [fit, 15rem, 7rem, auto]
    entries:
      - {id: value, name: value, type: 'number | null', omitted: Uses the server fallback., effect: Controls native determinate value; null removes the attribute for indeterminate state; omission returns to server fallback.}
      - {id: label, name: label, type: string, omitted: Uses the server fallback., effect: Controls the nonempty native accessible name; omission returns to server fallback.}
      - {id: value-text, name: valueText, type: 'string | null', omitted: Uses the server fallback., effect: Controls `aria-valuetext`; null removes it; omission returns to server fallback.}
      - {id: intent, name: intent, type: '"neutral" | "primary" | "success" | "warn" | "danger"', omitted: Uses the server fallback., effect: Controls the public visual palette reflection.}
      - {id: size, name: size, type: '"sm" | "md" | "lg"', omitted: Uses the server fallback., effect: Controls the public thickness reflection.}
      - {id: shape, name: shape, type: '"square" | "rounded" | "pill"', omitted: Uses the server fallback., effect: Controls the public radius reflection.}

slots: []
events: []
methods: []

css:
  - id: cprogress-css-variables
    component: CProgress
    entries:
      - {id: cui-progress-track-color, name: --cui-progress-track-color, type: color, purpose: Unfilled native track., default: Scheme-aware neutral color.}
      - {id: cui-progress-range-color, name: --cui-progress-range-color, type: color, purpose: Completed range and indeterminate accent., default: Intent-derived color.}
      - {id: cui-progress-height, name: --cui-progress-height, type: length, purpose: Native track thickness., default: Size-derived length.}
      - {id: cui-progress-radius, name: --cui-progress-radius, type: length, purpose: Native track and range radius., default: Shape-derived length.}

attributes:
  - id: cprogress-attributes
    component: CProgress
    entries:
      - {id: value, name: value, element: Native root, type: 'number or absent', meaning: Present only for determinate progress and controlled by the effective value.}
      - {id: max, name: max, element: Native root, type: positive number, meaning: Reflects the server-owned task maximum.}
      - {id: aria-label, name: aria-label, element: Native root, type: nonempty string, meaning: Carries the required accessible task name.}
      - {id: aria-valuetext, name: aria-valuetext, element: Native root, type: 'string or absent', meaning: Carries optional application-authored value phrasing.}
      - {id: data-state, name: data-state, element: Native root, type: '"determinate" | "indeterminate"', meaning: Reflects whether the native value attribute is present.}
      - {id: data-intent, name: data-intent, element: Native root, type: '"neutral" | "primary" | "success" | "warn" | "danger"', meaning: Reflects the effective visual palette.}
      - {id: data-size, name: data-size, element: Native root, type: '"sm" | "md" | "lg"', meaning: Reflects effective thickness.}
      - {id: data-shape, name: data-shape, element: Native root, type: '"square" | "rounded" | "pill"', meaning: Reflects effective radius.}

selectors:
  - id: cprogress-selectors
    component: CProgress
    entries:
      - {id: data-citry-ui-part-progress, selector: '[data-citry-ui-part="progress"]', element: Native progress root, purpose: Stable public root and `attrs` destination.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-cprogress-intent, name: CProgressIntent, definition: 'Literal["neutral", "primary", "success", "warn", "danger"]'}
      - {id: input-type-aliases-cprogress-size, name: CProgressSize, definition: 'Literal["sm", "md", "lg"]'}
      - {id: input-type-aliases-cprogress-shape, name: CProgressShape, definition: 'Literal["square", "rounded", "pill"]'}

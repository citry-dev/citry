schema_version: 1
family: badge

components:
  - CBadge

inputs:
  - id: cbadge-server-inputs
    component: CBadge
    channel: server
    column_widths: [fit, 15rem, 7rem, auto]
    entries:
      - {id: variant, name: variant, type: {display: '"soft" | "solid" | "outline"', interfaces: [CBadgeVariant]}, default: {kind: literal, value: soft}, effect: 'Selects quiet fill, strong fill, or outlined emphasis.'}
      - {id: intent, name: intent, type: {display: '"neutral" | "primary" | "success" | "warn" | "danger"', interfaces: [CBadgeIntent]}, default: {kind: literal, value: neutral}, effect: Selects a visual palette; authored text must still carry status meaning.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg"', interfaces: [CBadgeSize]}, default: {kind: literal, value: md}, effect: 'Sets compact height, type, padding, icon size, and gap.'}
      - {id: shape, name: shape, type: {display: '"rounded" | "pill"', interfaces: [CBadgeShape]}, default: {kind: literal, value: rounded}, effect: Selects compact rounded or fully pill-shaped geometry.}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds copied trusted native, data, and targeted Alpine root attributes without replacing Badge anatomy, semantics, or Citry runtime fields.'}

slots:
  - id: cbadge-slots
    component: CBadge
    entries:
      - {id: default, name: default, required: true, data: {display: '{}', interfaces: [CBadgeDefaultSlotData]}, fallback: Missing fill raises before rendering.}
      - {id: start, name: start, required: false, data: {display: '{}', interfaces: [CBadgeStartSlotData]}, fallback: Leading wrapper omitted.}
      - {id: end, name: end, required: false, data: {display: '{}', interfaces: [CBadgeEndSlotData]}, fallback: Trailing wrapper omitted.}

events: []
methods: []

css:
  - id: cbadge-css-variables
    component: CBadge
    entries:
      - {id: cui-badge-background, name: --cui-badge-background, type: color, purpose: Root fill., default: Variant- and intent-derived color.}
      - {id: cui-badge-foreground, name: --cui-badge-foreground, type: color, purpose: Label and icon foreground., default: Contrast-checked variant and intent color.}
      - {id: cui-badge-border-color, name: --cui-badge-border-color, type: color, purpose: Root border., default: Variant-derived transparent or currentColor.}
      - {id: cui-badge-radius, name: --cui-badge-radius, type: length, purpose: Root corner radius., default: Shape-derived 0.375rem or 999px.}
      - {id: cui-badge-min-height, name: --cui-badge-min-height, type: length, purpose: Compact minimum block size., default: Size-derived length.}
      - {id: cui-badge-padding-inline, name: --cui-badge-padding-inline, type: length, purpose: Root inline padding., default: Size-derived length.}
      - {id: cui-badge-gap, name: --cui-badge-gap, type: length, purpose: Space between supplied slot wrappers., default: Size-derived length.}
      - {id: cui-badge-font-size, name: --cui-badge-font-size, type: length, purpose: Label font size., default: Size-derived length.}
      - {id: cui-badge-font-weight, name: --cui-badge-font-weight, type: font-weight, purpose: Label weight., default: '650'}

attributes:
  - id: cbadge-attributes
    component: CBadge
    entries:
      - {id: data-variant, name: data-variant, element: Root, type: '"soft" | "solid" | "outline"', meaning: Reflects the selected emphasis treatment.}
      - {id: data-intent, name: data-intent, element: Root, type: '"neutral" | "primary" | "success" | "warn" | "danger"', meaning: Reflects the selected visual palette.}
      - {id: data-size, name: data-size, element: Root, type: '"sm" | "md" | "lg"', meaning: Reflects compact geometry.}
      - {id: data-shape, name: data-shape, element: Root, type: '"rounded" | "pill"', meaning: Reflects corner geometry.}

selectors:
  - id: cbadge-selectors
    component: CBadge
    entries:
      - {id: data-citry-ui-part-badge, selector: '[data-citry-ui-part="badge"]', element: Native span root, purpose: Stable Badge root and `attrs` destination.}
      - {id: data-citry-ui-part-start, selector: '[data-citry-ui-part="start"]', element: Optional leading wrapper, purpose: Leading icon/content layout.}
      - {id: data-citry-ui-part-label, selector: '[data-citry-ui-part="label"]', element: Required label wrapper, purpose: Visible meaning-bearing content.}
      - {id: data-citry-ui-part-end, selector: '[data-citry-ui-part="end"]', element: Optional trailing wrapper, purpose: Trailing icon/content layout.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-cbadge-variant, name: CBadgeVariant, definition: 'Literal["soft", "solid", "outline"]'}
      - {id: input-type-aliases-cbadge-intent, name: CBadgeIntent, definition: 'Literal["neutral", "primary", "success", "warn", "danger"]'}
      - {id: input-type-aliases-cbadge-size, name: CBadgeSize, definition: 'Literal["sm", "md", "lg"]'}
      - {id: input-type-aliases-cbadge-shape, name: CBadgeShape, definition: 'Literal["rounded", "pill"]'}
  - {id: cbadge-default-slot-data, kind: record, name: CBadgeDefaultSlotData, entries: []}
  - {id: cbadge-start-slot-data, kind: record, name: CBadgeStartSlotData, entries: []}
  - {id: cbadge-end-slot-data, kind: record, name: CBadgeEndSlotData, entries: []}

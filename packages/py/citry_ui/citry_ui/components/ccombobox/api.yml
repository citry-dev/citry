schema_version: 1
family: combobox

components:
  - CCombobox

inputs:
  - id: ccombobox-server-inputs
    component: CCombobox
    channel: server
    column_widths: [fit, 13rem, 9rem, auto]
    entries:
      - {id: options, name: options, type: 'Sequence[CComboboxOption]', default: {kind: literal, value: '()'}, effect: Supplies the initial strict-selection collection.}
      - {id: name, name: name, type: 'str | None', default: {kind: literal, value: null}, effect: Adds the optional hidden native submitted name. Omit it when the control does not participate in a Form.}
      - {id: id, name: id, type: 'str | None', default: {kind: derived, display: Uses the Field ID or a generated ID.}, effect: 'Sets visible-input, listbox, and option identity.'}
      - {id: value, name: value, type: 'str | None', default: {kind: literal, value: null}, effect: Sets initial canonical selection. A value may arrive before its matching item.}
      - {id: input-value, name: input_value, type: 'str | None', default: {kind: derived, display: Uses the selected label or an empty string.}, effect: Sets initial editable query text.}
      - {id: open, name: open, type: bool, default: {kind: literal, value: false}, effect: Sets initial popup visibility when interaction and the query threshold allow it.}
      - {id: required, name: required, type: 'bool | None', default: {kind: literal, value: null}, effect: 'Requires canonical selection when standalone; `CField` owns this state when composed.'}
      - {id: disabled, name: disabled, type: 'bool | None', default: {kind: literal, value: null}, effect: 'Disables interaction and Form participation when standalone; disabled `CForm` always wins and `CField` owns this state when composed.'}
      - {id: readonly, name: readonly, type: 'bool | None', default: {kind: derived, display: Inherits CForm when standalone.}, effect: 'Preserves Form participation but blocks editing, opening, clearing, and selection; `CField` owns this state when composed.'}
      - {id: invalid, name: invalid, type: 'bool | None', default: {kind: literal, value: null}, effect: 'Sets application invalid presentation when standalone; `CField` owns this state when composed.'}
      - {id: loading, name: loading, type: bool, default: {kind: literal, value: false}, effect: Adds external loading presentation to internal remote loading.}
      - {id: clearable, name: clearable, type: bool, default: {kind: literal, value: true}, effect: Shows the clear action when selection or query text exists.}
      - {id: open-on-focus, name: open_on_focus, type: bool, default: {kind: literal, value: false}, effect: Opens on input focus when the query meets `min_chars`.}
      - {id: auto-highlight, name: auto_highlight, type: bool, default: {kind: literal, value: false}, effect: Highlights the first enabled match after filtering or loading without selecting it on blur or Tab.}
      - id: filter
        name: filter
        type: {display: '"contains" | "starts_with" | "none"', interfaces: [CComboboxFilter]}
        default: {kind: literal, value: contains}
        effect: Selects plain case-insensitive local matching. Remote mode bypasses it.
      - {id: min-chars, name: min_chars, type: non-negative int, default: {kind: literal, value: 0}, effect: Sets the minimum Unicode-code-point query length for popup visibility and remote loading.}
      - {id: debounce-ms, name: debounce_ms, type: non-negative int, default: {kind: literal, value: 200}, effect: Sets remote request delay in milliseconds.}
      - {id: placeholder, name: placeholder, type: 'str | None', default: {kind: literal, value: null}, effect: Sets the visible native-input placeholder.}
      - {id: autocomplete, name: autocomplete, type: non-empty str, default: {kind: literal, value: 'off'}, effect: Sets the visible native-input autocomplete hint. Browser heuristics may still override it.}
      - {id: inputmode, name: inputmode, type: 'str | None', default: {kind: literal, value: null}, effect: Sets the visible native-input virtual-keyboard hint.}
      - {id: required-message, name: required_message, type: non-empty str, default: {kind: literal, value: Select an option.}, effect: Sets native custom-validity text for a missing required selection.}
      - {id: clear-label, name: clear_label, type: non-empty str, default: {kind: literal, value: Clear selection}, effect: Names the clear Button.}
      - {id: open-label, name: open_label, type: non-empty str, default: {kind: literal, value: Show options}, effect: Names the closed popup trigger.}
      - {id: close-label, name: close_label, type: non-empty str, default: {kind: literal, value: Hide options}, effect: Names the open popup trigger.}
      - {id: loading-label, name: loading_label, type: non-empty str, default: {kind: literal, value: Loading options...}, effect: Sets fallback loading status text.}
      - {id: empty-label, name: empty_label, type: non-empty str, default: {kind: literal, value: No options found.}, effect: Sets fallback empty status text.}
      - {id: error-label, name: error_label, type: non-empty str, default: {kind: literal, value: Options could not be loaded.}, effect: Sets fallback remote-error status text.}
      - id: variant
        name: variant
        type: {display: '"outline" | "filled" | "plain"', interfaces: [CComboboxVariant]}
        default: {kind: literal, value: outline}
        effect: Selects control presentation.
      - id: size
        name: size
        type: {display: '"sm" | "md" | "lg"', interfaces: [CComboboxSize]}
        default: {kind: literal, value: md}
        effect: Selects control geometry.
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds allowed native, ARIA, Alpine, and data attributes to the root. Prefer the top-level class and style inputs.'}
      - {id: input-attrs, name: input_attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds allowed attributes to the visible input. `form` is rejected so validation and submitted value cannot have different owners.'}

  - id: ccombobox-client-inputs
    component: CCombobox
    channel: client
    column_widths: [fit, 13rem, 12rem, auto]
    entries:
      - {id: items, name: items, type: {display: 'CComboboxItem[]', interfaces: [CComboboxItem]}, omitted: Keeps the current collection., effect: 'Replaces the current collection while valid. `null`, malformed entries, and duplicate values retain the prior collection and report once per invalid episode.'}
      - {id: value, name: value, type: 'non-empty string | null', omitted: Continues uncontrolled from the current selection., effect: 'Controls canonical selection while supplied. `null` is an intentional empty controlled value; empty strings and other invalid values release control from current state.'}
      - {id: input-value, name: inputValue, type: 'string | null', omitted: Continues uncontrolled from the current query. `null` has the same effect., effect: Controls editable query text while supplied as a string. Invalid values report and release control.}
      - {id: open, name: open, type: 'boolean | null', omitted: Continues uncontrolled from current visibility. `null` has the same effect., effect: 'Controls requested popup visibility; disabled, read-only, and query-threshold rules still determine effective visibility.'}
      - {id: required, name: required, type: boolean, omitted: Uses the server value., effect: Controls required state only when standalone. `CField` owns it when composed.}
      - {id: disabled, name: disabled, type: boolean, omitted: Uses the server value., effect: Controls local disabled state only when standalone. Disabled `CForm` always wins and `CField` owns it when composed.}
      - {id: readonly, name: readonly, type: boolean, omitted: Uses the server or reactive CForm value., effect: Controls read-only state only when standalone. `CField` owns it when composed.}
      - {id: invalid, name: invalid, type: boolean, omitted: Uses the server value., effect: Controls application invalid state only when standalone. `CField` owns it when composed.}
      - {id: loading, name: loading, type: boolean, omitted: Uses the server input., effect: Adds external loading presentation.}
      - {id: clearable, name: clearable, type: boolean, omitted: Uses the server input., effect: Controls clear-action visibility.}
      - {id: open-on-focus, name: openOnFocus, type: boolean, omitted: Uses the server input., effect: Controls focus-triggered opening.}
      - {id: auto-highlight, name: autoHighlight, type: boolean, omitted: Uses the server input., effect: Controls first-match highlight after filtering or loading.}
      - id: filter
        name: filter
        type: {display: '"contains" | "starts_with" | "none"', interfaces: [CComboboxFilter]}
        omitted: Uses the server input.
        effect: Controls local matching.
      - {id: min-chars, name: minChars, type: non-negative integer, omitted: Uses the server input., effect: Controls the Unicode-code-point popup and remote-query threshold.}
      - {id: debounce-ms, name: debounceMs, type: non-negative integer, omitted: Uses the server input., effect: Controls remote delay.}
      - id: variant
        name: variant
        type: {display: '"outline" | "filled" | "plain"', interfaces: [CComboboxVariant]}
        omitted: Uses the server input.
        effect: Controls presentation.
      - id: size
        name: size
        type: {display: '"sm" | "md" | "lg"', interfaces: [CComboboxSize]}
        omitted: Uses the server input.
        effect: Controls geometry.
      - {id: load-options, name: loadOptions, type: {display: '(request: CComboboxLoadRequest) => Promise<CComboboxItem[]> | CComboboxItem[]', interfaces: [CComboboxLoadRequest, CComboboxItem]}, omitted: Uses local filtering., effect: 'Loads one complete replacement collection for the committed query. `null` disables remote mode. Replacing or removing the function aborts current work; a valid replacement reloads a qualifying open query.'}
      - {id: on-value-change, name: onValueChange, type: function, omitted: Does not notify a selection callback., effect: Receives user and reset selection requests.}
      - {id: on-input-value-change, name: onInputValueChange, type: function, omitted: Does not notify a query callback., effect: Receives user and reset query requests.}
      - {id: on-open-change, name: onOpenChange, type: function, omitted: Does not notify a visibility callback., effect: Receives user-authored popup requests and query-threshold closure.}
      - {id: on-load-error, name: onLoadError, type: function, omitted: Does not notify a loading-error callback., effect: Receives current non-abort remote failures after safe error presentation.}

slots:
  - id: ccombobox-slots
    component: CCombobox
    entries:
      - {id: loading, name: loading, required: false, data: {display: '{}', interfaces: [CComboboxLoadingSlotData]}, fallback: '`loading_label`'}
      - {id: empty, name: empty, required: false, data: {display: '{}', interfaces: [CComboboxEmptySlotData]}, fallback: '`empty_label`'}
      - {id: error, name: error, required: false, data: {display: '{}', interfaces: [CComboboxErrorSlotData]}, fallback: '`error_label`'}

events:
  - id: ccombobox-events
    component: CCombobox
    entries:
      - id: on-value-change
        name: onValueChange
        signature: {display: '(value: string | null, detail: CComboboxValueChangeDetail) => void', interfaces: [CComboboxValueChangeDetail]}
        trigger: Option selection, clear, text invalidation, or uncanceled reset requests a different canonical value.
        detail: {display: '{reason: "option" | "clear" | "input" | "reset", option: CComboboxItem | null, query: string, controlled: boolean, source: EventTarget | null}', interfaces: [CComboboxValueChangeDetail, CComboboxItem]}
        behavior: Uncontrolled value and Form state commit before notification. Controlled requests wait for the owner. Owner commits and repeated values do not notify.
      - id: on-input-value-change
        name: onInputValueChange
        signature: {display: '(query: string, detail: CComboboxInputValueChangeDetail) => void', interfaces: [CComboboxInputValueChangeDetail]}
        trigger: Input, option, clear, blur reconciliation, or uncanceled reset requests different query text.
        detail: {display: '{reason: "input" | "option" | "clear" | "blur" | "reset", controlled: boolean, source: EventTarget | null}', interfaces: [CComboboxInputValueChangeDetail]}
        behavior: Uncontrolled visible text commits before notification. Controlled requests wait for the owner. Owner commits do not notify.
      - id: on-open-change
        name: onOpenChange
        signature: {display: '(open: boolean, detail: CComboboxOpenChangeDetail) => void', interfaces: [CComboboxOpenChangeDetail]}
        trigger: Input, focus, trigger, keyboard, selection, Escape, outside press, blur, reset, or threshold requests different visibility.
        detail: {display: '{reason: "input" | "focus" | "trigger" | "keyboard" | "selection" | "escape" | "outside" | "blur" | "reset" | "minimum-characters", controlled: boolean, source: EventTarget | null}', interfaces: [CComboboxOpenChangeDetail]}
        behavior: Uncontrolled visibility and ARIA commit before notification. Controlled requests wait for the owner. Owner commits do not notify.
      - id: on-load-error
        name: onLoadError
        signature: {display: '(error: unknown, detail: CComboboxLoadErrorDetail) => void', interfaces: [CComboboxLoadErrorDetail]}
        trigger: The current remote loader throws, rejects, or returns an invalid collection for a reason other than abort.
        detail: {display: '{query: string, requestId: number}', interfaces: [CComboboxLoadErrorDetail]}
        behavior: Error presentation appears before notification. Abort and stale requests do not notify.

methods: []

css:
  - id: ccombobox-css-variables
    component: CCombobox
    entries:
      - {id: cui-combobox-background, name: --cui-combobox-background, type: color, purpose: Control background., default: Canvas}
      - {id: cui-combobox-foreground, name: --cui-combobox-foreground, type: color, purpose: Control and popup text., default: CanvasText}
      - {id: cui-combobox-border-color, name: --cui-combobox-border-color, type: color, purpose: Resting control border., default: Subtle CanvasText mix.}
      - {id: cui-combobox-focus-color, name: --cui-combobox-focus-color, type: color, purpose: Focus ring and border., default: Highlight}
      - {id: cui-combobox-invalid-color, name: --cui-combobox-invalid-color, type: color, purpose: Invalid border., default: Scheme-aware error color.}
      - {id: cui-combobox-radius, name: --cui-combobox-radius, type: length, purpose: 'Control, popup, and option radius basis.', default: 0.5rem}
      - {id: cui-combobox-height, name: --cui-combobox-height, type: length, purpose: Minimum control height., default: Size-derived.}
      - {id: cui-combobox-inline-padding, name: --cui-combobox-inline-padding, type: length, purpose: Input logical inline padding., default: Size-derived.}
      - {id: cui-combobox-icon-size, name: --cui-combobox-icon-size, type: length, purpose: Clear and trigger Button size., default: 2.25rem}
      - {id: cui-combobox-popup-background, name: --cui-combobox-popup-background, type: color, purpose: Popup surface., default: Canvas}
      - {id: cui-combobox-popup-border-color, name: --cui-combobox-popup-border-color, type: color, purpose: Popup border., default: Subtle CanvasText mix.}
      - {id: cui-combobox-popup-shadow, name: --cui-combobox-popup-shadow, type: shadow, purpose: Popup elevation., default: 0 0.75rem 2rem rgb(15 23 42 / 18%)}
      - {id: cui-combobox-popup-max-height, name: --cui-combobox-popup-max-height, type: length, purpose: Scrollable list height., default: 18rem}
      - {id: cui-combobox-option-padding, name: --cui-combobox-option-padding, type: length, purpose: Option padding., default: 0.625rem 0.75rem}
      - {id: cui-combobox-option-gap, name: --cui-combobox-option-gap, type: length, purpose: Gap between option label and description., default: 0.125rem}
      - {id: cui-combobox-option-description-color, name: --cui-combobox-option-description-color, type: color, purpose: Supporting option text., default: Muted current color.}
      - {id: cui-combobox-highlighted-background, name: --cui-combobox-highlighted-background, type: color, purpose: Keyboard or pointer highlight., default: Subtle Highlight/Canvas mix.}
      - {id: cui-combobox-selected-background, name: --cui-combobox-selected-background, type: color, purpose: Committed selected-option background., default: Stronger Highlight/Canvas mix.}
      - {id: cui-combobox-disabled-opacity, name: --cui-combobox-disabled-opacity, type: number, purpose: Disabled control and option opacity., default: '0.55'}
      - {id: cui-combobox-error-color, name: --cui-combobox-error-color, type: color, purpose: Remote error text., default: Scheme-aware error color.}

attributes:
  - id: ccombobox-root-attributes
    component: CCombobox
    entries:
      - {id: data-open, name: data-open, element: Root, type: present | absent, meaning: Mirrors effective popup visibility.}
      - {id: data-loading, name: data-loading, element: Root, type: present | absent, meaning: Mirrors external or current remote loading.}
      - {id: data-empty, name: data-empty, element: Root, type: present | absent, meaning: Mirrors visible open empty state.}
      - {id: data-error, name: data-error, element: Root, type: present | absent, meaning: Mirrors current remote-error state.}
      - {id: data-required, name: data-required, element: Root, type: present | absent, meaning: Mirrors effective required state.}
      - {id: data-disabled, name: data-disabled, element: Root, type: present | absent, meaning: Mirrors effective disabled state.}
      - {id: data-readonly, name: data-readonly, element: Root, type: present | absent, meaning: Mirrors effective read-only state.}
      - {id: data-invalid, name: data-invalid, element: Root, type: present | absent, meaning: Mirrors application or native invalid state.}
      - {id: data-variant, name: data-variant, element: Root, type: '"outline" | "filled" | "plain"', meaning: Mirrors effective variant.}
      - {id: data-size, name: data-size, element: Root, type: '"sm" | "md" | "lg"', meaning: Mirrors effective size.}
  - id: ccombobox-option-attributes
    component: CCombobox
    entries:
      - {id: data-value, name: data-value, element: Option, type: string, meaning: Canonical option identity.}
      - {id: data-selected, name: data-selected, element: Option, type: present | absent, meaning: Mirrors committed selection.}
      - {id: data-highlighted, name: data-highlighted, element: Option, type: present | absent, meaning: Mirrors transient keyboard or pointer highlight.}
      - {id: data-disabled, name: data-disabled, element: Option, type: present | absent, meaning: Mirrors disabled state.}

selectors:
  - id: ccombobox-selectors
    component: CCombobox
    entries:
      - {id: root, selector: '[data-citry-ui-part="root"]', element: Root, purpose: Combobox root and `attrs` destination.}
      - {id: control, selector: '[data-citry-ui-part="control"]', element: Control, purpose: Visible input and action layout.}
      - {id: input, selector: '[data-citry-ui-part="input"]', element: Native text input, purpose: 'Editable query, validation owner, and `input_attrs` destination.'}
      - {id: clear, selector: '[data-citry-ui-part="clear"]', element: Clear Button, purpose: Clear action.}
      - {id: trigger, selector: '[data-citry-ui-part="trigger"]', element: Trigger Button, purpose: Popup toggle.}
      - {id: popup, selector: '[data-citry-ui-part="popup"]', element: Popup, purpose: Inline popup surface.}
      - {id: listbox, selector: '[data-citry-ui-part="listbox"]', element: Listbox, purpose: ARIA listbox and scrolling collection.}
      - {id: option, selector: '[data-citry-ui-part="option"]', element: Option, purpose: Selectable plain-text item.}
      - {id: option-label, selector: '[data-citry-ui-part="option-label"]', element: Option label, purpose: Primary visible text.}
      - {id: option-description, selector: '[data-citry-ui-part="option-description"]', element: Option description, purpose: Optional supporting visible text.}
      - {id: loading, selector: '[data-citry-ui-part="loading"]', element: Loading status, purpose: Remote or external loading feedback.}
      - {id: empty, selector: '[data-citry-ui-part="empty"]', element: Empty status, purpose: Open empty-result feedback.}
      - {id: error, selector: '[data-citry-ui-part="error"]', element: Error status, purpose: Safe remote-failure feedback.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-ccombobox-filter, name: CComboboxFilter, definition: 'Literal["contains", "starts_with", "none"]'}
      - {id: input-type-aliases-ccombobox-variant, name: CComboboxVariant, definition: 'Literal["outline", "filled", "plain"]'}
      - {id: input-type-aliases-ccombobox-size, name: CComboboxSize, definition: 'Literal["sm", "md", "lg"]'}
  - id: ccombobox-option
    kind: record
    name: CComboboxOption
    entries:
      - {id: value, name: value, type: non-empty str, meaning: Stable identity and optional submitted value.}
      - {id: label, name: label, type: non-empty str, meaning: Primary escaped visible text and local filter text.}
      - {id: description, name: description, type: 'str | None', default: None, meaning: Optional escaped supporting text.}
      - {id: disabled, name: disabled, type: bool, default: 'False', meaning: Excludes the option from selection and highlight.}
  - id: ccombobox-item
    kind: record
    name: CComboboxItem
    entries:
      - {id: value, name: value, type: non-empty string, meaning: Stable unique identity and canonical value.}
      - {id: label, name: label, type: non-empty string, meaning: Primary plain text and local filter text.}
      - {id: description, name: description, type: 'string | null', default: 'null', meaning: Optional supporting plain text.}
      - {id: disabled, name: disabled, type: boolean, default: 'false', meaning: Excludes the item from selection and highlight.}
  - id: ccombobox-load-request
    kind: record
    name: CComboboxLoadRequest
    entries:
      - {id: query, name: query, type: string, meaning: Committed query that qualified for loading.}
      - {id: signal, name: signal, type: AbortSignal, meaning: 'Aborts when superseded, closed, reset, blocked, replaced, or removed.'}
      - {id: request-id, name: requestId, type: number, meaning: Monotonic identity used to reject stale results even if abort is ignored.}
  - {id: ccombobox-loading-slot-data, kind: record, name: CComboboxLoadingSlotData, entries: []}
  - {id: ccombobox-empty-slot-data, kind: record, name: CComboboxEmptySlotData, entries: []}
  - {id: ccombobox-error-slot-data, kind: record, name: CComboboxErrorSlotData, entries: []}
  - id: ccombobox-value-change-detail
    kind: record
    name: CComboboxValueChangeDetail
    entries:
      - {id: reason, name: reason, type: '"option" | "clear" | "input" | "reset"', meaning: Canonical-value request source.}
      - {id: option, name: option, type: 'CComboboxItem | null', meaning: Associated option when one caused the request.}
      - {id: query, name: query, type: string, meaning: Query before dependent query reconciliation.}
      - {id: controlled, name: controlled, type: boolean, meaning: Whether a valid client `value` currently owns selection.}
      - {id: source, name: source, type: 'EventTarget | null', meaning: Browser source associated with the request.}
  - id: ccombobox-input-value-change-detail
    kind: record
    name: CComboboxInputValueChangeDetail
    entries:
      - {id: reason, name: reason, type: '"input" | "option" | "clear" | "blur" | "reset"', meaning: Query request source.}
      - {id: controlled, name: controlled, type: boolean, meaning: Whether a valid client `inputValue` currently owns query text.}
      - {id: source, name: source, type: 'EventTarget | null', meaning: Browser source associated with the request.}
  - id: ccombobox-open-change-detail
    kind: record
    name: CComboboxOpenChangeDetail
    entries:
      - {id: reason, name: reason, type: '"input" | "focus" | "trigger" | "keyboard" | "selection" | "escape" | "outside" | "blur" | "reset" | "minimum-characters"', meaning: Popup request source.}
      - {id: controlled, name: controlled, type: boolean, meaning: Whether a valid client `open` currently owns requested visibility.}
      - {id: source, name: source, type: 'EventTarget | null', meaning: Browser source associated with the request.}
  - id: ccombobox-load-error-detail
    kind: record
    name: CComboboxLoadErrorDetail
    entries:
      - {id: query, name: query, type: string, meaning: Query associated with the failed current request.}
      - {id: request-id, name: requestId, type: number, meaning: Failed request identity.}

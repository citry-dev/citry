schema_version: 1
family: card

components:
  - CCard

inputs:
  - id: ccard-server-inputs
    component: CCard
    channel: server
    column_widths: [fit, 14rem, 7rem, auto]
    entries:
      - id: tag
        name: tag
        type:
          display: '"div" | "article" | "section" | "li"'
          interfaces: [CCardTag]
        default: {kind: literal, value: div}
        effect: Selects the native root. Use the neutral default unless the Card content satisfies stronger document semantics.
      - id: variant
        name: variant
        type:
          display: '"elevated" | "outline" | "subtle"'
          interfaces: [CCardVariant]
        default: {kind: literal, value: elevated}
        effect: Selects shadow, border, and background emphasis.
      - id: size
        name: size
        type:
          display: '"sm" | "md" | "lg"'
          interfaces: [CCardSize]
        default: {kind: literal, value: md}
        effect: Sets section padding and action gaps without changing consumer typography.
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds root inline styles and merges them with `attrs`.'}
      - id: attrs
        name: attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine root attributes. It cannot replace the public part, variant, size, or Citry runtime ownership fields.
      - id: media-attrs
        name: media_attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine attributes to the media wrapper. A nonempty mapping requires the media slot.
      - id: header-attrs
        name: header_attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine attributes to the header row. A nonempty mapping requires header or header_actions.
      - id: header-actions-attrs
        name: header_actions_attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine attributes to the header action group. A nonempty mapping requires header_actions.
      - id: body-attrs
        name: body_attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine attributes to the body wrapper. A nonempty mapping requires the default slot.
      - id: footer-attrs
        name: footer_attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine attributes to the footer row. A nonempty mapping requires footer or actions.
      - id: actions-attrs
        name: actions_attrs
        type: Mapping[str, object] | None
        default: {kind: literal, value: null}
        effect: Adds native, ARIA, data, and trusted Alpine attributes to the footer action group. A nonempty mapping requires actions.

slots:
  - id: ccard-slots
    component: CCard
    entries:
      - {id: media, name: media, required: false, data: {display: '{}', interfaces: [CCardMediaSlotData]}, fallback: Wrapper omitted.}
      - {id: header, name: header, required: false, data: {display: '{}', interfaces: [CCardHeaderSlotData]}, fallback: Content wrapper omitted.}
      - {id: header-actions, name: header_actions, required: false, data: {display: '{}', interfaces: [CCardHeaderActionsSlotData]}, fallback: Action wrapper omitted.}
      - {id: default, name: default, required: false, data: {display: '{}', interfaces: [CCardDefaultSlotData]}, fallback: Body wrapper omitted.}
      - {id: footer, name: footer, required: false, data: {display: '{}', interfaces: [CCardFooterSlotData]}, fallback: Content wrapper omitted.}
      - {id: actions, name: actions, required: false, data: {display: '{}', interfaces: [CCardActionsSlotData]}, fallback: Action wrapper omitted.}

events: []
methods: []

css:
  - id: ccard-css-variables
    component: CCard
    entries:
      - {id: cui-card-background, name: --cui-card-background, type: color, purpose: Root background., default: Variant-derived Canvas or system-color mix.}
      - {id: cui-card-foreground, name: --cui-card-foreground, type: color, purpose: Inherited content color., default: CanvasText}
      - {id: cui-card-border-color, name: --cui-card-border-color, type: color, purpose: Root border color., default: Variant-derived transparent or system-color mix.}
      - {id: cui-card-shadow, name: --cui-card-shadow, type: shadow, purpose: Root elevation shadow., default: Variant-derived shadow or none.}
      - {id: cui-card-radius, name: --cui-card-radius, type: length, purpose: Root and media edge radius., default: 0.75rem}
      - {id: cui-card-padding, name: --cui-card-padding, type: length, purpose: 'Header, body, and footer row padding.', default: Size-derived length.}
      - {id: cui-card-section-gap, name: --cui-card-section-gap, type: length, purpose: Space between header or footer content and actions., default: Size-derived length.}
      - {id: cui-card-actions-gap, name: --cui-card-actions-gap, type: length, purpose: Gap between controls in either action group., default: Size-derived length.}
      - {id: cui-card-actions-justify, name: --cui-card-actions-justify, type: justify-content, purpose: Alignment inside action groups., default: flex-start}

attributes:
  - id: ccard-attributes
    component: CCard
    entries:
      - {id: data-variant, name: data-variant, element: Root, type: '"elevated" | "outline" | "subtle"', meaning: Reflects the server-selected surface treatment.}
      - {id: data-size, name: data-size, element: Root, type: '"sm" | "md" | "lg"', meaning: Reflects the server-selected spacing preset.}

selectors:
  - id: ccard-selectors
    component: CCard
    entries:
      - {id: data-citry-ui-part-card, selector: '[data-citry-ui-part="card"]', element: Native root, purpose: Stable Card root and `attrs` destination.}
      - {id: data-citry-ui-part-media, selector: '[data-citry-ui-part="media"]', element: Optional media wrapper, purpose: Clipped media edge and `media_attrs` destination.}
      - {id: data-citry-ui-part-header, selector: '[data-citry-ui-part="header"]', element: Optional header row, purpose: Header layout and `header_attrs` destination.}
      - {id: data-citry-ui-part-header-actions, selector: '[data-citry-ui-part="header-actions"]', element: Optional header action group, purpose: Direct-control layout and `header_actions_attrs` destination.}
      - {id: data-citry-ui-part-body, selector: '[data-citry-ui-part="body"]', element: Optional body wrapper, purpose: Main content and `body_attrs` destination.}
      - {id: data-citry-ui-part-footer, selector: '[data-citry-ui-part="footer"]', element: Optional footer row, purpose: Footer layout and `footer_attrs` destination.}
      - {id: data-citry-ui-part-actions, selector: '[data-citry-ui-part="actions"]', element: Optional footer action group, purpose: Direct-control layout and `actions_attrs` destination.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-ccard-tag, name: CCardTag, definition: 'Literal["div", "article", "section", "li"]'}
      - {id: input-type-aliases-ccard-variant, name: CCardVariant, definition: 'Literal["elevated", "outline", "subtle"]'}
      - {id: input-type-aliases-ccard-size, name: CCardSize, definition: 'Literal["sm", "md", "lg"]'}
  - {id: ccard-media-slot-data, kind: record, name: CCardMediaSlotData, entries: []}
  - {id: ccard-header-slot-data, kind: record, name: CCardHeaderSlotData, entries: []}
  - {id: ccard-header-actions-slot-data, kind: record, name: CCardHeaderActionsSlotData, entries: []}
  - {id: ccard-default-slot-data, kind: record, name: CCardDefaultSlotData, entries: []}
  - {id: ccard-footer-slot-data, kind: record, name: CCardFooterSlotData, entries: []}
  - {id: ccard-actions-slot-data, kind: record, name: CCardActionsSlotData, entries: []}

translations: []

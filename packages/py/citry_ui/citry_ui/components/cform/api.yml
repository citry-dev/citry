schema_version: 1
family: form

components:
  - CForm

inputs:
  - id: cform-server-inputs
    component: CForm
    channel: server
    column_widths: [fit, 13rem, 7rem, auto]
    entries:
      - {id: id, name: id, type: 'str | None', default: {kind: generated}, effect: Sets unique native Form identity and an external control ownership target.}
      - {id: action, name: action, type: 'str | None', default: {kind: literal, value: null}, effect: Sets the native submission destination; omission preserves browser current-URL behavior.}
      - id: method
        name: method
        type:
          display: '"get" | "post" | "dialog" | None'
          interfaces: [CFormMethod]
        default: {kind: literal, value: null}
        effect: Sets the native submission method; omission uses the browser default.
      - id: enctype
        name: enctype
        type:
          display: '"application/x-www-form-urlencoded" | "multipart/form-data" | "text/plain" | None'
          interfaces: [CFormEnctype]
        default: {kind: literal, value: null}
        effect: Sets native submission encoding.
      - {id: target, name: target, type: 'str | None', default: {kind: literal, value: null}, effect: Sets the native browsing-context target.}
      - id: autocomplete
        name: autocomplete
        type:
          display: '"on" | "off" | None'
          interfaces: [CFormAutocomplete]
        default: {kind: literal, value: null}
        effect: Sets the native Form autocomplete hint.
      - {id: disabled, name: disabled, type: bool, default: {kind: literal, value: false}, effect: Disables physical descendant controls through the internal fieldset and supplies inherited Citry disabled state.}
      - {id: readonly, name: readonly, type: bool, default: {kind: literal, value: false}, effect: Supplies a read-only default to supporting Citry controls; ordinary native controls are unaffected.}
      - {id: submitting, name: submitting, type: bool, default: {kind: literal, value: false}, effect: Exposes Form busy state and stops later submit handlers reached after CForm's capture listener; it is not inherited by descendants.}
      - {id: novalidate, name: novalidate, type: bool, default: {kind: literal, value: false}, effect: Maps to native `novalidate`.}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds native Form classes from a string, conditional mapping, or nested sequence and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds native Form inline styles from CSS text, a property mapping, or nested sequence and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds allowed less-common native Form, ARIA, Alpine, and data attributes; direct native inputs, public parts, and reflected attributes cannot also be supplied here. Class and style values merge with the top-level inputs.'}
  - id: cform-client-inputs
    component: CForm
    channel: client
    column_widths: [fit, 9rem, 11rem, auto]
    entries:
      - {id: disabled, name: disabled, type: boolean, omitted: Uses the server input., effect: 'Controls the fieldset, inherited Citry disabled state, and `data-disabled`.'}
      - {id: readonly, name: readonly, type: boolean, omitted: Uses the server input., effect: Controls inherited Citry read-only state and `data-readonly`.}
      - {id: submitting, name: submitting, type: boolean, omitted: Uses the server input., effect: 'Controls Form busy state, its submit guard, and `data-submitting`; descendants remain enabled unless disabled separately.'}

slots:
  - id: cform-slots
    component: CForm
    entries:
      - {id: default, name: default, required: true, data: {display: '{}', interfaces: [CFormDefaultSlotData]}, fallback: none}

events: []
methods: []

css:
  - id: cform-css-variables
    component: CForm
    entries:
      - {id: cui-form-gap, name: --cui-form-gap, type: length, purpose: Spacing between direct children of the internal fieldset., default: 1rem}

attributes:
  - id: cform-attributes
    component: CForm
    entries:
      - {id: data-disabled, name: data-disabled, element: Native Form, type: present | absent, meaning: Mirrors effective disabled state.}
      - {id: data-readonly, name: data-readonly, element: Native Form, type: present | absent, meaning: Mirrors effective read-only state.}
      - {id: data-submitting, name: data-submitting, element: Native Form, type: present | absent, meaning: Mirrors effective submitting state.}
      - {id: data-validation-attempted, name: data-validation-attempted, element: Native Form, type: present | absent, meaning: 'Appears after a physical descendant dispatches native invalid, including through validation methods, and clears after an uncanceled reset.'}

selectors:
  - id: cform-selectors
    component: CForm
    entries:
      - {id: data-citry-ui-part-form, selector: '[data-citry-ui-part="form"]', element: Native Form, purpose: Root and `attrs` destination.}
      - {id: data-citry-ui-part-fieldset, selector: '[data-citry-ui-part="fieldset"]', element: Native fieldset, purpose: Native disabled-group and direct-child layout boundary.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-cform-method, name: CFormMethod, definition: 'Literal["get", "post", "dialog"]'}
      - {id: input-type-aliases-cform-enctype, name: CFormEnctype, definition: 'Literal["application/x-www-form-urlencoded", "multipart/form-data", "text/plain"]'}
      - {id: input-type-aliases-cform-autocomplete, name: CFormAutocomplete, definition: 'Literal["on", "off"]'}
  - {id: cform-default-slot-data, kind: record, name: CFormDefaultSlotData, entries: []}

schema_version: 1
family: slider

components:
  - CSlider
  - CRangeSlider

inputs:
  - id: cslider-server-inputs
    component: CSlider
    channel: server
    column_widths: [fit, 17rem, 13rem, auto]
    entries:
      - {id: value, name: value, type: {display: 'CSliderExact | None', interfaces: [CSliderExact]}, default: {kind: literal, value: null}, effect: Sets the initial exact value; None uses min.}
      - {id: name, name: name, type: 'str | None', default: {kind: literal, value: null}, effect: Names the progressive native Form entry.}
      - {id: form, name: form, type: 'str | None', default: {kind: literal, value: null}, effect: Associates the Form entry with an external Form ID.}
      - {id: id, name: id, type: 'str | None', default: {kind: generated}, effect: Sets the public native input ID and enhanced label target.}
      - {id: min, name: min, type: {display: CSliderExact, interfaces: [CSliderExact]}, default: {kind: literal, value: 0}, effect: Sets the inclusive exact minimum and step-grid origin.}
      - {id: max, name: max, type: {display: CSliderExact, interfaces: [CSliderExact]}, default: {kind: literal, value: 100}, effect: Sets the inclusive exact maximum.}
      - {id: step, name: step, type: {display: CSliderExact, interfaces: [CSliderExact]}, default: {kind: literal, value: 1}, effect: Sets the positive exact grid interval.}
      - {id: large-step, name: large_step, type: {display: 'CSliderExact | None', interfaces: [CSliderExact]}, default: {kind: derived, value: Ten steps.}, effect: Sets the positive whole-step Page Up and Page Down interval.}
      - {id: disabled, name: disabled, type: 'bool | None', default: {kind: literal, value: null}, effect: Blocks focus mutation and Form participation outside Field.}
      - {id: readonly, name: readonly, type: 'bool | None', default: {kind: literal, value: null}, effect: Preserves focus and submission while blocking mutation outside Field.}
      - {id: invalid, name: invalid, type: 'bool | None', default: {kind: literal, value: null}, effect: Reflects application invalid state outside Field.}
      - {id: orientation, name: orientation, type: {display: '"horizontal" | "vertical"', interfaces: [CSliderOrientation]}, default: {kind: literal, value: horizontal}, effect: Selects track orientation.}
      - {id: variant, name: variant, type: {display: '"solid" | "subtle"', interfaces: [CSliderVariant]}, default: {kind: literal, value: solid}, effect: Selects visual treatment.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg"', interfaces: [CSliderSize]}, default: {kind: literal, value: md}, effect: Selects track and thumb sizing.}
      - {id: show-value, name: show_value, type: {display: '"never" | "interaction" | "always"', interfaces: [CSliderShowValue]}, default: {kind: literal, value: interaction}, effect: Controls localized value bubbles.}
      - {id: show-marks, name: show_marks, type: 'bool | None', default: {kind: derived, value: True when marks exist.}, effect: Shows or hides mark dots and labels.}
      - {id: marks, name: marks, type: 'Mapping[CSliderExact, str] | Sequence[CSliderExact] | None', default: {kind: literal, value: null}, effect: Adds up to 101 bounded step-grid marks.}
      - {id: format, name: format, type: str, default: {kind: literal, value: citry-ui-slider}, effect: Selects the named i18n number format profile for visible and accessible values.}
      - {id: class, name: class_, type: {display: 'CClassValue | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: Adds classes to the documented root and merges with attrs.}
      - {id: style, name: style, type: {display: 'CStyleValue | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: Adds styles to the documented root and merges with attrs.}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds copied allowed root attributes without replacing owned state or identity.}
      - {id: input-attrs, name: input_attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds copied allowed native-input attributes including standalone accessible naming.}

  - id: crange-slider-server-inputs
    component: CRangeSlider
    channel: server
    column_widths: [fit, 17rem, 13rem, auto]
    entries:
      - {id: value, name: value, type: {display: 'tuple[CSliderExact, CSliderExact] | None', interfaces: [CSliderExact]}, default: {kind: derived, value: '(min, max)'}, effect: Sets the initial ordered lower and upper exact values.}
      - {id: name, name: name, type: 'str | None', default: {kind: literal, value: null}, effect: Names both ordered Form entries when separate names are omitted.}
      - {id: lower-name, name: lower_name, type: 'str | None', default: {kind: literal, value: null}, effect: Names the lower Form entry when supplied together with upper_name.}
      - {id: upper-name, name: upper_name, type: 'str | None', default: {kind: literal, value: null}, effect: Names the upper Form entry when supplied together with lower_name.}
      - {id: form, name: form, type: 'str | None', default: {kind: literal, value: null}, effect: Associates both Form entries with an external Form ID.}
      - {id: id, name: id, type: 'str | None', default: {kind: generated}, effect: Sets the lower native input ID and bases the generated upper and root IDs.}
      - {id: min, name: min, type: {display: CSliderExact, interfaces: [CSliderExact]}, default: {kind: literal, value: 0}, effect: Sets the inclusive exact minimum and step-grid origin.}
      - {id: max, name: max, type: {display: CSliderExact, interfaces: [CSliderExact]}, default: {kind: literal, value: 100}, effect: Sets the inclusive exact maximum.}
      - {id: step, name: step, type: {display: CSliderExact, interfaces: [CSliderExact]}, default: {kind: literal, value: 1}, effect: Sets the positive exact grid interval.}
      - {id: large-step, name: large_step, type: {display: 'CSliderExact | None', interfaces: [CSliderExact]}, default: {kind: derived, value: Ten steps.}, effect: Sets the positive whole-step Page Up and Page Down interval.}
      - {id: min-steps-between-thumbs, name: min_steps_between_thumbs, type: int, default: {kind: literal, value: 0}, effect: Keeps this many grid intervals between fixed lower and upper thumbs.}
      - {id: disabled, name: disabled, type: 'bool | None', default: {kind: literal, value: null}, effect: Blocks focus mutation and Form participation outside Field.}
      - {id: readonly, name: readonly, type: 'bool | None', default: {kind: literal, value: null}, effect: Preserves focus and ordered submission while blocking mutation outside Field.}
      - {id: invalid, name: invalid, type: 'bool | None', default: {kind: literal, value: null}, effect: Reflects application invalid state outside Field.}
      - {id: orientation, name: orientation, type: {display: '"horizontal" | "vertical"', interfaces: [CSliderOrientation]}, default: {kind: literal, value: horizontal}, effect: Selects track orientation.}
      - {id: variant, name: variant, type: {display: '"solid" | "subtle"', interfaces: [CSliderVariant]}, default: {kind: literal, value: solid}, effect: Selects visual treatment.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg"', interfaces: [CSliderSize]}, default: {kind: literal, value: md}, effect: Selects track and thumb sizing.}
      - {id: show-value, name: show_value, type: {display: '"never" | "interaction" | "always"', interfaces: [CSliderShowValue]}, default: {kind: literal, value: interaction}, effect: Controls both localized value bubbles.}
      - {id: show-marks, name: show_marks, type: 'bool | None', default: {kind: derived, value: True when marks exist.}, effect: Shows or hides mark dots and labels.}
      - {id: marks, name: marks, type: 'Mapping[CSliderExact, str] | Sequence[CSliderExact] | None', default: {kind: literal, value: null}, effect: Adds up to 101 bounded step-grid marks.}
      - {id: format, name: format, type: str, default: {kind: literal, value: citry-ui-slider}, effect: Selects the named i18n number format profile for both values.}
      - {id: lower-label, name: lower_label, type: str, default: {kind: literal, value: Lower value}, effect: Overrides the catalog-backed lower-thumb accessible name.}
      - {id: upper-label, name: upper_label, type: str, default: {kind: literal, value: Upper value}, effect: Overrides the catalog-backed upper-thumb accessible name.}
      - {id: class, name: class_, type: {display: 'CClassValue | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: Adds classes to the documented root and merges with attrs.}
      - {id: style, name: style, type: {display: 'CStyleValue | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: Adds styles to the documented root and merges with attrs.}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds copied allowed root attributes without replacing owned state or identity.}
      - {id: lower-input-attrs, name: lower_input_attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds copied allowed attributes to the lower native input.}
      - {id: upper-input-attrs, name: upper_input_attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds copied allowed attributes to the upper native input.}

  - id: cslider-client-inputs
    component: CSlider
    channel: client
    entries:
      - {id: value, name: value, type: canonical decimal string, omitted: Releases control to the last uncontrolled value., effect: Controls the exact value while supplied.}
      - {id: min, name: min, type: canonical decimal string, omitted: Uses the server value., effect: Replaces the minimum when the resulting grid is valid.}
      - {id: max, name: max, type: canonical decimal string, omitted: Uses the server value., effect: Replaces the maximum when the resulting grid is valid.}
      - {id: step, name: step, type: positive canonical decimal string, omitted: Uses the server value., effect: Replaces the grid interval when min and max contain whole steps.}
      - {id: large-step, name: largeStep, type: positive canonical decimal string, omitted: Uses the server value., effect: Replaces the Page Up and Page Down interval.}
      - {id: disabled, name: disabled, type: boolean, omitted: Uses server or owner state., effect: Controls mutation and Form participation.}
      - {id: readonly, name: readonly, type: boolean, omitted: Uses server or owner state., effect: Controls focusable nonmutable state.}
      - {id: invalid, name: invalid, type: boolean, omitted: Uses server or Field state., effect: Controls application invalid state.}
      - {id: orientation, name: orientation, type: {display: CSliderOrientation, interfaces: [CSliderOrientation]}, omitted: Uses the server value., effect: Controls track orientation.}
      - {id: variant, name: variant, type: {display: CSliderVariant, interfaces: [CSliderVariant]}, omitted: Uses the server value., effect: Controls visual treatment.}
      - {id: size, name: size, type: {display: CSliderSize, interfaces: [CSliderSize]}, omitted: Uses the server value., effect: Controls coordinated sizing.}
      - {id: show-value, name: showValue, type: {display: CSliderShowValue, interfaces: [CSliderShowValue]}, omitted: Uses the server value., effect: Controls value-bubble visibility.}
      - {id: format, name: format, type: string, omitted: Uses the server profile., effect: Controls locale-aware visible and accessible value formatting.}
      - {id: on-value-change, name: onValueChange, type: function, omitted: No live value callback., effect: Receives each user value request.}
      - {id: on-value-change-end, name: onValueChangeEnd, type: function, omitted: No completed-interaction callback., effect: Receives each keyboard request and completed pointer gesture.}

  - id: crange-slider-client-inputs
    component: CRangeSlider
    channel: client
    entries:
      - {id: value, name: value, type: '[canonical decimal string, canonical decimal string]', omitted: Releases control to the last uncontrolled pair., effect: Controls the ordered exact pair while supplied.}
      - {id: min, name: min, type: canonical decimal string, omitted: Uses the server value., effect: Replaces the minimum when the resulting grid is valid.}
      - {id: max, name: max, type: canonical decimal string, omitted: Uses the server value., effect: Replaces the maximum when the resulting grid is valid.}
      - {id: step, name: step, type: positive canonical decimal string, omitted: Uses the server value., effect: Replaces the grid interval when min and max contain whole steps.}
      - {id: large-step, name: largeStep, type: positive canonical decimal string, omitted: Uses the server value., effect: Replaces the Page Up and Page Down interval.}
      - {id: min-steps-between-thumbs, name: minStepsBetweenThumbs, type: nonnegative integer, omitted: Uses the server value., effect: Controls the minimum lower-to-upper grid gap.}
      - {id: disabled, name: disabled, type: boolean, omitted: Uses server or owner state., effect: Controls mutation and Form participation.}
      - {id: readonly, name: readonly, type: boolean, omitted: Uses server or owner state., effect: Controls focusable nonmutable state.}
      - {id: invalid, name: invalid, type: boolean, omitted: Uses server or Field state., effect: Controls application invalid state.}
      - {id: orientation, name: orientation, type: {display: CSliderOrientation, interfaces: [CSliderOrientation]}, omitted: Uses the server value., effect: Controls track orientation.}
      - {id: variant, name: variant, type: {display: CSliderVariant, interfaces: [CSliderVariant]}, omitted: Uses the server value., effect: Controls visual treatment.}
      - {id: size, name: size, type: {display: CSliderSize, interfaces: [CSliderSize]}, omitted: Uses the server value., effect: Controls coordinated sizing.}
      - {id: show-value, name: showValue, type: {display: CSliderShowValue, interfaces: [CSliderShowValue]}, omitted: Uses the server value., effect: Controls both value bubbles.}
      - {id: format, name: format, type: string, omitted: Uses the server profile., effect: Controls locale-aware visible and accessible value formatting.}
      - {id: on-value-change, name: onValueChange, type: function, omitted: No live value callback., effect: Receives each ordered-pair request.}
      - {id: on-value-change-end, name: onValueChangeEnd, type: function, omitted: No completed-interaction callback., effect: Receives each keyboard request and completed pointer gesture.}

slots: []

events:
  - id: cslider-events
    component: CSlider
    entries:
      - id: on-value-change
        name: onValueChange
        signature: {display: '(value: string, detail: CSliderValueChangeDetail) => void', interfaces: [CSliderValueChangeDetail]}
        trigger: Each pointer-drag or keyboard value request.
        detail: {display: '{value, previousValue, controlled, source, sourceEvent, phase}', interfaces: [CSliderValueChangeDetail]}
        behavior: Uncontrolled state and native Form value update before notification; controlled state is request-only.
      - id: on-value-change-end
        name: onValueChangeEnd
        signature: {display: '(value: string, detail: CSliderValueChangeDetail) => void', interfaces: [CSliderValueChangeDetail]}
        trigger: A keyboard request or completed changed pointer gesture.
        detail: {display: '{value, previousValue, controlled, source, sourceEvent, phase}', interfaces: [CSliderValueChangeDetail]}
        behavior: Reports the final requested value once per completed interaction.
  - id: crange-slider-events
    component: CRangeSlider
    entries:
      - id: on-value-change
        name: onValueChange
        signature: {display: '(value: tuple[str, str], detail: CRangeSliderValueChangeDetail) => void', interfaces: [CRangeSliderValueChangeDetail]}
        trigger: Each lower or upper pointer-drag or keyboard pair request.
        detail: {display: '{value, previousValue, controlled, source, sourceEvent, phase, activeThumb}', interfaces: [CRangeSliderValueChangeDetail]}
        behavior: Preserves ordered stable thumb identity; controlled state is request-only.
      - id: on-value-change-end
        name: onValueChangeEnd
        signature: {display: '(value: tuple[str, str], detail: CRangeSliderValueChangeDetail) => void', interfaces: [CRangeSliderValueChangeDetail]}
        trigger: A keyboard request or completed changed pointer gesture.
        detail: {display: '{value, previousValue, controlled, source, sourceEvent, phase, activeThumb}', interfaces: [CRangeSliderValueChangeDetail]}
        behavior: Reports the final requested ordered pair once per completed interaction.

methods: []

css:
  - id: cslider-css-variables
    component: CSlider
    entries:
      - {id: track-color, name: --cui-slider-track-color, type: color, purpose: Unfilled rail color., default: Mixed CanvasText.}
      - {id: fill-color, name: --cui-slider-fill-color, type: color, purpose: Selected rail color., default: AccentColor}
      - {id: thumb-color, name: --cui-slider-thumb-color, type: color, purpose: Thumb fill., default: Canvas}
      - {id: thumb-border-color, name: --cui-slider-thumb-border-color, type: color, purpose: Thumb outline., default: AccentColor}
      - {id: focus-color, name: --cui-slider-focus-color, type: color, purpose: Keyboard focus ring., default: Highlight}
      - {id: mark-color, name: --cui-slider-mark-color, type: color, purpose: Mark dots., default: CanvasText}
      - {id: value-background, name: --cui-slider-value-background, type: color, purpose: Value-bubble background., default: CanvasText}
      - {id: value-foreground, name: --cui-slider-value-foreground, type: color, purpose: Value-bubble text., default: Canvas}
      - {id: track-size, name: --cui-slider-track-size, type: length, purpose: Rail thickness., default: 0.375rem}
      - {id: thumb-size, name: --cui-slider-thumb-size, type: length, purpose: Thumb diameter., default: 1.25rem}
      - {id: control-size, name: --cui-slider-control-size, type: length, purpose: Minimum interaction block size., default: 2.75rem}
      - {id: radius, name: --cui-slider-radius, type: length, purpose: Rail and thumb rounding., default: 999px}

attributes:
  - id: cslider-root-attributes
    component: CSlider
    entries:
      - {id: data-disabled, name: data-disabled, element: Root div, type: present | absent, meaning: Mirrors effective disabledness.}
      - {id: data-readonly, name: data-readonly, element: Root div, type: present | absent, meaning: Mirrors effective readonly state.}
      - {id: data-invalid, name: data-invalid, element: Root div, type: present | absent, meaning: Mirrors effective invalid state.}
      - {id: data-dragging, name: data-dragging, element: Root div, type: present | absent, meaning: Marks an active pointer gesture.}
      - {id: data-orientation, name: data-orientation, element: Root div, type: {display: CSliderOrientation, interfaces: [CSliderOrientation]}, meaning: Mirrors track orientation.}
      - {id: data-variant, name: data-variant, element: Root div, type: {display: CSliderVariant, interfaces: [CSliderVariant]}, meaning: Mirrors visual treatment.}
      - {id: data-size, name: data-size, element: Root div, type: {display: CSliderSize, interfaces: [CSliderSize]}, meaning: Mirrors coordinated sizing.}
      - {id: data-show-value, name: data-show-value, element: Root div, type: {display: CSliderShowValue, interfaces: [CSliderShowValue]}, meaning: Mirrors value-bubble policy.}
  - id: cslider-thumb-attributes
    component: CSlider
    entries:
      - {id: role, name: role, element: Enhanced thumb Button, type: '"slider"', meaning: Exposes slider interaction semantics.}
      - {id: aria-valuenow, name: aria-valuenow, element: Enhanced thumb Button, type: canonical decimal, meaning: Exposes the exact current value.}
      - {id: aria-valuetext, name: aria-valuetext, element: Enhanced thumb Button, type: localized string, meaning: Exposes the locale-formatted current value.}
      - {id: aria-valuemin, name: aria-valuemin, element: Enhanced thumb Button, type: canonical decimal, meaning: Exposes the current inclusive lower bound.}
      - {id: aria-valuemax, name: aria-valuemax, element: Enhanced thumb Button, type: canonical decimal, meaning: Exposes the current inclusive upper bound.}

selectors:
  - id: cslider-selectors
    component: CSlider
    entries:
      - {id: slider, selector: '[data-citry-ui-part="slider"]', element: CSlider root div, purpose: State reflections and root customization destination.}
      - {id: range-slider, selector: '[data-citry-ui-part="range-slider"]', element: CRangeSlider root div, purpose: State reflections and root customization destination.}
      - {id: native-input, selector: '[data-citry-ui-part="native-input"]', element: Native range input, purpose: No-JavaScript fallback and enhanced Form transport.}
      - {id: control, selector: '[data-citry-ui-part="control"]', element: Enhanced control div, purpose: Pointer interaction surface.}
      - {id: track, selector: '[data-citry-ui-part="track"]', element: Track div, purpose: Positions fill marks and thumbs.}
      - {id: fill, selector: '[data-citry-ui-part="fill"]', element: Fill span, purpose: Shows the selected value or interval.}
      - {id: mark, selector: '[data-citry-ui-part="mark"]', element: Mark span, purpose: Shows a configured grid position.}
      - {id: mark-label, selector: '[data-citry-ui-part="mark-label"]', element: Mark label span, purpose: Shows application-owned mark text.}
      - {id: thumb, selector: '[data-citry-ui-part="thumb"]', element: Enhanced slider Button, purpose: Keyboard focus target and draggable value owner.}
      - {id: value, selector: '[data-citry-ui-part="value"]', element: Value span, purpose: Shows the locale-formatted current value.}

interfaces:
  - id: cslider-aliases
    kind: aliases
    entries:
      - {id: exact, name: CSliderExact, definition: 'int | Decimal | str'}
      - {id: orientation, name: CSliderOrientation, definition: 'Literal["horizontal", "vertical"]'}
      - {id: variant, name: CSliderVariant, definition: 'Literal["solid", "subtle"]'}
      - {id: size, name: CSliderSize, definition: 'Literal["sm", "md", "lg"]'}
      - {id: show-value, name: CSliderShowValue, definition: 'Literal["never", "interaction", "always"]'}
      - {id: change-source, name: CSliderChangeSource, definition: 'Literal["pointer", "keyboard", "reset"]'}
      - {id: change-phase, name: CSliderChangePhase, definition: 'Literal["change", "end"]'}
      - {id: range-thumb, name: CRangeSliderThumb, definition: 'Literal["lower", "upper"]'}
      - {id: class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: style-value, name: CStyleValue, definition: 'str | Mapping[str, object] | Sequence[CStyleValue]'}
  - id: cslider-value-change-detail
    kind: record
    name: CSliderValueChangeDetail
    entries:
      - {id: value, name: value, type: canonical decimal string, meaning: Requested exact value.}
      - {id: previous-value, name: previousValue, type: canonical decimal string, meaning: Effective exact value before the interaction.}
      - {id: controlled, name: controlled, type: boolean, meaning: Whether client value owns state.}
      - {id: source, name: source, type: {display: CSliderChangeSource, interfaces: [CSliderChangeSource]}, meaning: Pointer keyboard or reset cause.}
      - {id: source-event, name: sourceEvent, type: 'object | null', meaning: Native interaction event when one exists.}
      - {id: phase, name: phase, type: {display: CSliderChangePhase, interfaces: [CSliderChangePhase]}, meaning: Live change or completed interaction.}
  - id: crange-slider-value-change-detail
    kind: record
    name: CRangeSliderValueChangeDetail
    entries:
      - {id: value, name: value, type: '[canonical decimal string, canonical decimal string]', meaning: Requested ordered exact pair.}
      - {id: previous-value, name: previousValue, type: '[canonical decimal string, canonical decimal string]', meaning: Effective ordered pair before the interaction.}
      - {id: controlled, name: controlled, type: boolean, meaning: Whether client value owns state.}
      - {id: source, name: source, type: {display: CSliderChangeSource, interfaces: [CSliderChangeSource]}, meaning: Pointer keyboard or reset cause.}
      - {id: source-event, name: sourceEvent, type: 'object | null', meaning: Native interaction event when one exists.}
      - {id: phase, name: phase, type: {display: CSliderChangePhase, interfaces: [CSliderChangePhase]}, meaning: Live change or completed interaction.}
      - {id: active-thumb, name: activeThumb, type: {display: CRangeSliderThumb, interfaces: [CRangeSliderThumb]}, meaning: Stable lower or upper thumb that requested the change.}

translations:
  - id: crange-slider-translations
    component: CRangeSlider
    entries:
      - {id: lower, key: citry-ui-range-slider-lower, purpose: Distinguishes the lower thumb and native fallback input., variables: None, override: '`lower_label`', updates: '$c-tr updates the stable hidden label; both controls reference it.'}
      - {id: upper, key: citry-ui-range-slider-upper, purpose: Distinguishes the upper thumb and native fallback input., variables: None, override: '`upper_label`', updates: '$c-tr updates the stable hidden label; both controls reference it.'}

schema_version: 1
family: popover

components:
  - CPopover

inputs:
  - id: cpopover-server-inputs
    component: CPopover
    channel: server
    column_widths: [fit, 12rem, 7rem, auto]
    entries:
      - {id: id, name: id, type: 'str | None', default: {kind: generated}, effect: 'Sets native identity and title, description, and activator relationships.'}
      - {id: open, name: open, type: bool, default: {kind: literal, value: false}, effect: Sets the server-visible initial state and uncontrolled fallback. A valid client `open` input controls later state.}
      - {id: dismissible, name: dismissible, type: bool, default: {kind: literal, value: true}, effect: 'Permits Escape, outside-pointer, and focus-outside close requests. Trigger and explicit actions remain available when false.'}
      - id: placement
        name: placement
        type: {display: '"top-start" | "top" | "top-end" | "bottom-start" | "bottom" | "bottom-end"', interfaces: [CPopoverPlacement]}
        default: {kind: literal, value: bottom-start}
        effect: Sets the preferred logical placement. Collision fallback may choose a different rendered side.
      - {id: match-width, name: match_width, type: bool, default: {kind: literal, value: false}, effect: Makes the Popover at least as wide as its activator.}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: Adds surface classes and merges them with `attrs`.}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: Adds surface inline styles and merges them with `attrs`; Citry retains anchor ownership.}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds allowed native, ARIA, Alpine, and data attributes to the Popover surface. Owned presence, semantics, focus, and relationships are rejected.'}

  - id: cpopover-client-inputs
    component: CPopover
    channel: client
    column_widths: [fit, 13rem, 12rem, auto]
    entries:
      - {id: open, name: open, type: 'boolean | null', omitted: Releases control and preserves the current committed state. `null` has the same effect., effect: Controls visible state while supplied as a Boolean. An invalid value reports once and releases control from the current state.}
      - {id: dismissible, name: dismissible, type: boolean, omitted: Uses the server input., effect: 'Controls passive Escape, outside-pointer, and focus-outside dismissal.'}
      - id: placement
        name: placement
        type: {display: '"top-start" | "top" | "top-end" | "bottom-start" | "bottom" | "bottom-end"', interfaces: [CPopoverPlacement]}
        omitted: Uses the server input.
        effect: Controls requested placement and `data-placement`.
      - {id: match-width, name: matchWidth, type: boolean, omitted: Uses the server input., effect: Controls trigger-width matching and `data-match-width`.}
      - {id: on-open-change, name: onOpenChange, type: function, omitted: Does not notify a component callback., effect: 'Receives trigger, explicit-action, passive-dismissal, and external-native visibility requests.'}

slots:
  - id: cpopover-slots
    component: CPopover
    entries:
      - id: activator
        name: activator
        required: true
        data: {display: '{activator_attrs: dict[str, object]}', interfaces: [CPopoverActivatorSlotData]}
        fallback: none
      - {id: title, name: title, required: true, data: {display: '{}', interfaces: [CPopoverTitleSlotData]}, fallback: none}
      - {id: description, name: description, required: false, data: {display: '{}', interfaces: [CPopoverDescriptionSlotData]}, fallback: 'Omitted, with no `aria-describedby`.'}
      - {id: default, name: default, required: true, data: {display: '{}', interfaces: [CPopoverDefaultSlotData]}, fallback: none}
      - id: actions
        name: actions
        required: false
        data: {display: '{close_attrs: dict[str, object]}', interfaces: [CPopoverActionsSlotData]}
        fallback: omitted

events:
  - id: cpopover-events
    component: CPopover
    entries:
      - id: on-open-change
        name: onOpenChange
        signature: {display: '(requestedOpen: boolean, detail: CPopoverOpenChangeDetail) => void', interfaces: [CPopoverOpenChangeDetail]}
        trigger: An owned activator, explicit action, Escape, outside pointer, focus outside, or external native Popover operation requests a different state.
        detail: {display: '{reason: "trigger" | "action" | "escape" | "outside" | "focus-outside" | "native" | "ancestor" | "modal", controlled: boolean, forced: boolean, source: Element | EventTarget | null}', interfaces: [CPopoverOpenChangeDetail]}
        behavior: Uncontrolled requests commit before notification. Controlled requests wait for the owner. Owner commits do not notify.

methods: []

css:
  - id: cpopover-css-variables
    component: CPopover
    entries:
      - {id: cui-popover-background, name: --cui-popover-background, type: color, purpose: Surface background., default: Canvas}
      - {id: cui-popover-foreground, name: --cui-popover-foreground, type: color, purpose: Surface text and inherited control context., default: CanvasText}
      - {id: cui-popover-border-color, name: --cui-popover-border-color, type: color, purpose: Surface boundary., default: Subtle CanvasText mix.}
      - {id: cui-popover-border-width, name: --cui-popover-border-width, type: length, purpose: Boundary width., default: 1px}
      - {id: cui-popover-radius, name: --cui-popover-radius, type: length, purpose: Surface corner radius., default: 0.75rem}
      - {id: cui-popover-shadow, name: --cui-popover-shadow, type: shadow, purpose: Top-layer elevation., default: 0 1rem 3rem rgb(15 23 42 / 22%)}
      - {id: cui-popover-inline-size, name: --cui-popover-inline-size, type: length, purpose: Preferred surface width., default: 20rem}
      - {id: cui-popover-max-inline-size, name: --cui-popover-max-inline-size, type: length, purpose: Maximum responsive width., default: calc(100dvi - 1rem)}
      - {id: cui-popover-max-block-size, name: --cui-popover-max-block-size, type: length, purpose: Maximum responsive height., default: calc(100dvb - 1rem)}
      - {id: cui-popover-padding, name: --cui-popover-padding, type: length, purpose: Region inline and edge padding., default: 1rem}
      - {id: cui-popover-gap, name: --cui-popover-gap, type: length, purpose: 'Gap between header, body, and actions.', default: 0.75rem}
      - {id: cui-popover-offset, name: --cui-popover-offset, type: length, purpose: Gap between activator and surface., default: 0.5rem}
      - {id: cui-popover-duration, name: --cui-popover-duration, type: time, purpose: Entry and exit duration; reduced motion resolves to zero., default: 140ms}
      - {id: cui-popover-easing, name: --cui-popover-easing, type: easing, purpose: Entry and exit easing., default: 'cubic-bezier(0.2, 0.8, 0.2, 1)'}
      - {id: cui-popover-focus-color, name: --cui-popover-focus-color, type: color, purpose: Surface fallback focus outline., default: Highlight}

attributes:
  - id: cpopover-attributes
    component: CPopover
    entries:
      - {id: popover, name: popover, element: Surface, type: '"manual"', meaning: Uses native top-layer presence while Citry owns dismissal and control.}
      - {id: role, name: role, element: Surface, type: '"dialog"', meaning: Identifies the named non-modal interactive surface.}
      - {id: aria-labelledby, name: aria-labelledby, element: Surface, type: IDREF, meaning: References the required visible title.}
      - {id: aria-describedby, name: aria-describedby, element: Surface, type: IDREF | absent, meaning: References the optional concise description.}
      - {id: data-open, name: data-open, element: Surface, type: present | absent, meaning: Mirrors logical visible ownership; absent during exit.}
      - {id: data-placement, name: data-placement, element: Surface, type: {display: six placement strings, interfaces: [CPopoverPlacement]}, meaning: 'Mirrors requested placement, not the collision fallback result.'}
      - {id: data-match-width, name: data-match-width, element: Surface, type: present | absent, meaning: Indicates trigger-width matching.}
      - {id: aria-haspopup, name: aria-haspopup, element: Activator Button, type: '"dialog"', meaning: Announces the kind of surface controlled by the Button.}
      - {id: aria-controls, name: aria-controls, element: Activator Button, type: IDREF, meaning: References the Popover surface.}
      - {id: aria-expanded, name: aria-expanded, element: Activator Button, type: '"true" | "false"', meaning: Mirrors logical open state.}

selectors:
  - id: cpopover-selectors
    component: CPopover
    entries:
      - {id: data-citry-ui-part-popover, selector: '[data-citry-ui-part="popover"]', element: Surface, purpose: 'Semantic root, visual surface, and attrs destination.'}
      - {id: data-citry-ui-part-header, selector: '[data-citry-ui-part="header"]', element: Header, purpose: Title and optional-description layout.}
      - {id: data-citry-ui-part-title, selector: '[data-citry-ui-part="title"]', element: Title, purpose: Required visible accessible name.}
      - {id: data-citry-ui-part-description, selector: '[data-citry-ui-part="description"]', element: Description, purpose: Optional concise supporting text.}
      - {id: data-citry-ui-part-body, selector: '[data-citry-ui-part="body"]', element: Body, purpose: Required rich interactive content region.}
      - {id: data-citry-ui-part-actions, selector: '[data-citry-ui-part="actions"]', element: Actions, purpose: Optional explicit-action row.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-cpopover-placement, name: CPopoverPlacement, definition: 'Literal["top-start", "top", "top-end", "bottom-start", "bottom", "bottom-end"]'}
  - id: cpopover-activator-slot-data
    kind: record
    name: CPopoverActivatorSlotData
    entries:
      - {id: activator-attrs, name: activator_attrs, type: 'dict[str, object]', meaning: 'Owned trigger marker, CSS anchor, `aria-haspopup`, `aria-controls`, and synchronized `aria-expanded`.'}
  - {id: cpopover-title-slot-data, kind: record, name: CPopoverTitleSlotData, entries: []}
  - {id: cpopover-description-slot-data, kind: record, name: CPopoverDescriptionSlotData, entries: []}
  - {id: cpopover-default-slot-data, kind: record, name: CPopoverDefaultSlotData, entries: []}
  - id: cpopover-actions-slot-data
    kind: record
    name: CPopoverActionsSlotData
    entries:
      - {id: close-attrs, name: close_attrs, type: 'dict[str, object]', meaning: Marks an explicit action control as a close request.}
  - id: cpopover-open-change-detail
    kind: record
    name: CPopoverOpenChangeDetail
    entries:
      - {id: reason, name: reason, type: '"trigger" | "action" | "escape" | "outside" | "focus-outside" | "native" | "ancestor" | "modal"', meaning: Source of the requested visibility change.}
      - {id: controlled, name: controlled, type: boolean, meaning: Whether a valid client `open` Boolean currently owns state.}
      - {id: forced, name: forced, type: boolean, meaning: Whether structural or modal safety required the component to close regardless of controlled ownership.}
      - {id: source, name: source, type: 'Element | EventTarget | null', meaning: Browser source associated with the request.}

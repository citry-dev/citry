schema_version: 1
family: textarea

components:
  - CTextarea

inputs:
  - id: ctextarea-server-inputs
    component: CTextarea
    channel: server
    column_widths: [fit, 13rem, 9rem, auto]
    entries:
      - {id: name, name: name, type: 'non-empty str | None', default: {kind: literal, value: null}, effect: Sets the native submitted name; an unnamed Textarea contributes no `FormData` entry.}
      - {id: id, name: id, type: 'str | None', default: {kind: generated}, effect: 'Uses the Field control ID when composed, otherwise sets or generates native identity.'}
      - {id: value, name: value, type: 'str | None', default: {kind: literal, value: null}, effect: 'Sets LF-normalized, escaped native child text as the initial value and reset default.'}
      - {id: rows, name: rows, type: 'positive int', default: {kind: literal, value: 4}, effect: Sets the initial visible line count.}
      - {id: cols, name: cols, type: 'positive int | None', default: {kind: literal, value: null}, effect: Sets the native preferred character width and is required by hard wrapping; CSS still owns rendered inline size.}
      - id: wrap
        name: wrap
        type: {display: '"soft" | "hard"', interfaces: [CTextareaWrap]}
        default: {kind: literal, value: soft}
        effect: Selects native submission wrapping; hard requires cols.
      - {id: required, name: required, type: 'bool | None', default: {kind: literal, value: null}, effect: 'Sets native required state when standalone; omit it inside `CField`, which owns the state.'}
      - {id: disabled, name: disabled, type: 'bool | None', default: {kind: literal, value: null}, effect: 'Sets local disabled state when standalone; disabled `CForm` always wins.'}
      - {id: readonly, name: readonly, type: 'bool | None', default: {kind: derived, display: Inherits `CForm` when standalone.}, effect: 'Sets read-only state when standalone; omit it inside `CField`.'}
      - {id: invalid, name: invalid, type: 'bool | None', default: {kind: literal, value: null}, effect: 'Sets application invalid state when standalone; omit it inside `CField`.'}
      - {id: autocomplete, name: autocomplete, type: 'str | None', default: {kind: literal, value: null}, effect: Sets the native autofill hint.}
      - {id: inputmode, name: inputmode, type: 'str | None', default: {kind: literal, value: null}, effect: Sets the native virtual-keyboard hint.}
      - {id: placeholder, name: placeholder, type: 'str | None', default: {kind: literal, value: null}, effect: Sets short hint text; it does not replace a label.}
      - id: variant
        name: variant
        type: {display: '"outline" | "filled" | "plain"', interfaces: [CTextareaVariant]}
        default: {kind: literal, value: outline}
        effect: Selects presentation.
      - id: size
        name: size
        type: {display: '"sm" | "md" | "lg"', interfaces: [CTextareaSize]}
        default: {kind: literal, value: md}
        effect: Selects padding, text size, and line geometry.
      - id: resize
        name: resize
        type: {display: '"none" | "vertical" | "horizontal" | "both"', interfaces: [CTextareaResize]}
        default: {kind: literal, value: vertical}
        effect: Selects the native CSS resize policy; horizontal and both may overflow a narrow container.
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds native-root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds native-root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds native constraints, ARIA, data, and trusted Alpine attributes not owned by explicit inputs.'}

  - id: ctextarea-client-inputs
    component: CTextarea
    channel: client
    column_widths: [fit, 13rem, 13rem, auto]
    entries:
      - {id: value, name: value, type: string, omitted: Releases control and preserves the current native value., effect: Controls the LF-normalized native current value while supplied; an invalid value retains the prior valid controlled value.}
      - {id: rows, name: rows, type: 'positive integer', omitted: Uses the server input., effect: Controls the native rows property; invalid values use the server fallback.}
      - {id: required, name: required, type: boolean, omitted: Uses the server value., effect: 'Controls required state when standalone; `CField` owns it when composed.'}
      - {id: disabled, name: disabled, type: boolean, omitted: Uses the server value., effect: 'Controls local disabled state when standalone; disabled `CForm` always wins.'}
      - {id: readonly, name: readonly, type: boolean, omitted: Uses the server or reactive Form value., effect: 'Controls read-only state when standalone; `CField` owns it when composed.'}
      - {id: invalid, name: invalid, type: boolean, omitted: Uses the server value., effect: 'Controls application invalid state when standalone; native invalidity still combines with it.'}
      - id: variant
        name: variant
        type: {display: '"outline" | "filled" | "plain"', interfaces: [CTextareaVariant]}
        omitted: Uses the server input.
        effect: Controls presentation.
      - id: size
        name: size
        type: {display: '"sm" | "md" | "lg"', interfaces: [CTextareaSize]}
        omitted: Uses the server input.
        effect: Controls padding and text geometry.
      - id: resize
        name: resize
        type: {display: '"none" | "vertical" | "horizontal" | "both"', interfaces: [CTextareaResize]}
        omitted: Uses the server input.
        effect: Controls the native CSS resize policy.

slots: []
events: []
methods: []

css:
  - id: ctextarea-css-variables
    component: CTextarea
    entries:
      - {id: cui-textarea-background, name: --cui-textarea-background, type: color, purpose: Native root background., default: 'Canvas, variant adjusted'}
      - {id: cui-textarea-foreground, name: --cui-textarea-foreground, type: color, purpose: Entered text., default: CanvasText}
      - {id: cui-textarea-border-color, name: --cui-textarea-border-color, type: color, purpose: Resting border., default: 'Subtle CanvasText mix, variant adjusted'}
      - {id: cui-textarea-hover-border-color, name: --cui-textarea-hover-border-color, type: color, purpose: Hover border., default: Stronger CanvasText mix.}
      - {id: cui-textarea-focus-color, name: --cui-textarea-focus-color, type: color, purpose: Focus outline and border., default: Highlight}
      - {id: cui-textarea-invalid-border-color, name: --cui-textarea-invalid-border-color, type: color, purpose: Invalid border., default: Scheme-aware negative color.}
      - {id: cui-textarea-disabled-background, name: --cui-textarea-disabled-background, type: color, purpose: Disabled background., default: Subtle CanvasText/Canvas mix.}
      - {id: cui-textarea-placeholder-color, name: --cui-textarea-placeholder-color, type: color, purpose: Placeholder text., default: Muted CanvasText mix.}
      - {id: cui-textarea-radius, name: --cui-textarea-radius, type: length, purpose: Corner radius., default: '0.5rem; 0 for plain'}
      - {id: cui-textarea-inline-padding, name: --cui-textarea-inline-padding, type: length, purpose: Logical inline padding., default: Size-derived length.}
      - {id: cui-textarea-block-padding, name: --cui-textarea-block-padding, type: length, purpose: Logical block padding., default: Size-derived length.}
      - {id: cui-textarea-font-size, name: --cui-textarea-font-size, type: length, purpose: Editing text size., default: Size-derived length.}
      - {id: cui-textarea-line-height, name: --cui-textarea-line-height, type: 'number | length', purpose: Editing line height and row geometry., default: '1.5'}

attributes:
  - id: ctextarea-attributes
    component: CTextarea
    entries:
      - {id: data-required, name: data-required, element: Native Textarea, type: 'present | absent', meaning: Mirrors effective required state.}
      - {id: data-disabled, name: data-disabled, element: Native Textarea, type: 'present | absent', meaning: Mirrors effective disabled state.}
      - {id: data-readonly, name: data-readonly, element: Native Textarea, type: 'present | absent', meaning: Mirrors effective read-only state.}
      - {id: data-invalid, name: data-invalid, element: Native Textarea, type: 'present | absent', meaning: Mirrors combined application and native invalid state.}
      - {id: data-variant, name: data-variant, element: Native Textarea, type: '"outline" | "filled" | "plain"', meaning: Mirrors effective presentation variant.}
      - {id: data-size, name: data-size, element: Native Textarea, type: '"sm" | "md" | "lg"', meaning: Mirrors effective visual size.}
      - {id: data-resize, name: data-resize, element: Native Textarea, type: '"none" | "vertical" | "horizontal" | "both"', meaning: Mirrors the effective native CSS resize policy.}

selectors:
  - id: ctextarea-selectors
    component: CTextarea
    entries:
      - {id: textarea, selector: '[data-citry-ui-part="textarea"]', element: Native Textarea, purpose: 'Stable root, styling hook, and `attrs` destination.'}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-ctextarea-variant, name: CTextareaVariant, definition: 'Literal["outline", "filled", "plain"]'}
      - {id: input-type-aliases-ctextarea-size, name: CTextareaSize, definition: 'Literal["sm", "md", "lg"]'}
      - {id: input-type-aliases-ctextarea-resize, name: CTextareaResize, definition: 'Literal["none", "vertical", "horizontal", "both"]'}
      - {id: input-type-aliases-ctextarea-wrap, name: CTextareaWrap, definition: 'Literal["soft", "hard"]'}

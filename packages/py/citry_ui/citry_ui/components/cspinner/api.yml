schema_version: 1
family: spinner

components:
  - CSpinner

inputs:
  - id: cspinner-server-inputs
    component: CSpinner
    channel: server
    column_widths: [fit, 15rem, 7rem, auto]
    entries:
      - {id: label, name: label, type: str, default: {kind: required}, effect: Sets the required nonempty accessible task name.}
      - {id: intent, name: intent, type: {display: '"neutral" | "primary" | "success" | "warn" | "danger"', interfaces: [CSpinnerIntent]}, default: {kind: literal, value: primary}, effect: Selects the visual ring palette; surrounding text still carries meaning.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg"', interfaces: [CSpinnerSize]}, default: {kind: literal, value: md}, effect: Sets ring diameter and default thickness.}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds copied trusted nonconflicting metadata, description relationships, visibility, and targeted Alpine attributes to the Spinner root.'}
  - id: cspinner-client-inputs
    component: CSpinner
    channel: client
    column_widths: [fit, 15rem, 7rem, auto]
    entries:
      - {id: label, name: label, type: string, omitted: Uses the server fallback., effect: Controls the nonempty accessible task name; omission returns to server fallback.}
      - {id: intent, name: intent, type: '"neutral" | "primary" | "success" | "warn" | "danger"', omitted: Uses the server fallback., effect: Controls the public visual palette reflection.}
      - {id: size, name: size, type: '"sm" | "md" | "lg"', omitted: Uses the server fallback., effect: Controls the public size reflection.}

slots: []
events: []
methods: []

css:
  - id: cspinner-css-variables
    component: CSpinner
    entries:
      - {id: cui-spinner-color, name: --cui-spinner-color, type: color, purpose: Active ring arc., default: Intent-derived color.}
      - {id: cui-spinner-track-color, name: --cui-spinner-track-color, type: color, purpose: Quiet remainder of the ring., default: Current color mixed with transparency.}
      - {id: cui-spinner-size, name: --cui-spinner-size, type: length, purpose: Ring diameter., default: Size-derived length.}
      - {id: cui-spinner-thickness, name: --cui-spinner-thickness, type: length, purpose: Ring border width., default: Size-derived length.}
      - {id: cui-spinner-duration, name: --cui-spinner-duration, type: time, purpose: One rotation duration when motion is allowed., default: 0.75s.}

attributes:
  - id: cspinner-attributes
    component: CSpinner
    entries:
      - {id: role, name: role, element: Root, type: '"progressbar"', meaning: Exposes an indeterminate progress indicator.}
      - {id: aria-label, name: aria-label, element: Root, type: nonempty string, meaning: Carries the required accessible task name.}
      - {id: data-intent, name: data-intent, element: Root, type: '"neutral" | "primary" | "success" | "warn" | "danger"', meaning: Reflects the effective visual palette.}
      - {id: data-size, name: data-size, element: Root, type: '"sm" | "md" | "lg"', meaning: Reflects effective diameter and default thickness.}

selectors:
  - id: cspinner-selectors
    component: CSpinner
    entries:
      - {id: data-citry-ui-part-spinner, selector: '[data-citry-ui-part="spinner"]', element: Spinner root, purpose: Stable public root and `attrs` destination.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-cspinner-intent, name: CSpinnerIntent, definition: 'Literal["neutral", "primary", "success", "warn", "danger"]'}
      - {id: input-type-aliases-cspinner-size, name: CSpinnerSize, definition: 'Literal["sm", "md", "lg"]'}

translations: []

# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

#
# Two settings appear on the noisy ecosystems below and are worth knowing about.
#
# `open-pull-requests-limit` raises Dependabot's default of 5 open pull requests
# per ecosystem. At the default, npm and github-actions both sat at exactly 5
# and the rest of their queue stayed invisible, so the list of outstanding
# updates looked shorter than it was.
#
# `groups` collects related updates into one pull request instead of one per
# dependency. Storybook ships its packages in lockstep, so five separate pull
# requests all moved the same manifest to the same version.
#
# Every `ignore` below lists the three `version-update:semver-*` types rather
# than naming the dependency alone. A bare `dependency-name` suppresses security
# updates as well as version updates, which would hide the one kind of proposal
# always worth reading. Naming the version-update types keeps routine bumps
# quiet while a published advisory still opens a pull request.
version: 2
updates:
  ######################################
  # ROOT / TOOLING
  ######################################

  # Rust workspace (all crates share dependencies from root Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python - root pyproject.toml (tooling dependencies)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One pull request for all development dependencies. They are tooling, not
      # anything a user installs, so they are reviewed together and kept current.
      dev-dependencies:
        dependency-type: "development"

  # JS - root package.json (the pinned pyright the check gate runs; pnpm lockfile).
  # This one entry reaches every pnpm workspace member listed in
  # pnpm-workspace.yaml, so a workspace package needs no entry of its own.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Both pins follow from the VS Code extension's `engines.vscode`, which
    # declares the oldest editor it supports. They move when that decision moves,
    # in the same change, not on their own. The reasoning is in
    # packages/editors/vscode/README.md.
    ignore:
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      # Storybook releases its packages together, so they update together.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      # Everything else that stays on its major line. A patch or minor bump of a
      # dev tool is rarely worth reviewing one at a time.
      js-minor-and-patch:
        exclude-patterns:
          - "storybook"
          - "@storybook/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: github-actions
    # This actually targets ./.github/workflows/
    # See https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # Workflow action bumps are reviewed as one change to CI, not five.
      github-actions:
        patterns:
          - "*"

  ######################################
  # PYTHON PACKAGES
  ######################################

  - package-ecosystem: "pip"
    directory: "packages/py/citry_core"
    schedule:
      interval: weekly
    groups:
      # One pull request for all development dependencies. They are tooling, not
      # anything a user installs, so they are reviewed together and kept current.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "packages/py/citry"
    schedule:
      interval: weekly
    groups:
      # One pull request for all development dependencies. They are tooling, not
      # anything a user installs, so they are reviewed together and kept current.
      dev-dependencies:
        dependency-type: "development"
    # Both of these are runtime dependencies, so their floors say what a user
    # must install, not what this repo develops against. Each is set to the
    # lowest version that actually works and the reason is recorded beside the
    # dependency in pyproject.toml, so a proposal to raise them is noise.
    ignore:
      - dependency-name: "wrapt"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "typing-extensions"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "markupsafe"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "pip"
    directory: "packages/py/citry_lsp"
    schedule:
      interval: weekly
    groups:
      # One pull request for all development dependencies. They are tooling, not
      # anything a user installs, so they are reviewed together and kept current.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "packages/py/citry_ui"
    schedule:
      interval: weekly
    groups:
      # One pull request for all development dependencies. They are tooling, not
      # anything a user installs, so they are reviewed together and kept current.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "packages/py/pygments_citry"
    schedule:
      interval: weekly
    groups:
      # One pull request for all development dependencies. They are tooling, not
      # anything a user installs, so they are reviewed together and kept current.
      dev-dependencies:
        dependency-type: "development"

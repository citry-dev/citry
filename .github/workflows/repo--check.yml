# The project gate: runs the full check suite (scripts/check.py) in one job.
# This is the single source of truth for "does everything pass" - formatting,
# lints, types, the custom validators, and a single-environment test pass. The
# per-language matrix workflows (rust--tests.yml, py--tests.yml) add cross
# version/OS test breadth on top of this.
name: Check

on:
  # No path filters: the gate runs on every change.
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
    # `closed` starts a run in this PR's concurrency group, which cancels the
    # PR's queued or running checks once it merges or closes; every job
    # skips on that event, so the cancelling run needs no runner.
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A newer run cancels an older one for the same pull request. A push or any
# other run gets a group named after its own run ID, so no newer run cancels
# it. Every commit on main then keeps a complete Check result, which release
# step 5 in docs/codebase.md relies on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# The gate checks out and reads the repository and writes nothing back.
permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # Rust is needed for the cargo fmt/clippy/test phases.
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Reuses the citry-core wheel built from these exact Rust sources by any
      # earlier run, and builds it only when no cached wheel matches. The
      # cache step above already saves the target folder, so the action does
      # not add a second Rust cache.
      - name: Restore or build the citry-core wheel
        id: core
        uses: ./.github/actions/citry-core-wheel
        with:
          cache-rust: "false"

      # Syncs the locked workspace with every package's dev group, leaving out
      # the editable citry-core, then installs the wheel in its place.
      - name: Install the workspace
        env:
          CORE_WHEEL_DIR: ${{ steps.core.outputs.wheel-dir }}
          CORE_WHEEL_CACHE_KEY: ${{ steps.core.outputs.cache-key }}
        run: >-
          python scripts/citry_core_wheel.py install
          --wheel-dir "$CORE_WHEEL_DIR"
          --cache-key "$CORE_WHEEL_CACHE_KEY"
          -- --all-packages

      # Node runs the gate's pinned pyright, the package-local checks for the
      # protocol packages, client, docs playground, and VS Code extension, and
      # Vue's own server renderer for the Vue render parity phase. Only
      # this full-gate workflow runs check.py, so Node is set up here rather
      # than in each per-language test workflow.
      # pnpm goes first: setup-node's pnpm cache needs the pnpm binary. The
      # action reads the pinned pnpm version from package.json's packageManager
      # field, so the pin lives in one place.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # A current LTS line supported by the pinned workspace tools.
          node-version: "22"
          cache: "pnpm"

      - name: Install the Node workspace
        run: pnpm install --frozen-lockfile

      # The whole gate in one command: cargo fmt/clippy/test, ruff check/format,
      # mypy, pyright, package-local Node checks, pytest, the Vue render parity
      # check over the pages that pytest run recorded, and the custom
      # validators. Runs every phase then reports.
      - name: Run the check suite
        run: python scripts/check.py --profile full

      # Run the Vue client and Events package checks directly as well as through
      # check.py. `always()` preserves check.py's run-every-phase diagnostic
      # behavior when an earlier phase fails.
      - name: Check the Vue client package directly
        if: always()
        run: pnpm --dir packages/js/citry-client run check

      - name: Validate the Events protocol package directly
        if: always()
        run: python -S packages/protocol/events/v1/validate.py

      - name: Check protocol conformance data directly
        if: always()
        run: >-
          uv run --no-sync python -m packages.protocol._tooling.check
          packages/protocol/events/v1

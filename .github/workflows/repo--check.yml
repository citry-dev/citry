# The project gate: runs the full check suite (scripts/check.py) in one job.
# This is the single source of truth for "does everything pass" - formatting,
# lints, types, the custom validators, and a single-environment test pass. The
# per-language matrix workflows (rust--tests.yml, py--tests.yml) add cross
# version/OS test breadth on top of this.
name: Check

on:
  # No path filters: the gate runs on every change.
  push:
    branches:
      - "main"
      - "dev"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Rust is needed for the cargo fmt/clippy/test phases and to build the
      # citry_core extension during `uv sync`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # NOTE: keep in step with rust-toolchain.toml
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the workspace
        run: uv sync --locked --all-packages

      # Node runs the gate's pinned pyright and package-local checks for the
      # protocol packages, client, docs playground, and VS Code extension. Only
      # this full-gate workflow runs check.py, so Node is set up here rather
      # than in each per-language test workflow.
      # pnpm goes first: setup-node's pnpm cache needs the pnpm binary. The
      # action reads the pinned pnpm version from package.json's packageManager
      # field, so the pin lives in one place.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # A current LTS line supported by the pinned workspace tools.
          node-version: "22"
          cache: "pnpm"

      - name: Install the Node workspace
        run: pnpm install --frozen-lockfile

      # The whole gate in one command: cargo fmt/clippy/test, ruff check/format,
      # mypy, pyright, package-local Node checks, pytest, and the custom
      # validators. Runs every phase then reports.
      - name: Run the check suite
        run: python scripts/check.py

      # Run the package's CLI directly as well as through pytest. `-S` hides
      # installed site packages, exercising its standard-library schema checker.
      # `always()` preserves check.py's run-every-phase diagnostic behavior.
      - name: Validate the client graph protocol package directly
        if: always()
        run: python -S packages/protocol/client_graph/v1/validate.py

      - name: Validate the Events protocol package directly
        if: always()
        run: python -S packages/protocol/events/v1/validate.py

      - name: Check protocol conformance data directly
        if: always()
        run: >-
          uv run --no-sync python -m packages.protocol._tooling.check
          packages/protocol/events/v1 packages/protocol/client_graph/v1

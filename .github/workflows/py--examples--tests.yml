name: Python example projects

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "examples/**"
      - "packages/py/citry/**"
      - "packages/py/citry_core/**"
      - "packages/js/citry-client/**"
      - "packages/protocol/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "uv.lock"
      - ".github/workflows/py--examples--tests.yml"
  pull_request:
    paths:
      - "examples/**"
      - "packages/py/citry/**"
      - "packages/py/citry_core/**"
      - "packages/js/citry-client/**"
      - "packages/protocol/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "uv.lock"
      - ".github/workflows/py--examples--tests.yml"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      public_release:
        description: "Qualify frozen projects directly from their public-index locks"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-copy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build candidate wheels
        if: github.event_name != 'workflow_dispatch' || !inputs.public_release
        run: |
          uv build --wheel --python "${{ matrix.python-version }}" --out-dir dist/example-wheels packages/py/citry_core
          uv build --wheel --python "${{ matrix.python-version }}" --out-dir dist/example-wheels packages/py/citry

      - name: Install qualification tools
        run: |
          uv venv .example-tools --python "${{ matrix.python-version }}"
          uv pip install --python .example-tools/bin/python pytest==9.1.1 "tomli==2.3.0; python_version < '3.11'"

      - name: Validate the catalog and archives
        run: .example-tools/bin/python -m pytest examples/tests -q

      - name: Qualify clean copies against candidate wheels
        if: github.event_name != 'workflow_dispatch' || !inputs.public_release
        shell: bash
        run: |
          wheel_args=()
          for wheel in dist/example-wheels/*.whl; do
            wheel_args+=(--wheel "$wheel")
          done
          .example-tools/bin/python -m examples._internal.qualify \
            --python "${{ matrix.python-version }}" \
            "${wheel_args[@]}"

      - name: Qualify clean copies from public-index locks
        if: github.event_name == 'workflow_dispatch' && inputs.public_release
        run: >-
          .example-tools/bin/python -m examples._internal.qualify
          --python "${{ matrix.python-version }}"

      - name: Build deterministic archives
        if: matrix.python-version == '3.14'
        run: .example-tools/bin/python -m examples._internal.archive --output dist/examples

      - name: Upload example archives
        if: matrix.python-version == '3.14' && !inputs.public_release
        uses: actions/upload-artifact@v7
        with:
          name: citry-example-projects
          path: dist/examples/
          if-no-files-found: error

      - name: Upload public-release example evidence
        if: matrix.python-version == '3.14' && github.event_name == 'workflow_dispatch' && inputs.public_release
        uses: actions/upload-artifact@v7
        with:
          name: citry-example-projects-public
          path: dist/examples/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium", "firefox", "webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the pinned accessibility runtime
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Build candidate wheels
        if: github.event_name != 'workflow_dispatch' || !inputs.public_release
        run: |
          uv build --wheel --python 3.14 --out-dir dist/example-wheels packages/py/citry_core
          uv build --wheel --python 3.14 --out-dir dist/example-wheels packages/py/citry

      - name: Install qualification tools and browser
        run: |
          uv venv .example-tools --python 3.14
          uv pip install --python .example-tools/bin/python playwright==1.62.0
          .example-tools/bin/python -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Run all Chromium journeys
        if: github.event_name != 'schedule' && !inputs.public_release
        shell: bash
        run: |
          wheel_args=()
          for wheel in dist/example-wheels/*.whl; do
            wheel_args+=(--wheel "$wheel")
          done
          .example-tools/bin/python -m examples._internal.qualify \
            --python 3.14 \
            --browser "${{ matrix.browser }}" \
            "${wheel_args[@]}"

      - name: Run all Chromium journeys from public-index locks
        if: github.event_name == 'workflow_dispatch' && inputs.public_release
        run: >-
          .example-tools/bin/python -m examples._internal.qualify
          --python 3.14
          --browser "${{ matrix.browser }}"

      - name: Run weekly golden cross-browser journeys
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          wheel_args=()
          for wheel in dist/example-wheels/*.whl; do
            wheel_args+=(--wheel "$wheel")
          done
          .example-tools/bin/python -m examples._internal.qualify \
            --python 3.14 \
            --browser "${{ matrix.browser }}" \
            --project starter-standalone \
            --project starter-fastapi \
            --project demo-project-board \
            --project demo-htmx \
            "${wheel_args[@]}"

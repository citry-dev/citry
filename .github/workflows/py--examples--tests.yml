name: Python example projects

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "examples/**"
      - "packages/py/citry/**"
      - "packages/py/citry_core/**"
      - "packages/js/citry-client/**"
      - "packages/protocol/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "uv.lock"
      - ".github/workflows/py--examples--tests.yml"
      - "scripts/build_constraints.py"
  pull_request:
    # `closed` starts a run in this PR's concurrency group, which cancels the
    # PR's queued or running checks once it merges or closes; every job
    # skips on that event, so the cancelling run needs no runner.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "examples/**"
      - "packages/py/citry/**"
      - "packages/py/citry_core/**"
      - "packages/js/citry-client/**"
      - "packages/protocol/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "uv.lock"
      - ".github/workflows/py--examples--tests.yml"
      - "scripts/build_constraints.py"
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

env:
  # Test the examples with the compiler the citry-core release wheels are
  # built with: the minimum Rust version that Cargo.toml declares. It is set
  # here as well as in the setup step because these jobs build inside the
  # checkout, where rust-toolchain.toml would otherwise select the
  # development nightly.
  RUSTUP_TOOLCHAIN: "1.96.0"

jobs:
  clean-copy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build candidate wheels
        run: |
          uv build --wheel --python "${{ matrix.python-version }}" --out-dir dist/example-wheels packages/py/citry_core
          uv build --wheel --python "${{ matrix.python-version }}" --out-dir dist/example-wheels packages/py/citry

      - name: Install qualification tools
        run: |
          uv venv .example-tools --python "${{ matrix.python-version }}"
          uv pip install --python .example-tools/bin/python pytest==9.1.1

      - name: Validate the catalog and archives
        run: .example-tools/bin/python -m pytest examples/tests -q

      - name: Qualify clean copies against candidate wheels
        shell: bash
        run: |
          wheel_args=()
          for wheel in dist/example-wheels/*.whl; do
            wheel_args+=(--wheel "$wheel")
          done
          .example-tools/bin/python -m examples._internal.qualify \
            --python "${{ matrix.python-version }}" \
            "${wheel_args[@]}"

      - name: Build deterministic archives
        if: matrix.python-version == '3.14'
        run: .example-tools/bin/python -m examples._internal.archive --output dist/examples

      - name: Upload example archives
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: citry-example-projects
          path: dist/examples/
          if-no-files-found: error

  browser:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium", "firefox", "webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the pinned accessibility runtime
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Build candidate wheels
        run: |
          uv build --wheel --python 3.14 --out-dir dist/example-wheels packages/py/citry_core
          uv build --wheel --python 3.14 --out-dir dist/example-wheels packages/py/citry

      - name: Install qualification tools and browser
        run: |
          uv venv .example-tools --python 3.14
          uv pip install --python .example-tools/bin/python playwright==1.64.1
          .example-tools/bin/python -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Run all Chromium journeys
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          wheel_args=()
          for wheel in dist/example-wheels/*.whl; do
            wheel_args+=(--wheel "$wheel")
          done
          .example-tools/bin/python -m examples._internal.qualify \
            --python 3.14 \
            --browser "${{ matrix.browser }}" \
            "${wheel_args[@]}"

      - name: Run weekly golden cross-browser journeys
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          wheel_args=()
          for wheel in dist/example-wheels/*.whl; do
            wheel_args+=(--wheel "$wheel")
          done
          .example-tools/bin/python -m examples._internal.qualify \
            --python 3.14 \
            --browser "${{ matrix.browser }}" \
            --project starter-standalone \
            --project starter-fastapi \
            --project demo-project-board \
            --project demo-htmx \
            "${wheel_args[@]}"

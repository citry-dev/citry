# Run tests for all Rust packages
name: Rust tests

on:
  push:
    branches:
      - "main"
      - "dev"
    # Run only when an input to this Cargo test matrix changes.
    paths:
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/install-rust/**"
      - ".github/workflows/rust--tests.yml"
      - ".gitmodules"
  pull_request:
    # `closed` starts a run in this PR's concurrency group, which cancels the
    # PR's queued or running checks once it merges or closes; every job
    # skips on that event, so the cancelling run needs no runner.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/install-rust/**"
      - ".github/workflows/rust--tests.yml"
      - ".gitmodules"
  workflow_dispatch:

# A newer run cancels an older one for the same pull request, or for the same
# branch when both come from a push. Any other run gets a group named after
# its own run ID, so no newer run cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'push' }}
jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive

      # Install Rust deps
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Run Rust tests
      - name: Run Rust tests
        shell: bash
        run: |
          # Build cargo test command with -p flags for each package
          # We do so because the ruff submodule also contains crates and those will
          # run if we don't limit the tests to only our packages.
          # And `cargo test` command doesn't allow to exclude crates based on patterns.
          #
          # 1. Get all directories in our `crates/` folder
          packages=$(find crates -maxdepth 1 -mindepth 1 -type d | \
            sed 's/crates\///' | \
            tr '\n' ' ')
          echo "Running tests for packages: $packages"
          # 2. Format as `cargo test -p <package> -p <package> ...`
          cargo test $(echo "$packages" | sed 's/\([^ ]*\)/-p \1/g')

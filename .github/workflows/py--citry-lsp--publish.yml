# Qualify and publish the pure-Python citry-lsp package.
#
# The repository release controller qualifies an exact artifact pair, then
# sends that retained bundle back here for Trusted Publishing.
name: Publish citry-lsp to PyPI
run-name: >-
  ${{ inputs.operation == 'promote'
      && format('Publish citry-lsp for candidate {0}', inputs.candidate_id)
      || format('Qualify citry-lsp for candidate {0}', inputs.candidate_id) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [qualify, promote]
      release_commit:
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      workspace_dependencies:
        required: false
        type: string
      qualification_run_id:
        required: false
        type: string
      qualification_artifact_id:
        required: false
        type: string
      qualification_artifact_digest:
        required: false
        type: string

permissions:
  contents: read

env:
  PROJECT_DIR: packages/py/citry_lsp
  SOURCE_DATE_EPOCH: "315532800"
  UV_VERSION: "0.10.12"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - name: Read the qualified package version
        id: package-version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          # Bind qualification's checkout to GitHub's authenticated run SHA.
          if [ "$OPERATION" = "qualify" ]; then test "$GITHUB_SHA" = "$RELEASE_COMMIT"; fi
          pkg_version=$(grep -m1 '^version' "$PROJECT_DIR/pyproject.toml" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ inputs.operation == 'qualify' }}
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the wheel and source distribution
        run: uv build --package citry-lsp --out-dir dist
      - name: Build selected workspace dependencies for candidate smoke tests
        if: inputs.workspace_dependencies != ''
        shell: bash
        run: |
          selected=",${{ inputs.workspace_dependencies }},"
          mkdir -p candidate-dependencies
          if [[ "$selected" == *,citry-core,* ]]; then
            git submodule update --init --recursive
            uv build --package citry-core --wheel --out-dir candidate-dependencies
          fi
          if [[ "$selected" == *,citry,* ]]; then
            uv build --package citry --wheel --out-dir candidate-dependencies
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: raw-citry-lsp-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: inputs.workspace_dependencies != ''
        with:
          name: candidate-citry-lsp-dependencies
          path: candidate-dependencies/*.whl
          if-no-files-found: error

  smoke-python:
    if: ${{ inputs.operation == 'qualify' }}
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-lsp-distributions
          path: dist
      - uses: actions/download-artifact@v8
        if: inputs.workspace_dependencies != ''
        with:
          name: candidate-citry-lsp-dependencies
          path: candidate-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Rebuild the sdist and smoke the public dependency closure
        if: inputs.workspace_dependencies == ''
        run: python scripts/verify_citry_lsp_distribution.py --dist-dir dist
      - name: Rebuild the sdist and smoke the selected dependency closure
        if: inputs.workspace_dependencies != ''
        run: >-
          python scripts/verify_citry_lsp_distribution.py
          --dist-dir dist
          --dependency-wheel-dir candidate-dependencies

  verify-distributions:
    if: ${{ inputs.operation == 'qualify' }}
    needs: [verify-version, build, smoke-python]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-lsp-distributions
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Verify and stage the closed release pair
        run: >-
          python scripts/verify_citry_lsp_distribution.py
          --dist-dir dist
          --skip-install-smoke
          --stage-output-dir verified
      - name: Check package-index rendering metadata
        run: uvx --from twine==6.2.0 twine check verified/*.whl verified/*.tar.gz
      - name: Attest the qualified build outputs
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            verified/*.whl
            verified/*.tar.gz
            verified/release-inventory.json
      - name: Upload the only bundle the release controller may promote
        uses: actions/upload-artifact@v7
        with:
          name: verified-citry-lsp-distributions
          path: verified
          if-no-files-found: error
          retention-days: 30

  select-qualification:
    name: Verify the selected candidate artifact
    if: ${{ inputs.operation == 'promote' }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ inputs.qualification_run_id }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.qualification_run_id }}
      artifact_id: ${{ inputs.qualification_artifact_id }}
      artifact_digest: ${{ inputs.qualification_artifact_digest }}
      head_sha: ${{ inputs.release_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Require the trusted qualification for these exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ inputs.qualification_artifact_digest }}
        run: >-
          python scripts/release.py verify-qualification
          --repository "$GITHUB_REPOSITORY"
          --package citry-lsp
          --commit "$RELEASE_COMMIT"
          --run-id "$QUALIFICATION_RUN_ID"
          --artifact-id "$QUALIFICATION_ARTIFACT_ID"
          --artifact-digest "$QUALIFICATION_ARTIFACT_DIGEST"

  release:
    name: Promote qualified bytes and release
    if: ${{ inputs.operation == 'promote' }}
    needs: [verify-version, select-qualification]
    runs-on: ubuntu-latest
    # Pending PyPI publisher identity:
    # citry-lsp / citry-dev / citry / py--citry-lsp--publish.yml / pypi
    environment: pypi
    env:
      CITRY_LSP_VERSION: ${{ needs.verify-version.outputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_TAG: citry-lsp@${{ needs.verify-version.outputs.version }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      closeout_id: ${{ steps.closeout.outputs.artifact-id }}
      closeout_digest: ${{ steps.closeout.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - name: Require the qualified commit to remain on main
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.select-qualification.outputs.head_sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the immutable qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.select-qualification.outputs.artifact_id }}/zip" \
            --output qualification.zip
      - name: Verify GitHub's digest and every qualified artifact again
        run: >-
          python scripts/verify_citry_lsp_distribution.py
          --promote-archive qualification.zip
          --artifact-digest '${{ needs.select-qualification.outputs.artifact_digest }}'
          --promotion-output-dir verified
      - name: Record the promoted qualification
        run: |
          jq -n \
            --arg run_id '${{ needs.select-qualification.outputs.run_id }}' \
            --arg run_url '${{ needs.select-qualification.outputs.run_url }}' \
            --arg artifact_digest '${{ needs.select-qualification.outputs.artifact_digest }}' \
            --arg head_sha '${{ needs.select-qualification.outputs.head_sha }}' \
            '{run_id: $run_id, run_url: $run_url, artifact_digest: $artifact_digest, head_sha: $head_sha}' \
            > verified/qualification-provenance.json
          mkdir dist
          cp verified/*.whl verified/*.tar.gz dist/
      - name: Accept only absent or byte-identical public state
        id: public-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pypi_status=$(curl --silent --show-error --output pypi.json --write-out '%{http_code}' \
            "https://pypi.org/pypi/citry-lsp/${CITRY_LSP_VERSION}/json")
          args=(--status "$pypi_status" --inventory verified/release-inventory.json --github-output "$GITHUB_OUTPUT")
          if [ "$pypi_status" = "200" ]; then args+=(--pypi-json pypi.json); fi
          python scripts/pypi_release.py "${args[@]}"
          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in
            404) echo "release_exists=false" >> "$GITHUB_OUTPUT" ;;
            200) echo "release_exists=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not read GitHub Release $RELEASE_TAG; HTTP $release_status"; exit 1 ;;
          esac
      - name: Attest the promotion of the qualified bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            verified/release-inventory.json
            verified/qualification-provenance.json
      - name: Publish to PyPI
        if: steps.public-state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Verify the exact public artifact pair
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl --silent --show-error --output pypi.json --write-out '%{http_code}' \
              "https://pypi.org/pypi/citry-lsp/${CITRY_LSP_VERSION}/json")
            if [ "$status" = "200" ] && python scripts/pypi_release.py --status "$status" \
              --inventory verified/release-inventory.json --pypi-json pypi.json; then
              break
            fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 5
          done
      - name: Prepare the verified GitHub Release files
        run: |
          mkdir release-closeout
          cp dist/*.whl dist/*.tar.gz verified/release-inventory.json verified/qualification-provenance.json release-closeout/
      - name: Retain the verified release files for closeout
        id: closeout
        uses: actions/upload-artifact@v7
        with:
          name: release-closeout-${{ github.run_attempt }}
          path: release-closeout/*
          if-no-files-found: error
          retention-days: 7

  tag:
    name: Create or verify the final annotated tag
    needs: [verify-version, release]
    permissions:
      contents: read
    uses: ./.github/workflows/repo--release-tag.yml
    with:
      package: citry-lsp
      release_commit: ${{ inputs.release_commit }}
      release_tag: citry-lsp@${{ needs.verify-version.outputs.version }}

  closeout:
    name: Create the GitHub Release and notify
    needs: [verify-version, release, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: citry-lsp@${{ needs.verify-version.outputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the exact verified closeout archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release.outputs.closeout_id }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output closeout.zip
      - name: Verify the transferred release files
        env:
          ARTIFACT_DIGEST: ${{ needs.release.outputs.closeout_digest }}
        run: >-
          python -m scripts.release_closeout
          --archive closeout.zip --artifact-digest "$ARTIFACT_DIGEST"
          --release-commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION"
          --output-dir release-assets
      - name: Verify existing GitHub Release state
        id: public-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_github_release
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --assets-dir release-assets --github-output "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        if: steps.public-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG"
          --verify-tag --generate-notes
      - name: Verify the completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_github_release
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --assets-dir release-assets --require-existing
      - name: Start the Discord release notification
        if: steps.public-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches"
          -f event_type=citry-release-published
          -f "client_payload[tag]=$RELEASE_TAG"

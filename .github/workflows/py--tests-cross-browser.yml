# Weekly cross-browser run of the e2e suite on all three engines. PR-time e2e
# (the `e2e` job in py--tests.yml) runs chromium only for speed; this catches
# firefox/webkit-specific regressions on a schedule. A failed scheduled run
# notifies the maintainer via GitHub's default e-mail on workflow failure.
name: Cross-browser e2e

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Run every browser even if one fails, so a webkit-only break still shows
      # the chromium/firefox results.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      # Reuses the citry-core wheel built from these exact Rust sources by any
      # earlier run, and builds it only when no cached wheel matches.
      - name: Restore or build the citry-core wheel
        id: core
        uses: ./.github/actions/citry-core-wheel

      - name: Install the workspace with the e2e group
        env:
          CORE_WHEEL_DIR: ${{ steps.core.outputs.wheel-dir }}
          CORE_WHEEL_CACHE_KEY: ${{ steps.core.outputs.cache-key }}
        run: >-
          python scripts/citry_core_wheel.py install
          --wheel-dir "$CORE_WHEEL_DIR"
          --cache-key "$CORE_WHEEL_CACHE_KEY"
          -- --all-packages --group e2e

      - name: Install the ${{ matrix.browser }} browser
        run: uv run --no-sync playwright install --with-deps ${{ matrix.browser }}

      - name: Set up pnpm for the pinned axe runtime
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the root browser quality tools
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Compile the pinned Tailwind coexistence fixture
        run: pnpm run citry-ui:quality-css

      - name: Run the browser e2e tests on ${{ matrix.browser }}
        run: >-
          uv run --no-sync pytest
          packages/py/citry/tests/e2e
          packages/py/citry_ui/citry_ui/components
          packages/py/citry_ui/citry_ui/quality/tests/e2e
          packages/py/citry_ui/tests/e2e
          -m e2e
          --browser ${{ matrix.browser }}
          -n 4
          --dist loadfile
          --durations 30

      - name: Capture Citry UI visual candidates
        if: matrix.browser == 'chromium'
        run: >-
          uv run --no-sync python -m citry_ui.quality.capture_visuals
          "$RUNNER_TEMP/citry-ui-visuals"

      - name: Record bounded Citry UI scaling diagnostics
        if: matrix.browser == 'chromium'
        run: >-
          uv run --no-sync python -m citry_ui.quality.scaling
          > "$RUNNER_TEMP/citry-ui-scaling.json"

      - name: Upload Citry UI scheduled evidence
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: citry-ui-scheduled-quality
          path: |
            ${{ runner.temp }}/citry-ui-visuals/
            ${{ runner.temp }}/citry-ui-scaling.json
          if-no-files-found: error

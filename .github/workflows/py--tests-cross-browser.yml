# Weekly cross-browser run of the e2e suite on all three engines. PR-time e2e
# (the `e2e` job in py--tests.yml) runs chromium only for speed; this catches
# firefox/webkit-specific regressions on a schedule. A failed scheduled run
# notifies the maintainer via GitHub's default e-mail on workflow failure.
name: Cross-browser e2e

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      # Run every browser even if one fails, so a webkit-only break still shows
      # the chromium/firefox results.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # NOTE: keep in step with rust-toolchain.toml
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the workspace with the e2e group
        run: uv sync --locked --all-packages --group e2e

      - name: Install the ${{ matrix.browser }} browser
        run: uv run --no-sync playwright install --with-deps ${{ matrix.browser }}

      - name: Set up pnpm for the pinned axe runtime
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the root browser quality tools
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Compile the pinned Tailwind coexistence fixture
        run: pnpm run citry-ui:quality-css

      - name: Run the browser e2e tests on ${{ matrix.browser }}
        run: >-
          uv run --no-sync pytest
          packages/py/citry/tests/e2e
          packages/py/citry_ui/citry_ui/components
          packages/py/citry_ui/citry_ui/quality/tests/e2e
          -m e2e
          --browser ${{ matrix.browser }}
          -n 4
          --dist loadfile
          --durations 30

      - name: Capture Citry UI visual candidates
        if: matrix.browser == 'chromium'
        run: >-
          uv run --no-sync python -m citry_ui.quality.capture_visuals
          "$RUNNER_TEMP/citry-ui-visuals"

      - name: Record bounded Citry UI scaling diagnostics
        if: matrix.browser == 'chromium'
        run: >-
          uv run --no-sync python -m citry_ui.quality.scaling
          > "$RUNNER_TEMP/citry-ui-scaling.json"

      - name: Upload Citry UI scheduled evidence
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: citry-ui-scheduled-quality
          path: |
            ${{ runner.temp }}/citry-ui-visuals/
            ${{ runner.temp }}/citry-ui-scaling.json
          if-no-files-found: error

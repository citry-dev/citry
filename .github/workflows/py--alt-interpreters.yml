# Runs the non-browser Python suite on PyPy 3.11 and free-threaded CPython
# 3.14 (3.14t). On those interpreters Citry renders through its Python render
# path, and their object identity, garbage collection and thread scheduling
# differ from standard CPython, so the per-PR matrix in py--tests.yml cannot
# show that Citry still works there.
#
# It runs once a week and on demand, never on pull requests, so it adds
# nothing to the routine CI or release path. When a scheduled run fails, the
# last job opens one tracking issue, or comments on it if it is still open.
name: Python tests on PyPy and free-threaded CPython

on:
  schedule:
    # Mondays at 05:17 UTC, away from the top of the hour when runners are busiest.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One interpreter failing must not hide the other one's result.
      fail-fast: false
      matrix:
        python: ["pypy3.11", "3.14t"]
        # How many pytest runs the suite is split into (see "Run Python tests").
        include:
          - python: "pypy3.11"
            batches: 8
          - python: "3.14t"
            batches: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          prune-cache: true
          version: "0.13.5"

      # uv's own interpreter builds include PyPy and the free-threaded 3.14t.
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # `uv sync` builds citry_core for this interpreter through maturin.
      # These interpreters cannot use the stable ABI, so it builds a wheel
      # for this exact interpreter, as the release workflow does.
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.python }}

      # The default dependency groups leave out the browser test tools, which
      # the non-browser suite does not use.
      - name: Install the workspace
        run: uv sync --locked --all-packages --python ${{ matrix.python }}

      # citry_core declares that it needs the GIL (#433), so on a free-threaded
      # build importing it turns the GIL back on; the second line shows whether
      # the suite below runs with it.
      - name: Show the interpreter
        run: >-
          uv run --no-sync python -c
          "import sys, sysconfig; print(sys.version);
          print('GIL disabled build:', bool(sysconfig.get_config_var('Py_GIL_DISABLED')));
          import citry; print('GIL enabled after import citry:', getattr(sys, '_is_gil_enabled', lambda: True)())"

      # pytest's settings in pyproject.toml already print the failure summary
      # and the stack of any test still running after 5 minutes.
      #
      # On PyPy a pytest-xdist worker process rarely gives memory back to
      # the system, so each worker keeps growing as it runs more test files.
      # Much of that memory is outside PyPy's garbage collector: C memory
      # behind PyPy's support for C extensions such as citry_core and
      # pydantic-core, and, most likely, glibc's malloc, which keeps a
      # separate pool for each thread (Citry's Events checks run on their
      # own threads). Four workers that live for the whole suite filled the
      # runner's 16 GB before the end, the runner stopped answering, and
      # GitHub cancelled the job without a test report. So the PyPy job runs
      # the test files in batches, each with its own pytest and new workers,
      # which frees that memory between batches. In a test run capped at
      # 13 GB, one pytest over the whole suite reached the cap 25 to 38
      # percent of the way through. A batch holds an eighth of the files,
      # and the largest batch held under a fifth of the tests when this was
      # measured.
      - name: Run Python tests
        env:
          BATCHES: ${{ matrix.batches }}
        run: |
          # A missing or zero batch count would skip every test and pass.
          if ! [[ $BATCHES =~ ^[1-9][0-9]*$ ]]; then
            echo "The batch count must be a positive whole number, not '$BATCHES'"
            exit 1
          fi
          options=(-m "not e2e and not qualification" --ignore packages/py/citry/tests/test_server_reload.py)
          if [ "$BATCHES" -eq 1 ]; then
            exec uv run --no-sync pytest "${options[@]}" -n 4 --dist loadfile --durations 30
          fi
          # pytest lists the tests it would run, so the conftest files and
          # the `-m` marker filter still decide what runs. pytest collects a
          # file named on the command line even when a conftest's
          # `collect_ignore_glob` leaves it out, so the batches may only name
          # files from this list.
          listing=$(uv run --no-sync pytest "${options[@]}" -p no:xdist --collect-only -q) || {
            echo "$listing" | tail -n 60
            exit 1
          }
          # Only lines that start with a test id name a file; a warning in the
          # summary can also contain `::`.
          mapfile -t files < <(grep -E '^[^ ]+::' <<<"$listing" | sed 's/::.*//' | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "pytest listed no test files"
            exit 1
          fi
          echo "${#files[@]} test files in $BATCHES batches"
          # Every batch runs even after one fails, so a failure does not
          # hide the results of the files after it.
          status=0
          for ((batch = 0; batch < BATCHES; batch++)); do
            # Neighbouring files often test the same area and use similar
            # amounts of memory, so taking every BATCHES-th file spreads
            # them across the batches.
            mine=()
            for i in "${!files[@]}"; do
              if ((i % BATCHES == batch)); then mine+=("${files[i]}"); fi
            done
            if [ "${#mine[@]}" -eq 0 ]; then continue; fi
            echo "Batch $((batch + 1)) of $BATCHES: ${#mine[@]} files"
            uv run --no-sync pytest -m "not e2e and not qualification" -n 4 --dist loadfile --durations 30 "${mine[@]}" || status=1
          done
          exit "$status"

      # A free-threaded build keeps the GIL on once citry_core loads, so this
      # step turns it off to run the render, serialize, Events and thread tests
      # truly in parallel. Citry already renders on the Python path there
      # (native_render.py refuses the Rust path on such builds), so a failure
      # here is a Python-level race. It only reports until #433 makes
      # citry_core declare it is safe without the GIL.
      - name: Run the render, serialize, Events and thread tests without the GIL
        if: ${{ matrix.python == '3.14t' && !cancelled() }}
        continue-on-error: true
        env:
          PYTHON_GIL: "0"
        run: >-
          uv run --no-sync pytest
          -m "not e2e and not qualification"
          -n 4
          --dist loadfile
          -W "ignore:The global interpreter lock:RuntimeWarning"
          packages/py/citry/tests
          -k "render or serialize or events or thread"

  report-failure:
    # Only the weekly run reports: a manual run's author is already watching.
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Weekly Python tests on PyPy or free-threaded CPython failed"
        run: |
          # One open issue collects every failed week, so a long failure does
          # not open a new issue each Monday.
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          body="The weekly run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi


# Qualify and publish the pure-Python citry-ui package.
#
# A manual run builds and tests one artifact pair for an exact main commit.
# Pushing citry-ui@<version> at that commit promotes those same bytes; tag and
# manual-dispatch runs cannot publish freshly rebuilt or already-published files.
name: Publish citry-ui to PyPI

on:
  push:
    tags:
      - "citry-ui@*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: packages/py/citry_ui
  UV_VERSION: "0.10.12"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches pyproject version
        id: package-version
        run: |
          pkg_version=$(grep -m1 '^version' "$PROJECT_DIR/pyproject.toml" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#citry-ui@}"
          echo "tag version: $tag_version, pyproject version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag '$tag_version' does not match $PROJECT_DIR/pyproject.toml version '$pkg_version'"
            exit 1
          fi

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install the locked asset tools
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling
      - name: Verify checked-in production assets
        run: pnpm run citry-ui:check-assets
      - name: Build the wheel and source distribution
        run: uv build --package citry-ui --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: raw-citry-ui-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  smoke-python:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-ui-distributions
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Rebuild the sdist and smoke the installed components
        run: python scripts/verify_citry_ui_distribution.py --dist-dir dist

  smoke-browser:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-ui-distributions
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the exact wheel and browser tools
        run: >-
          uv pip install --system --only-binary :all:
          dist/citry_ui-*.whl playwright==1.61.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise an installed interactive component
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import citry_ui
          from citry import Citry, Component
          from playwright.sync_api import sync_playwright

          app = Citry(autodiscover=False)
          app.register_library(citry_ui)

          class Page(Component):
              citry = app
              template = """
                <!doctype html>
                <html lang="en">
                  <head><meta charset="utf-8" /><c-css /></head>
                  <body>
                    <c-CTabs default_value="one" aria_label="Installed Tabs">
                      <c-CTab value="one">One</c-CTab>
                      <c-CTab value="two">Two</c-CTab>
                      <c-CTabPanel value="one">First panel</c-CTabPanel>
                      <c-CTabPanel value="two">Second panel</c-CTabPanel>
                    </c-CTabs>
                    <c-js />
                  </body>
                </html>
              """

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content(str(Page()), wait_until="load")
              page.wait_for_selector("[data-citry-tabs-initialized]")
              page.get_by_role("tab", name="Two").click()
              assert page.get_by_role("tabpanel", name="Two").is_visible()
              browser.close()
          PY

  verify-distributions:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-version, build, smoke-python, smoke-browser]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-ui-distributions
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Verify and stage the closed release pair
        run: >-
          python scripts/verify_citry_ui_distribution.py
          --dist-dir dist
          --skip-install-smoke
          --stage-output-dir verified
      - name: Check package-index rendering metadata
        run: uvx --from twine==6.2.0 twine check verified/*.whl verified/*.tar.gz
      - name: Attest the qualified build outputs
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            verified/*.whl
            verified/*.tar.gz
            verified/release-inventory.json
      - name: Upload the only bundle a tag may promote
        uses: actions/upload-artifact@v7
        with:
          name: verified-citry-ui-distributions
          path: verified
          if-no-files-found: error
          retention-days: 14

  select-qualification:
    name: Select the exact main-commit qualification
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      run_url: ${{ steps.select.outputs.run_url }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      head_sha: ${{ steps.select.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record the peeled tag commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find a successful qualification for this commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/select_citry_core_qualification.py
          --repository "$GITHUB_REPOSITORY"
          --commit "${{ steps.commit.outputs.sha }}"
          --workflow py--citry-ui--publish.yml
          --artifact-name verified-citry-ui-distributions
          --github-output "$GITHUB_OUTPUT"

  release:
    name: Promote qualified bytes and release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [verify-version, select-qualification]
    runs-on: ubuntu-latest
    # PyPI publisher identity:
    # citry-ui / citry-dev / citry / py--citry-ui--publish.yml / pypi
    environment: pypi
    env:
      CITRY_UI_VERSION: ${{ needs.verify-version.outputs.version }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the qualified commit to remain on main
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.select-qualification.outputs.head_sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the immutable qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.select-qualification.outputs.artifact_id }}/zip" \
            --output qualification.zip
      - name: Verify GitHub's digest and every qualified artifact again
        run: >-
          python scripts/verify_citry_ui_distribution.py
          --promote-archive qualification.zip
          --artifact-digest '${{ needs.select-qualification.outputs.artifact_digest }}'
          --promotion-output-dir verified
      - name: Record the promoted qualification
        run: |
          jq -n \
            --arg run_id '${{ needs.select-qualification.outputs.run_id }}' \
            --arg run_url '${{ needs.select-qualification.outputs.run_url }}' \
            --arg artifact_digest '${{ needs.select-qualification.outputs.artifact_digest }}' \
            --arg head_sha '${{ needs.select-qualification.outputs.head_sha }}' \
            '{run_id: $run_id, run_url: $run_url, artifact_digest: $artifact_digest, head_sha: $head_sha}' \
            > verified/qualification-provenance.json
          mkdir dist
          cp verified/*.whl verified/*.tar.gz dist/
      - name: Require a new PyPI version and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pypi_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/citry-ui/${CITRY_UI_VERSION}/json")
          if [ "$pypi_status" != "404" ]; then
            echo "::error::expected PyPI version ${CITRY_UI_VERSION} to be absent; HTTP ${pypi_status}"
            exit 1
          fi
          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$release_status" in
            404) ;;
            200)
              echo "::error::GitHub Release ${GITHUB_REF_NAME} already exists"
              exit 1
              ;;
            *)
              echo "::error::could not prove GitHub Release ${GITHUB_REF_NAME} is absent; HTTP ${release_status}"
              exit 1
              ;;
          esac
      - name: Attest the promotion of the qualified bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            verified/release-inventory.json
            verified/qualification-provenance.json
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/* verified/release-inventory.json verified/qualification-provenance.json
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes

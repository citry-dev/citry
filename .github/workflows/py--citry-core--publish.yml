# Qualify and publish the citry-core Python package.
#
# A manual run builds, installs, tests, and stores one verified artifact bundle
# for an exact main commit. Pushing citry-core@<version> at that commit promotes
# those same bytes; a tag run never recompiles release artifacts.
name: Publish citry-core to PyPI

on:
  push:
    tags:
      - "citry-core@*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: packages/py/citry_core
  CITRY_CORE_RUST_TOOLCHAIN: "1.95.0"
  CITRY_CORE_EMSCRIPTEN_VERSION: "5.0.3"
  MATURIN_VERSION: "1.14.1"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches pyproject version
        id: package-version
        run: |
          pkg_version=$(grep -m1 '^version' "$PROJECT_DIR/pyproject.toml" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#citry-core@}"
          echo "tag version: $tag_version, pyproject version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag '$tag_version' does not match $PROJECT_DIR/pyproject.toml version '$pkg_version'"
            exit 1
          fi

  linux:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, x86, aarch64, armv7, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build the CPython ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --profile release-wheel --strip --locked --compatibility pypi --out dist
            --features abi3-py310 --interpreter python3.10
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: "true"
          manylinux: auto
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Build the free-threaded and PyPy wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --profile release-wheel --strip --locked --compatibility pypi --out dist
            --features abi3-py310 --interpreter python3.14t pypy3.11
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: "true"
          manylinux: auto
          working-directory: ${{ env.PROJECT_DIR }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: ${{ matrix.target == 'x86_64' }}
        with:
          version: "0.10.12"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: python310
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: python311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: python312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: python313
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: python314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: python314t
        with:
          python-version: "3.14t"
      - uses: actions/setup-python@v7
        if: ${{ matrix.target == 'x86_64' }}
        id: pypy311
        with:
          python-version: "pypy3.11"
      - name: Smoke the x86_64 wheels on every supported interpreter
        if: ${{ matrix.target == 'x86_64' }}
        env:
          CITRY_CORE_VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          abi3_wheel="$PROJECT_DIR/dist/citry_core-${CITRY_CORE_VERSION}-cp310-abi3-manylinux*x86_64.whl"
          for python in \
            "${{ steps.python310.outputs.python-path }}" \
            "${{ steps.python311.outputs.python-path }}" \
            "${{ steps.python312.outputs.python-path }}" \
            "${{ steps.python313.outputs.python-path }}" \
            "${{ steps.python314.outputs.python-path }}"
          do
            "$python" scripts/verify_citry_core_distribution.py smoke-wheel \
              --wheel "$abi3_wheel" --python "$python"
          done
          "${{ steps.python314t.outputs.python-path }}" scripts/verify_citry_core_distribution.py smoke-wheel \
            --wheel "$PROJECT_DIR/dist/citry_core-${CITRY_CORE_VERSION}-cp314-cp314t-manylinux*x86_64.whl" \
            --python "${{ steps.python314t.outputs.python-path }}"
          "${{ steps.pypy311.outputs.python-path }}" scripts/verify_citry_core_distribution.py smoke-wheel \
            --wheel "$PROJECT_DIR/dist/citry_core-${CITRY_CORE_VERSION}-pp311-pypy311_pp73-manylinux*x86_64.whl" \
            --python "${{ steps.pypy311.outputs.python-path }}"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: ${{ env.PROJECT_DIR }}/dist
          if-no-files-found: error

  musllinux:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, x86, aarch64, armv7]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build the CPython ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --profile release-wheel --strip --locked --compatibility pypi --out dist
            --features abi3-py310 --interpreter python3.10
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: "true"
          manylinux: musllinux_1_2
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Build the free-threaded and PyPy wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --profile release-wheel --strip --locked --compatibility pypi --out dist
            --features abi3-py310 --interpreter python3.14t pypy3.11
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: "true"
          manylinux: musllinux_1_2
          working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: ${{ env.PROJECT_DIR }}/dist
          if-no-files-found: error

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
      - uses: actions/setup-python@v7
        id: python310
        with:
          python-version: "3.10"
          architecture: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        id: python311
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        id: python312
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        id: python313
        with:
          python-version: "3.13"
          architecture: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        id: python314
        with:
          python-version: "3.14"
          architecture: ${{ matrix.target }}
      - name: Build one CPython ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --profile release-wheel --strip --locked --compatibility pypi --out dist
            --features abi3-py310 --interpreter ${{ steps.python310.outputs.python-path }}
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: "true"
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Smoke the ABI3 wheel on CPython 3.10 through 3.14
        env:
          CITRY_CORE_VERSION: ${{ needs.verify-version.outputs.version }}
        shell: pwsh
        run: |
          $wheel = "$env:PROJECT_DIR/dist/citry_core-$env:CITRY_CORE_VERSION-cp310-abi3-win*.whl"
          $pythons = @(
            '${{ steps.python310.outputs.python-path }}',
            '${{ steps.python311.outputs.python-path }}',
            '${{ steps.python312.outputs.python-path }}',
            '${{ steps.python313.outputs.python-path }}',
            '${{ steps.python314.outputs.python-path }}'
          )
          foreach ($python in $pythons) {
            & $python scripts/verify_citry_core_distribution.py smoke-wheel --wheel $wheel --python $python
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: ${{ env.PROJECT_DIR }}/dist
          if-no-files-found: error

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
      - uses: actions/setup-python@v7
        id: python310
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v7
        id: python314
        with:
          python-version: "3.14"
      - name: Build one CPython ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --profile release-wheel --strip --locked --compatibility pypi --out dist
            --features abi3-py310 --interpreter ${{ steps.python310.outputs.python-path }}
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          sccache: "true"
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Smoke the ABI3 wheel on the oldest and newest CPython
        env:
          CITRY_CORE_VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          wheel="$PROJECT_DIR/dist/citry_core-${CITRY_CORE_VERSION}-cp310-abi3-macosx*.whl"
          for python in \
            "${{ steps.python310.outputs.python-path }}" \
            "${{ steps.python314.outputs.python-path }}"
          do
            "$python" scripts/verify_citry_core_distribution.py smoke-wheel \
              --wheel "$wheel" --python "$python"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: ${{ env.PROJECT_DIR }}/dist
          if-no-files-found: error

  sdist:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Rebuild and smoke-test the sdist at Rust 1.95
        run: >-
          python scripts/verify_citry_core_distribution.py smoke-sdist
          --sdist '${{ env.PROJECT_DIR }}/dist/*.tar.gz'
          --rust-toolchain '${{ env.CITRY_CORE_RUST_TOOLCHAIN }}'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: ${{ env.PROJECT_DIR }}/dist
          if-no-files-found: error

  pyemscripten-build:
    name: PyEmscripten reproducibility build ${{ matrix.copy }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    env:
      CITRY_CORE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@v6
        if: ${{ matrix.copy == 'a' }}
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.CITRY_CORE_RUST_TOOLCHAIN }}
          targets: wasm32-unknown-emscripten
      - name: Cache the pinned Pyodide cross environment
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/citry-pyodide-xbuildenv
          key: pyodide-314.0.3-python-3.14.2-emscripten-5.0.3-rust-1.95.0-cli-0.5.0-build-0.37.0
      - name: Install the pinned Pyodide cross environment
        env:
          CITRY_XBUILDENV: ${{ runner.temp }}/citry-pyodide-xbuildenv
        run: |
          PYODIDE_XBUILDENV_PATH="$CITRY_XBUILDENV" uvx --python 3.14.2 \
            --from pyodide-cli==0.5.0 \
            --with pyodide-build==0.37.0 \
            pyodide xbuildenv install 314.0.3 --path "$CITRY_XBUILDENV"
          PYODIDE_XBUILDENV_PATH="$CITRY_XBUILDENV" uvx --python 3.14.2 \
            --from pyodide-cli==0.5.0 \
            --with pyodide-build==0.37.0 \
            pyodide xbuildenv install-emscripten --path "$CITRY_XBUILDENV"
      - name: Build from one clean source tree
        env:
          CITRY_XBUILDENV: ${{ runner.temp }}/citry-pyodide-xbuildenv
        run: |
          source_epoch=$(git show -s --format=%ct HEAD)
          python scripts/build_citry_core_pyodide_wheel.py \
            --source packages/py/citry_core \
            --out-dir "${{ runner.temp }}/pyemscripten-${{ matrix.copy }}" \
            --xbuildenv-path "$CITRY_XBUILDENV" \
            --cargo-target-dir "${{ runner.temp }}/cargo-pyemscripten-${{ matrix.copy }}" \
            --cargo-home "$CARGO_HOME" \
            --source-date-epoch "$source_epoch"
      - name: Inspect the wheel
        run: >-
          python scripts/verify_citry_core_distribution.py check-wheel
          --wheel '${{ runner.temp }}/pyemscripten-${{ matrix.copy }}/citry_core-${{ env.CITRY_CORE_VERSION }}-cp314-cp314-pyemscripten_2026_0_wasm32.whl'
      - name: Smoke build A in the pinned Pyodide runtime
        if: ${{ matrix.copy == 'a' }}
        env:
          CITRY_CORE_EXPECTED_VERSION: ${{ needs.verify-version.outputs.version }}
          CITRY_XBUILDENV: ${{ runner.temp }}/citry-pyodide-xbuildenv
        run: |
          wheel="${{ runner.temp }}/pyemscripten-a/citry_core-${CITRY_CORE_VERSION}-cp314-cp314-pyemscripten_2026_0_wasm32.whl"
          uvx --python 3.14.2 --from twine==6.2.0 twine check "$wheel"
          PYODIDE_XBUILDENV_PATH="$CITRY_XBUILDENV" \
            uvx --python 3.14.2 \
              --from pyodide-cli==0.5.0 \
              --with pyodide-build==0.37.0 \
              pyodide venv "${{ runner.temp }}/citry-pyodide-venv"
          "${{ runner.temp }}/citry-pyodide-venv/bin/pip" install --no-deps --no-index "$wheel"
          "${{ runner.temp }}/citry-pyodide-venv/bin/python" -I scripts/smoke_citry_core.py
      - uses: actions/upload-artifact@v7
        with:
          name: pyemscripten-repro-${{ matrix.copy }}
          path: ${{ runner.temp }}/pyemscripten-${{ matrix.copy }}/*.whl
          if-no-files-found: error

  pyemscripten:
    name: Compare PyEmscripten reproducibility builds
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-version, pyemscripten-build]
    runs-on: ubuntu-latest
    env:
      CITRY_CORE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pyemscripten-repro-*
          path: reproducibility-builds
      - name: Require byte-identical wheels from separate runners
        run: |
          wheel="citry_core-${CITRY_CORE_VERSION}-cp314-cp314-pyemscripten_2026_0_wasm32.whl"
          cmp \
            "reproducibility-builds/pyemscripten-repro-a/$wheel" \
            "reproducibility-builds/pyemscripten-repro-b/$wheel"
          mkdir verified-pyemscripten
          cp "reproducibility-builds/pyemscripten-repro-a/$wheel" verified-pyemscripten/
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-pyemscripten-wasm32
          path: verified-pyemscripten/*.whl
          if-no-files-found: error

  verify-distributions:
    name: Verify complete distribution inventory
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist, pyemscripten]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: raw-artifacts
      - name: Verify and stage the closed release set
        run: >-
          python scripts/verify_citry_core_distribution.py inventory
          --raw-dir raw-artifacts
          --output-dir verified
      - name: Attest the qualified build outputs
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            verified/*.whl
            verified/*.tar.gz
            verified/release-inventory.json
      - name: Upload the only bundle a tag may promote
        uses: actions/upload-artifact@v7
        with:
          name: verified-citry-core-distributions
          path: verified
          if-no-files-found: error
          retention-days: 14

  select-qualification:
    name: Select the exact main-commit qualification
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      run_url: ${{ steps.select.outputs.run_url }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      head_sha: ${{ steps.select.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record the peeled tag commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find a successful qualification for this commit
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/select_citry_core_qualification.py
          --repository "$GITHUB_REPOSITORY"
          --commit "${{ steps.commit.outputs.sha }}"
          --github-output "$GITHUB_OUTPUT"

  release:
    name: Promote qualified bytes and release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [verify-version, select-qualification]
    runs-on: ubuntu-latest
    environment: pypi
    env:
      CITRY_CORE_VERSION: ${{ needs.verify-version.outputs.version }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Require the qualified commit to remain on main
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.select-qualification.outputs.head_sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the immutable qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.select-qualification.outputs.artifact_id }}/zip" \
            --output qualification.zip
      - name: Verify GitHub's digest and every qualified artifact again
        run: >-
          python scripts/verify_citry_core_distribution.py promote
          --archive qualification.zip
          --artifact-digest '${{ needs.select-qualification.outputs.artifact_digest }}'
          --output-dir verified
      - name: Record the promoted qualification
        run: |
          jq -n \
            --arg run_id '${{ needs.select-qualification.outputs.run_id }}' \
            --arg run_url '${{ needs.select-qualification.outputs.run_url }}' \
            --arg artifact_digest '${{ needs.select-qualification.outputs.artifact_digest }}' \
            --arg head_sha '${{ needs.select-qualification.outputs.head_sha }}' \
            '{run_id: $run_id, run_url: $run_url, artifact_digest: $artifact_digest, head_sha: $head_sha}' \
            > verified/qualification-provenance.json
          mkdir dist
          cp verified/*.whl verified/*.tar.gz dist/
      - name: Require a new PyPI version and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pypi_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/citry-core/${CITRY_CORE_VERSION}/json")
          if [ "$pypi_status" != "404" ]; then
            echo "::error::expected PyPI version ${CITRY_CORE_VERSION} to be absent; HTTP ${pypi_status}"
            exit 1
          fi
          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          case "$release_status" in
            404) ;;
            200)
              echo "::error::GitHub Release ${GITHUB_REF_NAME} already exists"
              exit 1
              ;;
            *)
              echo "::error::could not prove GitHub Release ${GITHUB_REF_NAME} is absent; HTTP ${release_status}"
              exit 1
              ;;
          esac
      - name: Attest the promotion of the qualified bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            verified/release-inventory.json
            verified/qualification-provenance.json
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/* verified/release-inventory.json verified/qualification-provenance.json
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
      - name: Start the Discord release notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches"
          -f event_type=citry-release-published
          -f "client_payload[tag]=$GITHUB_REF_NAME"

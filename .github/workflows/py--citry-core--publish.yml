# Publish workflow for the citry-core Python package.
# Builds and publishes citry-core to PyPI when a `citry-core@<version>` tag is
# pushed (the version after `@` must match the package's pyproject version).
#
# Originally generated by maturin v1.8.1, then customized for per-package tagging.
name: Publish citry-core to PyPI

on:
  push:
    tags:
      # Tags for this package only, e.g. citry-core@1.3.0. A bare (no language
      # prefix) tag means the Python package; see docs/codebase.md "Versioning, tags and releases".
      - "citry-core@*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: packages/py/citry_core

jobs:
  # Fail fast if the tag's version does not match the package's pyproject
  # version (the release job needs this, so a mismatch blocks the publish).
  # Skipped cleanly on manual workflow_dispatch, which has no version tag.
  verify-version:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#citry-core@}"
          pkg_version=$(grep -m1 '^version' "$PROJECT_DIR/pyproject.toml" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag version: $tag_version, pyproject version: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag '$tag_version' does not match $PROJECT_DIR/pyproject.toml version '$pkg_version'"
            exit 1
          fi

  linux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: ${{ env.PROJECT_DIR }}/dist

  musllinux:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --find-interpreter
          sccache: "true"
          manylinux: musllinux_1_2
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: ${{ env.PROJECT_DIR }}/dist

  windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      # Explicitly install all supported versions of Python on Windows.
      # Otherwise, as of Jan 2026, if we installed only Python 3.14,
      # then the Windows runner would NOT generate wheels for Python 3.8.
      # See https://github.com/django-components/djc-core/issues/22
      # And https://pypi.org/project/djc-core-html-parser/1.0.3/#files
      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --find-interpreter
          sccache: "true"
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: ${{ env.PROJECT_DIR }}/dist

  macos:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      # Explicitly install all supported versions of Python on macOS.
      # Otherwise, as of Jan 2026, if we installed only Python 3.14,
      # then the macOS runner would NOT generate wheels for Python 3.8, 3.9, 3.10.
      # See https://github.com/django-components/djc-core/issues/22
      # And https://pypi.org/project/djc-core/1.1.0/#files
      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --find-interpreter
          sccache: "true"
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: ${{ env.PROJECT_DIR }}/dist

  sdist:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ env.PROJECT_DIR }}
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: ${{ env.PROJECT_DIR }}/dist

  # One-time addition for citry-core 1.4.0. The exact wheel was built twice
  # from the release tag, passed the three-browser Pyodide matrix, and is
  # staged on the matching GitHub Release. Keep this on its dedicated release
  # branch; future tags must build the PyEmscripten wheel with the full
  # inventory before their regular release job.
  publish-pyemscripten-1-4-0:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: citry-core@1.4.0
      WHEEL_FILE: citry_core-1.4.0-cp314-cp314-pyemscripten_2026_0_wasm32.whl
      WHEEL_BYTES: "7011715"
      WHEEL_SHA256: 765e4211b1d333800d9d620c6f310f0a06ddac1574fbfac4af1bd53c9c31c964
      PYODIDE_VERSION: 314.0.3
    steps:
      - name: Download the staged release wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$WHEEL_FILE" \
            --dir dist

      - name: Verify wheel identity, metadata, and RECORD
        run: |
          wheel="dist/$WHEEL_FILE"
          test "$(wc -c < "$wheel" | tr -d ' ')" = "$WHEEL_BYTES"
          printf '%s  %s\n' "$WHEEL_SHA256" "$wheel" | sha256sum --check --strict
          unzip -t "$wheel" >/dev/null
          python - <<'PY'
          import base64
          import csv
          import hashlib
          import io
          import os
          import zipfile

          wheel = f"dist/{os.environ['WHEEL_FILE']}"
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              metadata_names = [name for name in names if name.endswith(".dist-info/METADATA")]
              wheel_names = [name for name in names if name.endswith(".dist-info/WHEEL")]
              record_names = [name for name in names if name.endswith(".dist-info/RECORD")]
              assert len(metadata_names) == len(wheel_names) == len(record_names) == 1
              metadata = archive.read(metadata_names[0]).decode("utf-8")
              wheel_metadata = archive.read(wheel_names[0]).decode("utf-8")
              assert "Name: citry_core\n" in metadata
              assert "Version: 1.4.0\n" in metadata
              assert "Tag: cp314-cp314-pyemscripten_2026_0_wasm32\n" in wheel_metadata
              rows = list(csv.reader(io.TextIOWrapper(
                  archive.open(record_names[0]), encoding="utf-8", newline=""
              )))
              assert {row[0] for row in rows} == names
              for name, digest, size in rows:
                  data = archive.read(name)
                  if name == record_names[0]:
                      assert digest == size == ""
                      continue
                  algorithm, encoded = digest.split("=", 1)
                  assert algorithm == "sha256"
                  actual = base64.urlsafe_b64encode(
                      hashlib.sha256(data).digest()
                  ).rstrip(b"=").decode()
                  assert encoded == actual, name
                  assert int(size) == len(data), name
          PY

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.12"

      - name: Check distribution metadata
        run: uvx --from twine==6.2.0 twine check "dist/$WHEEL_FILE"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Smoke-test in pinned Pyodide
        run: |
          npm install \
            --prefix "$RUNNER_TEMP/pyodide-smoke" \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            "pyodide@$PYODIDE_VERSION"
          PYODIDE_DIR="$RUNNER_TEMP/pyodide-smoke/node_modules/pyodide" \
          WHEEL="$PWD/dist/$WHEEL_FILE" \
          node --input-type=module <<'JS'
          import path from "node:path";
          import process from "node:process";
          import { pathToFileURL } from "node:url";

          const pyodideDirectory = path.resolve(process.env.PYODIDE_DIR);
          const wheel = path.resolve(process.env.WHEEL);
          const { loadPyodide } = await import(
            pathToFileURL(path.join(pyodideDirectory, "pyodide.mjs"))
          );
          const pyodide = await loadPyodide({ indexURL: `${pyodideDirectory}/` });
          await pyodide.loadPackage([wheel]);
          const result = pyodide.runPython(`
          from importlib.metadata import version
          from citry_core.html_transform import mark_html
          from citry_core.safe_eval import safe_eval
          from citry_core.template_parser import compile_template, parse_template

          parsed = parse_template("<h1>{{ title }}</h1>")
          compiled = compile_template(parsed)
          segments, placeholders = mark_html(
              "<main><p>Hello</p></main>", ["data-citry"], "c-render-id"
          )
          assert version("citry-core") == "1.4.0"
          assert [token.content for token in parsed.used_variables] == ["title"]
          assert "def generate_template" in compiled
          assert safe_eval("value * 2")({"value": 21}) == 42
          assert segments[0] == '<main data-citry=""><p>Hello</p></main>'
          assert placeholders == []
          "citry-core 1.4.0 Pyodide smoke passed"
          `);
          console.log(result);
          JS

      - name: Publish the single wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Verify the public PyPI artifact
        run: |
          for attempt in $(seq 1 12); do
            result=$(curl --fail --silent --show-error \
              https://pypi.org/pypi/citry-core/1.4.0/json | \
              jq --arg filename "$WHEEL_FILE" \
                 --arg sha "$WHEEL_SHA256" \
                 --argjson bytes "$WHEEL_BYTES" \
                 '[.urls[] | select(
                   .filename == $filename and
                   .digests.sha256 == $sha and
                   .size == $bytes
                 )] | length')
            if [ "$result" = "1" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "PyPI did not report the expected wheel, size, and hash" >&2
          exit 1

      - name: Attach the publish attestation to the GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attest="dist/$WHEEL_FILE.publish.attestation"
          if [ -f "$attest" ]; then
            gh release upload "$RELEASE_TAG" "$attest" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    needs: [verify-version, linux, musllinux, windows, macos, sdist]
    # Trusted Publishing target. Configure a PyPI publisher for this repo, the
    # workflow file py--citry-core--publish.yml, and the environment 'pypi'.
    environment: pypi
    permissions:
      # OIDC token for Trusted Publishing (no stored secret) and the attestation
      id-token: write
      # Generate the build-provenance attestation
      attestations: write
      # Create the GitHub Release
      contents: write
    steps:
      # Collect every wheel and the sdist into a single dist/ directory.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      # Trusted Publishing (OIDC): no token. PyPI verifies the workflow's OIDC
      # identity against the configured publisher.
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      # No checkout in this job, so gh cannot infer the repo from a local git
      # remote; pass --repo. Idempotent: if the release already exists (created
      # in the UI, or a re-run), upload the artifacts to it instead of failing.
      - name: Create or update the GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading artifacts."
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi

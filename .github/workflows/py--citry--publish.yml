# Qualify and publish the pure-Python citry package.
#
# The repository release controller qualifies one exact artifact pair, then
# sends that retained bundle back here for Trusted Publishing.
name: Publish citry to PyPI
run-name: >-
  ${{ inputs.operation == 'promote'
      && format('Publish citry for candidate {0}', inputs.candidate_id)
      || format('Qualify citry for candidate {0}', inputs.candidate_id) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [qualify, promote]
      release_commit:
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      workspace_dependencies:
        required: false
        type: string
      qualification_run_id:
        required: false
        type: string
      qualification_artifact_id:
        required: false
        type: string
      qualification_artifact_digest:
        required: false
        type: string

permissions:
  contents: read

env:
  PROJECT_DIR: packages/py/citry
  SOURCE_DATE_EPOCH: "315532800"
  UV_VERSION: "0.10.12"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - name: Read the qualified package version
        id: package-version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          # Bind qualification's checkout to GitHub's authenticated run SHA.
          if [ "$OPERATION" = "qualify" ]; then test "$GITHUB_SHA" = "$RELEASE_COMMIT"; fi
          pkg_version=$(grep -m1 '^version' "$PROJECT_DIR/pyproject.toml" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ inputs.operation == 'qualify' }}
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build the wheel and source distribution
        run: uv build --package citry --out-dir dist
      - name: Build the selected citry-core dependency for candidate smoke tests
        if: contains(inputs.workspace_dependencies, 'citry-core')
        run: >-
          uv build --package citry-core --wheel --out-dir core-dist
          --config-setting 'maturin.build-args=--features abi3-py310'
      - uses: actions/upload-artifact@v7
        with:
          name: raw-citry-distributions
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: contains(inputs.workspace_dependencies, 'citry-core')
        with:
          name: candidate-citry-core-wheel
          path: core-dist/*.whl
          if-no-files-found: error

  smoke-python:
    if: ${{ inputs.operation == 'qualify' }}
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-distributions
          path: dist
      - uses: actions/download-artifact@v8
        if: contains(inputs.workspace_dependencies, 'citry-core')
        with:
          name: candidate-citry-core-wheel
          path: core-dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Rebuild the sdist and smoke the public dependency closure
        if: ${{ !contains(inputs.workspace_dependencies, 'citry-core') }}
        run: python scripts/verify_citry_distribution.py --dist-dir dist
      - name: Rebuild the sdist and smoke the selected dependency closure
        if: contains(inputs.workspace_dependencies, 'citry-core')
        run: >-
          python scripts/verify_citry_distribution.py
          --dist-dir dist
          --core-wheel "$(find core-dist -name '*.whl' -print -quit)"

  verify-distributions:
    if: ${{ inputs.operation == 'qualify' }}
    needs: [verify-version, build, smoke-python]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/download-artifact@v8
        with:
          name: raw-citry-distributions
          path: dist
      - uses: actions/download-artifact@v8
        if: contains(inputs.workspace_dependencies, 'citry-core')
        with:
          name: candidate-citry-core-wheel
          path: core-dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Verify and stage with public dependencies
        if: ${{ !contains(inputs.workspace_dependencies, 'citry-core') }}
        run: >-
          python scripts/verify_citry_distribution.py
          --dist-dir dist
          --stage-output-dir verified
      - name: Verify and stage with the selected Core dependency
        if: contains(inputs.workspace_dependencies, 'citry-core')
        run: >-
          python scripts/verify_citry_distribution.py
          --dist-dir dist
          --core-wheel "$(find core-dist -name '*.whl' -print -quit)"
          --stage-output-dir verified
      - name: Verify the predeclared playground wheel when this version is selected
        run: >-
          python scripts/verify_playground_release.py
          --runtime docs_site/static/playground/runtime.json
          --inventory verified/release-inventory.json
          --package-name citry
          --wheel-pattern '*.whl'
      - name: Check package-index rendering metadata
        run: uvx --from twine==6.2.0 twine check verified/*.whl verified/*.tar.gz
      - name: Attest the qualified build outputs
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            verified/*.whl
            verified/*.tar.gz
            verified/release-inventory.json
      - name: Upload the only bundle the release controller may promote
        uses: actions/upload-artifact@v7
        with:
          name: verified-citry-distributions
          path: verified
          if-no-files-found: error
          retention-days: 30

  select-qualification:
    name: Verify the selected candidate artifact
    if: ${{ inputs.operation == 'promote' }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ inputs.qualification_run_id }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.qualification_run_id }}
      artifact_id: ${{ inputs.qualification_artifact_id }}
      artifact_digest: ${{ inputs.qualification_artifact_digest }}
      head_sha: ${{ inputs.release_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Require the trusted qualification for these exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ inputs.qualification_artifact_digest }}
        run: >-
          python scripts/release.py verify-qualification
          --repository "$GITHUB_REPOSITORY"
          --package citry
          --commit "$RELEASE_COMMIT"
          --run-id "$QUALIFICATION_RUN_ID"
          --artifact-id "$QUALIFICATION_ARTIFACT_ID"
          --artifact-digest "$QUALIFICATION_ARTIFACT_DIGEST"

  release:
    name: Promote qualified bytes and release
    if: ${{ inputs.operation == 'promote' }}
    needs: [verify-version, select-qualification]
    runs-on: ubuntu-latest
    environment: pypi
    env:
      CITRY_VERSION: ${{ needs.verify-version.outputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_TAG: citry@${{ needs.verify-version.outputs.version }}
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - name: Require the qualified commit to remain on main
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the immutable qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.select-qualification.outputs.artifact_id }}/zip" \
            --output qualification.zip
      - name: Verify GitHub's digest and every qualified artifact again
        run: >-
          python scripts/verify_citry_distribution.py
          --promote-archive qualification.zip
          --artifact-digest '${{ needs.select-qualification.outputs.artifact_digest }}'
          --promotion-output-dir verified
      - name: Record the promoted qualification
        run: |
          jq -n \
            --arg run_id '${{ needs.select-qualification.outputs.run_id }}' \
            --arg run_url '${{ needs.select-qualification.outputs.run_url }}' \
            --arg artifact_digest '${{ needs.select-qualification.outputs.artifact_digest }}' \
            --arg head_sha "$RELEASE_COMMIT" \
            '{run_id: $run_id, run_url: $run_url, artifact_digest: $artifact_digest, head_sha: $head_sha}' \
            > verified/qualification-provenance.json
          mkdir dist
          cp verified/*.whl verified/*.tar.gz dist/
      - name: Accept only absent or byte-identical public state
        id: public-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output pypi.json --write-out '%{http_code}' \
            "https://pypi.org/pypi/citry/${CITRY_VERSION}/json")
          args=(--status "$status" --inventory verified/release-inventory.json --github-output "$GITHUB_OUTPUT")
          if [ "$status" = "200" ]; then args+=(--pypi-json pypi.json); fi
          python scripts/pypi_release.py "${args[@]}"
          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in
            404) echo "release_exists=false" >> "$GITHUB_OUTPUT" ;;
            200) echo "release_exists=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not read GitHub Release $RELEASE_TAG; HTTP $release_status"; exit 1 ;;
          esac
      - name: Attest the promotion of the qualified bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            verified/release-inventory.json
            verified/qualification-provenance.json
      - name: Publish to PyPI
        if: steps.public-state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      - name: Verify the exact public artifact pair
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl --silent --show-error --output pypi.json --write-out '%{http_code}' \
              "https://pypi.org/pypi/citry/${CITRY_VERSION}/json")
            if [ "$status" = "200" ] && python scripts/pypi_release.py --status "$status" \
              --inventory verified/release-inventory.json --pypi-json pypi.json; then
              break
            fi
            if [ "$attempt" = 20 ]; then exit 1; fi
            sleep 5
          done
      - name: Create or verify the final annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Create the GitHub Release
        if: steps.public-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/* verified/release-inventory.json verified/qualification-provenance.json
          --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_TAG"
          --verify-tag
          --generate-notes
      - name: Start the Discord release notification
        if: steps.public-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches"
          -f event_type=citry-release-published
          -f "client_payload[tag]=$RELEASE_TAG"

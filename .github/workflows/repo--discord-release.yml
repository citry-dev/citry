# Posts a completed package release to its explicitly assigned Discord channel.
# Publishers send repository_dispatch because releases created with GITHUB_TOKEN
# do not trigger another workflow. workflow_dispatch retries one missed tag.
name: Notify Discord on Release

on:
  repository_dispatch:
    types: [citry-release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag to notify
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Select the release channel
        id: route
        run: |
          channel=$(python scripts/discord_release.py route "$RELEASE_TAG")
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Read the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,url,body,author,publishedAt \
            > release.json
          python scripts/discord_release.py payload release.json \
            --repository "$GITHUB_REPOSITORY" \
            > discord-payload.json
      - name: Post to Discord (announcements channel)
        if: steps.route.outputs.channel == 'announcements'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_ANNOUNCEMENTS is not configured"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST -H "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
      - name: Post to Discord (development channel)
        if: steps.route.outputs.channel == 'development'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_DEVELOPMENT is not configured"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST -H "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"

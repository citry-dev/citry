# The docs-site gate: builds the documentation site and runs the post-build
# guards (the same `python -m docs_site build-check` a contributor runs locally),
# checks the committed version snapshots (`python -m docs_site versions-check`),
# then runs the docs-site unit tests. The docs live at the repo root (docs_site/) and
# are not covered by the main gate (scripts/check.py) or the package test
# workflows, so this is their dedicated CI. A guard error fails the job.
name: Docs check

on:
  push:
    branches:
      - "main"
      - "dev"
    # Keep this list to files the site build, its dependency install, or its
    # tests actually consume. Package tests/changelogs and unrelated workflows
    # do not change the rendered site.
    paths:
      - "docs_site/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "packages/py/citry/citry/**"
      - "packages/py/citry/pyproject.toml"
      - "packages/py/citry_core/citry_core/**"
      - "packages/py/citry_core/pyproject.toml"
      - "packages/py/citry_ui/citry_ui/**"
      - "packages/py/citry_ui/pyproject.toml"
      - "packages/py/pygments_citry/pygments_citry/**"
      - "packages/py/pygments_citry/pyproject.toml"
      - "packages/protocol/diagnostics/**"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/citry-core-wheel/**"
      - "scripts/citry_core_wheel.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/repo--docs-check.yml"
      - ".gitmodules"
  pull_request:
    # `closed` starts a run in this PR's concurrency group, which cancels the
    # PR's queued or running checks once it merges or closes; every job
    # skips on that event, so the cancelling run needs no runner.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs_site/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "packages/py/citry/citry/**"
      - "packages/py/citry/pyproject.toml"
      - "packages/py/citry_core/citry_core/**"
      - "packages/py/citry_core/pyproject.toml"
      - "packages/py/citry_ui/citry_ui/**"
      - "packages/py/citry_ui/pyproject.toml"
      - "packages/py/pygments_citry/pygments_citry/**"
      - "packages/py/pygments_citry/pyproject.toml"
      - "packages/protocol/diagnostics/**"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/citry-core-wheel/**"
      - "scripts/citry_core_wheel.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/repo--docs-check.yml"
      - ".gitmodules"
  workflow_dispatch:

# A newer run cancels an older one for the same pull request, or for the same
# branch when both come from a push. Any other run gets a group named after
# its own run ID, so no newer run cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event_name == 'push' }}
permissions:
  contents: read

jobs:
  docs-check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Reuses the citry-core wheel built from these exact Rust sources by any
      # earlier run, and builds it only when no cached wheel matches. The docs
      # import `citry`, which needs the extension.
      - name: Restore or build the citry-core wheel
        id: core
        uses: ./.github/actions/citry-core-wheel

      # The `docs` extra pulls the guard/build dependencies (lxml, pagefind,
      # minify-html, ...). The site imports Citry and Citry UI, but not the LSP,
      # so do not make this docs-only job build every workspace package.
      - name: Install the workspace with the docs extra
        id: install
        env:
          CORE_WHEEL_DIR: ${{ steps.core.outputs.wheel-dir }}
          CORE_WHEEL_CACHE_KEY: ${{ steps.core.outputs.cache-key }}
        run: >-
          python scripts/citry_core_wheel.py install
          --wheel-dir "$CORE_WHEEL_DIR"
          --cache-key "$CORE_WHEEL_CACHE_KEY"
          -- --package citry-monorepo --package citry --package citry-ui --extra docs

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node tooling
        run: pnpm install --frozen-lockfile

      - name: Check the generated playground bundle
        run: pnpm --dir docs_site/_internal/frontend run check

      # Build the site and run the post-build guards. Exits non-zero on a render
      # failure or a guard error (add --strict to also fail on warnings).
      - name: Run the docs guard gate
        run: uv run --no-sync python -m docs_site build-check

      # Check the committed release snapshots under docs_site/versions/. They
      # load files from the shared docs_site/static/ folder, so a change there
      # can break an old version that the build above never renders. It needs
      # no build, so it also runs when an earlier check fails, and one CI run
      # reports both kinds of failure. It still needs the installed workspace.
      # Only the /static/ guard runs here (a few seconds); the slower link
      # guards run in the docs release workflow with the full versions-check.
      - name: Check the committed version snapshots
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync python -m docs_site versions-check --strict --guard snapshot_static_files

      # docs_site/examples holds the per-example regression tests
      # (test_example_*.py), which live beside each example's component.py/page.py;
      # they are collected here alongside the main docs-site suite. The e2e suite
      # (docs_site/tests/e2e) is skipped: it importorskips pytest-playwright, which
      # the `docs` extra does not install. The docs-e2e job below runs it instead.
      - name: Run the docs-site tests
        run: uv run --no-sync pytest docs_site/tests docs_site/examples

  # Browser end-to-end tests (docs_site/tests/e2e): build the real site
  # and drive it in a headless browser. Chromium only for PR-time speed.
  # Needs the root-owned `docs` extra (to build the site), the `citry`
  # package's `e2e` group (for Playwright), and the browser binary.
  docs-e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Reuses the citry-core wheel built from these exact Rust sources by any
      # earlier run, and builds it only when no cached wheel matches. The docs
      # import `citry`, which needs the extension.
      - name: Restore or build the citry-core wheel
        id: core
        uses: ./.github/actions/citry-core-wheel

      - name: Install the workspace with the docs extra
        env:
          CORE_WHEEL_DIR: ${{ steps.core.outputs.wheel-dir }}
          CORE_WHEEL_CACHE_KEY: ${{ steps.core.outputs.cache-key }}
        run: >-
          python scripts/citry_core_wheel.py install
          --wheel-dir "$CORE_WHEEL_DIR"
          --cache-key "$CORE_WHEEL_CACHE_KEY"
          -- --package citry-monorepo --package citry --package citry-ui --extra docs

      # The e2e group belongs to the citry workspace package. Install it
      # additively so uv retains the root project's docs extra from above, and
      # leave citry-core alone so uv keeps the wheel rather than building the
      # editable package.
      - name: Install the browser test dependencies
        run: uv sync --locked --package citry --group e2e --inexact --no-install-package citry-core

      # Two docs E2E cases run the pinned axe bundle directly from the root
      # Node workspace, so the browser job needs that runtime as well.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the browser accessibility runtime
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run the docs browser e2e tests
        run: uv run --no-sync pytest docs_site/tests/e2e --browser chromium

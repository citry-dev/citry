# The docs-site gate: builds the documentation site and runs the post-build
# guards (the same `python -m docs_site build-check` a contributor runs locally),
# then the docs-site unit tests. The docs live at the repo root (docs_site/) and
# are not covered by the main gate (scripts/check.py) or the package test
# workflows, so this is their dedicated CI. A guard error fails the job.
name: Docs check

on:
  push:
    branches:
      - "main"
      - "dev"
    # Keep this list to files the site build, its dependency install, or its
    # tests actually consume. Package tests/changelogs and unrelated workflows
    # do not change the rendered site.
    paths:
      - "docs_site/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "packages/py/citry/citry/**"
      - "packages/py/citry/pyproject.toml"
      - "packages/py/citry_core/citry_core/**"
      - "packages/py/citry_core/pyproject.toml"
      - "packages/py/citry_ui/citry_ui/**"
      - "packages/py/citry_ui/pyproject.toml"
      - "packages/py/pygments_citry/pygments_citry/**"
      - "packages/py/pygments_citry/pyproject.toml"
      - "packages/protocol/diagnostics/**"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build_citry_core_pyodide_wheel.py"
      - "packages/py/citry_core/pyodide-build.json"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/repo--docs-check.yml"
      - ".gitmodules"
  pull_request:
    paths:
      - "docs_site/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "packages/py/citry/citry/**"
      - "packages/py/citry/pyproject.toml"
      - "packages/py/citry_core/citry_core/**"
      - "packages/py/citry_core/pyproject.toml"
      - "packages/py/citry_ui/citry_ui/**"
      - "packages/py/citry_ui/pyproject.toml"
      - "packages/py/pygments_citry/pygments_citry/**"
      - "packages/py/pygments_citry/pyproject.toml"
      - "packages/protocol/diagnostics/**"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build_citry_core_pyodide_wheel.py"
      - "packages/py/citry_core/pyodide-build.json"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/repo--docs-check.yml"
      - ".gitmodules"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
permissions:
  contents: read

env:
  # Docs only need the workspace MSRV. Override the repository's moving nightly
  # so all Ubuntu docs jobs can reuse one stable citry-core build cache.
  RUSTUP_TOOLCHAIN: "1.96.0"
  # Share compiler objects across simultaneous cold jobs; rust-cache below also
  # preserves the assembled Cargo target directory between workflow runs.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Rust is needed because `uv sync` builds the citry_core extension through
      # the maturin backend, and the docs import `citry`, which depends on it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Set up shared Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Both docs jobs compile the same CPython 3.14 extension on Ubuntu.
          shared-key: docs-citry-core-py314
          add-job-id-key: false
          # Preserve the expensive compile even when a later docs guard fails.
          cache-on-failure: true

      # The `docs` extra pulls the guard/build dependencies (lxml, pagefind,
      # minify-html, ...). The site imports Citry and Citry UI, but not the LSP,
      # so do not make this docs-only job build every workspace package.
      - name: Install the workspace with the docs extra
        run: >-
          uv sync --locked --package citry-monorepo --package citry
          --package citry-ui --extra docs

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node tooling
        run: pnpm install --frozen-lockfile

      - name: Check the generated playground bundle
        run: pnpm --dir docs_site/_internal/frontend run check

      # Build the site and run the post-build guards. Exits non-zero on a render
      # failure or a guard error (add --strict to also fail on warnings).
      - name: Run the docs guard gate
        run: uv run --no-sync python -m docs_site build-check

      # docs_site/examples holds the per-example regression tests
      # (test_example_*.py), which live beside each example's component.py/page.py;
      # they are collected here alongside the main docs-site suite. The e2e suite
      # (docs_site/tests/e2e) is skipped: it importorskips pytest-playwright, which
      # the `docs` extra does not install. The docs-e2e job below runs it instead.
      - name: Run the docs-site tests
        run: uv run --no-sync pytest docs_site/tests docs_site/examples

  # Browser end-to-end tests (docs_site/tests/e2e): build the real site
  # and drive it in a headless browser. Chromium only for PR-time speed.
  # Needs the root-owned `docs` extra (to build the site), the `citry`
  # package's `e2e` group (for Playwright), and the browser binary.
  docs-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: wasm32-unknown-emscripten

      - name: Set up shared Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: docs-citry-core-py314
          add-job-id-key: false
          cache-on-failure: true

      - name: Install the workspace with the docs extra
        run: >-
          uv sync --locked --package citry-monorepo --package citry
          --package citry-ui --extra docs

      # The local authoring fixture exercises workspace Citry and Citry UI. Its
      # Rust extension must come from one PyEmscripten wheel built from this
      # checkout; rebuilding it in the uvicorn factory would make every reload
      # pay the cross-compilation cost and could mix workspace/published bytes.
      - name: Restore the pinned Pyodide cross environment
        id: pyodide-xbuildenv
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/citry-pyodide-xbuildenv
          key: pyodide-314.0.3-python-3.14.2-emscripten-5.0.3-rust-1.96.0-cli-0.5.0-build-0.37.0

      - name: Install the pinned Pyodide cross environment
        if: ${{ steps.pyodide-xbuildenv.outputs.cache-hit != 'true' }}
        env:
          CITRY_XBUILDENV: ${{ runner.temp }}/citry-pyodide-xbuildenv
        run: |
          PYODIDE_XBUILDENV_PATH="$CITRY_XBUILDENV" uvx --python 3.14.2 \
            --from pyodide-cli==0.5.0 \
            --with pyodide-build==0.37.0 \
            pyodide xbuildenv install 314.0.3 --path "$CITRY_XBUILDENV"
          PYODIDE_XBUILDENV_PATH="$CITRY_XBUILDENV" uvx --python 3.14.2 \
            --from pyodide-cli==0.5.0 \
            --with pyodide-build==0.37.0 \
            pyodide xbuildenv install-emscripten --path "$CITRY_XBUILDENV"

      - name: Save the pinned Pyodide cross environment
        if: ${{ steps.pyodide-xbuildenv.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/citry-pyodide-xbuildenv
          key: pyodide-314.0.3-python-3.14.2-emscripten-5.0.3-rust-1.96.0-cli-0.5.0-build-0.37.0

      - name: Restore the workspace Citry Core Pyodide wheel
        id: workspace-core-wheel
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/citry-playground-core
          key: docs-playground-core-pyemscripten-pyodide-314.0.3-python-3.14.2-emscripten-5.0.3-rust-1.96.0-cli-0.5.0-build-0.37.0-${{ hashFiles('packages/py/citry_core/**', 'packages/py/citry_core/pyodide-build.json', 'crates/**', 'third_party/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build_citry_core_pyodide_wheel.py') }}

      - name: Build the workspace Citry Core Pyodide wheel once
        if: ${{ steps.workspace-core-wheel.outputs.cache-hit != 'true' }}
        env:
          CITRY_XBUILDENV: ${{ runner.temp }}/citry-pyodide-xbuildenv
        run: |
          set -euo pipefail
          source_epoch=$(git show -s --format=%ct HEAD)
          python scripts/build_citry_core_pyodide_wheel.py \
            --source packages/py/citry_core \
            --out-dir "${{ runner.temp }}/citry-playground-core" \
            --xbuildenv-path "$CITRY_XBUILDENV" \
            --cargo-target-dir "${{ runner.temp }}/cargo-pyemscripten" \
            --cargo-home "$CARGO_HOME" \
            --source-date-epoch "$source_epoch"

      - name: Save the workspace Citry Core Pyodide wheel
        if: ${{ steps.workspace-core-wheel.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/citry-playground-core
          key: docs-playground-core-pyemscripten-pyodide-314.0.3-python-3.14.2-emscripten-5.0.3-rust-1.96.0-cli-0.5.0-build-0.37.0-${{ hashFiles('packages/py/citry_core/**', 'packages/py/citry_core/pyodide-build.json', 'crates/**', 'third_party/**', 'Cargo.toml', 'Cargo.lock', 'scripts/build_citry_core_pyodide_wheel.py') }}

      - name: Select the workspace browser runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          core_wheels=("${{ runner.temp }}/citry-playground-core/"citry_core-*.whl)
          if [[ ${#core_wheels[@]} -ne 1 || ! -f ${core_wheels[0]} ]]; then
            printf 'Expected exactly one cached workspace Core wheel, found: %s\n' "${core_wheels[*]}" >&2
            exit 1
          fi
          echo "CITRY_PLAYGROUND_CORE_WHEEL=${core_wheels[0]}" >> "$GITHUB_ENV"

      # The e2e group belongs to the citry workspace package. Install it
      # additively so uv retains the root project's docs extra from above.
      - name: Install the browser test dependencies
        run: uv sync --locked --package citry --group e2e --inexact

      # Two docs E2E cases run the pinned axe bundle directly from the root
      # Node workspace, so the browser job needs that runtime as well.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install the browser accessibility runtime
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run the docs browser e2e tests
        run: uv run --no-sync pytest docs_site/tests/e2e --browser chromium

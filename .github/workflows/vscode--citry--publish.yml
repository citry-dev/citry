# Qualify and publish the universal Citry VS Code extension.
#
# The repository release controller qualifies one exact VSIX, then sends that
# retained bundle back here for both extension registries.
name: Publish Citry for VS Code
run-name: >-
  ${{ inputs.operation == 'promote'
      && format('Publish vscode-citry for candidate {0}', inputs.candidate_id)
      || format('Qualify vscode-citry for candidate {0}', inputs.candidate_id) }}

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [qualify, promote]
      release_commit:
        required: true
        type: string
      candidate_id:
        required: true
        type: string
      workspace_dependencies:
        required: false
        type: string
      qualification_run_id:
        required: false
        type: string
      qualification_artifact_id:
        required: false
        type: string
      qualification_artifact_digest:
        required: false
        type: string

permissions:
  contents: read

env:
  EXTENSION_DIR: packages/editors/vscode
  NODE_VERSION: "22"
  PRETTIER_VSCODE_VERSION: "12.4.0"
  PRETTIER_VSCODE_SHA256: "46d22a567b35ebe5bdffd7280457742cd67e65d7e1b250bb775ab2be86479a42"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      filename: ${{ steps.package-version.outputs.filename }}
      lsp_version: ${{ steps.package-version.outputs.lsp_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - name: Read the qualified extension versions
        id: package-version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          OPERATION: ${{ inputs.operation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          # Bind qualification's checkout to GitHub's authenticated run SHA.
          if [ "$OPERATION" = "qualify" ]; then test "$GITHUB_SHA" = "$RELEASE_COMMIT"; fi
          pkg_version=$(node -p "require('./$EXTENSION_DIR/package.json').version")
          lsp_version=$(node -p "require('./$EXTENSION_DIR/package.json').citry.lspVersion")
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "filename=citry-dev.citry-$pkg_version.vsix" >> "$GITHUB_OUTPUT"
          echo "lsp_version=$lsp_version" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ inputs.operation == 'qualify' }}
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install the locked Node workspace
        run: pnpm install --frozen-lockfile
      - name: Run the extension checks
        run: pnpm --dir "$EXTENSION_DIR" run check
      - name: Build the exact VSIX
        run: |
          pnpm --dir "$EXTENSION_DIR" run package
          mv "$EXTENSION_DIR/dist/citry.vsix" "$EXTENSION_DIR/dist/${{ needs.verify-version.outputs.filename }}"
          python scripts/verify_vscode_citry_distribution.py --dist-dir "$EXTENSION_DIR/dist"
      - uses: actions/setup-python@v7
        if: contains(inputs.workspace_dependencies, 'citry-lsp')
        with:
          python-version: "3.14"
      - name: Install uv
        if: contains(inputs.workspace_dependencies, 'citry-lsp')
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
      - name: Build selected workspace dependencies for candidate smoke tests
        if: contains(inputs.workspace_dependencies, 'citry-lsp')
        shell: bash
        run: |
          selected=",${{ inputs.workspace_dependencies }},"
          mkdir -p candidate-dependencies
          if [[ "$selected" == *,citry-core,* ]]; then
            git submodule update --init --recursive
            uv build --package citry-core --wheel --out-dir candidate-dependencies
          fi
          if [[ "$selected" == *,citry,* ]]; then
            uv build --package citry --wheel --out-dir candidate-dependencies
          fi
          uv build --package citry-lsp --wheel --out-dir candidate-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: raw-vscode-citry-extension
          path: ${{ env.EXTENSION_DIR }}/dist/${{ needs.verify-version.outputs.filename }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: contains(inputs.workspace_dependencies, 'citry-lsp')
        with:
          name: candidate-vscode-dependencies
          path: candidate-dependencies/*.whl
          if-no-files-found: error

  smoke-installed-extension:
    if: ${{ inputs.operation == 'qualify' }}
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the locked Node workspace
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: raw-vscode-citry-extension
          path: dist
      - uses: actions/download-artifact@v8
        if: contains(inputs.workspace_dependencies, 'citry-lsp')
        with:
          name: candidate-vscode-dependencies
          path: candidate-dependencies
      - name: Verify the downloaded VSIX
        run: python scripts/verify_vscode_citry_distribution.py --dist-dir dist
      - name: Install the public language server in a clean environment
        if: ${{ !contains(inputs.workspace_dependencies, 'citry-lsp') }}
        env:
          CITRY_LSP_VERSION: ${{ needs.verify-version.outputs.lsp_version }}
        run: |
          python -m venv "$RUNNER_TEMP/citry-vscode-python"
          "$RUNNER_TEMP/citry-vscode-python/bin/python" -m pip install --disable-pip-version-check \
            "citry-lsp==$CITRY_LSP_VERSION"
          "$RUNNER_TEMP/citry-vscode-python/bin/python" -I - <<'PY'
          import importlib.metadata
          import os

          import citry_lsp

          assert importlib.metadata.version("citry-lsp") == os.environ["CITRY_LSP_VERSION"]
          assert citry_lsp.__file__ is not None
          PY
      - name: Install the selected language server in a clean environment
        if: contains(inputs.workspace_dependencies, 'citry-lsp')
        env:
          CITRY_LSP_VERSION: ${{ needs.verify-version.outputs.lsp_version }}
        run: |
          python -m venv "$RUNNER_TEMP/citry-vscode-python"
          "$RUNNER_TEMP/citry-vscode-python/bin/python" -m pip install --disable-pip-version-check \
            candidate-dependencies/*.whl
          "$RUNNER_TEMP/citry-vscode-python/bin/python" -I - <<'PY'
          import importlib.metadata
          import os

          import citry_lsp

          assert importlib.metadata.version("citry-lsp") == os.environ["CITRY_LSP_VERSION"]
          assert citry_lsp.__file__ is not None
          PY
      - name: Extract the verified extension
        run: |
          mkdir "$RUNNER_TEMP/citry-vsix" "$RUNNER_TEMP/citry-vscode-workspace" \
            "$RUNNER_TEMP/citry-vscode-missing-server" "$RUNNER_TEMP/prettier-vscode"
          unzip -q "dist/${{ needs.verify-version.outputs.filename }}" -d "$RUNNER_TEMP/citry-vsix"
      - name: Install the exact formatter used by the embedded-language smoke
        run: |
          curl --fail --location --silent --show-error --compressed \
            "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/esbenp/vsextensions/prettier-vscode/$PRETTIER_VSCODE_VERSION/vspackage" \
            --output "$RUNNER_TEMP/prettier-vscode.vsix"
          echo "$PRETTIER_VSCODE_SHA256  $RUNNER_TEMP/prettier-vscode.vsix" | sha256sum --check
          unzip -q "$RUNNER_TEMP/prettier-vscode.vsix" -d "$RUNNER_TEMP/prettier-vscode"
          node - <<'NODE'
          const manifest = require(`${process.env.RUNNER_TEMP}/prettier-vscode/extension/package.json`);
          if (
            manifest.publisher !== "esbenp" ||
            manifest.name !== "prettier-vscode" ||
            manifest.version !== process.env.PRETTIER_VSCODE_VERSION
          ) {
            throw new Error("downloaded formatter identity does not match the qualification pin");
          }
          NODE
      - name: Exercise the installed VSIX against public citry-lsp
        env:
          CITRY_VSCODE_EXTENSION_DIR: ${{ runner.temp }}/citry-vsix/extension
          CITRY_VSCODE_PRETTIER_EXTENSION_DIR: ${{ runner.temp }}/prettier-vscode/extension
          CITRY_VSCODE_SMOKE_FORMATTING: "1"
          CITRY_VSCODE_SMOKE_PYTHON: ${{ runner.temp }}/citry-vscode-python/bin/python
          CITRY_VSCODE_SMOKE_WORKSPACE: ${{ runner.temp }}/citry-vscode-workspace
        run: xvfb-run -a node "$EXTENSION_DIR/tests/integration/run.mjs"
      - name: Exercise the missing-server setup path
        env:
          CITRY_VSCODE_EXTENSION_DIR: ${{ runner.temp }}/citry-vsix/extension
          CITRY_VSCODE_EXPECT_UNAVAILABLE: "1"
          CITRY_VSCODE_SMOKE_PYTHON: ${{ runner.temp }}/citry-python-does-not-exist
          CITRY_VSCODE_SMOKE_WORKSPACE: ${{ runner.temp }}/citry-vscode-missing-server
        run: xvfb-run -a node "$EXTENSION_DIR/tests/integration/run.mjs"

  verify-extension:
    if: ${{ inputs.operation == 'qualify' }}
    needs: [verify-version, build, smoke-installed-extension]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/download-artifact@v8
        with:
          name: raw-vscode-citry-extension
          path: dist
      - name: Verify and stage the closed release artifact
        run: >-
          python scripts/verify_vscode_citry_distribution.py
          --dist-dir dist
          --stage-output-dir verified
      - name: Attest the qualified VSIX
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            verified/*.vsix
            verified/release-inventory.json
      - name: Upload the only bundle the release controller may promote
        uses: actions/upload-artifact@v7
        with:
          name: verified-vscode-citry-extension
          path: verified
          if-no-files-found: error
          retention-days: 30

  select-qualification:
    name: Verify the selected candidate artifact
    if: ${{ inputs.operation == 'promote' }}
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ inputs.qualification_run_id }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.qualification_run_id }}
      artifact_id: ${{ inputs.qualification_artifact_id }}
      artifact_digest: ${{ inputs.qualification_artifact_digest }}
      head_sha: ${{ inputs.release_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Require the trusted qualification for these exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ inputs.qualification_artifact_digest }}
        run: >-
          python scripts/release.py verify-qualification
          --repository "$GITHUB_REPOSITORY"
          --package vscode-citry
          --commit "$RELEASE_COMMIT"
          --run-id "$QUALIFICATION_RUN_ID"
          --artifact-id "$QUALIFICATION_ARTIFACT_ID"
          --artifact-digest "$QUALIFICATION_ARTIFACT_DIGEST"

  release:
    name: Promote qualified bytes to both extension registries
    if: ${{ inputs.operation == 'promote' }}
    needs: [verify-version, select-qualification]
    runs-on: ubuntu-latest
    concurrency:
      group: vscode-citry-registry-release
      cancel-in-progress: false
    environment: vscode-marketplaces
    env:
      EXTENSION_VERSION: ${{ needs.verify-version.outputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_TAG: vscode-citry@${{ needs.verify-version.outputs.version }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      closeout_id: ${{ steps.closeout.outputs.artifact-id }}
      closeout_digest: ${{ steps.closeout.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - name: Require the qualified commit to remain on main
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.select-qualification.outputs.head_sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Download the immutable qualification archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.select-qualification.outputs.artifact_id }}/zip" \
            --output qualification.zip
      - name: Verify GitHub's digest and the qualified VSIX again
        run: >-
          python scripts/verify_vscode_citry_distribution.py
          --promote-archive qualification.zip
          --artifact-digest '${{ needs.select-qualification.outputs.artifact_digest }}'
          --promotion-output-dir verified
      - name: Record the promoted qualification
        run: |
          jq -n \
            --arg run_id '${{ needs.select-qualification.outputs.run_id }}' \
            --arg run_url '${{ needs.select-qualification.outputs.run_url }}' \
            --arg artifact_digest '${{ needs.select-qualification.outputs.artifact_digest }}' \
            --arg head_sha '${{ needs.select-qualification.outputs.head_sha }}' \
            '{run_id: $run_id, run_url: $run_url, artifact_digest: $artifact_digest, head_sha: $head_sha}' \
            > verified/qualification-provenance.json
      - name: Require registry credentials and read GitHub Release state
        id: public-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$VSCE_PAT" || { echo "::error::VSCE_PAT is not configured"; exit 1; }
          test -n "$OVSX_PAT" || { echo "::error::OVSX_PAT is not configured"; exit 1; }
          release_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in
            404) echo "release_exists=false" >> "$GITHUB_OUTPUT" ;;
            200) echo "release_exists=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not read GitHub Release $RELEASE_TAG; HTTP $release_status"; exit 1 ;;
          esac
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install the locked Visual Studio Marketplace client
        run: pnpm install --frozen-lockfile
      - name: Publish the qualified VSIX to Visual Studio Marketplace
        run: >-
          pnpm --dir "$EXTENSION_DIR" exec vsce publish
          --packagePath "$GITHUB_WORKSPACE/verified/${{ needs.verify-version.outputs.filename }}"
          --skip-duplicate
      - name: Publish the same VSIX to Open VSX
        run: >-
          pnpm dlx ovsx@1.1.1 -p "$OVSX_PAT" publish
          "$GITHUB_WORKSPACE/verified/${{ needs.verify-version.outputs.filename }}"
          --skip-duplicate
      - name: Verify both public registry versions
        run: |
          marketplace_url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/citry-dev/vsextensions/citry/$EXTENSION_VERSION/vspackage"
          open_vsx_url="https://open-vsx.org/api/citry-dev/citry/$EXTENSION_VERSION"
          for attempt in $(seq 1 20); do
            marketplace_status=$(curl --compressed --location --silent --show-error --output marketplace.vsix --write-out '%{http_code}' "$marketplace_url")
            open_vsx_status=$(curl --silent --show-error --output open-vsx.json --write-out '%{http_code}' "$open_vsx_url")
            if [ "$marketplace_status" = "200" ] && [ "$open_vsx_status" = "200" ]; then
              test "$(jq -r '.namespace' open-vsx.json)" = "citry-dev"
              test "$(jq -r '.name' open-vsx.json)" = "citry"
              test "$(jq -r '.version' open-vsx.json)" = "$EXTENSION_VERSION"
              open_vsx_download=$(jq -r '.files.download' open-vsx.json)
              curl --fail --location --silent --show-error "$open_vsx_download" --output open-vsx.vsix
              expected_sha=$(sha256sum "verified/${{ needs.verify-version.outputs.filename }}" | cut -d' ' -f1)
              test "$(sha256sum marketplace.vsix | cut -d' ' -f1)" = "$expected_sha"
              test "$(sha256sum open-vsx.vsix | cut -d' ' -f1)" = "$expected_sha"
              jq -n \
                --arg marketplace "$marketplace_url" \
                --arg open_vsx "$open_vsx_url" \
                --arg version "$EXTENSION_VERSION" \
                '{version: $version, visual_studio_marketplace: $marketplace, open_vsx: $open_vsx}' \
                > verified/registry-verification.json
              exit 0
            fi
            echo "registry propagation attempt $attempt: marketplace=$marketplace_status open-vsx=$open_vsx_status"
            sleep 15
          done
          echo "::error::extension version did not become public in both registries"
          exit 1
      - name: Attest the promotion of the qualified bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            verified/*.vsix
            verified/release-inventory.json
            verified/qualification-provenance.json
            verified/registry-verification.json
      - name: Prepare the verified GitHub Release files
        run: |
          mkdir release-closeout
          cp verified/*.vsix verified/release-inventory.json verified/qualification-provenance.json verified/registry-verification.json release-closeout/
      - name: Retain the verified release files for closeout
        id: closeout
        uses: actions/upload-artifact@v7
        with:
          name: release-closeout-${{ github.run_attempt }}
          path: release-closeout/*
          if-no-files-found: error
          retention-days: 7

  tag:
    needs: [verify-version, release]
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-maintenance
    env:
      PACKAGE: vscode-citry
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_TAG: vscode-citry@${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the package source and existing tag before requesting write access
        run: >-
          python -m scripts.release_tag validate
          --package "$PACKAGE" --release-commit "$RELEASE_COMMIT"
          --release-tag "$RELEASE_TAG"
      - name: Mint the dedicated release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: citry
          permission-contents: write
      - name: Create or verify the final annotated tag
        env:
          RELEASE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python -m scripts.release_tag create
          --package "$PACKAGE" --release-commit "$RELEASE_COMMIT"
          --release-tag "$RELEASE_TAG"

  closeout:
    name: Create the GitHub Release and notify
    needs: [verify-version, release, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: vscode-citry@${{ needs.verify-version.outputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the exact verified closeout archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.release.outputs.closeout_id }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output closeout.zip
      - name: Verify the transferred release files
        env:
          ARTIFACT_DIGEST: ${{ needs.release.outputs.closeout_digest }}
        run: >-
          python -m scripts.release_closeout
          --archive closeout.zip --artifact-digest "$ARTIFACT_DIGEST"
          --release-commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION"
          --output-dir release-assets
      - name: Verify existing GitHub Release state
        id: public-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_github_release
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --assets-dir release-assets --github-output "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        if: steps.public-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG"
          --verify-tag --generate-notes
      - name: Verify the completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.verify_github_release
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --assets-dir release-assets --require-existing
      - name: Start the Discord release notification
        if: steps.public-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches"
          -f event_type=citry-release-published
          -f "client_payload[tag]=$RELEASE_TAG"

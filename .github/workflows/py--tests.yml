# Run tests for all Python packages
name: Python tests

on:
  push:
    branches:
      - "main"
      - "dev"
    # Run when an input to a Python, browser, or distribution-contract job changes.
    paths:
      - "packages/py/**"
      - "packages/js/citry-client/**"
      - "packages/protocol/**"
      - "benchmarks/i18n.py"
      - "benchmarks/native_build.py"
      - "scripts/build_citry_core_pyodide_wheel.py"
      - "scripts/build_constraints.py"
      - "scripts/release_links.py"
      - "scripts/select_citry_core_qualification.py"
      - "scripts/sync_protocol_python.py"
      - "scripts/verify_citry_core_distribution.py"
      - "scripts/verify_citry_distribution.py"
      - "scripts/verify_citry_lsp_distribution.py"
      - "scripts/verify_citry_ui_distribution.py"
      - "scripts/verify_pygments_citry_distribution.py"
      - "scripts/verify_wheel_size.py"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/install-rust/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "README.md" # the citry wheel's metadata includes the root README
      - ".github/workflows/py--tests.yml"
      - ".github/workflows/py--citry-ui--publish.yml"
      - ".github/workflows/py--pygments-citry--publish.yml"
      - ".gitmodules"
  pull_request:
    # `closed` starts a run in this PR's concurrency group, which cancels the
    # PR's queued or running checks once it merges or closes; every job
    # skips on that event, so the cancelling run needs no runner.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "packages/py/**"
      - "packages/js/citry-client/**"
      - "packages/protocol/**"
      - "benchmarks/i18n.py"
      - "benchmarks/native_build.py"
      - "scripts/build_citry_core_pyodide_wheel.py"
      - "scripts/build_constraints.py"
      - "scripts/release_links.py"
      - "scripts/select_citry_core_qualification.py"
      - "scripts/sync_protocol_python.py"
      - "scripts/verify_citry_core_distribution.py"
      - "scripts/verify_citry_distribution.py"
      - "scripts/verify_citry_lsp_distribution.py"
      - "scripts/verify_citry_ui_distribution.py"
      - "scripts/verify_pygments_citry_distribution.py"
      - "scripts/verify_wheel_size.py"
      - "crates/**"
      - "third_party/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/install-rust/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "README.md" # the citry wheel's metadata includes the root README
      - ".github/workflows/py--tests.yml"
      - ".github/workflows/py--citry-ui--publish.yml"
      - ".github/workflows/py--pygments-citry--publish.yml"
      - ".gitmodules"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

env:
  # pip before 26.2.2 still trusts the eMudhra (emSign) certificate
  # authorities, and the pip that setup-python provides can be older. pip checks
  # the #sha256 fragment itself, so this download is safe even if an attacker
  # controls the connection. pip 26.2.2 also adds the operating system's
  # certificate list, which may still hold the affected emSign root, so the
  # upgrade step then sets PIP_USE_DEPRECATED=legacy-certs for later steps and
  # pip uses only its own list. Older pip rejects that value, so it is not set
  # here.
  PIP_WHEEL: "https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

jobs:
  i18n-release-qualification:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the workspace
        run: uv sync --locked --all-packages

      - name: Build the release i18n runtime
        working-directory: packages/py/citry_core
        run: uv run --no-sync maturin develop --release

      - name: Run server and large-catalog qualification
        run: uv run --no-sync python benchmarks/i18n.py --json > i18n-qualification.json

      - name: Check browser payload budgets
        run: >-
          uv run --no-sync pytest
          packages/py/citry/tests/test_i18n_client.py::test_large_catalog_browser_payload_contains_only_the_requested_roots
          packages/py/citry/tests/test_i18n_client.py::test_one_hundred_message_partition_stays_within_the_release_budget

      - name: Upload i18n qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: i18n-release-qualification
          path: i18n-qualification.json
          if-no-files-found: error

  test:
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one interpreter must not hide portability results from
      # the other supported Windows and Linux versions.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest]
        # macOS is a smoke pair (oldest + newest Python) rather than the full
        # matrix, since macOS runners are costly and the maintainer develops on
        # darwin. The publish workflow builds the full macOS wheel set.
        include:
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.15" }
        # The Check workflow (repo--check.yml) runs this same suite on Linux,
        # with the Python its setup step names, on every pull request, so that
        # cell is left out here rather than run twice (test_ci_workflows.py
        # keeps the two in step).
        exclude:
          - { os: ubuntu-latest, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Rust is needed because `uv sync` builds the citry_core extension through
      # the maturin backend, so the toolchain must be in place before the sync.
      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # One command builds citry_core (maturin) and installs citry editable,
      # plus every package's dev group, from the locked workspace.
      - name: Install the workspace
        run: uv sync --locked --all-packages

      # The real-server reload tests start development servers, so they run
      # once, in one process rather than across the four pytest workers, in
      # check.py's "pytest reload servers" phase in the Check workflow.
      #
      # The Linux 3.11 cell renders with Citry's Python render path, the one
      # PyPy, Pyodide and free-threaded builds use, because no job runs the
      # suite on those interpreters. Every other cell keeps the native path.
      # The option is added here rather than as a matrix key, so the cell's
      # check name stays the same.
      #
      # The tests that render deep templates on a 128 KiB thread start an
      # interpreter each, so one Linux cell runs them on CI; a local run
      # always does (packages/py/citry/tests/test_native_render_depth.py).
      - name: Run Python tests
        env:
          CITRY_NATIVE_DEPTH_PROBES: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') && '1' || '' }}
        run: >-
          uv run --no-sync pytest
          -m "not e2e"
          --ignore packages/py/citry/tests/test_server_reload.py
          -n 4
          --dist loadfile
          --durations 30
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && '--python-render-path' || '' }}

  # Browser end-to-end tests, including Citry UI's co-located component tests,
  # run in Chromium for PR-time speed. The weekly cross-browser workflow runs
  # the same paths on all three engines. The `test` job above excludes `e2e`
  # explicitly and does not sync that dependency group.
  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the workspace with the e2e group
        run: uv sync --locked --all-packages --group e2e

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Set up pnpm for the pinned axe runtime
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Java for the pinned Nu checker
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install the root browser quality tools
        run: pnpm install --frozen-lockfile --filter citry-dev-tooling

      - name: Compile the pinned Tailwind coexistence fixture
        run: pnpm run citry-ui:quality-css

      - name: Verify checked-in Citry UI production assets
        run: pnpm run citry-ui:check-assets

      - name: Validate every shared Citry UI route with Nu
        shell: bash
        run: |
          rendered_dir="$RUNNER_TEMP/citry-ui-html"
          mkdir -p "$rendered_dir"
          uv run --no-sync python - <<'PY' > "$rendered_dir/scenarios.txt"
          from citry_ui.quality.scenarios import SCENARIOS, QualityTool

          for scenario in SCENARIOS:
              if QualityTool.HTML in scenario.tools:
                  print(scenario.id)
          PY
          while IFS= read -r scenario; do
            rendered="$rendered_dir/${scenario//./-}.html"
            uv run --no-sync python -m citry_ui.quality.routes "$scenario" --output "$rendered"
            uv run --no-sync python -m citry_ui.quality.validate_html \
              "$rendered" \
              --scenario "$scenario" \
              > "$rendered_dir/${scenario//./-}.nu.json"
          done < "$rendered_dir/scenarios.txt"

      - name: Run the browser e2e tests
        run: >-
          uv run --no-sync pytest
          packages/py/citry/tests/e2e
          packages/py/citry_ui/citry_ui/components
          packages/py/citry_ui/citry_ui/quality/tests/e2e
          packages/py/citry_ui/tests/e2e
          -m e2e
          --browser chromium
          -n 4
          --dist loadfile
          --durations 30

      - name: Build the Citry UI qualification record
        shell: bash
        run: |
          report_dir="$RUNNER_TEMP/citry-ui-quality"
          mkdir -p "$report_dir"
          cp -R "$RUNNER_TEMP/citry-ui-html" "$report_dir/html"
          uv run --no-sync python -m citry_ui.quality.scenarios > "$report_dir/scenarios.json"
          uv run --no-sync python -m citry_ui.quality.asset_report > "$report_dir/assets.json"
          uv run --no-sync python -m citry_ui.quality.exit_record \
            --inspect-browser \
            --result scenario-catalog=passed \
            --result chromium-accessibility=passed \
            --result css-coexistence=passed \
            --result nu-html=passed \
            --result assets=passed \
            --output "$report_dir/phase-7.5.json"

      - name: Upload Citry UI qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: citry-ui-pr-quality
          path: ${{ runner.temp }}/citry-ui-quality/
          if-no-files-found: error

  citry-ui-wheel-build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Build the Citry UI wheel and source distribution
        run: uv build --package citry-ui --out-dir dist

      - name: Build the matching local Citry wheel
        run: uv build --package citry --wheel --out-dir dist

      - name: Build the matching local Citry Core wheel
        run: >-
          uv build --package citry-core --wheel --out-dir dist
          --config-setting 'maturin.build-args=--features abi3-py311'

      # Release qualification runs this same wheel check, so a size or
      # file-list problem shows up on the pull request instead of mid-release.
      - name: Check the Citry wheel's size and file list against the release rules
        run: python scripts/verify_citry_distribution.py --check-wheel dist/citry-[0-9]*.whl

      - name: Check the Citry Core wheel against the release rules
        run: python scripts/verify_citry_core_distribution.py check-wheel --wheel "dist/citry_core-[0-9]*.whl"

      # These two packages build in seconds, so the job builds them only for
      # this check. It runs the release check on the wheel and sdist, including
      # a wheel rebuilt from the sdist; only the install smoke test is left to
      # release qualification.
      - name: Check the Citry LSP and Pygments distributions against the release rules
        run: |
          uv build --package citry-lsp --out-dir dist-citry-lsp
          python scripts/verify_citry_lsp_distribution.py --dist-dir dist-citry-lsp --skip-install-smoke
          uv build --package pygments-citry --out-dir dist-pygments-citry
          python scripts/verify_pygments_citry_distribution.py --dist-dir dist-pygments-citry --skip-install-smoke

      - name: Check the exact wheel inventory
        run: >-
          python packages/py/citry_ui/citry_ui/quality/qualify_wheel.py
          dist/citry_ui-*.whl

      - name: Rebuild and check the wheel from the source distribution
        shell: bash
        run: |
          # --no-config hides the root build pins, so pass them as a hashed constraints file.
          python scripts/build_constraints.py export "$RUNNER_TEMP/build-constraints.txt"
          uv build dist/citry_ui-*.tar.gz \
            --wheel \
            --out-dir dist-from-sdist \
            --no-config \
            --no-build-logs \
            --build-constraints "$RUNNER_TEMP/build-constraints.txt" \
            --require-hashes
          python packages/py/citry_ui/citry_ui/quality/qualify_wheel.py \
            dist-from-sdist/citry_ui-*.whl

      - name: Upload the exact Citry UI wheel
        uses: actions/upload-artifact@v7
        with:
          name: citry-ui-wheel
          path: |
            dist/citry_ui-*.whl
            dist/citry_ui-*.tar.gz
            dist/citry-[0-9]*.whl
            dist/citry_core-[0-9]*.whl
          if-no-files-found: error

  citry-ui-wheel-install:
    needs: citry-ui-wheel-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: citry-ui-wheel
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip to a release with the current certificate list
        run: |
          python -m pip install --disable-pip-version-check "$PIP_WHEEL"
          echo "PIP_USE_DEPRECATED=legacy-certs" >> "$GITHUB_ENV"

      - name: Prepare an offline wheelhouse
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          local_citry_wheels=(dist/citry-[0-9]*.whl)
          local_citry_core_wheels=(dist/citry_core-[0-9]*.whl)
          if [[ ${#local_citry_wheels[@]} -ne 1 || ! -f ${local_citry_wheels[0]} ]]; then
            printf 'Expected exactly one local Citry wheel, found: %s\n' "${local_citry_wheels[*]}" >&2
            exit 1
          fi
          if [[ ${#local_citry_core_wheels[@]} -ne 1 || ! -f ${local_citry_core_wheels[0]} ]]; then
            printf 'Expected exactly one local Citry Core wheel, found: %s\n' "${local_citry_core_wheels[*]}" >&2
            exit 1
          fi
          local_citry=${local_citry_wheels[0]}
          local_citry_core=${local_citry_core_wheels[0]}
          # Citry and Citry Core are released together with citry-ui, so
          # resolve them from the wheels built from this commit. Naming the
          # files makes pip use exactly these bytes for those two names, even
          # when PyPI has the same version; other dependencies still come
          # from PyPI.
          python -m pip download \
            --dest "$RUNNER_TEMP/wheelhouse" \
            dist/citry_ui-*.whl "$local_citry" "$local_citry_core"
          # The offline installs below rely on the wheelhouse holding the
          # local bytes, so fail here rather than test a published build.
          for wheel in "$local_citry" "$local_citry_core"; do
            cmp "$wheel" "$RUNNER_TEMP/wheelhouse/$(basename "$wheel")"
          done

      - name: Install and exercise the wheel with pip outside the checkout
        shell: bash
        run: |
          # This venv starts with the pip bundled in Python, which can predate the
          # legacy-certs option and would reject it. Its installs are offline, so
          # it never uses a certificate list.
          unset PIP_USE_DEPRECATED
          test_dir="$RUNNER_TEMP/citry-ui-pip-test"
          python -m venv "$test_dir"
          "$test_dir/bin/python" -m pip install \
            --no-index \
            --find-links "$RUNNER_TEMP/wheelhouse" \
            dist/citry_ui-*.whl
          cd "$RUNNER_TEMP"
          "$test_dir/bin/python" - <<'PY'
          import importlib.util
          import json

          import citry_ui
          from citry import Citry, Component
          from citry.ext.i18n import make_context

          app = Citry(
              mode="production",
              autodiscover=False,
              extensions_defaults={
                  "i18n": {
                      "source_locale": "en-US",
                      "locales": ("en-US",),
                      "catalogs": ("citry_ui_i18n",),
                  }
              },
          )
          app.register_library(citry_ui)

          class Page(Component):
              citry = app
              template = """
                <c-CButton>
                  Installed wheel
                </c-CButton>
                <c-CPagination c-pages="2" c-page="1" />
              """

          context = make_context(app, locale="en-US")
          html = str(Page().render(provides={"citry_i18n": context}))
          assert "Installed wheel" in html
          assert "Pagination" in html
          i18n = app.extensions.get_extension("i18n")
          assert i18n.for_context(context).tr("citry-ui-pagination-label") == "Pagination"
          artifact = json.loads(i18n._compiled_catalog.artifact_json())
          assert artifact["stats"]["parsed_catalogs"] == 0
          assert importlib.util.find_spec("citry_ui.quality") is None
          assert importlib.util.find_spec("citry_ui.components.ctabs.tests") is None
          PY
          "$test_dir/bin/python" -m pip install \
            --force-reinstall \
            --no-index \
            --find-links "$RUNNER_TEMP/wheelhouse" \
            "$GITHUB_WORKSPACE"/dist/citry_ui-*.whl
          "$test_dir/bin/python" -m pip uninstall --yes citry-ui
          cd "$RUNNER_TEMP"
          "$test_dir/bin/python" -c "import citry; import importlib.util; assert importlib.util.find_spec('citry_ui') is None"

      - name: Add the wheel to a clean uv project offline
        shell: bash
        run: |
          project_dir="$RUNNER_TEMP/citry-ui-uv-project"
          mkdir -p "$project_dir"
          cd "$project_dir"
          uv init --bare --python "${{ matrix.python-version }}"
          uv add \
            --offline \
            --find-links "$RUNNER_TEMP/wheelhouse" \
            "$GITHUB_WORKSPACE"/dist/citry_ui-*.whl
          uv run --offline python -c "import citry_ui; from citry import Citry; Citry(autodiscover=False).register_library(citry_ui)"

  citry-ui-wheel-browser:
    needs: citry-ui-wheel-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: citry-ui-wheel
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Upgrade pip to a release with the current certificate list
        run: |
          python -m pip install --disable-pip-version-check "$PIP_WHEEL"
          echo "PIP_USE_DEPRECATED=legacy-certs" >> "$GITHUB_ENV"

      - name: Prepare an offline wheelhouse with the matching local Citry
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          local_citry_wheels=(dist/citry-[0-9]*.whl)
          local_citry_core_wheels=(dist/citry_core-[0-9]*.whl)
          if [[ ${#local_citry_wheels[@]} -ne 1 || ! -f ${local_citry_wheels[0]} ]]; then
            printf 'Expected exactly one local Citry wheel, found: %s\n' "${local_citry_wheels[*]}" >&2
            exit 1
          fi
          if [[ ${#local_citry_core_wheels[@]} -ne 1 || ! -f ${local_citry_core_wheels[0]} ]]; then
            printf 'Expected exactly one local Citry Core wheel, found: %s\n' "${local_citry_core_wheels[*]}" >&2
            exit 1
          fi
          local_citry=${local_citry_wheels[0]}
          local_citry_core=${local_citry_core_wheels[0]}
          # Citry and Citry Core are released together with citry-ui, so
          # resolve them from the wheels built from this commit. Naming the
          # files makes pip use exactly these bytes for those two names, even
          # when PyPI has the same version; other dependencies still come
          # from PyPI.
          python -m pip download \
            --dest "$RUNNER_TEMP/wheelhouse" \
            dist/citry_ui-*.whl "$local_citry" "$local_citry_core"
          # The offline installs below rely on the wheelhouse holding the
          # local bytes, so fail here rather than test a published build.
          for wheel in "$local_citry" "$local_citry_core"; do
            cmp "$wheel" "$RUNNER_TEMP/wheelhouse/$(basename "$wheel")"
          done

      - name: Install the exact wheel and matching local Citry
        shell: bash
        run: |
          python -m pip install \
            --no-index \
            --find-links "$RUNNER_TEMP/wheelhouse" \
            dist/citry_ui-*.whl
          python -m pip install "playwright==1.64.1"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Smoke-test the installed artifact in Chromium
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import citry_ui
          from citry import Citry, Component
          from playwright.sync_api import sync_playwright

          app = Citry(autodiscover=False)
          app.register_library(citry_ui)

          class Page(Component):
              citry = app
              template = """
                <!doctype html>
                <html lang="en">
                  <head><meta charset="utf-8" /><c-css /></head>
                  <body>
                    <c-CTabs default_value="one" aria_label="Installed Tabs">
                      <c-CTab value="one">One</c-CTab>
                      <c-CTab value="two">Two</c-CTab>
                      <c-CTabPanel value="one">First panel</c-CTabPanel>
                      <c-CTabPanel value="two">Second panel</c-CTabPanel>
                    </c-CTabs>
                    <c-js />
                  </body>
                </html>
              """

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content(str(Page()), wait_until="load")
              page.wait_for_selector("[data-citry-tabs-initialized]")
              page.get_by_role("tab", name="Two").click()
              assert page.get_by_role("tabpanel", name="Two").is_visible()
              browser.close()
          PY

  # Keep a compact Vue Events/targeting contract in every supported engine on
  # pull requests. The scheduled cross-browser workflow retains the broader
  # all-e2e sweep.
  vue-conformance:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          prune-cache: true
          version: "0.13.5"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the workspace with the e2e group
        run: uv sync --locked --all-packages --group e2e

      - name: Install the ${{ matrix.browser }} browser
        run: uv run --no-sync playwright install --with-deps ${{ matrix.browser }}

      - name: Run compact Vue and i18n qualification on ${{ matrix.browser }}
        run: >-
          uv run --no-sync pytest
          packages/py/citry/tests/e2e/test_vue_events_default_e2e.py
          packages/py/citry/tests/e2e/test_vue_targeting_e2e.py
          packages/py/citry/tests/e2e/test_vue_listener_modifiers_e2e.py
          packages/py/citry/tests/e2e/test_i18n_vue_formatting_e2e.py::test_vue_i18n_large_catalog_switch_stays_atomic
          --browser ${{ matrix.browser }}

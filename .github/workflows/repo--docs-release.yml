# Build documentation from an immutable release tag and push the generated
# snapshot to a separate branch. The release maintainer opens and merges its PR;
# repo--docs-deploy.yml publishes the merged snapshot from main.
# The workflow does not bypass main's pull-request requirement.
name: Release docs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable citry@X.Y.Z tag to build or recover before deploying"
        required: true
        type: string

# Serialize snapshot preparation without cancelling a running build.
concurrency:
  group: release-docs
  cancel-in-progress: false

env:
  # Snapshot builds need only the workspace MSRV. Keep it fixed so release
  # docs reuse the same citry-core cache as the ordinary Pages workflows.
  RUSTUP_TOOLCHAIN: "1.96.0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # The public URL the built site targets (canonical, Open Graph, sitemap). Keep
  # in step with repo--docs-deploy.yml and the Pages custom domain in settings.
  DOCS_SITE_URL: "https://citry.dev/"
  # Subpath prefix for a project-Pages deploy (e.g. "/citry"); empty for a
  # custom-domain / root deploy.
  DOCS_BASE_PATH: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the canonical repo prepares snapshot branches; forks skip it.
    if: github.repository == 'citry-dev/citry'
    permissions:
      contents: write # to push the generated snapshot branch
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive
          # Full history so per-page git dates (sitemap <lastmod>, article
          # published/modified, footer "last updated") are accurate, and so
          # main can be fetched as the base for a snapshot branch.
          fetch-depth: 0
          ref: main

      - name: Require the documentation release controller from main
        run: test "$GITHUB_REF" = "refs/heads/main"

      # Manual recovery can be dispatched while the UI is showing another ref.
      # Always base the snapshot branch on the current default branch; the
      # immutable release source itself is opened separately by `build-tag`.
      - name: Check out the default branch as the snapshot base
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git submodule update --init --recursive

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Rust is needed because `uv sync` builds the citry_core extension through
      # the maturin backend, and the docs import `citry`, which depends on it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Set up shared Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: docs-citry-core-py314
          add-job-id-key: false
          cache-on-failure: true

      # `social-cards` adds Playwright so the per-page OG images render during the
      # snapshot preparation. The site imports Citry and Citry UI, but not
      # the LSP workspace package.
      - name: Install the workspace with docs + social-card extras
        run: >-
          uv sync --locked --package citry-monorepo --package citry
          --package citry-ui --extra docs --extra social-cards

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node tooling
        run: pnpm install --frozen-lockfile

      - name: Check the generated playground bundle
        run: pnpm --dir docs_site/_internal/frontend run check

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Require the current site to pass every strict guard
        run: uv run --no-sync python -m docs_site build-check --strict

      # Reuse rendered cards across deploys: they are content-addressed, so only
      # new or changed pages launch the browser.
      - name: Cache social-card images
        uses: actions/cache@v6
        with:
          path: docs_site/.cache/og
          key: og-cards-${{ hashFiles('docs_site/_internal/components/og_card.py', 'docs_site/content/**') }}
          restore-keys: |
            og-cards-

      - name: Require the completed Citry GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ inputs.release_tag }}
        run: |
          for attempt in {1..90}; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REF_NAME" \
              --jq 'select(.draft == false) | .html_url' \
              > release-url.txt 2>/dev/null && test -s release-url.txt; then
              cat release-url.txt
              exit 0
            fi
            sleep 10
          done
          echo "::error::the final GitHub Release $REF_NAME did not complete"
          exit 1

      - name: Configure git identity for the snapshot commit
        run: |
          git config user.name "citry-docs-bot"
          git config user.email "citry-docs-bot@users.noreply.github.com"

      - name: Build the version snapshot and prepare its pull request branch
        env:
          REF_NAME: ${{ inputs.release_tag }}
        run: |
          VERSION="${REF_NAME#citry@}"
          uv run --no-sync python -m docs_site build-tag "$REF_NAME"
          uv run --no-sync python -m docs_site versions-check
          git add docs_site/versions/
          if git diff --cached --quiet; then
            echo "The version snapshot is already on main." >> "$GITHUB_STEP_SUMMARY"
          else
            SNAPSHOT_BRANCH="docs/release-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$SNAPSHOT_BRANCH"
            git commit -m "docs: build $VERSION"
            git push origin "HEAD:refs/heads/$SNAPSHOT_BRANCH"
            echo "Snapshot prepared from $REF_NAME." >> "$GITHUB_STEP_SUMMARY"
            echo "Open and merge a [pull request](https://github.com/$GITHUB_REPOSITORY/compare/main...$SNAPSHOT_BRANCH?expand=1)." >> "$GITHUB_STEP_SUMMARY"
            echo "The main deployment workflow publishes the snapshot after merge." >> "$GITHUB_STEP_SUMMARY"
          fi

# Build an immutable release snapshot and verify public browser packages.
# A separate main-only job commits generated files with the release App.
name: Release docs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable citry@X.Y.Z tag to build or recover before deploying"
        required: true
        type: string

# Serialize snapshot preparation without cancelling a running build.
concurrency:
  group: release-docs
  cancel-in-progress: false

env:
  # Snapshot builds need only the workspace MSRV. Keep it fixed so release
  # docs reuse the same citry-core cache as the ordinary Pages workflows.
  RUSTUP_TOOLCHAIN: "1.96.0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # The public URL the built site targets (canonical, Open Graph, sitemap). Keep
  # in step with repo--docs-deploy.yml and the Pages custom domain in settings.
  DOCS_SITE_URL: "https://citry.dev/"
  # Subpath prefix for a project-Pages deploy (e.g. "/citry"); empty for a
  # custom-domain / root deploy.
  DOCS_BASE_PATH: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the canonical main workflow can prepare release updates.
    if: github.repository == 'citry-dev/citry' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive
          # Full history so per-page git dates (sitemap <lastmod>, article
          # published/modified, footer "last updated") are accurate, and so
          # the release tag can be opened by build-tag.
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Require the documentation release controller from main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Record the source main commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Rust is needed because `uv sync` builds the citry_core extension through
      # the maturin backend, and the docs import `citry`, which depends on it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Set up shared Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: docs-citry-core-py314
          add-job-id-key: false
          cache-on-failure: true

      # `social-cards` adds Playwright so the per-page OG images render during the
      # snapshot preparation. The site imports Citry and Citry UI, but not
      # the LSP workspace package.
      - name: Install the workspace with docs + social-card extras
        run: >-
          uv sync --locked --package citry-monorepo --package citry
          --package citry-ui --extra docs --extra social-cards --group e2e

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node tooling
        run: pnpm install --frozen-lockfile

      - name: Check the generated playground bundle
        run: pnpm --dir docs_site/_internal/frontend run check

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Require the current site to pass every strict guard
        run: uv run --no-sync python -m docs_site build-check --strict

      # Reuse rendered cards across deploys: they are content-addressed, so only
      # new or changed pages launch the browser.
      - name: Cache social-card images
        uses: actions/cache@v6
        with:
          path: docs_site/.cache/og
          key: og-cards-${{ hashFiles('docs_site/_internal/components/og_card.py', 'docs_site/content/**') }}
          restore-keys: |
            og-cards-

      - name: Require the completed Citry GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ inputs.release_tag }}
        run: |
          for attempt in {1..90}; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REF_NAME" \
              --jq 'select(.draft == false) | .html_url' \
              > release-url.txt 2>/dev/null && test -s release-url.txt; then
              cat release-url.txt
              exit 0
            fi
            sleep 10
          done
          echo "::error::the final GitHub Release $REF_NAME did not complete"
          exit 1

      - name: Update the browser runtime from published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ inputs.release_tag }}
        run: >-
          uv run --no-sync python scripts/update_playground_runtime.py
          --source-ref "$REF_NAME"
          --runtime docs_site/static/playground/runtime.json

      - name: Test the published browser runtime
        run: >-
          uv run --no-sync pytest docs_site/tests/e2e/test_playground_e2e.py
          -k published_runtime

      - name: Build the version snapshot
        env:
          REF_NAME: ${{ inputs.release_tag }}
        run: |
          uv run --no-sync python -m docs_site build-tag "$REF_NAME"
          uv run --no-sync python -m docs_site versions-check

      - name: Retain the verified generated files
        uses: actions/upload-artifact@v7
        with:
          name: release-site-update
          retention-days: 7
          include-hidden-files: true
          path: |
            docs_site/versions/
            docs_site/static/playground/runtime.json

  commit:
    needs: build
    runs-on: ubuntu-latest
    environment: release-maintenance
    permissions:
      contents: read
    steps:
      - name: Mint the dedicated release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: citry
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - name: Require the main commit that was validated
        env:
          BASE_SHA: ${{ needs.build.outputs.base_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "::error::main advanced during generation; rerun Release docs"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: release-site-update
          path: generated-site

      - name: Commit only generated documentation and runtime pins
        env:
          REF_NAME: ${{ inputs.release_tag }}
        run: |
          python scripts/apply_release_site_update.py generated-site
          git add -- docs_site/versions/ docs_site/static/playground/runtime.json
          if git diff --cached --quiet; then
            echo "The release site update is already on main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "citry-release[bot]"
          git config user.email "citry-release[bot]@users.noreply.github.com"
          git commit -m "docs: publish site updates for $REF_NAME"
          git push origin HEAD:refs/heads/main
          echo "Committed verified site updates; the main docs workflow deploys them." >> "$GITHUB_STEP_SUMMARY"

# Release the documentation for a new version tag: build that version's snapshot,
# commit it into docs_site/versions/ on the default branch (the committed-versions
# model, matching the committed docs_site/versions/versions.json), then assemble
# the full multi-version site and deploy it to GitHub Pages.
#
# This is the release counterpart to repo--docs-deploy.yml (which redeploys the
# current site on every push to main). It runs only on a version tag push
# (citry@X.Y.Z) or a manual dispatch.
#
# REVIEW BEFORE THE FIRST REAL RELEASE (see the deploy notes in the PR):
#   - Commit-back token: the build-and-commit step pushes to the default branch
#     using the default GITHUB_TOKEN (contents: write). If the default branch is
#     protected, that push is rejected. Switch to a GitHub App token or a PAT with
#     contents: write then (django-components' release-docs.yml shows the
#     create-github-app-token shape) and pass it to actions/checkout `token:`.
#   - Committed vs artifact-only: this commits every built snapshot to the repo.
#     To keep versions out of git instead, drop the commit-back step and build the
#     versions during assemble. citry's committed versions.json means committed is
#     the current model.
#   - The snapshot is built from the default branch's tip labelled as the tag
#     version. A release is tagged on that tip, so they coincide; if main advances
#     between tagging and this run, the snapshot reflects main's tip.
name: Release docs

on:
  push:
    tags:
      # Docs releases are the citry package's version tags (citry@X.Y.Z). A
      # sibling package's tag (e.g. citry-core@1.3.0) does not match, so it never
      # triggers a docs release.
      - "citry@[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Serialize with the main-push deploy (repo--docs-deploy.yml) through the shared
# "pages" group so two Pages deploys never overlap; never cancel an in-progress
# publish. The commit-back below carries [skip ci], so it does not re-trigger the
# main-push deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # The public URL the built site targets (canonical, Open Graph, sitemap). Keep
  # in step with repo--docs-deploy.yml and the Pages custom domain in settings.
  DOCS_SITE_URL: "https://citry.dev/"
  # Subpath prefix for a project-Pages deploy (e.g. "/citry"); empty for a
  # custom-domain / root deploy.
  DOCS_BASE_PATH: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the canonical repo commits snapshots and deploys; forks skip it.
    if: github.repository == 'citry-dev/citry'
    permissions:
      contents: write # to commit the built version snapshot back to the default branch
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive
          # Full history so per-page git dates (sitemap <lastmod>, article
          # published/modified, footer "last updated") are accurate, and so the
          # default branch can be checked out and pushed to below.
          fetch-depth: 0

      # A tagged run intentionally snapshots the default branch under the tag's
      # version label (see the policy note above). Select that source before
      # dependency installation so Python, Rust, docs, and the lockfile all come
      # from one revision rather than producing a mixed tag/main artifact.
      - name: Check out the snapshot source
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git submodule update --init --recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Rust is needed because `uv sync` builds the citry_core extension through
      # the maturin backend, and the docs import `citry`, which depends on it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # NOTE: keep in step with rust-toolchain.toml
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # `social-cards` adds Playwright so the per-page OG images render during the
      # assemble step's root build; `docs` is the build/guard dependency set.
      - name: Install the workspace with docs + social-card extras
        run: uv sync --locked --all-packages --extra docs --extra social-cards

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      # Reuse rendered cards across deploys: they are content-addressed, so only
      # new or changed pages launch the browser.
      - name: Cache social-card images
        uses: actions/cache@v4
        with:
          path: docs_site/.cache/og
          key: og-cards-${{ hashFiles('docs_site/_internal/components/og_card.py', 'docs_site/content/**') }}
          restore-keys: |
            og-cards-

      - name: Configure git identity for the commit-back
        run: |
          git config user.name "citry-docs-bot"
          git config user.email "citry-docs-bot@users.noreply.github.com"

      # Build the tagged version's snapshot into docs_site/versions/<version>/,
      # validate the whole version tree (versions-check), and commit it to the
      # default branch. The [skip ci] on the commit stops repo--docs-deploy.yml
      # from also firing on this push.
      - name: Build & commit the version snapshot
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#citry@}"
          echo "Releasing docs version: $VERSION"
          uv run --no-sync python -m docs_site build --docs-version "$VERSION" --alias latest
          uv run --no-sync python -m docs_site versions-check
          git add docs_site/versions/
          if git diff --cached --quiet; then
            echo "No version changes to commit (already built)."
          else
            git commit -m "docs: build $VERSION [skip ci]"
            git push origin main
          fi

      # Assemble the deploy artifact into ./site: the current version at the root
      # plus every committed versions/ snapshot (including the one just built)
      # mounted under /v/.
      - name: Assemble the site
        run: uv run --no-sync python -m docs_site assemble

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

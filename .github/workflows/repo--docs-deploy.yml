# Publish the documentation site to GitHub Pages (the upload-pages-artifact +
# deploy-pages model, not a gh-pages branch push). The build job assembles the
# multi-version site (current version at the root, committed snapshots under /v/)
# and renders per-page social cards with a headless browser; the deploy job
# publishes it. Runs on pushes to main and on demand.
#
# Operational setup (one-time, in repo Settings -> Pages): set the build source
# to "GitHub Actions". For the citry.dev custom domain, also set the custom
# domain there; the DOCS_SITE_URL below must match it. To deploy to project Pages
# at https://<owner>.github.io/citry/ instead, set DOCS_SITE_URL to that URL and
# DOCS_BASE_PATH to "/citry".
name: Deploy docs to Pages

on:
  push:
    branches:
      - "main"
    paths:
      - "docs_site/**"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "packages/py/citry/citry/**"
      - "packages/py/citry/pyproject.toml"
      - "packages/py/citry_core/citry_core/**"
      - "packages/py/citry_core/pyproject.toml"
      - "packages/py/citry_ui/citry_ui/**"
      - "packages/py/citry_ui/pyproject.toml"
      - "packages/py/pygments_citry/pygments_citry/**"
      - "packages/py/pygments_citry/pyproject.toml"
      - "packages/protocol/diagnostics/**"
      - "crates/**"
      - "third_party/**"
      - ".gitmodules"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/repo--docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One Pages deploy at a time; do not cancel an in-progress deploy (a half-applied
# publish is worse than waiting).
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Docs only need the workspace MSRV. Pin it so Pages and docs checks share a
  # stable citry-core build cache instead of invalidating it with each nightly.
  RUSTUP_TOOLCHAIN: "1.95.0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # The public URL the built site targets (canonical, Open Graph, sitemap). Keep
  # in step with the Pages custom domain in repo settings.
  DOCS_SITE_URL: "https://citry.dev/"
  # Subpath prefix for a project-Pages deploy (e.g. "/citry"); empty for a
  # custom-domain / root deploy.
  DOCS_BASE_PATH: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize the vendored Ruff submodule (a build/runtime dependency)
          submodules: recursive
          # Full history so per-page git dates (sitemap <lastmod>, article
          # published/modified, footer "last updated") are accurate. A shallow
          # clone makes every page report the checkout commit as its date.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Rust is needed because `uv sync` builds the citry_core extension through
      # the maturin backend, and the docs import `citry`, which depends on it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned 2026-08-18
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Set up shared Rust compiler cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: docs-citry-core-py314
          add-job-id-key: false
          cache-on-failure: true

      # `social-cards` adds Playwright so the per-page OG images render; `docs`
      # is the build/guard dependency set. The site imports Citry and Citry UI,
      # but does not need the LSP workspace package.
      - name: Install the workspace with docs + social-card extras
        run: >-
          uv sync --locked --package citry-monorepo --package citry
          --package citry-ui --extra docs --extra social-cards

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node tooling
        run: pnpm install --frozen-lockfile

      - name: Check the generated playground bundle
        run: pnpm --dir docs_site/_internal/frontend run check

      - name: Install the chromium browser
        run: uv run --no-sync playwright install --with-deps chromium

      # Reuse rendered cards across deploys: they are content-addressed, so only
      # new or changed pages launch the browser.
      - name: Cache social-card images
        uses: actions/cache@v6
        with:
          path: docs_site/.cache/og
          key: og-cards-${{ hashFiles('docs_site/_internal/components/og_card.py', 'docs_site/content/**') }}
          restore-keys: |
            og-cards-

      # Assemble the deploy artifact into ./site: the current version at the root
      # plus any committed versions/ snapshots mounted under /v/.
      - name: Assemble the site
        run: uv run --no-sync python -m docs_site assemble

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

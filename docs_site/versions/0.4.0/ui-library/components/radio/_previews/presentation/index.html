  :where([data-citry-ui-part="radio-group"]) {

    --_cui-radio-item-gap: var(--cui-radio-item-gap, 0.55rem);
    --_cui-radio-label-gap: var(--cui-radio-label-gap, 0.2rem);
    --_cui-radio-disabled-opacity: var(--cui-radio-disabled-opacity, 0.52);
    display: grid;
    gap: var(--_cui-radio-group-gap);
    min-inline-size: 0;
    margin: 0;
    padding: 0;
    border: 0;
    color: var(--_cui-radio-foreground);
  }

  :where([data-citry-ui-part="radio-group"][data-orientation="horizontal"]) {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), max-content));
    align-items: start;
  }

  :where([data-citry-ui-part="legend"]) {
    margin-block-end: 0.25rem;
    padding: 0;
    font-weight: 600;
  }

  :where([data-citry-ui-part="radio"]) {
    display: inline-flex;
    align-items: flex-start;
    min-inline-size: 0;
    gap: var(--_cui-radio-item-gap);
  }

  :where([data-citry-ui-part="input"][type="radio"]) {
    flex: none;

    background: var(--_cui-radio-active-color);
    box-shadow: inset 0 0 0 0.27em Canvas;
  }

    border-color: var(--_cui-radio-active-color);
    background: radial-gradient(
      circle,
      var(--_cui-radio-active-color) 0 34%,
      transparent 38%
    );
  }

  :where([data-citry-ui-part="input"][type="radio"]:focus-visible) {
    outline: 0.1875rem solid color-mix(

      var(--_cui-radio-focus-color) 42%,
      transparent
    );
    outline-offset: 0.125rem;
  }

  :where([data-citry-ui-part="radio-group"][data-invalid] [data-citry-ui-part="input"]) {
    border-color: var(--_cui-radio-invalid-color);
  }

  :where([data-citry-ui-part="radio"][data-disabled]) {
    opacity: var(--_cui-radio-disabled-opacity);
  }

  :where([data-citry-ui-part="radio"][data-disabled] [data-citry-ui-part="input"]),
  :where([data-citry-ui-part="radio-group"]:disabled [data-citry-ui-part="input"]) {
    cursor: not-allowed;
  }

  :where([data-citry-ui-part="body"]) {
    display: grid;
    min-inline-size: 0;
    gap: var(--_cui-radio-label-gap);
  }

  :where([data-citry-ui-part="label"], [data-citry-ui-part="description"]) {
    min-inline-size: 0;
    overflow-wrap: anywhere;
  }

  :where([data-citry-ui-part="label"]) {
    cursor: pointer;
  }

  :where([data-citry-ui-part="description"]) {
    color: color-mix(in srgb, currentColor 68%, transparent);
    font-size: 0.82em;
  }

  :where([data-citry-ui-part="radio-group"][data-label-pos="start"] [data-citry-ui-part="input"]) {
    order: 2;
  }

  :where([data-citry-ui-part="radio-group"][data-label-pos="start"] [data-citry-ui-part="body"]) {
    order: 1;
  }

  :where([data-citry-ui-part="radio-group"][data-size="sm"]) {
    --_cui-radio-control-size: var(--cui-radio-control-size, 1rem);
    font-size: 0.875rem;
  }

  :where([data-citry-ui-part="radio-group"][data-size="lg"]) {
    --_cui-radio-control-size: var(--cui-radio-control-size, 1.3rem);
    font-size: 1.0625rem;
  }

      forced-color-adjust: auto;
    }

    }
  }

  @media print {
    :where([data-citry-ui-part="input"][type="radio"]) {
      border-color: CanvasText;
    }
  }

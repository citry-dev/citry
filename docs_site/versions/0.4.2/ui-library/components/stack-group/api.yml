schema_version: 1
family: flow-layout

components:
  - CStack
  - CGroup

inputs:
  - id: cstack-server-inputs
    component: CStack
    channel: server
    column_widths: [fit, 16rem, 7rem, auto]
    entries:
      - {id: tag, name: tag, type: {display: '"div" | "section" | "nav" | "ul" | "ol"', interfaces: [CFlowTag]}, default: {kind: literal, value: div}, effect: Selects the native root without adding a role or accessible name.}
      - {id: gap, name: gap, type: {display: '"0" | "xs" | "sm" | "md" | "lg" | "xl"', interfaces: [CFlowGap]}, default: {kind: literal, value: md}, effect: Selects the vertical space between direct children.}
      - {id: align, name: align, type: {display: '"start" | "center" | "end" | "stretch" | "baseline"', interfaces: [CFlowAlign]}, default: {kind: literal, value: stretch}, effect: Aligns direct children across the horizontal axis.}
      - {id: justify, name: justify, type: {display: '"start" | "center" | "end" | "between" | "around" | "evenly"', interfaces: [CFlowJustify]}, default: {kind: literal, value: start}, effect: Distributes direct children along the vertical axis.}
      - {id: reverse, name: reverse, type: bool, default: {kind: literal, value: false}, effect: 'Reverses visual flow without changing DOM, reading, or Tab order.'}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds native, ARIA, data, and trusted targeted Alpine attributes without replacing owned layout or Citry runtime fields.'}
  - id: cgroup-server-inputs
    component: CGroup
    channel: server
    column_widths: [fit, 16rem, 7rem, auto]
    entries:
      - {id: tag, name: tag, type: {display: '"div" | "section" | "nav" | "ul" | "ol"', interfaces: [CFlowTag]}, default: {kind: literal, value: div}, effect: Selects the native root without adding a role or accessible name.}
      - {id: gap, name: gap, type: {display: '"0" | "xs" | "sm" | "md" | "lg" | "xl"', interfaces: [CFlowGap]}, default: {kind: literal, value: sm}, effect: Selects horizontal and wrapped-row spacing between direct children.}
      - {id: align, name: align, type: {display: '"start" | "center" | "end" | "stretch" | "baseline"', interfaces: [CFlowAlign]}, default: {kind: literal, value: center}, effect: Aligns direct children across each row.}
      - {id: justify, name: justify, type: {display: '"start" | "center" | "end" | "between" | "around" | "evenly"', interfaces: [CFlowJustify]}, default: {kind: literal, value: start}, effect: Distributes direct children along each row.}
      - {id: wrap, name: wrap, type: bool, default: {kind: literal, value: true}, effect: Allows direct children to continue on later rows when space runs out.}
      - {id: reverse, name: reverse, type: bool, default: {kind: literal, value: false}, effect: 'Reverses visual flow without changing DOM, reading, or Tab order.'}
      - {id: class, name: class_, type: {display: 'str | Mapping[str, bool] | Sequence[CClassValue] | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: 'Adds root classes and merges them with `attrs`.'}
      - {id: style, name: style, type: {display: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue] | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: 'Adds root inline styles and merges them with `attrs`.'}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: 'Adds native, ARIA, data, and trusted targeted Alpine attributes without replacing owned layout or Citry runtime fields.'}

slots:
  - id: cstack-slots
    component: CStack
    entries:
      - {id: default, name: default, required: false, data: {display: '{}', interfaces: [CStackDefaultSlotData]}, fallback: Renders an empty layout root.}
  - id: cgroup-slots
    component: CGroup
    entries:
      - {id: default, name: default, required: false, data: {display: '{}', interfaces: [CGroupDefaultSlotData]}, fallback: Renders an empty layout root.}

events: []
methods: []

css:
  - id: cstack-css-variables
    component: CStack
    entries:
      - {id: cui-stack-gap, name: --cui-stack-gap, type: length, purpose: Overrides the selected direct-child gap., default: Gap-preset length.}
  - id: cgroup-css-variables
    component: CGroup
    entries:
      - {id: cui-group-gap, name: --cui-group-gap, type: length, purpose: Overrides horizontal and wrapped-row gaps., default: Gap-preset length.}

attributes:
  - id: cstack-attributes
    component: CStack
    entries:
      - {id: data-gap, name: data-gap, element: Root, type: '"0" | "xs" | "sm" | "md" | "lg" | "xl"', meaning: Reflects the selected spacing preset.}
      - {id: data-align, name: data-align, element: Root, type: '"start" | "center" | "end" | "stretch" | "baseline"', meaning: Reflects cross-axis alignment.}
      - {id: data-justify, name: data-justify, element: Root, type: '"start" | "center" | "end" | "between" | "around" | "evenly"', meaning: Reflects main-axis distribution.}
      - {id: data-reverse, name: data-reverse, element: Root, type: Boolean presence, meaning: Present while visual order is reversed.}
  - id: cgroup-attributes
    component: CGroup
    entries:
      - {id: data-gap, name: data-gap, element: Root, type: '"0" | "xs" | "sm" | "md" | "lg" | "xl"', meaning: Reflects the selected spacing preset.}
      - {id: data-align, name: data-align, element: Root, type: '"start" | "center" | "end" | "stretch" | "baseline"', meaning: Reflects cross-axis alignment.}
      - {id: data-justify, name: data-justify, element: Root, type: '"start" | "center" | "end" | "between" | "around" | "evenly"', meaning: Reflects main-axis distribution.}
      - {id: data-wrap, name: data-wrap, element: Root, type: Boolean presence, meaning: Present while wrapping is enabled.}
      - {id: data-reverse, name: data-reverse, element: Root, type: Boolean presence, meaning: Present while visual order is reversed.}

selectors:
  - id: cstack-selectors
    component: CStack
    entries:
      - {id: data-citry-ui-part-stack, selector: '[data-citry-ui-part="stack"]', element: Native root, purpose: Stable Stack root and `attrs` destination.}
  - id: cgroup-selectors
    component: CGroup
    entries:
      - {id: data-citry-ui-part-group, selector: '[data-citry-ui-part="group"]', element: Native root, purpose: Stable Group root and `attrs` destination.}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-cflow-tag, name: CFlowTag, definition: 'Literal["div", "section", "nav", "ul", "ol"]'}
      - {id: input-type-aliases-cflow-gap, name: CFlowGap, definition: 'Literal["0", "xs", "sm", "md", "lg", "xl"]'}
      - {id: input-type-aliases-cflow-align, name: CFlowAlign, definition: 'Literal["start", "center", "end", "stretch", "baseline"]'}
      - {id: input-type-aliases-cflow-justify, name: CFlowJustify, definition: 'Literal["start", "center", "end", "between", "around", "evenly"]'}
  - {id: cstack-default-slot-data, kind: record, name: CStackDefaultSlotData, entries: []}
  - {id: cgroup-default-slot-data, kind: record, name: CGroupDefaultSlotData, entries: []}

translations: []

8b8dcacc63a0914bf18faad0f4f991aef8325"}</script><script src=/citry/ext/events/runtime.js></script><script>(function() {

      Citry.manager.registerComponent("Tabs_118635", ({ els }) => {
        const root = els[0];
        const tabs = root.querySelectorAll(".demo-tabs__tab");
        const panels = root.querySelectorAll(".demo-tabs__panel");

        const activate = (nextTab, moveFocus = false) => {
          const nextIndex = nextTab.getAttribute("data-index");
          tabs.forEach((tab) => {
            const selected = tab === nextTab;
            tab.setAttribute("aria-selected", selected ? "true" : "false");
            tab.setAttribute("data-active", selected ? "true" : "false");
            tab.tabIndex = selected ? 0 : -1;
          });
          panels.forEach((panel) => {
            if (panel.getAttribute("data-index") === nextIndex) {
              panel.removeAttribute("hidden");
            } else {
              panel.setAttribute("hidden", "");
            }
          });
          if (moveFocus) {
            nextTab.focus();
          }
        };

        tabs.forEach((tab, index) => {
          tab.addEventListener("click", () => activate(tab));
          tab.addEventListener("keydown", (event) => {
            let nextIndex;
            if (event.key === "ArrowRight") {
              nextIndex = (index + 1) % tabs.length;
            } else if (event.key === "ArrowLeft") {
              nextIndex = (index - 1 + tabs.length) % tabs.length;
            } else if (event.key === "Home") {
              nextIndex = 0;
            } else if (event.key === "End") {
              nextIndex = tabs.length - 1;
            } else {
              return;
            }
            event.preventDefault();
            activate(tabs[nextIndex], true);
          });
        });
      });
    
})();</script></body></html><!--citry:g1:6509ae21ada9a15b82ce78f31308b8dcacc63a0914bf18faad0f4f991aef8325:0:i:1:e-->

schema_version: 1
family: toggle

components: [CToggleGroup, CToggle]

inputs:
  - id: ctoggle-group-server-inputs
    component: CToggleGroup
    channel: server
    column_widths: [fit, 14rem, 7rem, auto]
    entries:
      - {id: label, name: label, type: str, default: {kind: required}, effect: Names the related Toggle choices.}
      - {id: value, name: value, type: {display: 'str | None | Sequence[str]', interfaces: [CToggleValue]}, default: {kind: literal, value: null}, effect: Selects the initial single value or multiple values.}
      - {id: multiple, name: multiple, type: bool, default: {kind: literal, value: false}, effect: Allows several Toggles to be pressed together.}
      - {id: mandatory, name: mandatory, type: bool, default: {kind: literal, value: false}, effect: Prevents user activation from clearing the final pressed Toggle.}
      - {id: disabled, name: disabled, type: bool, default: {kind: literal, value: false}, effect: Disables every owned Toggle; enclosing CForm disabled remains dominant.}
      - {id: orientation, name: orientation, type: {display: '"horizontal" | "vertical"', interfaces: [CToggleOrientation]}, default: {kind: literal, value: horizontal}, effect: Selects the group axis.}
      - {id: variant, name: variant, type: {display: '"soft" | "outline" | "plain"', interfaces: [CToggleVariant]}, default: {kind: literal, value: outline}, effect: Owns visual treatment for every grouped Toggle.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg"', interfaces: [CToggleSize]}, default: {kind: literal, value: md}, effect: Owns geometry for every grouped Toggle.}
      - {id: grow, name: grow, type: bool, default: {kind: literal, value: false}, effect: Gives direct Toggles equal available width.}
      - {id: class, name: class_, type: {display: 'CClassValue | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: Adds root classes.}
      - {id: style, name: style, type: {display: 'CStyleValue | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: Adds root inline styles.}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds trusted copied root attributes without replacing group ownership.}
  - id: ctoggle-group-client-inputs
    component: CToggleGroup
    channel: client
    entries:
      - {id: value, name: value, type: 'string | null | string[] | undefined', omitted: Uses the server input., effect: Controls pressed values while supplied; omission releases ownership.}
      - {id: disabled, name: disabled, type: 'boolean | undefined', omitted: Uses the server input., effect: Overrides local disabled while supplied; Form disabled remains dominant.}
      - {id: orientation, name: orientation, type: '"horizontal" | "vertical" | undefined', omitted: Uses the server input., effect: Overrides orientation while valid and supplied.}
      - {id: variant, name: variant, type: '"soft" | "outline" | "plain" | undefined', omitted: Uses the server input., effect: Overrides visual treatment for every grouped Toggle.}
      - {id: size, name: size, type: '"sm" | "md" | "lg" | undefined', omitted: Uses the server input., effect: Overrides geometry for every grouped Toggle.}
      - {id: on-value-change, name: onValueChange, type: '((value, detail) => void) | undefined', omitted: Uses the server input., effect: Runs after an accepted grouped activation.}
  - id: ctoggle-server-inputs
    component: CToggle
    channel: server
    entries:
      - {id: value, name: value, type: 'str | None', default: {kind: literal, value: null}, effect: Required unique identity inside CToggleGroup; unused standalone.}
      - {id: pressed, name: pressed, type: bool, default: {kind: literal, value: false}, effect: Sets standalone initial pressed state; group value owns grouped state.}
      - {id: disabled, name: disabled, type: bool, default: {kind: literal, value: false}, effect: Disables this Toggle; enclosing CForm disabled remains dominant.}
      - {id: variant, name: variant, type: {display: '"soft" | "outline" | "plain" | None', interfaces: [CToggleVariant]}, default: {kind: literal, value: null}, effect: Selects standalone visual treatment; CToggleGroup owns grouped presentation.}
      - {id: size, name: size, type: {display: '"sm" | "md" | "lg" | None', interfaces: [CToggleSize]}, default: {kind: literal, value: null}, effect: Selects standalone geometry; CToggleGroup owns grouped presentation.}
      - {id: class, name: class_, type: {display: 'CClassValue | None', interfaces: [CClassValue]}, default: {kind: literal, value: null}, effect: Adds Button classes.}
      - {id: style, name: style, type: {display: 'CStyleValue | None', interfaces: [CStyleValue]}, default: {kind: literal, value: null}, effect: Adds Button inline styles.}
      - {id: attrs, name: attrs, type: 'Mapping[str, object] | None', default: {kind: literal, value: null}, effect: Adds trusted copied Button attributes without replacing Toggle ownership.}
  - id: ctoggle-client-inputs
    component: CToggle
    channel: client
    entries:
      - {id: pressed, name: pressed, type: 'boolean | undefined', omitted: Uses the server input., effect: Controls a standalone Toggle while supplied.}
      - {id: disabled, name: disabled, type: 'boolean | undefined', omitted: Uses the server input., effect: Overrides local disabled while supplied; enclosing CForm disabled remains dominant.}
      - {id: variant, name: variant, type: '"soft" | "outline" | "plain" | undefined', omitted: Uses the server input., effect: Overrides standalone visual treatment; grouped presentation comes from CToggleGroup.}
      - {id: size, name: size, type: '"sm" | "md" | "lg" | undefined', omitted: Uses the server input., effect: Overrides standalone geometry; grouped presentation comes from CToggleGroup.}
      - {id: on-pressed-change, name: onPressedChange, type: '((pressed, detail) => void) | undefined', omitted: Uses the server input., effect: Runs after accepted standalone activation.}

slots:
  - id: ctoggle-group-slots
    component: CToggleGroup
    entries:
      - {id: default, name: default, required: true, data: {display: '{}', interfaces: [CToggleGroupDefaultSlotData]}, fallback: None.}
  - id: ctoggle-slots
    component: CToggle
    entries:
      - {id: default, name: default, required: true, data: {display: '{}', interfaces: [CToggleDefaultSlotData]}, fallback: None.}

events:
  - id: ctoggle-group-events
    component: CToggleGroup
    entries:
      - {id: on-value-change, name: onValueChange, signature: {display: '(value, detail: CToggleValueChangeDetail) => void', interfaces: [CToggleValueChangeDetail]}, trigger: Accepted grouped activation., detail: {display: '{value, previousValue, source}', interfaces: [CToggleValueChangeDetail]}, behavior: Reports the requested next selection; a supplied client value remains authoritative.}
  - id: ctoggle-events
    component: CToggle
    entries:
      - {id: on-pressed-change, name: onPressedChange, signature: '(pressed: boolean, detail: object) => void', trigger: Accepted standalone activation., detail: '{value: boolean, previousValue: boolean, source: "activation"}', behavior: Reports the requested pressed state; a supplied client value remains authoritative.}

methods: []

css:
  - id: ctoggle-css-variables
    component: CToggle
    entries:
      - {id: cui-toggle-foreground, name: --cui-toggle-foreground, type: color, purpose: Resting text/icon foreground., default: CanvasText}
      - {id: cui-toggle-background, name: --cui-toggle-background, type: color, purpose: Resting background., default: transparent}
      - {id: cui-toggle-border-color, name: --cui-toggle-border-color, type: color, purpose: Border color., default: Nested-scheme border color.}
      - {id: cui-toggle-pressed-background, name: --cui-toggle-pressed-background, type: color, purpose: Pressed background., default: Nested-scheme blue surface.}
      - {id: cui-toggle-pressed-foreground, name: --cui-toggle-pressed-foreground, type: color, purpose: Pressed foreground., default: Nested-scheme blue foreground.}
      - {id: cui-toggle-radius, name: --cui-toggle-radius, type: length, purpose: Outer group corners., default: 0.55rem}
      - {id: cui-toggle-height, name: --cui-toggle-height, type: length, purpose: Minimum block size., default: Size-derived.}
      - {id: cui-toggle-padding, name: --cui-toggle-padding, type: length, purpose: Inline padding., default: Size-derived.}
      - {id: cui-toggle-focus-ring, name: --cui-toggle-focus-ring, type: color, purpose: Keyboard focus outline., default: Highlight}
  - id: ctoggle-group-css-variables
    component: CToggleGroup
    entries:
      - {id: cui-toggle-group-gap, name: --cui-toggle-group-gap, type: length, purpose: Gap between Toggles., default: '0'}

attributes:
  - id: ctoggle-group-attributes
    component: CToggleGroup
    entries:
      - {id: data-multiple, name: data-multiple, element: Root, type: present-or-absent, meaning: Present in multiple mode.}
      - {id: data-mandatory, name: data-mandatory, element: Root, type: present-or-absent, meaning: Present while final user deselection is prevented.}
      - {id: data-disabled, name: data-disabled, element: Root, type: present-or-absent, meaning: Present while all owned Toggles are disabled.}
      - {id: data-orientation, name: data-orientation, element: Root, type: '"horizontal" | "vertical"', meaning: Reflects layout axis.}
      - {id: data-variant, name: data-variant, element: Root, type: '"soft" | "outline" | "plain"', meaning: Reflects group-owned visual treatment.}
      - {id: data-size, name: data-size, element: Root, type: '"sm" | "md" | "lg"', meaning: Reflects group-owned geometry.}
      - {id: data-grow, name: data-grow, element: Root, type: present-or-absent, meaning: Present when Toggles share the available width.}
  - id: ctoggle-attributes
    component: CToggle
    entries:
      - {id: aria-pressed, name: aria-pressed, element: Native Button, type: boolean, meaning: Exposes native Toggle pressed state.}
      - {id: data-pressed, name: data-pressed, element: Native Button, type: present-or-absent, meaning: Public pressed styling hook.}
      - {id: data-disabled, name: data-disabled, element: Native Button, type: present-or-absent, meaning: Mirrors effective disabled state.}
      - {id: data-value, name: data-value, element: Grouped native Button, type: string, meaning: Stable group identity.}
      - {id: data-variant, name: data-variant, element: Native Button, type: '"soft" | "outline" | "plain"', meaning: Reflects visual treatment.}
      - {id: data-size, name: data-size, element: Native Button, type: '"sm" | "md" | "lg"', meaning: Reflects geometry.}

selectors:
  - id: ctoggle-group-selectors
    component: CToggleGroup
    entries:
      - {id: data-citry-ui-part-toggle-group, selector: '[data-citry-ui-part="toggle-group"]', element: Root, purpose: Stable group and attrs destination.}
  - id: ctoggle-selectors
    component: CToggle
    entries:
      - {id: data-citry-ui-part-toggle, selector: '[data-citry-ui-part="toggle"]', element: Native Button root, purpose: 'Stable Toggle, attrs, focus, and pressed-state surface.'}

interfaces:
  - id: input-type-aliases
    kind: aliases
    entries:
      - {id: input-type-aliases-class-value, name: CClassValue, definition: 'str | Mapping[str, bool] | Sequence[CClassValue]'}
      - {id: input-type-aliases-style-value, name: CStyleValue, definition: 'str | Mapping[str, str | int | float | bool | None] | Sequence[CStyleValue]'}
      - {id: input-type-aliases-toggle-variant, name: CToggleVariant, definition: 'Literal["soft", "outline", "plain"]'}
      - {id: input-type-aliases-toggle-size, name: CToggleSize, definition: 'Literal["sm", "md", "lg"]'}
      - {id: input-type-aliases-toggle-orientation, name: CToggleOrientation, definition: 'Literal["horizontal", "vertical"]'}
      - {id: input-type-aliases-toggle-value, name: CToggleValue, definition: 'str | None | Sequence[str]'}
  - {id: ctoggle-value-change-detail, kind: record, name: CToggleValueChangeDetail, entries: [{id: value, name: value, type: 'str | list[str] | None', meaning: Requested selection.}, {id: previous-value, name: previousValue, type: 'str | list[str] | None', meaning: Selection before activation.}, {id: source, name: source, type: '"activation"', meaning: Change origin.}]}
  - {id: ctoggle-group-default-slot-data, kind: record, name: CToggleGroupDefaultSlotData, entries: []}
  - {id: ctoggle-default-slot-data, kind: record, name: CToggleDefaultSlotData, entries: []}

translations: []

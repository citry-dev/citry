# Primary site navigation. Every top-level area appears in the header, in this
# order. Its direct items and groups make up that area's sidebar. Generated
# navigation is declared in place with `source`.

home:
  title: Citry
  path: /
  scope: site

areas:

  - label: Docs
    scope: versioned
    items:
      - { title: Overview, path: /docs/ }
    groups:
      - label: Getting started
        collapsible: true
        section_style: true
        items:
          - { title: Install Citry, path: /getting-started/installation/ }
          - { title: Your first component, path: /getting-started/your-first-component/ }
          - { title: Use data in components, path: /getting-started/data-in-components/ }
          - { title: Build a page from components, path: /getting-started/build-page/ }
          - { title: Add flexible content, path: /getting-started/add-slots/ }
          - { title: Add browser behavior, path: /getting-started/browser-interactivity/ }
          - { title: Connect components in the browser, path: /getting-started/client-props-and-handlers/ }
          - { title: Serve pages with FastAPI, path: /getting-started/fastapi/ }
          - { title: Call Python from a click, path: /getting-started/call-python/ }
          - { title: Events state, path: /getting-started/state/ }
          - { title: Handle and validate forms, path: /getting-started/forms/ }
          - { title: Update page from Python, path: /getting-started/server-rendered-updates/ }
          - { title: Build CRUD pages, path: /getting-started/build-crud-pages/ }


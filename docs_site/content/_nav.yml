          - { title: Build a page from components, path: /getting-started/build-page/ }
          - { title: Add flexible content, path: /getting-started/add-slots/ }
          - { title: Add browser behavior, path: /getting-started/browser-interactivity/ }
          - { title: Connect components in the browser, path: /getting-started/client-props-and-handlers/ }
          - { title: Serve a page with FastAPI, path: /getting-started/fastapi/ }
          - { title: Call Python from a click, path: /getting-started/call-python/ }
          - { title: Events state, path: /getting-started/state/ }
          - { title: Handle and validate a form, path: /getting-started/forms/ }

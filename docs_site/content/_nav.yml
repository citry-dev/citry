# Primary site navigation. Every top-level area appears in the header, in this
# order. Its direct items and groups make up that area's sidebar. Generated
# navigation is declared in place with `source`.

areas:

  - label: Docs
    scope: versioned
    items:
      - { title: Home, path: / }
    groups:
      - label: Getting started
        items:
          - { title: Install Citry, path: /getting-started/installation/ }
          - { title: Your first component, path: /getting-started/your-first-component/ }

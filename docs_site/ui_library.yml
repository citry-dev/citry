# Ordered Citry UI component catalog. Functional groups drive both the sidebar
# and the overview page. Every component entry requires a unique non-empty
# `family`, a unique safe `slug`, and a safe repository-relative `.md` `source`.
# Every source requires a sibling api.yml containing its schema-validated API
# reference. `nav_title` is an optional non-empty override. Unknown fields fail
# validation. See docs_site/_internal/ui_library_projection.py and
# ui_library_reference.py.
groups:
  - id: actions
    label: Actions
    components:
      - family: button
        slug: button
        source: packages/py/citry_ui/citry_ui/components/cbutton/api.md
      - family: button-group
        slug: button-group
        source: packages/py/citry_ui/citry_ui/components/cbutton_group/api.md
        nav_title: Button Group
      - family: split-button

schema_version: 1
packages:
  - distribution: citry-django
    name: Citry Django
    categories:
      - extension
    summary: Compose Django's template engine with Citry so each can render the other's template syntax.
    ownership: community
    published: false
    citry_requirement: ">=0.4.3"
    source_url: https://github.com/joeyjurjens/citry-django
    maintainer: "@joeyjurjens"
    maintainer_url: https://github.com/joeyjurjens
    notice: "Preview: the repository describes this package as a proof of concept. Its metadata declares MIT, but the repository does not include a license file."

  - distribution: citry-ui
    name: Citry UI
    categories:
      - ui_library
    summary: First-party styled components for building Citry application interfaces.
    ownership: official
    published: true
    citry_requirement: ">=0.4.2,<0.5.0"
    source_url: https://github.com/citry-dev/citry/tree/main/packages/py/citry_ui
    docs_url: /ui-library/
    maintainer: Citry maintainers
    maintainer_url: /community/people/

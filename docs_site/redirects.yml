# Published clean-URL redirects. Each list item accepts exactly `from` and `to`,
# both literal root-relative paths with one leading and one trailing `/` and no
# whitespace, percent escapes, drive separators, query, fragment, backslash, or
# dot segment.
# Sources must be unique and vacant, destinations must be published, and chains
# and cycles are rejected. See docs_site/_internal/redirects.py for validation.
redirects:
  - from: /advanced/alpine-runtime/
    to: /advanced/vue-runtime/
  - from: /syntax/alpine/
    to: /syntax/vue/
  - from: /syntax/dynamic-attributes/
    to: /syntax/attributes/
  - from: /advanced/const-optimization/
    to: /performance/const/
  - from: /advanced/performance/
    to: /performance/
  - from: /advanced/simple-components/
    to: /performance/simple-components/
  - from: /advanced/caching/
    to: /performance/caching/
  - from: /advanced/cache-backends/
    to: /performance/cache-backends/
  - from: /ui-library/components/stack-group/
    to: /ui-library/components/col-row/
  - from: /events/http/
    to: /events/routes/
  - from: /advanced/custom-component-values/
    to: /advanced/render-custom-values/
  - from: /cli/
    to: /advanced/cli/
  - from: /web-frameworks/
    to: /advanced/web-frameworks/
